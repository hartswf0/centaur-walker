the drawbar.</text><text x="60" y="336.0" font-size="10" font-weight="400" text-anchor="start" fill="#000">A 1 mm nylon washer each side fills the 40 mm gap.</text><text x="60" y="431" font-size="10" font-weight="700" text-anchor="start" fill="#000">BP-DRAWBAR · 3/4 in EMT, cut 840 · flatten 150 at the rear end, 60 at the front, in a vise</text><rect x="60" y="445" width="378" height="12" fill="#ddd" stroke="#000"/><rect x="60" y="441" width="67.5" height="20" fill="#bbb" stroke="#000" stroke-width="1"/><rect x="410.7953954240881" y="441" width="27.0" height="20" fill="#bbb" stroke="#000" stroke-width="1"/><circle cx="64.5" cy="451" r="3" fill="#fff" stroke="#000"/><circle cx="118.5" cy="451" r="3" fill="#fff" stroke="#000"/><circle cx="431.0453954240881" cy="451" r="3" fill="#fff" stroke="#000"/><circle cx="417.5453954240881" cy="451" r="3" fill="#fff" stroke="#000"/><text x="60" y="483" font-size="10" font-weight="400" text-anchor="start" fill="#000">Rear end: 2 × Ø6.5 at 10 and 130 from the end; end flush with the block rear (matches the block).</text><text x="60" y="499" font-size="10" font-weight="400" text-anchor="start" fill="#000">Front end: 2 × Ø6.5 at 15 and 45 from the end, to the hinge leaf.</text><text x="560" y="50" font-size="10" font-weight="700" text-anchor="start" fill="#000">BP-LUMBAR · 1/2 in ply 250 × 150</text><rect x="560" y="60" width="250.0" height="150.0" fill="#f6efe0" stroke="#000" stroke-width="1"/><rect x="576" y="85" width="8" height="100" fill="#fff" stroke="#000"/><rect x="786" y="85" width="8" height="100" fill="#fff" stroke="#000"/><rect x="655" y="120" width="60" height="30" fill="#ddd" stroke="#000" stroke-width="1"/><text x="685" y="140" font-size="9" font-weight="400" text-anchor="middle" fill="#000">hinge</text><circle cx="665" cy="127" r="2.5" fill="#fff" stroke="#000"/><circle cx="665" cy="143" r="2.5" fill="#fff" stroke="#000"/><circle cx="705" cy="127" r="2.5" fill="#fff" stroke="#000"/><circle cx="705" cy="143" r="2.5" fill="#fff" stroke="#000"/><path d="M 560 224 H 810 M 560 220 v 8 M 810 220 v 8" stroke="#2563eb" stroke-width="0.8"/><text x="685.0" y="221" font-size="10" font-weight="400" text-anchor="middle" fill="#2563eb">250</text><path d="M 550 60 V 210 M 546 60 h 8 M 546 210 h 8" stroke="#2563eb" stroke-width="0.8"/><text x="544" y="139.0" font-size="10" font-weight="400" text-anchor="end" fill="#2563eb">150</text><text x="560" y="250" font-size="10" font-weight="400" text-anchor="start" fill="#000">Strap slots 8 × 100, 20 in from each side.</text><text x="560" y="266" font-size="10" font-weight="400" text-anchor="start" fill="#000">3 in butt hinge centred, pin horizontal (side to side).</text><text x="560" y="282" font-size="10" font-weight="400" text-anchor="start" fill="#000">Hinge leaf: 4 × wood screws into the plate.</text><text x="560" y="298" font-size="10" font-weight="400" text-anchor="start" fill="#000">Other leaf: 2 × M6 × 40 to the drawbar front.</text></svg>