>D</text><circle cx="815.6" cy="276.2" r="3.2" fill="#000"/><rect x="820.6" y="259.2" width="14" height="14" fill="#2563eb"/><text x="823.6" y="270.2" fill="#fff" font-size="10" font-weight="700">L</text><text x="14" y="20" font-weight="700">BACKPACK DRIVE · seen from the rig's right side · walking to the right</text><text x="14" y="38">wheel clockwise → roller anticlockwise → belt → S1 anticlockwise → spur → crank clockwise</text><text x="14" y="56">one crank turn = π × 55 × 2.5 × 3 = 1296 mm of ground = one rig stride</text><text x="14" y="90" font-size="10" font-weight="700">x, y in mm · axle O at x 0, floor y 0</text><text x="14" y="110" font-size="10">O  (0, 899)  crank rod, 60T spur</text><text x="14" y="128" font-size="10">S1  (0, 859)  arm pivot, 20T spur + 40T pulley</text><text x="14" y="146" font-size="10">T  (148, 534)  tensioner pivot tp; lever points up toward S1</text><text x="14" y="164" font-size="10">R  (330, 138)  55 roller + 16T pulley</text><text x="14" y="182" font-size="10">W  (330, 55)  110 ground wheel</text><text x="14" y="200" font-size="10">K  (-70, 984)  saddle block, 2×4 (38 × 89) × 140, bolts at m1 m2</text><text x="14" y="218" font-size="10">D  (275, 966)  drawbar 3/4 in EMT, cut 840, rear flattened 150, front 60</text><text x="14" y="236" font-size="10">L  (680, 984)  lumbar plate + 3 in butt hinge</text></svg>