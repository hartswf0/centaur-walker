<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="IBM Plex Mono, monospace" font-size="11"><rect width="900" height="560" fill="#fff"/><text x="14" y="22" font-size="12" font-weight="700" text-anchor="start" fill="#000">BIKE MOUNT PARTS · all mm</text><text x="60" y="50" font-size="10" font-weight="700" text-anchor="start" fill="#000">BK-BOARD · 1/2 in ply 420 × 320 · seen from above, front of bike to the right</text><rect x="60" y="60" width="420.0" height="320.0" fill="#f6efe0" stroke="#000" stroke-width="1"/><circle cx="248" cy="160" r="4" fill="#fff" stroke="#000"/><circle cx="272" cy="160" r="4" fill="#fff" stroke="#000"/><circle cx="248" cy="280" r="4" fill="#fff" stroke="#000"/><circle cx="272" cy="280" r="4" fill="#fff" stroke="#000"/><circle cx="438" cy="160" r="4" fill="#fff" stroke="#000"/><circle cx="462" cy="160" r="4" fill="#fff" stroke="#000"/><circle cx="438" cy="280" r="4" fill="#fff" stroke="#000"/><circle cx="462" cy="280" r="4" fill="#fff" stroke="#000"/><circle cx="90" cy="72" r="3.25" fill="#fff" stroke="#000"/><circle cx="90" cy="368" r="3.25" fill="#fff" stroke="#000"/><circle cx="270" cy="72" r="3.25" fill="#fff" stroke="#000"/><circle cx="270" cy="368" r="3.25" fill="#fff" stroke="#000"/><path d="M 60 394 H 480 M 60 390 v 8 M 480 390 v 8" stroke="#2563eb" stroke-width="0.8"/><text x="270.0" y="391" font-size="10" font-weight="400" text-anchor="middle" fill="#2563eb">420</text><path d="M 50 60 V 380 M 46 60 h 8 M 46 380 h 8" stroke="#2563eb" stroke-width="0.8"/><text x="44" y="224.0" font-size="10" font-weight="400" text-anchor="end" fill="#2563eb">320</text><text x="60" y="420" font-size="10" font-weight="400" text-anchor="start" fill="#000">U-bolt holes (pairs 24 apart) at 200 and 390 from the rear end, over the rack; shown for rails 120 apart, drill to suit yours.</text><text x="60" y="436" font-size="10" font-weight="400" text-anchor="start" fill="#000">Angle bolts: 4 × Ø6.5, 12 in from each long edge, at 30 and 210 from the rear end. Angles flush with the rear end.</text><text x="60" y="452" font-size="10" font-weight="400" text-anchor="start" fill="#000">The board rear end overhangs the rack by 170. Crank rod: 190 behind the rear axle, 700 above the floor.</text><text x="540" y="50" font-size="10" font-weight="700" text-anchor="start" fill="#000">BK-ANGLE ×2 · alu 1 × 1 × 1/8 in, 300 long</text><rect x="540" y="60" width="270.0" height="25" fill="#ddd" stroke="#000" stroke-width="1"/><text x="540" y="98" font-size="9" font-weight="400" text-anchor="start" fill="#000">vertical leg (frame side)</text><circle cx="621.0" cy="72.5" r="3.25" fill="#fff" stroke="#000"/><circle cx="783.0" cy="72.5" r="3.25" fill="#fff" stroke="#000"/><rect x="540" y="110" width="270.0" height="25" fill="#ddd" stroke="#000" stroke-width="1"/><text x="540" y="148" font-size="9" font-weight="400" text-anchor="start" fill="#000">flange under the board</text><circle cx="567.0" cy="122.5" r="3.25" fill="#fff" stroke="#000"/><circle cx="729.0" cy="122.5" r="3.25" fill="#fff" stroke="#000"/><text x="540" y="178" font-size="10" font-weight="400" text-anchor="start" fill="#000">Vertical leg: Ø6.5 at 90 and 270 from the rear end,</text><text x="540" y="194" font-size="10" font-weight="400" text-anchor="start" fill="#000">13 below the board = the frame holes m2, m1.</text><text x="540" y="210" font-size="10" font-weight="400" text-anchor="start" fill="#000">Flange: Ø6.5 at 30 and 210 to the board.</text><text x="540" y="226" font-size="10" font-weight="400" text-anchor="start" fill="#000">Outer face of the vertical leg flush with the board</text><text x="540" y="242" font-size="10" font-weight="400" text-anchor="start" fill="#000">edge, so the frames sit 320 apart on the outside.</text></svg>