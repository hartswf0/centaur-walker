<meta charset="utf-8">
<title>Centaur Rig Design Set</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Drawing set. Top half: the sheet drawing. Bottom half: sheet list and the sheet's numbers. Wide screens put the list on the right. Single light look, same marks as the instrument. */
:root{
  --paper:#fff; --ink:#000; --teal:#19e6c8; --amber:#ffd23f; --red:#ff2e2e; --blue:#2563eb; --tan:#f6efe0; --rule:#000;
  --mono:'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme:light;
}
*{box-sizing:border-box;border-radius:0}
html,body{height:100%;background:var(--paper);color:var(--ink)}
body{margin:0;font-family:var(--mono);font-size:12px;line-height:1.4;overflow:hidden;
  padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px));padding-block:4px;
  display:grid;grid-template-rows:auto minmax(0,55fr) minmax(0,45fr);gap:4px}
@media (min-width:900px){ body{grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr) 440px} header{grid-column:1 / -1} }
header{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;border:1px solid var(--rule);padding:4px 6px}
header h1{font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin:0 6px 0 0}
.seg{display:flex;gap:3px;flex-wrap:wrap}
button{font:inherit;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--paper);color:var(--ink);border:1px solid var(--ink);padding:4px 8px;cursor:pointer;min-height:30px}
button:hover{background:var(--ink);color:var(--paper)}
button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.view{border:1px solid var(--rule);position:relative;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr)}
.vbar{display:flex;gap:6px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--rule);padding:3px 6px;font-size:11px}
.vbar b{letter-spacing:.06em;text-transform:uppercase}
#sheet{overflow:auto;min-height:0;background:#e9e9e9;touch-action:pan-x pan-y pinch-zoom}
#sheet svg{display:block;width:100%;height:100%;background:#fff}
#sheet.z2 svg{width:200%;height:auto} #sheet.z4 svg{width:400%;height:auto}
.panel{border:1px solid var(--rule);display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;min-width:0}
.list{display:flex;flex-wrap:wrap;gap:3px;padding:5px;border-bottom:1px solid var(--rule)}
@media (max-width:899px){.list{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin}.list button{flex:0 0 auto}}
.list button{text-transform:none;letter-spacing:0;min-height:26px;padding:2px 7px}
.list button.part{border-style:dashed}
#text{overflow-y:auto;min-height:0;padding:0 0 14px}
h3{font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin:0;padding:9px 8px 4px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
h3 span{font-weight:400;letter-spacing:0;text-transform:none;font-style:italic}
.lead,.note{padding:6px 8px;margin:0}
.note{font-size:11px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin-bottom:4px}
td,th{padding:3px 6px;text-align:left;font-size:11px;border-top:1px solid #000;vertical-align:top}
th{font-size:10px;font-weight:700}
table.kv th{display:none} table.kv td:first-child{width:46%}
table.kv td:last-child{font-weight:700}
.led{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:6px;padding:4px 8px;align-items:center;border-top:1px solid #000}
.led i{width:10px;height:10px;border:1px solid var(--ink)}
.ok{background:var(--teal);padding:0 3px} .warn{background:var(--amber);padding:0 3px} .bad{background:var(--red);padding:0 3px}
ol.steps{margin:0;padding:0 8px 0 30px} ol.steps li{margin:4px 0}
.stack{display:grid;grid-template-columns:2em minmax(0,1fr) auto;gap:0 6px;padding:0 8px}
.stack span{border-top:1px solid #000;padding:2px 0}
.stack .t{text-align:right;font-variant-numeric:tabular-nums}
.fast{padding:2px 8px 6px;margin:0;font-weight:700}
.files{padding:6px 8px;column-width:220px;font-size:11px}
.files div{break-inside:avoid}
</style>

<header>
  <h1>Centaur Rig · design set</h1>
  <div class="seg" role="group" aria-label="Build">
    <button data-build="backpack" aria-pressed="true">Backpack</button>
    <button data-build="bike" aria-pressed="false">Bike</button>
  </div>
  <div class="seg" role="group" aria-label="Zoom">
    <button data-z="1" aria-pressed="true">Fit</button><button data-z="2" aria-pressed="false">×2</button><button data-z="4" aria-pressed="false">×4</button>
  </div>
</header>
<section class="view" aria-label="Drawing">
  <div class="vbar"><b id="vtitle"></b><span id="vsub"></span></div>
  <div id="sheet"></div>
</section>
<section class="panel" aria-label="Sheets">
  <div class="list" id="list"></div>
  <div id="text"></div>
</section>

ht=\"30\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"0.6\"/><text x=\"369.9\" y=\"278.0\" font-size=\"9\" text-anchor=\"middle\">c</text><rect x=\"443.1\" y=\"263.0\" width=\"3.8\" height=\"22\" fill=\"#dfe9ff\" stroke=\"#000\" stroke-width=\"0.6\"/><rect x=\"446.9\" y=\"259.0\" width=\"146.5\" height=\"30\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"0.6\"/><text x=\"520.1\" y=\"278.0\" font-size=\"9\" text-anchor=\"middle\">k</text><rect x=\"593.4\" y=\"263.0\" width=\"6.1\" height=\"22\" fill=\"#dfe9ff\" stroke=\"#000\" stroke-width=\"0.6\"/><rect x=\"599.5\" y=\"265.0\" width=\"30.5\" height=\"18\" fill=\"#000\" stroke=\"#000\" stroke-width=\"0.6\"/><text x=\"636.0\" y=\"278\" font-size=\"10\">120.4 \u00b7 M8 \u00d7 140 bolt (partly threaded)</text><text x=\"10\" y=\"330\" font-weight=\"700\">J3</text><text x=\"10\" y=\"344\" font-size=\"9\">back</text><rect x=\"116\" y=\"325\" width=\"367.7\" height=\"6\" fill=\"#777\"/><rect x=\"120.0\" y=\"319.0\" width=\"20.2\" height=\"18\" fill=\"#000\" stroke=\"#000\" stroke-width=\"0.6\"/><rect x=\"140.2\" y=\"317.0\" width=\"6.1\" height=\"22\" fill=\"#dfe9ff\" stroke=\"#000\" stroke-width=\"0.6\"/><rect x=\"146.3\" y=\"313.0\" width=\"146.5\" height=\"30\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"0.6\"/><text x=\"219.6\" y=\"332.0\" font-size=\"9\" text-anchor=\"middle\">f</text><rect x=\"292.8\" y=\"317.0\" width=\"3.8\" height=\"22\" fill=\"#dfe9ff\" stroke=\"#000\" stroke-width=\"0.6\"/><rect x=\"296.6\" y=\"313.0\" width=\"146.5\" height=\"30\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"0.6\"/><text x=\"369.9\" y=\"332.0\" font-size=\"9\" text-anchor=\"middle\">up</text><rect x=\"443.1\" y=\"317.0\" width=\"6.1\" height=\"22\" fill=\"#dfe9ff\" stroke=\"#000\" stroke-width=\"0.6\"/><rect x=\"449.2\" y=\"319.0\" width=\"30.5\" height=\"18\" fill=\"#000\" stroke=\"#000\" stroke-width=\"0.6\"/><text x=\"485.7\" y=\"332\" font-size=\"10\">81.0 \u00b7 M8 \u00d7 100 bolt (partly threaded)</text><text x=\"10\" y=\"384\" font-weight=\"700\">J4</text><text x=\"10\" y=\"398\" font-size=\"9\">hock</text><rect x=\"116\" y=\"379\" width=\"367.7\" height=\"6\" fill=\"#777\"/><rect x=\"120.0\" y=\"373.0\" width=\"20.2\" height=\"18\" fill=\"#000\" stroke=\"#000\" stroke-width=\"0.6\"/><rect x=\"140.2\" y=\"371.0\" width=\"6.1\" height=\"22\" fill=\"#dfe9ff\" stroke=\"#000\" stroke-width=\"0.6\"/><rect x=\"146.3\" y=\"367.0\" width=\"146.5\" height=\"30\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"0.6\"/><text x=\"219.6\" y=\"386.0\" font-size=\"9\" text-anchor=\"middle\">f</text><rect x=\"292.8\" y=\"371.0\" width=\"3.8\" height=\"22\" fill=\"#dfe9ff\" stroke=\"#000\" stroke-width=\"0.6\"/><rect x=\"296.6\" y=\"367.0\" width=\"146.5\" height=\"30\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"0.6\"/><text x=\"369.9\" y=\"386.0\" font-size=\"9\" text-anchor=\"middle\">lo</text><rect x=\"443.1\" y=\"371.0\" width=\"6.1\" height=\"22\" fill=\"#dfe9ff\" stroke=\"#000\" stroke-width=\"0.6\"/><rect x=\"449.2\" y=\"373.0\" width=\"30.5\" height=\"18\" fill=\"#000\" stroke=\"#000\" stroke-width=\"0.6\"/><text x=\"485.7\" y=\"386\" font-size=\"10\">81.0 \u00b7 M8 \u00d7 100 bolt (partly threaded)</text></svg>", "panel": "<ol class=\"steps\"><li>Print every part sheet at 100% (tiled PDF in the files). Measure the 100 mm bar. Reprint if it is off by more than 1 mm. Join tiles on the crosses.</li><li>Before gluing the crank pairs: cut a 13 mm across-flats hex right through one layer (red hex on the sheet): at M in the inner layer (faces the frame), at O in the outer layer. Epoxy an M8 thin nut (5 mm) in each, flush.</li><li>Glue pairs of 1/4 in ply for frames (\u00d72), cranks (\u00d72) and the wheel arm (\u00d71). Clamp flat overnight.</li><li>Stick the printed sheets to the stock with spray adhesive. Cut foam with a snap blade in two passes or a hot wire. Cut ply with a jigsaw.</li><li>Drill ply on a drill press: \u00d810 for bushes, \u00d822 for 608s (Forstner, flush with the inner face), \u00d88.2 at the crank centres, \u00d86.5 for M6, \u00d85 for the screw eye.</li><li>Cut 6.5 \u00d7 7 mm slots along links j, k, c, f (table saw or router, two passes). Glue the 1/4 in dowel in with PVA. Let dry.</li><li>Cut 52 cheek discs \u00d860 with \u00d810 holes. Drill the foam \u00d814 at each hole. Glue a cheek to each face, lined up on an M8 bolt.</li><li>Press a flanged bush into every \u00d810 hole from the outside face, flange out. Press 608s into the frames (O, S1) and the arm (S1, R).</li><li>Pin B (frame pivot): M8 \u00d7 140 bolt (partly threaded), nylock. Head on the centre side. Inner to outer: Frame / spacer tube 25.4 long, 12 OD \u00d7 8.5 ID / Top triangle / Link c. Tighten until it stops rattling, then back off 1/8 turn.</li><li>Pin J1 (top): M8 \u00d7 100 bolt (partly threaded), nylock. Head on the centre side. Inner to outer: Top triangle / Link j. Tighten until it stops rattling, then back off 1/8 turn.</li><li>Pin J2 (knee): M8 \u00d7 140 bolt (partly threaded), nylock. Head on the centre side. Inner to outer: Foot triangle / Link c / Link k. Tighten until it stops rattling, then back off 1/8 turn.</li><li>Pin J3 (back): M8 \u00d7 100 bolt (partly threaded), nylock. Head on the centre side. Inner to outer: Link f / Top triangle. Tighten until it stops rattling, then back off 1/8 turn.</li><li>Pin J4 (hock): M8 \u00d7 100 bolt (partly threaded), nylock. Head on the centre side. Inner to outer: Link f / Foot triangle. Tighten until it stops rattling, then back off 1/8 turn.</li><li>Pin M (crank pin): M8 \u00d7 120 bolt, cut to 118 so the tip stops 1 mm inside the crank, thread locker. Bolt goes in from the outside, through Crank / spacer tube 27.4 long, 12 OD \u00d7 8.5 ID / Link j / Link k, into the captive nut. Check j and k swing freely.</li><li>Crank rod O: M8 threaded rod, cut to 141, shared by both legs, ends flush with the crank outer faces, cranks 180\u00b0 apart, thread locker. Order is on the Z map. Set the cranks 180\u00b0 apart, then drill 3 mm across each crank through the rod, in the inner ply layer 2.75 from the glue line, and tap in a 3 \u00d7 40 roll pin.</li><li>File a small flat on every shaft where a pulley, spur or collar sits. Tighten each set screw onto its flat with thread locker.</li><li>Fit the 60T spur on the crank rod and the 20T spur + 40T pulley on S1 (positions on the Z map). The gears should mesh with a paper-thin gap.</li><li>Remove the bearings from the 55 mm roller. Slide it on the R shaft and pack the core with epoxy putty, centred. Let it cure.</li><li>Hang the arm on S1. Fit the 110 mm wheel on its M8 \u00d7 70 axle and the R shaft with roller and 16T pulley. The roller sits on top of the wheel. The belt path is 1643 mm: use a 1650\u20131700 mm closed loop, or splice a 2 m open belt (overlap 40 mm teeth-in-teeth, glue with flexible CA, wrap with tape); a clamp joint will not pass the 16T pulley.</li><li>Bolt the tensioner lever to the arm at tp (loose, nylock), pointing up the arm toward S1, the toothed idler at its end inside the belt loop. Hook the spring from the lever to the screw eye at sa so the idler pushes one belt span outward. Shim with washers so the idler lines up with the belt.</li><li>Bolt the saddle block between the frames (2 \u00d7 M6 \u00d7 80 at m1, m2). Flatten both ends of the drawbar (840 mm). Bolt one end on top of the block (2 \u00d7 M6 \u00d7 110), the other to the butt hinge on the lumbar plate.</li><li>Strap the lumbar plate to the backpack hip belt with two ratchet straps. The hinge pin runs side to side so the rig can pitch.</li><li>Drill the steel bar \u00d86.5 at 20 and 390 from one end and bolt it along the arm at w1, w2 (left face). Its weight presses the wheel down about 1 kg.</li><li>Glue a rubber pad under each foot point F.</li><li>Turn the crank one full turn by hand. Nothing catches. Mark any pin that knocks.</li><li>Stand on the rig&#x27;s right side and push it forward (to your right). The crank turns clockwise and each foot moves backward while it is down. If not, the gear stage is missing or doubled.</li><li>Hang the rump (2 kg) and walk 100 strides. Measure foot slop, sideways push at the foot (10 N), and link k bow. Compare with the Checks sheet.</li></ol><p class=\"note\">No solvent glue, solvent spray paint or PVC cement on EPS. Use foam-safe spray adhesive.</p>"}, {"id": "checks", "title": "Checks", "part": false, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 800\" font-family=\"IBM Plex Mono, monospace\"><rect width=\"960\" height=\"800\" fill=\"#111\"/><g transform=\"translate(3,3)\"><rect width=\"234\" height=\"194\" fill=\"#f3ead8\"/><line x1=\"16.7\" y1=\"188.0\" x2=\"16.7\" y2=\"13.7\" stroke=\"#d8ccb4\" stroke-width=\"0.5\"/><line x1=\"40.9\" y1=\"188.0\" x2=\"40.9\" y2=\"13.7\" stroke=\"#d8ccb4\" stroke-width=\"0.5\"/><line x1=\"65.1\" y1=\"188.0\" x2=\"65.1\" y2=\"13.7\" stroke=\"#d8ccb4\" stroke-width=\"0.5\"/><line x1=\"89.3\" y1=\"188.0\" x2=\"89.3\" y2=\"13.7\" stroke=\"#d8ccb4\" stroke-width=\"0.5\"/><line x1=\"113.5\" y1=\"188.0\" x2=\"113.5\" y2=\"13.7\" stroke=\"#d8ccb4\" stroke-width=\"0.5\"/><line x1=\"137.7\" y1=\"188.0\" x2=\"137.7\" y2=\"13.7\" stroke=\"#d8ccb4\" stroke-width=\"0.5\"/><line x1=\"161.9\" y1=\"188.0\" x2=\"161.9\" y2=\"13.7\" stroke=\"#d8ccb4\" stroke-width=\"0.5\"/><line x1=\"186.2\" y1=\"188.0\" x2=\"186.2\" y2=\"13.7\" stroke=\"#d8ccb4\" stroke-width=\"0.5\"/><line x1=\"210.4\" y1=\"188.0\" x2=\"210.4\" y2=\"13.7\" stroke=\"#d8ccb4\" stroke-width=\"0.5\"/><line x1=\"0\" y1=\"188.0\" x2=\"240\" y2=\"188.0\" stroke=\"#000\" stroke-width=\"1\"/><line x1=\"77.5\" y1=\"108.3\" x2=\"113.5\" y2=\"108.3\" stroke=\"#6b7fa8\" stroke-width=\"6.78\" stroke-linecap=\"round\" opacity=\"0.35\"/><line x1=\"113.5\" y1=\"108.3\" x2=\"113.5\" y2=\"100.9\" stroke=\"#6b7fa8\" stroke-width=\"6.78\" stroke-linecap=\"round\" opacity=\"0.35\"/><line x1=\"113.5\" y1=\"100.9\" x2=\"99.4\" y2=\"99.7\" stroke=\"#6b7fa8\" stroke-width=\"6.78\" stro 0\" stroke-width=\"0.6\"/><rect x=\"323.0\" y=\"313.0\" width=\"63.1\" height=\"30\" fill=\"#f6efe0\" stroke=\"#000\" stroke-width=\"0.6\"/><text x=\"354.6\" y=\"332.0\" font-size=\"9\" text-anchor=\"middle\">up</text><rect x=\"386.2\" y=\"317.0\" width=\"15.5\" height=\"22\" fill=\"#dfe9ff\" stroke=\"#000\" stroke-width=\"0.6\"/><rect x=\"401.7\" y=\"319.0\" width=\"77.7\" height=\"18\" fill=\"#000\" stroke=\"#000\" stroke-width=\"0.6\"/><text x=\"485.4\" y=\"332\" font-size=\"10\">23.7 \u00b7 M8 \u00d7 35 bolt (partly threaded)</text><text x=\"10\" y=\"384\" font-weight=\"700\">J4</text><text x=\"10\" y=\"398\" font-size=\"9\">hock</text><rect x=\"116\" y=\"379\" width=\"367.4\" height=\"6\" fill=\"#777\"/><rect x=\"120.0\" y=\"373.0\" width=\"51.5\" height=\"18\" fill=\"#000\" stroke=\"#000\" stroke-width=\"0.6\"/><rect x=\"171.5\" y=\"371.0\" width=\"15.5\" height=\"22\" fill=\"#dfe9ff\" stroke=\"#000\" stroke-width=\"0.6\"/><rect x=\"187.0\" y=\"367.0\" width=\"63.1\" height=\"30\" fill=\"#f6efe0\" stroke=\"#000\" stroke-width=\"0.6\"/><text x=\"218.6\" y=\"386.0\" font-size=\"9\" text-anchor=\"middle\">f</text><rect x=\"250.2\" y=\"375.0\" width=\"63.1\" height=\"14\" fill=\"#d99a00\" stroke=\"#000\" stroke-width=\"0.6\"/><rect x=\"313.3\" y=\"371.0\" width=\"9.7\" height=\"22\" fill=\"#dfe9ff\" stroke=\"#000\" stroke-width=\"0.6\"/><rect x=\"323.0\" y=\"367.0\" width=\"63.1\" height=\"30\" fill=\"#f6efe0\" stroke=\"#000\" stroke-width=\"0.6\"/><text x=\"354.6\" y=\"386.0\" font-size=\"9\" text-anchor=\"middle\">lo</text><rect x=\"386.2\" y=\"371.0\" width=\"15.5\" height=\"22\" fill=\"#dfe9ff\" stroke=\"#000\" stroke-width=\"0.6\"/><rect x=\"401.7\" y=\"373.0\" width=\"77.7\" height=\"18\" fill=\"#000\" stroke=\"#000\" stroke-width=\"0.6\"/><text x=\"485.4\" y=\"386\" font-size=\"10\">23.7 \u00b7 M8 \u00d7 35 bolt (partly threaded)</text></svg>", "panel": "<ol class=\"steps\"><li>Print every part sheet at 100% (tiled PDF in the files). Measure the 100 mm bar. Reprint if it is off by more than 1 mm. Join tiles on the crosses.</li><li>Before gluing the crank pairs: cut a 13 mm across-flats hex right through one layer (red hex on the sheet): at M in the inner layer (faces the frame), at O in the outer layer. Epoxy an M8 thin nut (5 mm) in each, flush.</li><li>Glue pairs of 1/4 in ply for frames (\u00d72), cranks (\u00d72) and drive-box plates (\u00d72 pairs). Clamp flat overnight.</li><li>Stick the printed sheets to the ply with spray adhesive. Cut with a jigsaw or bandsaw. Drill on a drill press: \u00d810 bushes, \u00d822 608s (Forstner), \u00d88.2 crank centres, \u00d86.5 for M6.</li><li>Press flanged bushes into every \u00d810 hole, flange out. Press 608s into the frames (O) and both box plates (C, R, S1, S2).</li><li>Pin B (frame pivot): M8 \u00d7 50 bolt (partly threaded), nylock. Head on the centre side. Inner to outer: Frame / Top triangle / spacer tube 4.5 long, 12 OD \u00d7 8.5 ID / Link c. Tighten until it stops rattling, then back off 1/8 turn.</li><li>Pin J1 (top): M8 \u00d7 35 bolt (partly threaded), nylock. Head on the centre side. Inner to outer: Top triangle / spacer tube 4.5 long, 12 OD \u00d7 8.5 ID / Link j. Tighten until it stops rattling, then back off 1/8 turn.</li><li>Pin J2 (knee): M8 \u00d7 50 bolt (partly threaded), nylock. Head on the centre side. Inner to outer: Foot triangle / spacer tube 4.5 long, 12 OD \u00d7 8.5 ID / Link c / spacer tube 10.0 long, 12 OD \u00d7 8.5 ID / Link k. Tighten until it stops rattling, then back off 1/8 turn.</li><li>Pin J3 (back): M8 \u00d7 35 bolt (partly threaded), nylock. Head on the centre side. Inner to outer: Link f / spacer tube 6.5 long, 12 OD \u00d7 8.5 ID / Top triangle. Tighten until it stops rattling, then back off 1/8 turn.</li><li>Pin J4 (hock): M8 \u00d7 35 bolt (partly threaded), nylock. Head on the centre side. Inner to outer: Link f / spacer tube 6.5 long, 12 OD \u00d7 8.5 ID / Foot triangle. Tighten until it stops rattling, then back off 1/8 turn.</li><li>Pin M (crank pin): M8 \u00d7 40 bolt, cut to 37 so the tip stops 1 mm inside the crank, thread locker. Bolt goes in from the outside, through Crank / Link j / spacer tube 10.0 long, 12 OD \u00d7 8.5 ID / Link k, into the captive nut. Check j and k swing freely.</li><li>Crank rod O: M8 threaded rod, cut to 370, shared by both legs, ends flush with the crank outer faces, cranks 180\u00b0 apart, thread locker. Order is on the Z map. Set the cranks 180\u00b0 apart, then drill 3 mm across each crank through the rod, in the inner ply layer 2.75 from the glue line, and tap in a 3 \u00d7 40 roll pin.</li><li>File a small flat on every shaft where a pulley, spur or collar sits. Tighten each set screw onto its flat with thread locker.</li><li>Bolt the two angles under the board long edges, flush with the rear end and the edges (Mounts sheet). Bolt the board to the rack with 4 U-bolts so the board overhangs the rack by 170 at the back and the crank rod will sit 190 behind the rear axle.</li><li>Bolt each leg frame to its angle with 2 \u00d7 M6 \u00d7 30 at m1, m2: head on the inside (box side), nylock outside.</li><li>Remove the bearings from the 52 mm roller. Slide it on the R shaft and pack the core with epoxy putty, centred. Let it cure.</li><li>Assemble the drive box with the shaft order on the Z map: three M6 \u00d7 80 standoffs with 47 mm tubes hold the plates apart. Fit both 200 mm belts. If a belt is slack, the centres are off: re-drill S2. Hang the box on the crank rod.</li><li>Hook the spring from the screw eye at hole sa (on the tail behind the hinge) straight up to the rack board. The tail lifts, the roller presses the tire with about 1 kg.</li><li>Turn the crank one full turn by hand. Nothing catches. Mark any pin that knocks.</li><li>Bike on a stand, roller down. Stand on the right side and turn the rear wheel forward. The crank turns clockwise. Count 27 roller turns per crank turn.</li><li>Ride 1 km at walking pace, then 16 km/h. Check bolts, belt tensi
