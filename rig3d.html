<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Velocipede Drive Module</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{--bg:#e9e7e2;--panel:#f7f6f2;--paper:#f4f2ec;--ink:#17150f;--ink-2:#5a554b;--ink-3:#8d877b;--rule:#d0cabe;--accent:#2f55c9;--accent-ink:#fff;--hot:#e2591b;--ok:#15803d;--warn:#b7791f;--tight:#e2591b;--slack:#2f7bd9;

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f0e0c;--panel:#171512;--paper:#1d1a16;--ink:#ece7dd;--ink-2:#a9a293;--ink-3:#736c60;--rule:#2d2924;--accent:#8fa8ff;--accent-ink:#0d1014;--hot:#ff8a4c;--ok:#4ade80;--warn:#f0b54a;--tight:#ff8a4c;--slack:#6aa8ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f0e0c;--panel:#171512;--paper:#1d1a16;--ink:#ece7dd;--ink-2:#a9a293;--ink-3:#736c60;--rule:#2d2924;--accent:#8fa8ff;--accent-ink:#0d1014;--hot:#ff8a4c;--ok:#4ade80;--warn:#f0b54a;--tight:#ff8a4c;--slack:#6aa8ff;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);display:grid;grid-template-rows:auto 1fr;overflow:hidden}
header{display:flex;align-items:center;gap:14px;padding:9px 16px;border-bottom:1px solid var(--rule);background:var(--panel);min-width:0}
h1{font:500 17px var(--f-disp);letter-spacing:.14em;text-transform:uppercase;margin:0;white-space:nowrap}
.status{font:12px var(--f-mono);color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.status b{color:var(--hot)}.status b.ok{color:var(--ok)}
header a{font:500 12px var(--f-body);color:var(--accent);text-decoration:none;white-space:nowrap}
main{display:grid;grid-template-columns:1fr 450px;min-height:0}
.view{position:relative;background:var(--paper);min-height:0;overflow:hidden;touch-action:none}
.view canvas{position:absolute;inset:0;width:100%;height:100%;display:block}#ov{pointer-events:none}
.vbar{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:2;pointer-events:none}
.vbar button{pointer-events:auto;height:30px;border:1px solid var(--rule);background:var(--panel);color:var(--ink-2);border-radius:7px;font:600 12px var(--f-body);padding:0 10px;cursor:pointer}.vbar button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.seg2{position:absolute;left:10px;top:10px;display:flex;z-index:2;border:1px solid var(--rule);border-radius:8px;overflow:hidden;max-width:calc(100% - 20px)}

.legend{position:absolute;right:10px;top:10px;z-index:2;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:6px 9px;font:500 11.5px var(--f-body);color:var(--ink-2);display:none}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}
aside{background:var(--panel);border-left:1px solid var(--rule);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:4px;padding:8px 10px;flex-shrink:0;border-bottom:1px solid var(--rule)}
.tabs button{flex:1;height:34px;border:1px solid var(--rule);background:var(--paper);color:var(--ink-2);border-radius:8px;font:600 12.5px var(--f-body);cursor:pointer;padding:0 4px}.tabs button[aria-selected="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.pane{overflow:auto;flex:1;padding:4px 12px 16px}.pane[hidden]{display:none}
h2{font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:16px 2px 6px}
.stepnav{display:flex;gap:8px;align-items:center;padding:8px 2px;position:sticky;top:0;background:var(--panel);z-index:1;border-bottom:1px solid var(--rule)}
.stepnav button{height:34px;min-width:40px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);font:600 13px var(--f-body);cursor:pointer}.stepnav .nx{background:var(--accent);color:var(--accent-ink);border:0;padding:0 14px}
.stepnav .t{flex:1;font-weight:700;font-size:14px}.stepnav .t small{display:block;font:500 11px var(--f-mono);color:var(--ink-3)}
.sbody{font-size:13.5px;padding:6px 2px}.sbody ol{padding-left:18px;margin:6px 0}.sbody li{margin:5px 0}
.kit{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.kit span{font:500 12px var(--f-body);border:1px solid var(--rule);background:var(--paper);border-radius:6px;padding:3px 7px}.kit b{font-family:var(--f-mono)}
.why{font-size:12.5px;color:var(--ink-2);border-left:3px solid var(--accent);padding:4px 10px;margin:8px 0}
.slist button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--rule);background:none;padding:6px 2px;font:13px var(--f-body);color:var(--ink-2);cursor:pointer}.slist button[aria-current="true"]{color:var(--ink);font-weight:700}.slist i{font:600 11px var(--f-mono);font-style:normal;color:var(--accent);margin-right:8px}

table.t td.n{font:500 12px var(--f-mono);text-align:right;white-space:nowrap}
.bom tr{cursor:pointer}.bom tr.on td{background:var(--paper);color:var(--hot)}
.task{border-bottom:1px solid var(--rule);padding:9px 2px}.task p{margin:0;font-size:13px}.task p em{font-style:normal;font:500 11px var(--f-mono);color:var(--ok);margin-left:6px}
.in{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0}.in label{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2)}

select{font:600 12.5px var(--f-body);padding:4px 6px;border:1px solid var(--rule);border-radius:6px;background:var(--panel);color:var(--ink);max-width:100%}
input[type=range]{width:100%;accent-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.chips button{height:30px;border:1px solid var(--rule);background:var(--paper);color:var(--ink-2);border-radius:7px;font:600 12px var(--f-body);padding:0 10px;cursor:pointer}.chips button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.big{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}.big div{flex:1;min-width:92px;border:1px solid var(--rule);border-radius:8px;padding:6px 8px;background:var(--paper)}.big b{display:block;font:600 18px var(--f-mono)}.big span{font-size:11px;color:var(--ink-3)}.big .bad b{color:var(--hot)}.big .good b{color:var(--ok)}.big .warn b{color:var(--warn)}
svg.dia{width:100%;height:auto;display:block;background:var(--paper);border:1px solid var(--rule);border-radius:8px;margin:6px 0}
p.note{font-size:12px;color:var(--ink-2);margin:6px 2px}
.rowctl{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:12.5px;color:var(--ink-2);margin:6px 2px}
@media (max-width:760px){main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}aside{border-left:0;border-top:1px solid var(--rule)}header{padding:7px 10px}h1{font-size:13px;letter-spacing:.08em}header a{display:none}.status{font-size:11px}.vbar button{height:27px;font-size:11px;padding:0 7px}.seg2 button{height:28px;font-size:11px;padding:0 7px}.tabs button{font-size:11.5px}.legend{top:46px;font-size:10.5px}}
</style></head>

<header><h1>Drive module</h1><div class="status" id="status"></div><a href="powertrain.html">Powertrain</a><a href="index.html">All pages</a></header>

  <section class="view" id="view"><canvas id="c3"></canvas><canvas id="ov"></canvas>

    <div class="vbar"><button id="vSide">Side</button><button id="vRear">Rear</button><button id="vTop">Top</button><button id="v3q" aria-pressed="true">3/4</button><button id="vFocus">Close-up</button><button id="vPlay" aria-pressed="true">Moving</button><button id="vBasket" aria-pressed="true">Basket</button><button id="vLabels" aria-pressed="true">Labels</button></div>

    <div class="pane" id="p-build"><div class="stepnav"><button id="sPrev" aria-label="Previous step">‹</button><div class="t" id="sTitle"></div><button class="nx" id="sNext">Next</button></div><div class="sbody" id="sBody"></div><h2>All steps</h2><div class="slist" id="sList"></div></div>

    <div class="pane" id="p-bom" hidden><div id="bom"></div></div>

  </aside>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const T=window.THREE,TAU=Math.PI*2,$=id=>document.getElementById(id),css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const IN=.0254,MM=.001,V=(x,y)=>({x,y}),NPI=4.448;
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const fr=(x,den=16)=>{const s=x<0?'−':'';x=Math.abs(x);let w=Math.floor(x+1e-9),r=Math.round((x-w)*den);if(r===den){w++;r=0;}if(!r)return s+w;let n=r,d=den;while(n%2===0){n/=2;d/=2;}return s+(w?w+'-':'')+n+'/'+d;};
const f1=x=>(Math.abs(x)<10?x.toFixed(1):x.toFixed(0)),lb=n=>(n/NPI).toFixed(1);
// ======================= the leg (velocipede lengths, mm) =======================
const J={m:62,a:202,l:89,b:342,c:281,d:277,e:596,f:327,g:206,h:359,i:518,j:226,k:426};

function lk(th){const O=V(0,0),B=V(-J.a,-J.l),C=V(J.m*Math.cos(th),J.m*Math.sin(th));const D=circ(B,J.b,C,J.j,1),E=circ(B,J.c,C,J.k,-1);if(!D||!E)return null;const F=circ(B,J.d,D,J.e,1);if(!F)return null;const G=circ(F,J.f,E,J.g,-1);if(!G)return null;const H=circ(G,J.h,E,J.i,-1);if(!H)return null;return {O,B,C,D,E,F,G,H};}

const legAt=th=>PU[((Math.round(th/TAU*NS)%NS)+NS)%NS];
const YMIN=Math.min(...PU.map(p=>p.H.y)),HT=-YMIN,CONTACT=PU.map(p=>p.H.y<YMIN+6);let TD=0;for(let k=0;k<NS;k++)if(CONTACT[k]&&!CONTACT[(k+1)%NS])TD=k;
const DUTY=CONTACT.filter(Boolean).length/NS,STX=PU.filter((p,i)=>CONTACT[i]).map(p=>p.H.x),ADV=(Math.max(...STX)-Math.min(...STX))/DUTY,ADVIN=ADV/25.4;
const HOOF_ANG=(()=>{const P=PU[(((Math.round(TD-NS*DUTY/2))%NS)+NS)%NS];return Math.atan2(P.H.y-P.E.y,P.H.x-P.E.x);})();
const PARK=(()=>{let b=null;for(let k=0;k<NS;k++){const a=PU[k],c=PU[(k+NS/2)%NS],d=Math.abs(a.H.y-c.H.y);if(!b||d<b.d)b={k,d};}return b.k/NS*TAU;})();
const LINKS=[{id:'crank',j:['O','C'],L:1,kind:'pine'},{id:'t1',j:['B','D','F'],L:1,kind:'plate'},{id:'t2',j:['G','E','H'],L:1,kind:'plate'},
  {id:'j',j:['C','D'],L:2,kind:'pine'},{id:'c',j:['B','E'],L:2,kind:'pine'},{id:'f',j:['F','G'],L:2,kind:'pine'},{id:'k',j:['C','E'],L:3,kind:'pine'}];
// leg masses (kg): pine 1x2 0.33 g per mm, coroplast plates, hoof. Gravity and swing torque at the crank, both legs half a turn apart
const KPM=.00033;function legParts(p,hoof){const O=V(0,0),B=V(-J.a,-J.l),seg=(a,b,m)=>({m,x:(a.x+b.x)/2,y:(a.y+b.y)/2}),cen=(a,b,c,m)=>({m,x:(a.x+b.x+c.x)/3,y:(a.y+b.y+c.y)/3});
  return [seg(O,p.C,.03),seg(p.C,p.D,J.j*KPM),seg(B,p.E,J.c*KPM),seg(p.F,p.G,J.f*KPM),seg(p.C,p.E,J.k*KPM),cen(B,p.D,p.F,.06),cen(p.G,p.E,p.H,.09),{m:hoof,x:p.H.x,y:p.H.y}];}
const LEGDYN={};function legDyn(hoof){if(LEGDYN[hoof])return LEGDYN[hoof];const g=9.81,dt=1e-3;const U=th=>legParts(lk(th),hoof).reduce((s,q)=>s+q.m*g*q.y/1000,0);
  const I=t=>{const a=legParts(lk(t),hoof),b=legParts(lk(t+dt),hoof);return a.reduce((s,q,i)=>s+q.m*((b[i].x-q.x)**2+(b[i].y-q.y)**2)/1e6/(dt*dt),0);};
  let tg=0,kd=0;for(let k=0;k<180;k++){const th=k/180*TAU;const t2=-(U(th+dt)-U(th-dt))/(2*dt)-(U(th+Math.PI+dt)-U(th+Math.PI-dt))/(2*dt);tg=Math.max(tg,Math.abs(t2));const dI=(I(th+.01)-I(th-.01))/.02+(I(th+Math.PI+.01)-I(th+Math.PI-.01))/.02;kd=Math.max(kd,Math.abs(dI/2));}
  const m=legParts(lk(0),hoof).reduce((s,q)=>s+q.m,0);return LEGDYN[hoof]={tg,kd,m};}
// ======================= measurements =======================
// x forward from the deck's rear end; y up from the floor; z across the bike, + to the rider's right
const DEF={deckTop:33,rodFwd:13.5,rodUp:7.9,saddleX:25,saddleUp:8,riderBack:2.5,riderHalf:7,basketW:15.5,basketL:14.3,basketRim:-1,
  redX:-2,redY:-9,cageX:4.5,cageY:.5,redD:3.74,groove:3.2,gap:.2,capD:2.25,cageD:1.75,tyreD:27.5,
  a:1.8,b:1.9,top:'lid',lidEff:11.3,zL:1.0,mph:3,hoof:'coro',frame:'alu',mu:.3,muT:.6};
const PHOTO=new Set(['deckTop','rodFwd','rodUp','saddleX','saddleUp','basketL','basketRim','redX','redY']);
const P=Object.assign({},DEF,store.get('rig3d4',{}));
const save=()=>{store.set('rig3d4',P);dirty=true;refreshPanels();};
const PLY=.5,PINE=.75,PINEW=1.5,CORO=.157,WASHT=1/16,NUTH=17/64,SPACER=5/8,LIDD=11.9,CORD=.16;
const FRAMES={ply:{n:'Plywood cheeks and platform',short:'Plywood'},alu:{n:'Aluminium angle truss (1 × 1 × 1/8 in.)',short:'Aluminium angle',AW:1,t:.125,lbft:.274},steel:{n:'Slotted steel angle truss (1-1/2 in., 14 ga)',short:'Slotted steel angle',AW:1.5,t:.075,lbft:.56}};

const topD=o=>{o=o||P;return o.top==='lid'?o.lidEff:TOPS[o.top].d;};
function D(){const rod={x:P.rodFwd,y:P.deckTop+P.rodUp},B={x:rod.x-J.a*MM/IN,y:rod.y-J.l*MM/IN},zIn=P.basketW/2+.25,F=FRAMES[P.frame],truss=P.frame!=='ply';
  const AW=truss?F.AW:1,t=truss?F.t:.125;
  const zFaceRod=truss?zIn+t+PLY+PINE:zIn+PLY,zFaceB=truss?zIn+t+PLY:zIn+PLY,z1=zFaceRod+SPACER,spacerB=z1-zFaceB,LZ=L=>z1+(L-1)*(PINE+WASHT)+PINE/2,crankOut=z1+PINE;
  const plat={y0:P.deckTop,y1:P.deckTop+PLY,x0:B.x-1.1,x1:Math.min(17.2,rod.x+3.5),w:2*(zIn+PLY)};
  const cheek=[[B.x-1.1,plat.y1],[plat.x1,plat.y1],[plat.x1,rod.y-1.5],[rod.x+1.6,rod.y+1.4],[rod.x-1.6,rod.y+1.4],[B.x-1.1,B.y+1.1]];
  const yr=P.deckTop+AW+AW/2,Pr={x:B.x,y:yr},Pf={x:Math.min(17,rod.x+3.5),y:yr},xbar=[Pf.x-.5,B.x+.2];

  const tyreR=P.tyreD/2,red={x:-P.redX,y:P.deckTop+P.redY},dy=red.y-tyreR,tc={x:red.x+Math.sqrt(Math.max(1,(tyreR+P.redD/2)**2-dy*dy)),y:tyreR};

  return {rod,B,zIn,AW,t,truss,zFaceRod,zFaceB,z1,spacerB,LZ,crankOut,plat,cheek,yr,Pr,Pf,xbar,baseTop,tyreR,red,tc,cage,hz,armZ:hz-.36,rear,n,contact,rodLen:2*crankOut,rackY:P.deckTop-1,post:{z0:-1.35,z1:-.6,y0:truss?P.deckTop:plat.y1}};}
// ======================= belts =======================
function beltGeom(c1,r1,c2,r2,cr){const dx=c2.x-c1.x,dy=c2.y-c1.y,dd=Math.hypot(dx,dy),a=Math.atan2(dy,dx),kk=cr?(r1+r2)/dd:(r1-r2)/dd;if(Math.abs(kk)>=1)return null;const b=Math.acos(kk);
  const P1=t=>({x:c1.x+r1*Math.cos(t),y:c1.y+r1*Math.sin(t)}),P2=t=>({x:c2.x+r2*Math.cos(t),y:c2.y+r2*Math.sin(t)});

  <p class="note">Diameters in inches. If both belts ride the cage at the same diameter, the cage cancels out: crank turns per wheel turn = (tyre ÷ red tread) × (groove ÷ top pulley) = ${(P.tyreD/P.redD*P.groove/r.top).toFixed(2)}. So the top pulley is the only big gear, and tape on track 2 is the fine gear: one wrap of electrical tape (0.18 mm) speeds the legs ${(2*.007/P.b*100).toFixed(1)}%. For no hoof skid, track 2 should be <b>${fr(b4,32)} in.</b> with track 1 at ${fr(P.a,32)} in.</p>
  <h2>The legs are the load</h2><div class="chips">${Object.entries(HOOFS).map(([k,v])=>`<button data-hoof="${k}" aria-pressed="${P.hoof===k}">${v.n} hoof, ${v.m*1000} g</button>`).join('')}</div>
  <p class="note">Peak crank torque = ${r.tg.toFixed(2)} N·m to lift the legs + ${r.kd.toFixed(3)} × (crank speed in rad/s)² to swing them. It grows with the square of speed, so it decides everything else. The hoof is at the end of the longest swing: a pine block makes the swinging load ${(legDyn(.11).kd/legDyn(.03).kd).toFixed(1)}× bigger than a coroplast box. Leg weight ${(r.legm*1000).toFixed(0)} g each.</p>
  <h2>Belt forces, 1.5× margin</h2>
  <table class="t"><tr><th></th><th style="text-align:right">Belt 1</th><th style="text-align:right">Belt 2</th></tr>
  <tr><td>Difference between the sides (carries the torque)</td><td class="n">${f1(r.dT1)} N</td><td class="n">${f1(r.dT2)} N</td></tr>
  <tr><td>Wrap on the small pulley</td><td class="n">${(r.th1*180/Math.PI).toFixed(0)}°</td><td class="n">${(r.th2*180/Math.PI).toFixed(0)}°</td></tr>
  <tr><td>Most the tight side can exceed the slack side, e<sup>μθ</sup></td><td class="n">×${r.e1.toFixed(2)}</td><td class="n">×${r.e2.toFixed(2)}</td></tr>
  <tr><td>Slack side at least</td><td class="n">${f1(r.s1)} N (${lb(r.s1)} lb)</td><td class="n">${f1(r.s2)} N (${lb(r.s2)} lb)</td></tr>
  <tr><td>Tight side</td><td class="n">${f1(r.t1)} N</td><td class="n">${f1(r.t2)} N</td></tr>
  <tr><td>Path length round the pulleys</td><td class="n">${fr(r.len1,8)} in.</td><td class="n">${fr(r.len2,8)} in.</td></tr>
  <tr><td>Tension test: a 200 g phone hung mid-span sags</td><td class="n">${fr(r.sag1,16)} in.</td><td class="n">${fr(r.sag2,16)} in.</td></tr></table>
  <p class="note">A belt carries torque only as the difference between its two sides, and that difference is capped by the friction (μ = ${P.mu} for cord on tape or plastic) times the wrap. A pulley ${(r.top/2).toFixed(1)} in. in radius needs ${(r.top/2).toFixed(1)}× less belt pull than one 1 in. in radius for the same crank torque, which is why the big lid matters more than its ratio.</p>
  <h2>Red wheels on the tyre</h2>${sectionSVG()}
  <table class="t"><tr><td>Drag the tyre passes to the red wheels</td><td class="n">${f1(r.Ftyre)} N</td></tr><tr><td>Push needed (grip ${P.muT}, 1.5× margin)</td><td class="n">${f1(r.Nneed)} N (${lb(r.Nneed)} lb)</td></tr>
  <tr><td>Tyre drag swings the arms ${self>0?'into':'away from'} the tyre, lever ratio</td><td class="n">${Math.abs(self).toFixed(2)}</td></tr></table>
  <p class="note">The arms swing on the cage axle, so belt 1 pulls straight through the pivot and cannot lift the wheels off the tyre (on the rack hinge it pulled them off). Riding forward, the tyre’s drag ${self>0?`swings the arms in: the drive tightens itself, like a bottle dynamo. Grip ${P.muT} × lever ${self.toFixed(2)} = ${wedge.toFixed(2)}${wedge>1?'. That is over 1, so with nothing to stop it the wheels would wedge into the tyre and could lock it. A limit cord from the axle to the rear hanger stops them 1/8 in. into the tyre.':', under 1, so it will not wedge.'} The bungee only holds the wheels on when you start and stop: about ${lb(Math.max(5,r.Nneed*.35))} lb.`:`pushes the arms away, so the bungee must give all ${lb(r.Nneed)} lb.`}</p>
  <h2>As built now, for comparison</h2>

  <tr><td>Peak crank torque</td><td class="n">${f1(cur.Tc)} N·m</td><td class="n">${r.Tc.toFixed(1)} N·m</td></tr>
  <tr><td>Belt 2 tight side</td><td class="n">${f1(cur.t2)} N</td><td class="n">${f1(r.t2)} N</td></tr>
  <tr><td>Push needed at the tyre</td><td class="n">${f1(cur.Nneed)} N</td><td class="n">${f1(r.Nneed)} N</td></tr></table>
  <p class="note">Now: belt 1 on an end cap about 4 in. off line, belt 2 on the 2 in. green cap, pine hooves, red-wheel arms hinged at the rack, cage on a one-ended wire. The crank turns ${(cur.N/r.Nt).toFixed(1)}× too fast for the road, the legs’ swinging load grows with the square of that, and no cord can carry it, so the cords slip and slap. That is the slop you see.</p>`;
  $('mph').oninput=e=>{P.mph=+e.target.value;$('mphv').textContent=P.mph+' mph';store.set('rig3d4',P);};$('mph').onchange=()=>{drivePanel();checksPanel();};

function cutList(frame){const save=P.frame;if(frame)P.frame=frame;const d=D(),F=FRAMES[P.frame],len=[];
  if(d.truss){for(let s=0;s<2;s++)len.push(['rail',d.Pf.x-d.Pr.x],['front strut',Math.hypot(d.rod.x-d.Pf.x,d.rod.y-d.Pf.y)-1.7],['rear strut',Math.hypot(d.rod.x-d.Pr.x,d.rod.y-d.Pr.y)-1.7],['post',Math.hypot(d.B.x-d.Pr.x,d.B.y-d.Pr.y)-1.2],['tie',Math.hypot(d.rod.x-d.B.x,d.rod.y-d.B.y)-2.9]);
    len.push(['cross bar',2*(d.zIn+d.t)],['cross bar',2*(d.zIn+d.t)]);}
  const arm=Math.hypot(d.rear.x-d.cage.x,P.deckTop+d.rear.AW/2-d.cage.y)+.6;len.push(['hanger bar',2*d.hz+.25],['hanger arm',arm],['hanger arm',arm]);
  const sticks=[];for(const [n,l] of [...len].sort((a,b)=>b[1]-a[1])){let s=sticks.find(s=>s.left>=l+.125);if(!s){s={left:48,cuts:[]};sticks.push(s);}s.left-=l+.125;s.cuts.push([n,l]);}
  const metalLb=len.reduce((s,q)=>s+q[1],0)/12*(d.truss?F.lbft:FRAMES.alu.lbft);
  const area=pts=>Math.abs(pts.reduce((s,p,i)=>{const q=pts[(i+1)%pts.length];return s+p[0]*q[1]-q[0]*p[1];},0)/2);
  const woodLb=d.truss?(2*(4*3.6+3*3.1)*PLY+2*3*PINE*PINEW)*.022:(2*area(d.cheek)*PLY+(d.plat.x1-d.plat.x0)*d.plat.w*PLY+2*(d.plat.x1-d.plat.x0)*PINE*PINEW+2*3*PINE*PINEW)*.022;
  P.frame=save;return {len,sticks,metalLb,woodLb,total:metalLb+woodLb+.4,arm};}

const STEPS=[
 {t:'Cage onto its own axle',hi:['cage','cageaxle','hanger'],cam:d=>CAMS.cageC(d),
  body:d=>`<ol><li>Pull the roller cage off its wire frame (pry off the far end cap; the cage slides off the wire).</li><li>Drill both end-cap holes to <b>25/64 in.</b> so the cage spins freely on 3/8-16 rod.</li><li>Rear hanger: an angle <b>${fr(2*d.hz+.25,8)} in.</b> long across the top of the deck’s rear end, two 1/4-20 bolts through the deck. From each end, an angle arm <b>${fr(cutList().arm,8)} in.</b> back and down to the cage axle, one bolt each end.</li><li>Cage axle, from the centre out on each side: end cap, nut (stops the cage sliding), the LSTA arm (next step), nut, hanger arm, nut. The hanger arms run straight back, level with the deck top, so the cage axis sits ${fr(P.cageY,8)} in. above the deck top and ${fr(P.cageX,8)} in. behind it; that lifts belt 2 clear of the hanger. Leave the cage ${fr(1/16)} in. of end play.</li></ol><div class="why">The roller frame held the cage at one end. Two belts pulled it two ways, the wire bent, and the tracks wandered. Held at both ends, the axle does not move. The cage spins on a fixed axle, so nothing on it unscrews.</div>`,kit:[['3/8-16 × 12 in. rod',1],['3/8-16 nuts',6],['angle, from the cut list',3],['1/4-20 bolts',4]]},
 {t:'Two tape tracks on the cage',hi:['cage'],cam:d=>CAMS.cageC(d),

  body:d=>`<ol><li>Red-wheel axle: 5/16-18 rod, <b>11 in.</b> The Razor wheels’ 608 bearings fit 5/16 rod. Both wheels in the middle, <b>${(P.gap*25.4).toFixed(0)} mm</b> apart (one 5/16 washer between them), a nut snug against each outer side. Three zip ties through the spokes so they turn together.</li><li>PVC spacers <b>${fr(d.armZ-.05-(P.gap/2+.472+.48),8)} in.</b> from each wheel out to the arm.</li><li>Arms: the two LSTA12s, drill a 13/32 in. hole at the top for the cage axle and a 21/64 in. hole for the red axle, ${fr(Math.hypot(d.red.x-d.cage.x,d.red.y-d.cage.y),16)} in. apart centre to centre. Each arm goes on the cage axle just inside its hanger arm, between two nuts set a washer’s thickness apart so it swings freely.</li></ol><div class="why">With the arms hanging from the cage axle, belt 1 pulls straight through the pivot and cannot lift the wheels off the tyre. On the rack hinge it pulled them away with about ${f1(DRV().t1*.9)} N, which is why they slipped.</div>`,kit:[['5/16-18 rod, 11 in.',1],['1/2 in. PVC pipe',''],['5/16 nuts, washers',4]]},
 {t:'Bungee and limit cord',hi:['redbungee','limit','red'],cam:d=>CAMS.tyre(d),
  body:d=>`<ol><li>A 10 in. bungee from each end of the red axle, down and forward to the rack stay, as near the line toward the wheel hub as you can.</li><li>Pull the wheels back by hand at the axle: about <b>${lb(Math.max(5,DRV().Nneed*.35))} lb</b> should lift them off (a luggage scale shows it).</li><li>Limit cords: paracord from each end of the red axle up to the rear hanger bar. With the tyre at riding pressure, push the wheels <b>1/8 in.</b> into it and tie the cord tight there.</li></ol><div class="why">Riding forward, the tyre’s drag pulls the wheels in by itself (lever ${DRV().selfRatio.toFixed(1)}). That is good for grip, but with nothing to stop it they would wedge in and could lock the wheel. The cord stops them.</div>`,kit:[['10 in. bungees',2],['paracord','2 ft']]},
 {t:()=>TR()?'Two cross bars on the deck':'Platform on the deck',hi:['xbar','platform'],cam:d=>({tx:d.rod.x*IN-.08,ty:(P.deckTop+.5)*IN,tz:0,r:1,th:.5,ph:.9}),
  body:d=>d.truss?`<ol><li>Cut two angles <b>${fr(2*(d.zIn+d.t),8)} in.</b></li><li>Across the deck, flat leg down, upright leg forward, at <b>${fr(d.xbar[1]-d.AW/2,8)} in.</b> and <b>${fr(d.xbar[0]-d.AW/2,8)} in.</b> from the deck’s rear end (to the angle’s back edge).</li><li>Two 1/4-20 bolts each through angle and deck top, 2-1/4 in. apart, lock nuts underneath. Check you can reach under the deck first.</li></ol>`:`<ol><li>Cut <b>${fr(d.plat.x1-d.plat.x0)} × ${fr(d.plat.w)} in.</b> from 1/2 in. sanded plywood.</li><li>Centre it across the deck, front edge ${fr(d.plat.x1)} in. from the deck’s rear end.</li><li>Four 1/4-20 carriage bolts through platform and deck, lock nuts under the deck.</li></ol>`,kit:[]},
 {t:()=>TR()?'Build both side trusses together':'Cut and drill both cheeks together',hi:['truss','gusset','bearing','cheek'],cam:d=>({tx:(d.rod.x-3)*IN,ty:(d.rod.y-3)*IN,tz:(d.zIn+.5)*IN,r:.95,th:.25,ph:1.35}),
  body:d=>{if(!d.truss)return `<ol><li>Mark one cheek on 1/2 in. plywood: bottom edge ${fr(d.plat.x1-(d.B.x-1.1))} in.; rod hole ${fr(d.rod.y-d.plat.y1)} in. above it and ${fr(d.plat.x1-d.rod.x)} in. back from the front; pivot B ${fr(J.a*MM/IN)} in. behind and ${fr(J.l*MM/IN)} in. below the rod hole.</li><li>Screw two blanks together and saw both. Glue a 3 in. 1×2 bearing block inside over the rod hole. Drill 21/64 in. through both for the rod and 1/4 in. for B.</li></ol>`;
   const cl=cutList().len,L=n=>fr(cl.find(c=>c[0]===n)[1],8);
   return `<ol><li>Cut for each side: rail <b>${L('rail')}</b>, front strut <b>${L('front strut')}</b>, rear strut <b>${L('rear strut')}</b>, post <b>${L('post')}</b>, tie <b>${L('tie')}</b> in.</li><li>Gussets, 1/2 in. plywood: rod gusset 4 × 3-5/8 in., B gusset 3 × 3-1/8 in. Glue a 3 in. 1×2 bearing block on the outside of each rod gusset.</li><li>Lay one side out flat on a full-size drawing: rod hole <b>${fr(d.rod.y-d.yr,8)} in.</b> above the rail’s centre line and <b>${fr(d.Pf.x-d.rod.x,8)} in.</b> behind its front end; B <b>${fr(J.a*MM/IN,8)} in.</b> behind and <b>${fr(J.l*MM/IN,8)} in.</b> below the rod hole.</li><li>Clamp the second side’s parts on top of the first and drill every hole through both: 1/4 in. for joints, <b>21/64 in.</b> through gusset and block for the rod, 1/4 in. for B.</li><li>Bolt up with 1/4-20 × 1 in. bolts and lock nuts${P.frame==='steel'?', through the slots where they fall; drill a hole where they don’t':''}.</li></ol><div class="why">Drilled together, the two rod holes line up and the rod turns freely. Each side is two triangles (rail, front strut, rear strut; rear strut, post, tie), so it cannot fold. The holes are in plywood gussets because a round hole in wood is a better bearing than a slot in metal.</div>`;},kit:[]},
 {t:'Stand the sides up and brace them',hi:['truss','cheek','diag','xbar','cleat'],cam:d=>({tx:d.rod.x*IN,ty:(P.deckTop+3)*IN,tz:0,r:.9,th:-1.35,ph:1.35}),
  body:d=>`<ol><li>${d.truss?'Bolt each rail onto the ends of both cross bars, outside the basket.':'Stand each cheek on the platform edge; a 1×2 cleat inside, screwed to the cheek and bolted down through the platform.'}</li><li>Push a straight 5/16 rod through both bearings. It must slide in with no force.</li><li>One LSTA12 a side, from just under the bearing to the ${d.truss?'front cross bar':'platform'} near the deck, ends bent flat, two screws or bolts at each end.</li></ol><div class="why">The sides are stiff front to back but could lean sideways. The strap stops them leaning out; the rod and its collars stop them leaning in.</div>`,kit:[['Simpson LSTA12',2]]},
 {t:'Make the lid pulley',hi:['lid'],cam:d=>CAMS.lidC(d),explode:true,
  body:d=>`<ol><li>Two 5-gallon lids, top faces together. Their rounded rims make a V at the edge where the cord rides.</li><li>Two 4 in. discs of 1/2 in. plywood (4 in. hole saw), one outside each lid.</li><li>Clamp all four. Drill the centre 5/16 in., then four 3/16 in. holes on a 2-5/8 in. circle; #10-24 bolts.</li><li>Measure the V: a string round it in the V, divided by 3.14. Enter it in Drive; it sets the gear.</li></ol>`,kit:[['5-gallon lids',2],['4 in. hole saw',1],['#10-24 × 1-3/4 in. bolts',4]]},
 {t:'Thread the shaft',hi:['rod','collar','jam','lid'],cam:d=>CAMS.explode(d),explode:true,
  body:d=>`<ol><li>Cut 5/16-18 rod to <b>${fr(d.rodLen,8)} in.</b> File the ends.</li><li>Through the left bearing: a <b>set-screw collar</b>, a jam pair, washer, the lid pulley, washer, a jam pair, a collar, through the right bearing.</li><li>Put the lid <b>${fr(P.zL)} in.</b> right of centre, in line with track 2. Lock each jam pair against the pulley with two wrenches; blue thread locker.</li><li>Collars against each bearing with a paper’s thickness gap; set screws tight.</li></ol><div class="why">Only the pulley and crank arms are clamped to the rod, and none of them touches anything that stands still, so nothing unscrews.</div>`,kit:[['5/16-18 × 24 in. rod',1],['Climax C-031 collars',2],['5/16 nuts',8],['blue thread locker','']]},
 {t:'Centre bearing post',hi:['post','rod'],cam:d=>({tx:d.rod.x*IN,ty:(d.rod.y-3)*IN,tz:-.02,r:.8,th:-.9,ph:1.3}),
  body:d=>`<ol><li>Pine 1×2, <b>${fr(d.rod.y+1.2-d.post.y0,8)} in.</b> long, standing on edge across the bike, just left of the lid.</li><li>With the shaft in place, hold the post against the rod, mark the rod centre, drill <b>21/64 in.</b>, slide it on from the left end before the collar.</li><li>Two 1-1/2 in. corner braces at its foot, screwed into the post and bolted through ${d.truss?'the deck':'the platform and deck'}.</li></ol><div class="why">Belt 2 pulls the lid with about ${f1(DRV().Wrod*NPI)} N. Between the side bearings alone the 5/16 rod would bow ${(DRV().Wrod*Math.pow(2*(d.truss?d.zIn+d.t:d.zIn-PINE),3)/(48*29e6*Math.PI*Math.pow(.2524,4)/64)).toFixed(2)} in., the lid would wobble, and the belt would go slack every turn. With the post 1-1/2 in. from the load it bows ${DRV().defl.toFixed(3)} in.</div>`,kit:[['pine 1×2',''],['1-1/2 in. corner braces',2]]},
 {t:'Crank arms',hi:['crankstack','leg'],cam:d=>({tx:d.rod.x*IN,ty:(d.rod.y-1)*IN,tz:d.zFaceRod*IN,r:.95,th:1.0,ph:1.2}),
  body:d=>`<ol><li>Pine 1×2, 3-1/2 in.: rod hole 5/16 in. and pin hole 1/4 in., <b>2-7/16 in.</b> apart (62 mm). A 7/8 in. counterbore 3/8 in. deep on the outside over the rod hole.</li><li>Each end of the rod: washer, jam pair locked ${fr(SPACER)} in. out, crank arm, nut in the counterbore. The two arms point opposite ways. File the rod flush with the arm.</li></ol>`,kit:[['pine 1×2',''],['7/8 in. spade bit',1]]},
 {t:'Belts',hi:['cord'],cam:d=>CAMS.drive(d),
  body:d=>{const r=DRV();return `<ol><li>Belt 1, open: the groove between the red wheels to track 1. Path <b>${fr(r.len1,8)} in.</b></li><li>Belt 2, crossed once (a figure 8): track 2 to the lid’s V. Path <b>${fr(r.len2,8)} in.</b> The cross turns the crank the same way as the wheel, which walks the legs forward.</li><li>Shock cord: cut 8% shorter than the path; overlap the ends 1 in. and whip them tight with waxed thread. Paracord: cut to the path, melt the ends, overlap and sew.</li><li>Tension test: hang a 200 g phone on the middle of the long strand. Belt 1 should sag <b>${fr(r.sag1,16)} in.</b>, belt 2 <b>${fr(r.sag2,16)} in.</b> More sag means too loose.</li></ol>`;},kit:[['1/4 in. shock cord','']]},
 {t:'Legs, two pins each',hi:['leg'],cam:d=>({tx:(d.rod.x-6)*IN,ty:(d.rod.y-12)*IN,tz:d.z1*IN,r:1.4,th:.65,ph:1.35}),
  body:d=>`<ol><li>Pivot B: PVC spacer <b>${fr(d.spacerB,16)} in.</b>, fender washer, hip plate, fender washer, thigh rocker; 1/4 × 3 in. clevis pin and clip.</li><li>Crank pin C: crank arm, washer, upper rod, washer, lower rod; clevis pin and clip.</li><li>Hooves: fold and tape a coroplast box 4 × 3-1/2 × 1 in. instead of a pine block. ${(legDyn(.11).kd/legDyn(.03).kd).toFixed(1)}× less swinging load.</li></ol>`,kit:[['clevis pins and clips',4],['fender washers',16]]},
 {t:'Count, then ride slowly',hi:['cord','red'],cam:d=>CAMS.drive(d),
  body:d=>{const r=DRV();return `<ol><li>Lift the rear wheel, chalk a mark, turn it 10 times. The crank should turn <b>${(r.N*10).toFixed(1)}</b> times (no hoof skid: ${(r.Nt*10).toFixed(1)}). Too many: unwrap tape from track 2. Too few: add tape.</li><li>First ride under <b>${(130/r.rpm.crank*P.mph).toFixed(1)} mph</b>. Then stop and check: belts still tight, collars tight, nothing rubbing.</li></ol>`;},kit:[]},
 {t:'Off and onto a shelf',hi:['leg','deck'],cam:d=>CAMS.shelf(d),shelf:true,
  body:d=>`<ol><li>Pull four clips and four clevis pins: both legs come off.</li><li>Undo the two cam straps; lift the module by the two sides. The red wheels hang on their arms.</li><li>Deck on the shelf, rear end over the edge so the red wheels and cage hang free. About 22 × ${fr(d.crankOut*2,4)} in. and ${fr(d.rod.y+(P.top==='lid'?LIDD/2:1)-P.deckTop+.5,4)} in. tall.</li></ol>`,kit:[]}];
let SI=store.get('rig3d4-step',0);if(!(SI>=0&&SI<STEPS.length))SI=0;
const stitle=s=>typeof s.t==='function'?s.t():s.t;
function showStep(i){SI=(i+STEPS.length)%STEPS.length;store.set('rig3d4-step',SI);const s=STEPS[SI],d=D();$('sTitle').innerHTML=`${stitle(s)}<small>step ${SI+1} of ${STEPS.length}</small>`;
  $('sBody').innerHTML=s.body(d)+(s.kit.length?`<div class="kit">${s.kit.map(([n,q])=>`<span>${q?`<b>${q}×</b> `:''}${n}</span>`).join('')}</div>`:'');
  $('sList').innerHTML=STEPS.map((q,k)=>`<button data-i="${k}" aria-current="${k===SI}"><i>${k+1}</i>${stitle(q)}</button>`).join('');$('sList').querySelectorAll('button').forEach(b=>b.onclick=()=>showStep(+b.dataset.i));
  HI=s.hi;highlightApply();const lo=SI>=10;if(lo!==LEGS_ON){LEGS_ON=lo;dirty=true;}const want=s.shelf?'shelf':s.explode?'explode':'bike';if(MODE!==want){MODE=want;dirty=true;}
  pressView('vFocus');goCam(s.cam(d));}
$('sPrev').onclick=()=>showStep(SI-1);$('sNext').onclick=()=>showStep(SI+1);
// ======================= measure =======================
const TASKS=[['Floor to the top of the Razor deck.',[['deckTop','in.']]],['Rod centre: in front of the deck’s rear end; above the deck top.',[['rodFwd','in front'],['rodUp','above']]],
 ['Saddle: rear edge in front of the deck’s rear end; top above the deck top; how far your seat sticks out behind it.',[['saddleX','rear edge'],['saddleUp','top'],['riderBack','you, behind']]],
 ['Basket: outside width, length, rim height compared with the deck top.',[['basketW','width'],['basketL','length'],['basketRim','rim']]],
 ['Red-wheel axle: behind the deck’s rear end (negative if in front of it); below the deck top (negative).',[['redX','behind'],['redY','below']]],
 ['Cage axis: behind the deck’s rear end; above (+) or below (−) the deck top.',[['cageX','behind'],['cageY','up/down']]],
 ['Cord groove between the red wheels (string round it ÷ 3.14); gap between the wheels.',[['groove','groove'],['gap','gap']]],
 ['Roller cage: end cap diameter; wire cage diameter.',[['capD','end cap'],['cageD','cage']]],
 ['Sitting on the saddle: middle of the bike to the outside of your hip.',[['riderHalf','in.']]],
 ['Grip: cord on tape or plastic; red wheel on tyre (0.6 dry, 0.3 wet).',[['mu','cord'],['muT','tyre']]]];
function tasks(){$('tasks').innerHTML=TASKS.map(([t,f],i)=>`<div class="task"><p><b>${i+1}.</b> ${t}${f.some(q=>PHOTO.has(q[0]))?'<em>photo</em>':''}</p><div class="in">${f.map(([k,l])=>`<label>${l}<input type="number" step=".05" data-k="${k}" value="${P[k]}"></label>`).join('')}</div></div>`).join('')+`<p class="note"><button id="reset" style="font:600 12px var(--f-body);border:1px solid var(--rule);background:var(--paper);color:var(--ink-2);border-radius:6px;padding:4px 10px;cursor:pointer">Reset to the photo numbers</button></p>`;
  $('tasks').querySelectorAll('input').forEach(inp=>inp.onchange=()=>{const v=parseFloat(inp.value);if(!isNaN(v)){P[inp.dataset.k]=v;save();showStep(SI);}});$('reset').onclick=()=>{Object.assign(P,DEF);save();tasks();showStep(SI);};}
function refreshPanels(){if(dirty)build();drivePanel();checksPanel();bomPanel();}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(q=>q.setAttribute('aria-selected',q===b));['build','drive','checks','bom','do'].forEach(k=>$('p-'+k).hidden=k!==b.dataset.t);if(b.dataset.t==='drive'&&MODE!=='drive')setMode('drive');});
// ======================= run =======================
tasks();resize();build();showStep(SI);drivePanel();checksPanel();bomPanel();let last=performance.now(),dist=0,expl=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(dirty)build();
  if(playing&&MODE!=='shelf')dist+=dt*(MODE==='drive'?.35:1)*P.mph*17.6*.15;
  if(SP.wheel)SP.wheel.rotation.z=-dist/(P.tyreD/2);const redRot=dist/(P.redD/2);if(SP.red)SP.red.rotation.z=redRot;const cageRot=redRot*(P.groove/P.a);if(SP.cage)SP.cage.rotation.z=cageRot;
  const topRot=-cageRot*(P.b/topD());if(SP.shaft)SP.shaft.rotation.z=topRot;
  expl+=((MODE==='explode'?1:0)-expl)*Math.min(1,dt*4);if(SP.parts)for(const p of SP.parts)p.o.position.z=(p.z+(p.ez-p.z)*expl)*IN;
  poseLegs(MODE==='shelf'?PARK:PARK+topRot);grid.position.x=-((dist*IN)%.1);
  if(tween){const k=Math.min(1,(now-tween.t0)/650),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;for(const key of ['th','ph','r','tx','ty','tz'])cam[key]=tween.from[key]+(tween.to[key]-tween.from[key])*e;if(k>=1)tween=null;}
  updCam();scene.background=srgb(css('--paper'));R.render(scene,camera);overlay();requestAnimationFrame(frame);}
window.__step=showStep;window.__P=P;window.__mode=setMode;window.__drv=DRV;window.__geo=GEO;window.__save=save;
requestAnimationFrame(frame);
})();
</script>
</body></html>
