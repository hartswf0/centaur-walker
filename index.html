<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Centaur Walker</title>
<meta name="description" content="Centaur hind legs driven from a bicycle: every working page in one workbench.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#e9e7e2;--panel:#f7f6f2;--paper:#f4f2ec;--ink:#17150f;--ink-2:#5a554b;--ink-3:#8d877b;--rule:#d0cabe;--accent:#2f55c9;--accent-ink:#fff;
  --f-body:'IBM Plex Sans',system-ui,sans-serif;--f-mono:'IBM Plex Mono',ui-monospace,monospace;--f-disp:'Bodoni Moda',Georgia,serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f0e0c;--panel:#171512;--paper:#1d1a16;--ink:#ece7dd;--ink-2:#a9a293;--ink-3:#736c60;--rule:#2d2924;--accent:#8fa8ff;--accent-ink:#0d1014;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f0e0c;--panel:#171512;--paper:#1d1a16;--ink:#ece7dd;--ink-2:#a9a293;--ink-3:#736c60;--rule:#2d2924;--accent:#8fa8ff;--accent-ink:#0d1014;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.4 var(--f-body);display:grid;grid-template-rows:auto 1fr;overflow:hidden}
header{display:flex;align-items:center;gap:12px;padding:7px 12px;background:var(--panel);border-bottom:1px solid var(--rule);min-width:0}
.brand{display:flex;align-items:center;gap:8px;white-space:nowrap}.brand img{width:22px;height:22px}
h1{font:500 16px var(--f-disp);letter-spacing:.14em;text-transform:uppercase;margin:0}
nav{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav a{flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;height:40px;padding:0 11px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink-2);text-decoration:none;font:600 12.5px var(--f-body);white-space:nowrap}
nav a small{font:500 10px var(--f-mono);color:var(--ink-3)}nav a[aria-current="page"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}nav a[aria-current="page"] small{color:var(--panel);opacity:.7}
.more{font:600 12px var(--f-body);color:var(--accent);text-decoration:none;white-space:nowrap}
.stack{position:relative;min-height:0}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:none}iframe.on{display:block}
@media (max-width:760px){header{flex-wrap:wrap;padding:6px 8px;gap:6px}.brand{order:1}.more{order:2;margin-left:auto}nav{order:3;flex-basis:100%}nav a{height:36px;padding:0 9px;font-size:12px}h1{font-size:13px}}
</style></head>
<body>
<header><a class="brand" href="#whole" style="text-decoration:none;color:inherit"><img src="favicon.svg" alt=""><h1>Centaur Walker</h1></a>
<nav id="nav" aria-label="Workbench"></nav><a class="more" href="archive.html">All versions</a></header>
<main class="stack" id="stack"></main>
<script>
(()=>{
// every working page, in the order the power flows and the build goes; each stays loaded once opened
const TABS=[
 ['whole','Whole picture','start here','whole.html'],
 ['belts','Belts','grip, make, mount','belt.html'],
 ['axle','Top axle','assembly, rod, leg','versions/32-complete-workbench.html'],
 ['redesign','Redesign','lift-off module','rig3d.html'],
 ['power','Powertrain','ratios','powertrain.html'],
 ['leg','Original leg','v14 reference','versions/14-velocipede-final.html'],
 ['book','Build book','leg steps','build-book.html'],
 ['tpl','Templates','print to cut','templates.html']];
const nav=document.getElementById('nav'),stack=document.getElementById('stack'),frames={};
nav.innerHTML=TABS.map(([k,n,s])=>`<a href="#${k}" data-k="${k}">${n}<small>${s}</small></a>`).join('');
function show(k){if(!TABS.some(t=>t[0]===k))k='whole';const t=TABS.find(t=>t[0]===k);
  if(!frames[k]){const f=document.createElement('iframe');f.src=t[3];f.title=t[1];f.loading='eager';stack.appendChild(f);frames[k]=f;}
  for(const id in frames)frames[id].classList.toggle('on',id===k);
  nav.querySelectorAll('a').forEach(a=>{const on=a.dataset.k===k;a.setAttribute('aria-current',on?'page':'false');if(on)a.scrollIntoView({inline:'nearest',block:'nearest'});});
  document.title=`${t[1]} · Centaur Walker`;}
addEventListener('hashchange',()=>show(location.hash.slice(1)));show(location.hash.slice(1));
})();
</script>
</body></html>
