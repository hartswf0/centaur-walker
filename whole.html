<script>
(()=>{
const $=id=>document.getElementById(id),TAU=Math.PI*2,css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim(),IN=.0254;
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const fr=(x,den=16)=>{const s=x<0?'−':'';x=Math.abs(x);let w=Math.floor(x+1e-9),r=Math.round((x-w)*den);if(r===den){w++;r=0;}if(!r)return s+w;let n=r,d=den;while(n%2===0){n/=2;d/=2;}return s+(w?w+'-':'')+n+'/'+d;};
const f1=x=>Math.abs(x)<10?x.toFixed(1):x.toFixed(0);
// ===================== the rig as built, read from the photos =====================
// inches; x forward from the deck's rear end, y up from the deck top, z across the bike (+ = rider's right)
const BUILT={red:{x:1,y:-9},cage:{x:-3,y:-1},rod:{x:14.5,y:7.9},tyreD:27.5,tread:3.74,groove:3.2,gap:5,cord:4,
  capD:2.25,wireD:1.75,tapeD:1.9,capL:-4.4,capR:5.9,greenD:2.0,greenZ:.3,brassD:3.5,brassZ:-12,lidD:11.3,lidZ:1,
  b1:'capL',b2cage:'wires',b2z:1,b2top:'green',cross1:false,cross2:false,T01:10,T02:10,push:15,cord1:'para',cord2:'para',
  mph:3,hoof:'pine',load:'legs',Tman:1,mu:{groove:.6,cap:.2,wires:.15,tape:.4,green:.2,brass:.15,lid:.3,tyre:.6}};
const PRESETS={built:{},inline:{b1:'tape1',b2cage:'tape2',b2z:1,cross2:true,cord1:'shock8',cord2:'shock4'},lid:{b1:'tape1',b2cage:'tape2',b2z:1,b2top:'lid',cross2:true,hoof:'coro',T01:20,T02:22,push:30,cord1:'shock8',cord2:'shock4'}};
const clone=o=>JSON.parse(JSON.stringify(o));
let P=Object.assign(clone(BUILT),store.get('centaur-asbuilt',{}));P.mu=Object.assign(clone(BUILT.mu),P.mu||{});
let preset=store.get('whole-preset','built');
const save=()=>{store.set('centaur-asbuilt',P);store.set('whole-preset',preset);};
// cords you can buy at Home Depot: diameter in mm, and stretch stiffness EA in N (pull that would double its length); EA values are estimates, measure yours
const CORDS={para:{n:'Paracord 550 (as built)',d:4,EA:8000,join:'para'},shock8:{n:'1/8 in. shock cord',d:3.2,EA:60,join:'shock'},shock4:{n:'1/4 in. shock cord',d:6.35,EA:150,join:'shock'}};
const LEGS={pine:{tg:.51,kd:.0943,n:'Pine block hooves'},coro:{tg:.36,kd:.0338,n:'Coroplast box hooves'}};
// where each belt touches the cage, by choice
const CAGE1={capL:{n:'Left end cap (as built)',z:()=>P.capL,d:()=>P.capD,s:'cap'},tape1:{n:'Tape track on the centre line',z:()=>0,d:()=>P.tapeD,s:'tape'},wires1:{n:'Bare wires on the centre line',z:()=>0,d:()=>P.wireD,s:'wires'},capR:{n:'Right end cap',z:()=>P.capR,d:()=>P.capD,s:'cap'}};
const CAGE2={wires:{n:'Bare wires (as built)',d:()=>P.wireD,s:'wires'},tape2:{n:'Tape track',d:()=>P.tapeD,s:'tape'}};
const TOPS={green:{n:'Green cap (as built)',d:()=>P.greenD,z:()=>P.greenZ,s:'green'},brass:{n:'Brass disc, outboard',d:()=>P.brassD,z:()=>P.brassZ,s:'brass'},lid:{n:'Two bucket lids, cord in the V',d:()=>P.lidD,z:()=>P.lidZ,s:'lid'}};
const SURF={groove:'cord pinched between the two urethane wheels',cap:'smooth polypropylene end cap, no groove',wires:'six round zinc wires',tape:'vinyl electrical tape, built up into a track',green:'smooth plastic cap, no flanges',brass:'thin brass edge',lid:'V between two lid rims'};
// ===================== geometry =====================
function beltGeom(c1,r1,c2,r2,cr){const dx=c2.x-c1.x,dy=c2.y-c1.y,dd=Math.hypot(dx,dy),a=Math.atan2(dy,dx),kk=cr?(r1+r2)/dd:(r1-r2)/dd;if(Math.abs(kk)>=1)return null;const b=Math.acos(kk);
  const P1=t=>({x:c1.x+r1*Math.cos(t),y:c1.y+r1*Math.sin(t)}),P2=t=>({x:c2.x+r2*Math.cos(t),y:c2.y+r2*Math.sin(t)});
  const tA1=a+b,tB1=a-b,tA2=cr?a+b+Math.PI:a+b,tB2=cr?a-b+Math.PI:a-b;
  const arc=(c,r,t0,t1)=>{const n=Math.max(12,Math.ceil(Math.abs(t1-t0)/.06)),p=[];for(let i=0;i<=n;i++){const t=t0+(t1-t0)*i/n;p.push({x:c.x+r*Math.cos(t),y:c.y+r*Math.sin(t)});}return p;};
  return {sA:[P1(tA1),P2(tA2)],sB:[P1(tB1),P2(tB2)],arc1:arc(c1,r1,tA1,tB1+TAU),arc2:cr?arc(c2,r2,tA2,tB2+TAU):arc(c2,r2,tB2,tA2),th1:TAU-2*b,th2:cr?TAU-2*b:2*b};}
const plen=p=>p.reduce((s,q,i)=>i?s+Math.hypot(q.x-p[i-1].x,q.y-p[i-1].y):0,0);
function tightKey(g,c,w){for(const k of ['sA','sB']){const s=g[k],pd=s[0],pn=s[1],r={x:pd.x-c.x,y:pd.y-c.y},v={x:-w*r.y,y:w*r.x};if(v.x*(pd.x-pn.x)+v.y*(pd.y-pn.y)>0)return k;}return 'sA';}
function tyreC(){const R=P.tyreD/2+P.tread/2,dy=P.red.y-(13.75-33);return {x:P.red.x+Math.sqrt(Math.max(.1,R*R-dy*dy)),y:13.75-33};}
// ===================== the model: one function, everything derived =====================
function solve(){const tc=tyreC(),c1=CAGE1[P.b1],c2=CAGE2[P.b2cage],tp=TOPS[P.b2top];
  const red={x:P.red.x,y:P.red.y,z:0,r:P.groove/2,mu:P.mu.groove,s:'groove'},cageA={x:P.cage.x,y:P.cage.y,z:c1.z(),r:c1.d()/2,mu:P.mu[c1.s],s:c1.s},cageB={x:P.cage.x,y:P.cage.y,z:P.b2z,r:c2.d()/2,mu:P.mu[c2.s],s:c2.s},top={x:P.rod.x,y:P.rod.y,z:tp.z(),r:tp.d()/2,mu:P.mu[tp.s],s:tp.s};
  // turning directions seen from the right side, + = anticlockwise
  const sW=-1,sRed=1,sCage=P.cross1?-sRed:sRed,sTop=P.cross2?-sCage:sCage,legsFwd=sTop===-1;
  const N1=P.tyreD/P.tread,N2=P.groove/(2*cageA.r),N3=(2*cageB.r)/(2*top.r),N=N1*N2*N3;
  const wr=P.mph*17.6/(Math.PI*P.tyreD),rpm={wheel:wr*60,red:wr*N1*60,cage:wr*N1*N2*60,top:wr*N*60};
  const L=LEGS[P.hoof],w=rpm.top/60*TAU,Tlegs=L.tg+L.kd*w*w,Tc=P.load==='legs'?Tlegs:P.Tman;
  const mk=(d,dn,cr,T0,dT,wd)=>{const g=beltGeom(d,d.r,dn,dn.r,cr);if(!g)return null;const tk=tightKey(g,d,wd),sk=tk==='sA'?'sB':'sA';
    const e1=Math.exp(d.mu*g.th1),e2=Math.exp(dn.mu*g.th2),e=Math.min(e1,e2),cap=2*T0*(e-1)/(e+1),slip=dT>cap;
    const dTa=Math.min(dT,cap),T1=T0+dTa/2,T2=Math.max(.01,T0-dTa/2),phi1=Math.min(g.th1,Math.log(T1/T2)/d.mu),phi2=Math.min(g.th2,Math.log(T1/T2)/dn.mu);
    // the order the cord travels: tight strand onto the driver, round the driver, slack strand, round the driven pulley
    const arcD=tk==='sA'?g.arc1:[...g.arc1].reverse(),arcN=(cr?(tk==='sA'?[...g.arc2].reverse():g.arc2):(tk==='sA'?g.arc2:[...g.arc2].reverse()));
    const span=Math.hypot(g.sA[1].x-g.sA[0].x,g.sA[1].y-g.sA[0].y),fleet=Math.atan(Math.abs(dn.z-d.z)/span)*180/Math.PI;
    return {g,tk,sk,d,dn,cr,T0,dT,cap,slip,margin:cap/dT,T1,T2,phi1,phi2,e1,e2,arcD,arcN,span,fleet,len:plen(g.arc1)+plen(g.arc2)+2*span,sag:2*span/(4*T0)};};
  const dT2=Tc/(top.r*IN),Tcage=dT2*cageB.r*IN,dT1=Tcage/(cageA.r*IN),Tred=dT1*red.r*IN,Ftyre=Tred/(P.tread/2*IN),capT=P.mu.tyre*P.push;
  const b1=mk(red,cageA,P.cross1,P.T01,dT1,sRed),b2=mk(cageB,top,P.cross2,P.T02,dT2,sCage);
  const tyre={need:Ftyre,cap:capT,margin:capT/Ftyre,slip:Ftyre>capT};
  const parts=[['tyre','Tyre',tyre.margin],['b1','Belt 1',b1?b1.margin:0],['b2','Belt 2',b2?b2.margin:0]];const first=parts.reduce((a,b)=>b[2]<a[2]?b:a);
  // what the cord hits
  const OB=[{n:'deck',x0:2.6,x1:17.3,y0:-1,y1:0,z0:-1.8,z1:1.8},{n:'left prong of the deck',x0:0,x1:2.6,y0:-1,y1:0,z0:-1.8,z1:-.95},{n:'right prong of the deck',x0:0,x1:2.6,y0:-1,y1:0,z0:.95,z1:1.8},{n:'roller handle on the deck',x0:4,x1:10.5,y0:0,y1:1.2,z0:-.6,z1:.6},{n:'lower tie rod of the A-frame',x0:12.7,x1:12.95,y0:5.85,y1:6.1,z0:-1.9,z1:1.9},
    {n:'left rack rail',x0:-1.5,x1:18,y0:-1.3,y1:-.8,z0:-2.3,z1:-1.9},{n:'right rack rail',x0:-1.5,x1:18,y0:-1.3,y1:-.8,z0:1.9,z1:2.3},{n:'basket floor',x0:0,x1:14.3,y0:-1.45,y1:-1.25,z0:-7.75,z1:7.75}];
  const hits=[];for(const [bn,b] of [['Belt 1',b1],['Belt 2',b2]]){if(!b)continue;for(const k of ['sA','sB']){const [p0,p1]=b.g[k],z0=b.d.z,z1=b.dn.z;for(let i=1;i<40;i++){const t=i/40,x=p0.x+(p1.x-p0.x)*t,y=p0.y+(p1.y-p0.y)*t,z=z0+(z1-z0)*t;for(const o of OB)if(x>o.x0&&x<o.x1&&y>o.y0-.08&&y<o.y1+.08&&z>o.z0&&z<o.z1){if(!hits.some(h=>h.n===o.n&&h.b===bn))hits.push({b:bn,n:o.n,x,y,z});}}}}
  const cd1=CORDS[P.cord1];if(cd1.d>P.gap+.4)hits.push({b:'Belt 1',n:'gap between the red wheels: the cord is thicker than the gap',x:P.red.x,y:P.red.y-P.groove/2,z:0});

const LBARS=[['O','C',0],['C','D',1],['B','E',1],['F','G',1],['C','E',2]],LPLATES=[['B','D','F'],['G','E','H']];let LEGM=[];
const LP=(p,z)=>W({x:P.rod.x+p.x/25.4,y:P.rod.y+p.y/25.4},z);
function buildLegs(){LEGM=[];const pine=mat('#e6ca98',{roughness:.7}),coro=mat('#e4e7ea',{roughness:.55,side:T.DoubleSide}),hoofM=P.hoof==='coro'?coro:pine,missing=mat(css('--hot'),{transparent:true,opacity:.35,roughness:.6});
  for(const sg of [-1,1]){const z0=sg*8.6,L={sg,bars:[],plates:[],z0};
    for(const [a,b,layer] of LBARS){const m=new T.Mesh(new T.BoxGeometry(1,1.5*IN,.75*IN),pine);rig.add(m);L.bars.push({m,a,b,z:z0+sg*layer*.82});}
    for(const pl of LPLATES){const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(new Array(9).fill(0),3));const m=new T.Mesh(g,coro);rig.add(m);L.plates.push({m,pl,z:z0+sg*.45});}
    L.hoof=new T.Mesh(new T.BoxGeometry(4*IN,1*IN,3.5*IN),hoofM);rig.add(L.hoof);pick(L.hoof,'legs');L.bars.forEach(b=>pick(b.m,'legs'));LEGM.push(L);
    // missing on the bike: a mount for pivot B on each side, and the rod long enough to reach the right leg
    const B=LP({x:-J.a,y:-J.l},z0);rig.add(cylAB(B,W({x:P.rod.x-7.4,y:0},sg*1.86),.6*IN,missing,8));rig.add(cylAB(B,W({x:P.rod.x-1,y:0},sg*1.86),.6*IN,missing,8));}
  rig.add(cylAB(W(P.rod,6.2),W(P.rod,10.6),.1*IN,missing,8));}
function poseLegs(th){for(const L of LEGM){const p=legAt(th+(L.sg>0?Math.PI:0));if(!p)continue;
  for(const b of L.bars){const A=LP(p[b.a],b.z),Bp=LP(p[b.b],b.z),len=A.distanceTo(Bp);b.m.scale.x=len+1.5*IN;b.m.position.copy(A).lerp(Bp,.5);b.m.rotation.set(0,0,Math.atan2(Bp.y-A.y,Bp.x-A.x));}
  for(const q of L.plates){const a=q.m.geometry.attributes.position;q.pl.forEach((k,i)=>{const v=LP(p[k],q.z);a.setXYZ(i,v.x,v.y,v.z);});a.needsUpdate=true;q.m.geometry.computeVertexNormals();q.m.geometry.computeBoundingSphere();}
  const H=LP(p.H,L.z0);L.hoof.position.set(H.x,H.y-.5*IN,H.z);L.hoof.rotation.z=Math.atan2(p.H.y-p.E.y,p.H.x-p.E.x)+1.25;}}
// ===================== camera =====================
const cam={tx:.15,ty:.75,tz:0,r:1.3,th:.75,ph:1.15};let tween=null;
const C3=(p,z)=>{const w=W(p,z);return {tx:w.x,ty:w.y,tz:w.z};};
const VIEWS={q:()=>Object.assign(C3({x:3,y:-11},0),{r:2.75,th:.5,ph:1.38}),side:()=>Object.assign(C3({x:6,y:-3},0),{r:1.25,th:0,ph:1.52}),top:()=>Object.assign(C3({x:6,y:0},-2),{r:1.3,th:0,ph:.04}),rear:()=>Object.assign(C3({x:3,y:-3},-2),{r:1.05,th:-Math.PI/2,ph:1.42}),
  gap:()=>Object.assign(C3(P.red,0),{r:.42,th:-Math.PI/2+.3,ph:1.25}),cage:()=>Object.assign(C3(P.cage,(P.capL+P.capR)/2),{r:.78,th:-.75,ph:1.1}),topp:()=>Object.assign(C3(P.rod,P.b2top==='lid'?P.lidZ:P.greenZ),{r:P.b2top==='lid'?1.05:.5,th:.55,ph:1.2})};
const SELCAM={legs:()=>Object.assign(C3({x:P.rod.x-7,y:P.rod.y-15},0),{r:2.2,th:.6,ph:1.35}),red:()=>Object.assign(C3(P.red,0),{r:.5,th:.2,ph:1.35}),cage:()=>VIEWS.cage(),top:()=>VIEWS.topp(),tyre:()=>Object.assign(C3(G.contact||P.red,0),{r:.3,th:-.4,ph:1.3}),
  b1:()=>{const b=S.b1;return Object.assign(C3({x:(b.d.x+b.dn.x)/2,y:(b.d.y+b.dn.y)/2},(b.d.z+b.dn.z)/2),{r:Math.max(.5,b.span*IN*2.3),th:.25,ph:1.35});},b2:()=>{const b=S.b2;return Object.assign(C3({x:(b.d.x+b.dn.x)/2,y:(b.d.y+b.dn.y)/2},(b.d.z+b.dn.z)/2),{r:Math.max(.5,b.span*IN*2.1),th:.3,ph:1.3});}};
const goCam=to=>{tween={from:Object.assign({},cam),to:Object.assign({},cam,to),t0:performance.now()};};
function updCam(){const k=1/Math.pow(Math.min(1,camera.aspect),.7),sp=v3(Math.sin(cam.ph)*Math.sin(cam.th),Math.cos(cam.ph),Math.sin(cam.ph)*Math.cos(cam.th)).multiplyScalar(cam.r*k);camera.position.set(cam.tx+sp.x,cam.ty+sp.y,cam.tz+sp.z);camera.lookAt(cam.tx,cam.ty,cam.tz);}
function press(v){document.querySelectorAll('[data-v],[data-c]').forEach(b=>b.setAttribute('aria-pressed',(b.dataset.v||b.dataset.c)===v));}
function setView(v){press(v);goCam((VIEWS[v]||VIEWS.q)());}
function fitTarget(){if(SEL&&SELCAM[SEL]){press('');goCam(SELCAM[SEL]());}}
function resize(){const r=view.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);R.setSize(r.width,r.height,false);camera.aspect=r.width/Math.max(1,r.height);camera.updateProjectionMatrix();ov.width=r.width*d;ov.height=r.height*d;}addEventListener('resize',resize);
// ===================== interaction: tap a part to zoom to it, drag a pulley to move it, drag elsewhere to turn the view =====================
const ray=new T.Raycaster(),ndc=new T.Vector2();let drag=null;
function hit(e){const r=cv.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ndc,camera);const h=ray.intersectObjects(PICK,false)[0];return h?h.object.userData.sel:null;}
function onPlane(e,normal,point){const r=cv.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ndc,camera);const pl=new T.Plane().setFromNormalAndCoplanarPoint(normal,point),out=new T.Vector3();return ray.ray.intersectPlane(pl,out)?out:null;}
view.addEventListener('pointerdown',e=>{view.setPointerCapture(e.pointerId);drag={sel:hit(e),x:e.clientX,y:e.clientY,th:cam.th,ph:cam.ph,moved:false};});
view.addEventListener('pointermove',e=>{if(!drag)return;if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6)return;drag.moved=true;const sel=drag.sel;
  if(sel==='red'||sel==='cage'||sel==='top'){const p=onPlane(e,v3(0,0,1),v3(0,0,0));if(!p)return;const x=+(p.x/IN).toFixed(2),y=+(p.y/IN-DT).toFixed(2);
    if(sel==='cage')P.cage={x,y};else if(sel==='top')P.rod={x,y};else{const tc=tyreC(),Rr=P.tyreD/2+P.tread/2,a=Math.atan2(y-tc.y,x-tc.x);P.red={x:+(tc.x+Rr*Math.cos(a)).toFixed(2),y:+(tc.y+Rr*Math.sin(a)).toFixed(2)};}preset='';update(true);return;}
  if(sel==='zb1'||sel==='zb2'){const p=onPlane(e,v3(0,1,0),W(P.cage,0));if(!p)return;const z=Math.max(P.capL-.4,Math.min(P.capR+.4,p.z/IN));if(sel==='zb1'){P.b1=Math.abs(z-P.capL)<.6?'capL':Math.abs(z-P.capR)<.6?'capR':'tape1';}else P.b2z=+z.toFixed(2);preset='';update(true);return;}
  tween=null;cam.th=drag.th-(e.clientX-drag.x)*.008;cam.ph=Math.max(.04,Math.min(1.62,drag.ph-(e.clientY-drag.y)*.006));press('');});
view.addEventListener('pointerup',()=>{if(drag&&!drag.moved){const s=drag.sel&&drag.sel[0]!=='z'?drag.sel:null;SEL=s&&s!==SEL?s:null;if(SEL)fitTarget();update();}else if(drag&&drag.moved&&drag.sel&&drag.sel!=='tyre'&&drag.sel[0]!=='b'){panel();}drag=null;});
view.addEventListener('wheel',e=>{e.preventDefault();tween=null;cam.r=Math.max(.08,Math.min(5,cam.r*Math.exp(e.deltaY*.001)));},{passive:false});
{const pts=new Map();let p0=null;view.addEventListener('touchstart',e=>{if(e.touches.length===2){drag=null;const [a,b]=e.touches;p0={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),r:cam.r};}},{passive:true});
 view.addEventListener('touchmove',e=>{if(e.touches.length===2&&p0){const [a,b]=e.touches;cam.r=Math.max(.08,Math.min(5,p0.r*p0.d/Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)));}},{passive:true});view.addEventListener('touchend',()=>{p0=null;});}
// ===================== overlay: only what you asked for =====================
function overlay(){const d=Math.min(2,devicePixelRatio||1);og.setTransform(1,0,0,1,0,0);og.clearRect(0,0,ov.width,ov.height);
  if(SEL){const info=selInfo();if(info){og.font=`600 ${11.5*d}px ${css('--f-mono')}`;og.fillStyle=css('--ink');let y=18*d;for(const t of info){og.fillText(t,12*d,y);y+=16*d;}}}
  if(!names)return;og.font=`500 ${11*d}px ${css('--f-body')}`;og.fillStyle=css('--ink-2');
  const L=[[P.red,0,'red wheels'],[P.cage,P.capL,'left end cap'],[P.cage,P.capR,'right end cap'],[P.rod,P.greenZ,'green cap'],[P.rod,P.brassZ,'brass disc'],[{x:7,y:1.2},0,'roller handle'],[{x:P.rod.x-4,y:4},1.9,'A-frame'],[{x:S.tc.x-9,y:S.tc.y+11},0,'rear tyre'],[{x:12.82,y:6},2.3,'tie rod']];
  for(const [p,z,t] of L){const v=W(p,z).project(camera);if(v.z>1)continue;og.fillText(t,(v.x+1)/2*ov.width+6*d,(1-v.y)/2*ov.height-6*d);}}
// ===================== panel =====================
function meter(key,name,need,cap,unit){const used=need/cap,pc=Math.min(1,used),col=used>1?css('--hot'):used>.7?css('--warn'):css('--ok');
  return `<div class="meter" data-sel="${key}" title="tap to look at it"><span>${name}</span><div class="track"><div class="fill" style="width:${(pc*100).toFixed(1)}%;background:${col}"></div></div><b style="color:${col}">${used>1?'slips':Math.round(used*100)+'%'}</b></div>`;}
// ===================== the whole chain, one node per part the power goes through =====================
const FIXES=[{k:'track',n:'Belt 1 onto a tape track on the bike’s centre line',on:()=>P.b1==='tape1',set:v=>{P.b1=v?'tape1':'capL';}},
 {k:'cross',n:'Cross belt 2 once (a figure 8)',on:()=>P.cross2,set:v=>{P.cross2=v;}},
 {k:'lid',n:'Two bucket lids as the top pulley; belt 2 on a tape track',on:()=>P.b2top==='lid',set:v=>{P.b2top=v?'lid':'green';P.b2cage=v?'tape2':'wires';}},
 {k:'shock',n:'Shock cord instead of paracord, fitted tighter',on:()=>P.cord1!=='para',set:v=>{P.cord1=v?'shock8':'para';P.cord2=v?'shock4':'para';P.T01=v?20:10;P.T02=v?22:10;}},
 {k:'push',n:'Stronger bungee pressing the red wheels on the tyre',on:()=>P.push>=30,set:v=>{P.push=v?30:15;}},
 {k:'hoof',n:'Coroplast box hooves instead of pine blocks',on:()=>P.hoof==='coro',set:v=>{P.hoof=v?'coro':'pine';}}];
function nodes(){const s=S,b1=s.b1,b2=s.b2,gapHit=s.hits.some(h=>h.b==='Belt 1'&&h.n.startsWith('gap')),b2hit=s.hits.filter(h=>h.b==='Belt 2');
  const pct=b=>b.slip?'slips':Math.round(100/b.margin)+'%';
  return [{k:'tyre',n:'Tyre',v:`${f1(s.rpm.wheel)} rpm`,st:s.tyre.slip?'bad':s.tyre.margin<1.4?'warn':'ok',d:[`The tyre has to drag the red wheels round with ${f1(s.Ftyre)} N.`,`They can grip ${f1(s.tyre.cap)} N, pressed on with ${P.push} N.`,s.tyre.slip?'Not enough: they skid on the tyre.':'Enough.'],fx:['push','hoof']},
   {k:'red',n:'Red wheels',v:`${f1(s.rpm.red)} rpm`,st:gapHit?'bad':'ok',d:[`They turn ${s.N1.toFixed(2)} times per wheel turn.`,`Belt 1 sits in the ${P.gap} mm gap between them. ${CORDS[P.cord1].n} is ${CORDS[P.cord1].d} mm thick${gapHit?': too thick':''}.`],fx:['shock']},
   {k:'b1',n:'Belt 1',v:pct(b1),st:b1.slip||b1.fleet>3?'bad':b1.margin<1.4?'warn':'ok',d:[`Red wheels to the cage ${CAGE1[P.b1].n.toLowerCase().replace(' (as built)','')}.`,`${b1.fleet>3?`Runs ${b1.fleet.toFixed(0)}° off line, so it climbs off.`:'Runs straight.'}`,b1.slip?`Slips: the load needs ${f1(b1.dT)} N of pull difference across it; it can hold ${f1(b1.cap)} N.`:`Grips: uses ${Math.round(100/b1.margin)}% of what it can hold.`],fx:['track','shock']},
   {k:'cage',n:'Cage',v:`${f1(s.rpm.cage)} rpm`,st:'ok',d:[`Turns ${(s.N1*s.N2).toFixed(1)} times per wheel turn.`,`Belt 1 on ${CAGE1[P.b1].n.toLowerCase().replace(' (as built)','')}; belt 2 on ${CAGE2[P.b2cage].n.toLowerCase().replace(' (as built)','')}.`],fx:['track','lid']},
   {k:'b2',n:'Belt 2',v:pct(b2),st:b2.slip?'bad':b2hit.length?'warn':b2.margin<1.4?'warn':'ok',d:[`Cage to the ${TOPS[P.b2top].n.toLowerCase().replace(' (as built)','')}, ${P.cross2?'crossed':'open'}.`,b2.slip?`Slips: the load needs ${f1(b2.dT)} N of pull difference across it; it can hold ${f1(b2.cap)} N.`:`Grips: uses ${Math.round(100/b2.margin)}% of what it can hold.`,...b2hit.map(h=>`Rubs the ${h.n}.`)],fx:['lid','cross','shock']},
   {k:'top',n:'Top',v:`${f1(s.rpm.top)} rpm`,st:s.legsFwd?'ok':'bad',d:[`Turns ${s.legsFwd?'clockwise':'anticlockwise'} seen from the right; the legs need clockwise.`,`Must deliver ${s.Tc.toFixed(s.Tc<10?2:0)} N·m to swing the legs.`],fx:['cross','lid']},
   {k:'legs',n:'Legs',v:s.legsFwd?'forward':'backward',st:!s.legsFwd||Math.abs(s.N/s.Nt-1)>.5?'bad':Math.abs(s.N/s.Nt-1)>.15?'warn':'ok',d:[`They walk ${s.legsFwd?'forward':'backward'}.`,`Crank turns per wheel turn ${s.N.toFixed(2)}; ${s.Nt.toFixed(2)} keeps them in step with the road (${(s.N/s.Nt).toFixed(1)}×).`,`${LEGS[P.hoof].n}.`],fx:['lid','hoof','cross']}];}
function panel(){const N=nodes(),sel=N.find(n=>n.k===SEL),bad=N.filter(n=>n.st==='bad');
  $('chain').innerHTML=N.map((n,i)=>`<button class="node ${n.st}" data-k="${n.k}" aria-pressed="${SEL===n.k}"><span class="nn">${n.n}</span><b>${n.v}</b><i></i></button>${i<N.length-1?'<span class="arrow" aria-hidden="true"></span>':''}`).join('');
  const show=sel||{d:bad.length?[`${bad.length} of 7 links fail: ${bad.map(n=>n.n.toLowerCase()).join(', ')}.`,'Tap a link to see it on the model.']:['Every link works.','Tap a link to see it on the model.'],fx:FIXES.map(f=>f.k)};
  $('pane').innerHTML=`<div class="detail">${sel?`<h2>${sel.n}</h2>`:'<h2>The whole drive</h2>'}${show.d.map(t=>`<p>${t}</p>`).join('')}</div>
   <h2>Fixes${sel?' for this link':''}</h2><div class="fixes">${FIXES.filter(f=>show.fx.includes(f.k)).map(f=>`<button class="fix" data-f="${f.k}" aria-pressed="${f.on()}"><span class="box"></span>${f.n}</button>`).join('')}</div>
   <div class="row2"><button class="btn" id="none">As built</button><button class="btn" id="all">All fixes</button><button class="btn" id="play" aria-pressed="${playing}">Turning</button></div>
   <div class="row"><span>Riding speed</span><b id="mphv">${P.mph} mph</b></div><input type="range" id="mph" min="1" max="10" step=".5" value="${P.mph}" aria-label="Riding speed">
   <p class="note">Belt colour: blue slack to orange tight; a contact that slips pulses red. Pale orange parts are missing on the bike: the leg pivot mounts and the longer top rod. <a href="belt.html">Belt lab</a> has every number; <a href="rig3d.html">3D module</a> the full redesign.</p>`;
  document.querySelectorAll('.node').forEach(b=>b.onclick=()=>{SEL=SEL===b.dataset.k?null:b.dataset.k;if(SEL)fitTarget();else goCam(VIEWS.q());update();});
  document.querySelectorAll('.fix').forEach(b=>b.onclick=()=>{const f=FIXES.find(q=>q.k===b.dataset.f);f.set(!f.on());update();});
  $('none').onclick=()=>{const m=P.mph;P=Object.assign(clone(BUILT));P.mu=clone(BUILT.mu);P.mph=m;update();};$('all').onclick=()=>{FIXES.forEach(f=>f.set(true));update();};
  $('play').onclick=e=>{playing=!playing;e.currentTarget.setAttribute('aria-pressed',playing);};
  $('mph').oninput=e=>{P.mph=+e.target.value;$('mphv').textContent=P.mph+' mph';};$('mph').onchange=()=>update();}
function update(light){S=solve();save();build();const s=S;
  $('status').innerHTML=`${s.N.toFixed(2)} crank turns per wheel turn · legs ${s.legsFwd?'forward':'<b>backward</b>'} · ${s.first[2]<1?`<b>${s.first[1].toLowerCase()} slips</b>`:`<b class=ok>grips</b>, ${s.first[1].toLowerCase()} first`}${s.hits.length?` · <b>${s.hits.length} hit${s.hits.length>1?'s':''}</b>`:''}`;
  panel();}

addEventListener('storage',e=>{if(e.key!=='centaur-asbuilt'||!e.newValue)return;try{const n=JSON.parse(e.newValue);P=Object.assign(clone(BUILT),n);P.mu=Object.assign(clone(BUILT.mu),n.mu||{});S=solve();build();panel();}catch(_){}});
// ===================== run =====================
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(playing&&S&&S.b1&&S.b2){const k=.06,wr=P.mph*17.6/(Math.PI*P.tyreD)*TAU*k; // 1/16 of real speed so the motion can be followed
    ang.wheel+=S.sW*wr*dt;const redW=wr*S.N1*(S.tyre.slip?S.tyre.margin:1);ang.red+=S.sRed*redW*dt;const v1=redW*S.red.r;ang.belt1+=v1*dt;
    const cageW=v1/S.cageA.r*(S.b1.slip?S.b1.margin:1);ang.cage+=S.sCage*cageW*dt;const v2=cageW*S.cageB.r;ang.belt2+=v2*dt;ang.top+=S.sTop*v2/S.top.r*(S.b2.slip?S.b2.margin:1)*dt;}
  if(G.wheel)G.wheel.rotation.z=ang.wheel;if(G.red)G.red.rotation.z=ang.red;if(G.cage)G.cage.rotation.z=ang.cage;if(G.top)G.top.rotation.z=ang.top;placeBeads();poseLegs(PARK+ang.top);
  const pz=.5+.5*Math.sin(now/130);for(const o of PULSE)if(o.material&&o.material.emissive){o.material.emissive.setRGB(.9*pz,.15*pz,.05*pz);}else if(o.isGroup||o.traverse)o.traverse(m=>{if(m.material&&m.material.emissive)m.material.emissive.setRGB(.9*pz,.15*pz,.05*pz);});
  if(tween){const t=Math.min(1,(now-tween.t0)/600),e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;for(const key of ['th','ph','r','tx','ty','tz'])cam[key]=tween.from[key]+(tween.to[key]-tween.from[key])*e;if(t>=1)tween=null;}
  updCam();scene.background=srgb(css('--paper'));R.render(scene,camera);overlay();requestAnimationFrame(frame);}
resize();update();Object.assign(cam,VIEWS.q());requestAnimationFrame(frame);
window.__S=()=>S;window.__P=()=>P;window.__sel=k=>{SEL=k;fitTarget();update();};window.__view=setView;
})();
</script>
</body></html>
