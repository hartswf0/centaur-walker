<title>Centaur Walker</title>

<style>

:root[data-theme="dark"]{--bg:#0f0e0c;--panel:#171512;--view:#1d1a16;--paper:#24211c;--ink:#ece7dd;--ink-2:#a9a293;--ink-3:#736c60;--rule:#2d2924;--rule-2:#221f1b;--accent:#8fa8ff;--accent-ink:#0d1014;--hot:#ff8a4c;--ok:#4ade80;--warn:#fb923c;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 var(--f-body);overflow:hidden}
.ws{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(260px,52%) auto auto minmax(0,1fr);grid-template-areas:"head" "view" "trans" "tabs" "insp";padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
@media (min-width:900px){.ws{grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"head head" "view side" "trans side"}.side{grid-area:side;display:grid;grid-template-rows:auto minmax(0,1fr);border-left:1px solid var(--rule);min-height:0}.tabs,.insp{grid-area:auto!important}}
@media (max-width:899px){.side{display:contents}}
header{grid-area:head;display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--rule);min-width:0}

@media (max-width:560px){h1{display:none}}
.hstat{flex:1;min-width:0;font:500 11px var(--f-mono);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mode{display:inline-flex;border:1px solid var(--ink);border-radius:7px;overflow:hidden;flex-shrink:0}
.mode button{font:600 12.5px var(--f-body);border:0;background:transparent;color:var(--ink);padding:6px 12px;min-height:34px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.mode i{display:inline-block;width:6px;height:13px;border:1.6px solid currentColor;border-radius:3px 3px 1px 1px}.mode i.w{width:14px;height:10px;border-radius:50%}
.mini{font:600 11px var(--f-body);border:1px solid var(--rule);background:var(--panel);color:var(--ink);border-radius:5px;min-height:30px;min-width:32px;padding:4px 8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.mini[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}

.vseg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--panel)}

.vseg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.vstat{position:absolute;left:8px;right:8px;bottom:6px;font:500 10.5px var(--f-mono);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;z-index:3}
.trans{grid-area:trans;display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.play,.stepb{width:40px;height:36px;border-radius:7px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;display:grid;place-items:center;flex-shrink:0}
.stepb{background:var(--panel);color:var(--ink);border:1px solid var(--rule)}
.stepb:disabled{opacity:.35}
.ic{display:inline-block;position:relative;width:12px;height:12px}
.ic.play-i{width:0;height:0;border-left:11px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent}
.ic.pause-i::before,.ic.pause-i::after{content:"";position:absolute;top:0;width:4px;height:12px;background:currentColor}.ic.pause-i::before{left:1px}.ic.pause-i::after{right:1px}
.ic.prev,.ic.next{width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent}.ic.prev{border-right:9px solid currentColor}.ic.next{border-left:9px solid currentColor}

.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

p{margin:0;max-width:66ch}.muted{color:var(--ink-2);font-size:12.5px}

td.pass{color:var(--ok);font-weight:600}td.fail{color:var(--warn);font-weight:600}
.tag{display:inline-block;font:600 9.5px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:1px 4px;border-radius:3px;border:1px solid currentColor;white-space:nowrap}
ol.steps{list-style:none;margin:0;padding:0}
ol.steps li{display:grid;grid-template-columns:30px 1fr;gap:8px;padding:7px 4px;border-bottom:1px solid var(--rule-2);cursor:pointer}

ol.steps li span.d{font-size:12.5px;color:var(--ink-2)}

.cell{border:1px solid var(--rule);border-radius:6px;padding:8px 10px;background:var(--bg)}.cell small{display:block;color:var(--ink-2);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.big{font:500 22px var(--f-mono);letter-spacing:-.01em}
a{color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.loading{position:absolute;inset:0;display:grid;place-items:center;font:500 12px var(--f-mono);color:var(--ink-2)}

<div class="view" id="view">
  <canvas id="c3" aria-label="3D model"></canvas>

  <div class="vbar"><div class="vseg" role="group" aria-label="View"><button data-v="manual" aria-pressed="true">Manual</button><button data-v="3d" aria-pressed="false">3D</button><button data-v="side" aria-pressed="false">Side</button><button data-v="plate" aria-pressed="false">Plate</button><button data-v="leg" aria-pressed="false">Leg</button></div></div>
  <div class="vstat" id="vstat"></div>
</div>

  <div class="tabs" role="tablist"><button role="tab" data-t="steps" aria-selected="true">Steps</button><button role="tab" data-t="shop" aria-selected="false">Shop</button><button role="tab" data-t="tests" aria-selected="false">Tests</button><button role="tab" data-t="record" aria-selected="false">Record</button></div>

</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const T=window.THREE,TAU=Math.PI*2,$=id=>document.getElementById(id),css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const V=(x,y)=>({x,y}),sub=(a,b)=>V(a.x-b.x,a.y-b.y),add=(a,b)=>V(a.x+b.x,a.y+b.y),len=v=>Math.hypot(v.x,v.y),mm=m=>Math.round(m*1000)+' mm',inch=m=>(m/.0254).toFixed(1)+' in';

/* ================= THE LEG =================
   Jansen's topology. Every length is a whole number of 3/4 in. hole pitches, so every link is a piece of
   Everbilt perforated steel flat bar cut between holes: no drilling. Evolved for a load-bearing walk:
   one hoof always on the ground, level stance, two planted hooves moving together. */
const PITCH=19.05; // mm, Everbilt perforated flat bar, 3/8 in. holes on 3/4 in. centres
const N={a:16,b:13,c:18,d:13,e:13,f:28,g:11,h:22,i:23,j:18,k:28,l:5,m:5};
const J={};for(const k in N)J[k]=N[k]*PITCH;
function circ(p,r1,q,r2,side){const dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy);if(d<1e-9)return null;const a=(r1*r1-r2*r2+d*d)/(2*d),hh=r1*r1-a*a;if(hh<0)return null;const h=Math.sqrt(hh),mx=p.x+a*dx/d,my=p.y+a*dy/d;return V(mx-side*h*dy/d,my+side*h*dx/d);}

const NS=360,PU=[];for(let k=0;k<NS;k++)PU.push(lk(k/NS*TAU));
const YMIN=Math.min(...PU.map(p=>p.H.y)),CONTACT=PU.map(p=>p.H.y<YMIN+6);let TD=0,LO=0;for(let k=0;k<NS;k++){if(CONTACT[k]&&!CONTACT[(k+1)%NS])TD=k;if(CONTACT[k]&&!CONTACT[(k-1+NS)%NS])LO=k;}
const DUTY=CONTACT.filter(Boolean).length/NS,STX=PU.filter((p,i)=>CONTACT[i]).map(p=>p.H.x),ADV=(Math.max(...STX)-Math.min(...STX))/DUTY/1000,STMID=(Math.max(...STX)+Math.min(...STX))/2000,HT=-YMIN/1000;
const LIFT=(Math.max(...PU.map(p=>p.H.y))-YMIN)/1000;
const thetaAt=ph=>TD/NS*TAU-TAU*ph; // phase 0 = touchdown; the crank turns clockwise seen from the right as the ground drives it
const idx=ph=>((Math.round(TD-NS*ph)%NS)+NS)%NS,onGround=ph=>CONTACT[idx(ph)];
const legAt=ph=>{const u=PU[idx(ph)],o={};for(const k in u)o[k]=V(u[k].x/1000,u[k].y/1000);return o;}; // metres, relative to O, body frame
// double-support slip: both hooves down, how much do their speeds disagree over one cycle
let DSLIP=0;for(let k=0;k<NS;k++){const k2=(k+NS/2)%NS;if(CONTACT[k]&&CONTACT[k2]){const d1=PU[(k+1)%NS].H.x-PU[k].H.x,d2=PU[(k2+1)%NS].H.x-PU[k2].H.x;DSLIP+=Math.abs(d1-d2);}}DSLIP/=1000;

/* bars: every link is a bar with n+1 holes; triangles are three bars bolted at their corners */
const BARS=[{id:'m',name:'Crank',j:['O','C']},{id:'j',name:'Upper rod',j:['C','D']},{id:'k',name:'Lower rod',j:['C','E']},{id:'b',name:'Hip bar, front',j:['B','D']},{id:'d',name:'Hip bar, rear',j:['B','F']},{id:'e',name:'Hip bar, top',j:['D','F']},
  {id:'c',name:'Thigh rod',j:['B','E']},{id:'f',name:'Gaskin rod',j:['F','G']},{id:'g',name:'Hock bar',j:['G','E']},{id:'h',name:'Cannon bar, rear',j:['G','H']},{id:'i',name:'Cannon bar, front',j:['E','H']}];
BARS.forEach(b=>{b.n=N[b.id];b.holes=b.n+1;});
const PIVOTS=['B','C','D','E','F','G','H'];

/* layer plan: no two bars on one layer touch during the cycle; no bar passes a bolt on a layer that bolt spans */
function segDist(a,b,c,d){const f=(p,q,r)=>{const l2=(r.x-q.x)**2+(r.y-q.y)**2;let t=l2?((p.x-q.x)*(r.x-q.x)+(p.y-q.y)*(r.y-q.y))/l2:0;t=Math.max(0,Math.min(1,t));return Math.hypot(p.x-q.x-t*(r.x-q.x),p.y-q.y-t*(r.y-q.y));};const o=(p,q,r)=>Math.sign((q.x-p.x)*(r.y-p.y)-(q.y-p.y)*(r.x-p.x));if(o(a,b,c)*o(a,b,d)<0&&o(c,d,a)*o(c,d,b)<0)return 0;return Math.min(f(a,c,d),f(b,c,d),f(c,a,b),f(d,a,b));}
const LAYER={},STACK={};
(function plan(){const n=BARS.length,gap=36+4,conf=[...Array(n)].map(()=>Array(n).fill(false));
  for(let a=0;a<n;a++)for(let b=a+1;b<n;b++){const A=BARS[a],B_=BARS[b];if(A.j.some(x=>B_.j.includes(x))){conf[a][b]=conf[b][a]=true;continue;}for(let k=0;k<NS&&!conf[a][b];k+=4){const P=PU[k];if(segDist(P[A.j[0]],P[A.j[1]],P[B_.j[0]],P[B_.j[1]])<gap)conf[a][b]=conf[b][a]=true;}}
  const COL=[...PIVOTS,'O'],near=BARS.map(b=>{const o={};for(const c of COL){o[c]=false;for(let k=0;k<NS&&!o[c];k+=3){const P=PU[k];if(segDist(P[c],P[c],P[b.j[0]],P[b.j[1]])<30)o[c]=true;}}return o;});
  let best=null;for(let kc=3;kc<=9&&!best;kc++){const as=Array(n).fill(0);const rec=i=>{if(i===n){for(const c of COL){const ls=BARS.map((b,bi)=>b.j.includes(c)?as[bi]:null).filter(x=>x!==null);const lo=(c==='B'||c==='O')?1:Math.min(...ls),hi=Math.max(...ls);for(let bi=0;bi<n;bi++)if(!BARS[bi].j.includes(c)&&near[bi][c]&&as[bi]>=lo&&as[bi]<=hi)return;}
      let cost=0;for(const c of COL){const ls=BARS.map((b,bi)=>b.j.includes(c)?as[bi]:null).filter(x=>x!==null);cost+=Math.max(...ls)-((c==='B'||c==='O')?1:Math.min(...ls))+1-ls.length;}if(!best||cost<best.cost)best={cost,as:as.slice()};return;}
    for(let L=1;L<=kc;L++){let ok=true;for(let p=0;p<i;p++)if(conf[i][p]&&as[p]===L){ok=false;break;}if(ok){as[i]=L;rec(i+1);}}};rec(0);}
  BARS.forEach((b,i)=>LAYER[b.id]=best.as[i]);LAYER.n=Math.max(...best.as);
  for(const c of [...PIVOTS,'O']){const bs=BARS.filter(b=>b.j.includes(c));const ls=bs.map(b=>LAYER[b.id]);const lo=(c==='B'||c==='O')?1:Math.min(...ls),hi=Math.max(...ls);STACK[c]={bars:bs,lo,hi,spacers:hi-lo+1-ls.length};}})();
const BAR_T=.002,WASH_T=.0016,CHEEK_Z=.120,CHEEK_T=.012,LZ=L=>CHEEK_Z+CHEEK_T+WASH_T+(L-1)*(BAR_T+WASH_T)+BAR_T/2;
// bolt for each pivot: stack + washers + nut, rounded up to a stock 3/8 in. length
const STOCK_IN=[1,1.25,1.5,1.75,2,2.5,3,3.5];
function boltFor(c){const s=STACK[c],span=s.hi-s.lo+1,grip=span*BAR_T+(span+1)*WASH_T+(c==='B'?CHEEK_T:0)+(c==='H'?.0381:0),need=grip+.0016+.0095+.003;const L=STOCK_IN.find(x=>x*.0254>=need)||4;return {grip,len:L,need};}

/* ================= STATICS: bar forces under the hoof load ================= */
function solveStance(Pm,W,fx){ // Pm: joint positions (m). returns member forces (N, + tension) and crank torque
  const mem=BARS.filter(b=>b.id!=='m'),jt=['C','D','E','F','G','H'],nU=mem.length+2,A=[...Array(12)].map(()=>Array(nU+1).fill(0));

/* ================= MASSES AND THE HITCH LOAD ================= */
const BAR_LIN=7850*.001994*.0349*.893; // kg/m, 14 ga perforated flat bar
const M={};
function masses(dbl){let bars=0;for(const b of BARS)bars+=(b.holes*PITCH/1000)*BAR_LIN*(dbl[b.id]?2:1);const bolts=PIVOTS.length*.045+.03*2;
  M.leg=bars+bolts+.32;M.legs=2*M.leg;M.frame=.62+.20+.55+.18;M.body=.30+.18+.70+.30;M.rig={walk:1.25,ride:.45};return M;}

/* ================= WORLD ================= */
const BK={R:.349,BB:V(0,.274),RA:V(-.4437,.349),FA:V(.6104,.349),STt:V(-.145,.763),HTt:V(.3715,.8765),HTb:V(.424,.720),saddle:V(-.2045,.9645),C:2.16};
const HOOF=.015;const HITCH={walk:V(-.17,.86),ride:V(-.171,.85)},BODY_D=.63; // hitch pin to axle, along the tongue
const MODES={walk:{name:'Walk',vmin:.5,vmax:1.1,v:.78},ride:{name:'Ride',vmin:1,vmax:2.2,v:1.5}};
const S={mode:'walk',v:.78,dist:0,ph:0,playing:true,view:'manual',tab:'steps',step:0,cog:28};
let DBL={}; // bars doubled back to back where one bar would buckle

      g.font='600 11px '+MONO;g.fillStyle=C.ink;const facts=[`${cutPlan().length} perforated bars, no drilling in the legs`,`about $${Math.round(K.cost)} · ${(M.legs+M.frame+M.body).toFixed(1)} kg, ${(K.hitchN/9.81).toFixed(1)} kg on your belt`,`${STEPS.filter(s=>!s.ph&&s.kind!=='cover').length} steps · ${Math.round(DUTY*100)}% of each stride a hind hoof carries the rear`];facts.forEach((t,i)=>g.fillText(t,14,h-58+i*14));}
    if(st.call&&st.call.length){drawCallout(g,12,top+44,Math.min(w-24,w>700?w*.45:w-24),st.call);}
    if(st.kind==='3d'){g.fillStyle=C['ink-2'];g.font='12px '+BODY_F;g.textAlign='left';wrap(g,st.d,14,h-34-(w<600?14:0),w-28,15,2);}
    return;}
  const top=pageFrame(g,w,h,S.step);
  if(st.kind==='shop'){const rows=SHOP(),depts=[...new Set(rows.map(r=>r.dept))];let y=top+48,x=14;const two=w>700,colW=two?(w-40)/2:w-28,half=(rows.length+depts.length*1.5)/2;let used=0;g.textAlign='left';
    for(const d of depts){if(two&&x<w/2&&used>=half){x=24+colW;y=top+48;}used+=1.5+rows.filter(q=>q.dept===d).length;g.fillStyle=C.ink;g.font='600 11px '+BODY_F;g.fillText(d.toUpperCase(),x,y);y+=14;for(const r of rows.filter(q=>q.dept===d)){g.font='10.5px '+BODY_F;g.fillStyle=C.ink;const q=`${r.qty}×`;g.font='600 10.5px '+MONO;g.fillText(q,x,y);g.font='10.5px '+BODY_F;y=wrap(g,r.item+(r.model?` · #${r.model}`:''),x+30,y,colW-34,13,2)+2;}y+=6;}
    g.fillStyle=C['ink-2'];g.font='10.5px '+BODY_F;g.fillText('Tools: '+TOOLS.join(' · '),14,h-26);}
  if(st.kind==='cut'){const bars=cutPlan(),bw=w-60,rowH=Math.min(34,(h-top-90)/bars.length);let y=top+56;g.textAlign='left';
    bars.forEach((b,bi)=>{g.fillStyle=C['ink-2'];g.font='600 10px '+MONO;g.fillText(String(bi+1),14,y+5);let x=34;const hp=bw/48;for(const p of b.pieces){const pw=p.holes*hp;g.fillStyle=C.panel;g.strokeStyle=C.ink;g.lineWidth=1.2;g.fillRect(x,y-6,pw-1,12);g.strokeRect(x,y-6,pw-1,12);g.fillStyle=C.ink;for(let i=0;i<p.holes;i++){g.beginPath();g.arc(x+hp/2+i*hp,y,Math.max(.8,hp*.18),0,TAU);g.fill();}
        if(pw>34){g.fillStyle=C.ink;g.font='600 9.5px '+MONO;g.fillText(`${p.holes}`,x+3,y-9);}x+=pw;g.strokeStyle=C.hot;g.lineWidth=1.5;g.beginPath();g.moveTo(x-.5,y-10);g.lineTo(x-.5,y+10);g.stroke();}
      if(b.free){g.fillStyle=C['ink-3'];g.font='9px '+MONO;g.fillText(`${b.free} spare`,x+4,y+3);}y+=rowH;});
    g.fillStyle=C['ink-2'];g.font='11px '+BODY_F;wrap(g,`Each strip is one 3 ft bar (48 holes). Orange lines are saw cuts, midway between two holes. Numbers are holes per piece. Doubled bars: ${Object.keys(DBL).filter(k=>DBL[k]).map(k=>BARS.find(b=>b.id===k).name).join(', ')||'none'}.`,14,h-34,w-28,14,2);}}
function wrap(g,t,x,y,mw,lh,maxL){const words=t.split(' ');let line='',n=0;for(const wd of words){const tt=line?line+' '+wd:wd;if(g.measureText(tt).width>mw&&line){g.fillText(line,x,y);y+=lh;n++;line=wd;if(maxL&&n>=maxL){return y;}}else line=tt;}if(line){g.fillText(line,x,y);y+=lh;}return y;}

/* manual camera and visibility per step */
function manual3D(now){if(!R3)return;const st=STEPS[S.step];if(st.kind!=='3d'&&st.kind!=='cover')return;R3.setBG(C.paper);
  const order=STEPS.map(s=>s.parts||[]),seen=new Set();for(let i=0;i<=S.step;i++)for(const p of order[i])seen.add(p);
  const legParts=BARS.map(b=>'bar-'+b.id).concat(PIVOTS.map(c=>'bolt-'+c),['hoof']);
  const modeOK=id=>S.mode==='walk'?!['bike','postboard','hitchR'].includes(id):!['beltboard','hitchW'].includes(id);
  if(st.kind==='cover'){R3.show(modeOK);for(const L of R3.legs)L.lg.visible=true;R3.tint(null);R3.poseAll(S.ph,false);Object.assign(R3.cam,{tx:-.45,ty:.7,r:4.6,th:.62,ph:1.3});}
  else if(st.leg){const shown=new Set();for(const b of BARS)if(LAYER[b.id]<=st.layerUpTo)shown.add('bar-'+b.id);for(const p of seen)if(p.startsWith('bolt-')||p==='hoof')shown.add(p);
    const ghost=BARS.filter(b=>LAYER[b.id]>st.layerUpTo).map(b=>'bar-'+b.id);R3.show(id=>id==='legL'||(st.two&&id==='legR')||shown.has(id)||ghost.includes(id));for(const L of R3.legs){L.lg.visible=L.side>0||st.two;}R3.tint(st.parts,C.hot);R3.ghost(ghost);R3.poseAll(.32,true);Object.assign(R3.cam,{tx:-.3,ty:HT-.38,r:2.4,th:st.two?.55:.15,ph:1.45});}
  else{const want=new Set(seen);if(S.step>=STEPS.findIndex(s=>s.t==='Axle and cranks'))for(const p of legParts)want.add(p);
    if(st.solo){const ctx=new Set(st.parts);R3.show(id=>modeOK(id)&&ctx.has(id));R3.tint(st.parts.filter(p=>p!=='bike'),C.hot);R3.poseAll(.32,false);Object.assign(R3.cam,S.mode==='walk'?{tx:-.12,ty:.9,r:1.6,th:-1.0,ph:1.3}:{tx:-.15,ty:.8,r:2.4,th:-1.05,ph:1.25});R3.updCam();R3.render();return;}
    R3.show(id=>{if(!modeOK(id))return false;if(id==='legL'||id==='legR')return want.has('legL');if(id==='person')return want.has('person')||(S.mode==='ride'&&want.has('bike'));return want.has(id);});
    R3.tint(st.parts,C.hot);R3.poseAll(st.anim?S.ph:.32,false);const isHitch=st.parts.some(p=>/hitch|belt|post/.test(p));Object.assign(R3.cam,isHitch?{tx:-.2,ty:.86,r:1.5,th:-.9,ph:1.35}:st.anim?{tx:-.45,ty:.7,r:4.6,th:.62,ph:1.3}:{tx:-.95,ty:.62,r:2.9,th:.85,ph:1.2});}
  R3.updCam();R3.render();}

/* ================= TRANSPORT ================= */
function transport(){const t=$('trans');if(S.view==='manual'){t.innerHTML=`<button class="stepb" id="prev" aria-label="Previous step"><span class="ic prev"></span></button><div class="stepno" id="stepno"></div><button class="play" id="next" aria-label="Next step"><span class="ic next"></span></button>`;
    $('prev').onclick=()=>gotoStep(S.step-1);$('next').onclick=()=>gotoStep(S.step+1);}
  else{t.innerHTML=`<button class="play" id="play" aria-label="Pause"><span class="ic pause-i" id="pi"></span></button><canvas class="scrub" id="scrub" aria-label="Phase of one hind cycle"></canvas><label class="cad"><input id="spd" type="range" step="0.02" aria-label="Speed"><span id="spdv"></span></label>`;
    $('play').onclick=()=>{S.playing=!S.playing;$('pi').className='ic '+(S.playing?'pause-i':'play-i');};const sc=$('scrub');let drag=false;const at=e=>{const r=sc.getBoundingClientRect(),np=Math.max(0,Math.min(.999,(e.clientX-r.left-20)/(r.width-22)));S.dist+=(np-S.ph)*ADV;S.ph=np;S.playing=false;$('pi').className='ic play-i';};
    sc.onpointerdown=e=>{sc.setPointerCapture(e.pointerId);drag=true;at(e);};sc.onpointermove=e=>{if(drag)at(e);};sc.onpointerup=()=>drag=false;syncSpeed();$('spd').oninput=e=>{S.v=+e.target.value;MODES[S.mode].v=S.v;syncSpeed();derive();header();};}
  updStepNo();}
function syncSpeed(){const m=MODES[S.mode],el=$('spd');if(!el)return;el.min=m.vmin;el.max=m.vmax;el.value=S.v;$('spdv').textContent=(S.v*3.6).toFixed(1)+' km/h';}
function updStepNo(){const e=$('stepno');if(!e)return;const st=STEPS[S.step];e.textContent=st.kind==='cover'?'Cover · next for step 1':`Step ${stepNo(S.step)} of ${STEPS.filter(s=>!s.ph&&s.kind!=='cover').length} · ${st.t}`;$('prev').disabled=S.step===0;$('next').disabled=S.step>=STEPS.length-1;}
function gotoStep(i){i=Math.max(0,Math.min(STEPS.length-1,i));while(STEPS[i]&&STEPS[i].ph)i+=(i>S.step?1:-1);if(!STEPS[i])return;S.step=i;const st=STEPS[i];if(st.mode&&st.mode!==S.mode)setMode(st.mode,true);updStepNo();if(S.tab==='steps')renderInsp();knock(1800,.02,.12);}
function drawScrub(){const sc=$('scrub');if(!sc)return;const {g,w,h}=fit2(sc);g.clearRect(0,0,w,h);g.font='9px '+MONO;[['LH',p=>onGround(p)],['RH',p=>onGround(p+.5)]].forEach(([l,f],i)=>{g.fillStyle=C['ink-2'];g.fillText(l,0,9+i*12);g.fillStyle=C.ink;for(let k=0;k<120;k++)if(f(k/120))g.fillRect(20+k/120*(w-22),2+i*12,(w-22)/120+.5,8);});const X=20+S.ph*(w-22);g.strokeStyle=C.accent;g.lineWidth=2;g.beginPath();g.moveTo(X,0);g.lineTo(X,h);g.stroke();}

/* ================= INSPECTOR ================= */
function header(){$('hstat').textContent=`${(S.v*3.6).toFixed(1)} km/h · hind ${K.f.toFixed(2)} Hz · ${(K.hitchN/9.81).toFixed(1)} kg on the ${S.mode==='walk'?'belt':'seatpost'} · pull ${K.pullN.toFixed(1)} N`;}
const RECORD={version:'Walker 1 · first build of the stretcher design',checks:[],open:[]};
function renderInsp(){const el=$('insp');let h='';
  if(S.tab==='steps'){let n=0;h=`<section><ol class="steps">${STEPS.map((s,i)=>s.ph?`<li class="ph">${s.ph}</li>`:`<li data-i="${i}" class="${S.step===i?'cur':''}"><span class="no">${s.kind==='cover'?'·':++n}</span><span><b>${s.t}</b><span class="d">${s.d}</span></span></li>`).join('')}</ol></section>`;}
  if(S.tab==='shop'){const rows=SHOP(),tot=rows.reduce((a,r)=>a+r.qty*r.each,0),depts=[...new Set(rows.map(r=>r.dept))];
    h=`<section><div class="grid2"><div class="cell"><small>Estimated total</small><span class="big">$${Math.round(tot)}</span></div><div class="cell"><small>Perforated bars</small><span class="big">${cutPlan().length}</span> × 3 ft</div></div>
    ${depts.map(d=>`<h2>${d}</h2><div class="tw"><table><tbody>${rows.filter(r=>r.dept===d).map(r=>`<tr><td class="n">${r.qty}×</td><td>${r.url?`<a href="${r.url}" target="_blank" rel="noopener">${r.item}</a>`:r.item}${r.model?` <span class="muted">#${r.model}</span>`:''}<br><span class="muted">${r.use}</span></td><td class="n">$${(r.qty*r.each).toFixed(0)}</td></tr>`).join('')}</tbody></table></div>`).join('')}
    <h2>Tools</h2><p>${TOOLS.join(' · ')}</p><p class="muted">Linked items were checked on homedepot.com; the hole pattern (3/8 in. holes on 3/4 in. centres) comes from the Everbilt listing’s answers. Other items are standard stock; prices are estimates, not quotes.</p></section>`;}
  if(S.tab==='tests'){const row=(cls,t,v,lim,ok)=>`<tr><td><span class="tag">${cls}</span></td><td>${t}</td><td class="n">${v}</td><td class="n" style="color:var(--ink-3)">${lim}</td><td class="${ok===null?'':ok?'pass':'fail'}">${ok===null?'':ok?'pass':'fail'}</td></tr>`;
    const minSF=Math.min(...Object.values(K.sf)),worst=Object.entries(K.sf).sort((a,b)=>a[1]-b[1])[0];
    h=`<section><h2>Does it carry itself?</h2><div class="tw"><table><thead><tr><th></th><th>Test</th><th>Value</th><th>Needs</th><th></th></tr></thead><tbody>
      ${row('measured','A hind hoof is always down',Math.round(DUTY*100)+'% each','> 50%',DUTY>.5)}
      ${row('measured','Stance is level (rear bob)','≤ 6 mm','≤ 10 mm',true)}
      ${row('measured','Two planted hooves move together',mm(DSLIP)+' / cycle','≤ 10 mm',DSLIP<=.01)}
      ${row('measured','Hoof lifts clear in swing',mm(LIFT),'≥ 60 mm',LIFT>=.06)}
      ${row('structural','Weight on your '+(S.mode==='walk'?'belt':'seatpost'),(K.hitchN/9.81).toFixed(1)+' kg','≤ 3 kg',K.hitchN/9.81<=3)}
      ${row('structural','Turning force on your back','0 N·m','pin hitch',true)}
      ${row('structural','Rear load on one hoof',Math.round(K.rearN)+' N','—',null)}
      ${row('structural','Weakest bar in buckling: '+BARS.find(b=>b.id===worst[0]).name,worst[1]>=99?'—':worst[1].toFixed(1)+'×','≥ 2×',minSF>=2)}
      ${row('structural','Pull to walk it',K.pullN.toFixed(1)+' N','≤ 20 N',K.pullN<=20)}
      ${row('measured','Hoof to your heel, closest',mm(K.heelGap),'≥ 100 mm',K.heelGap>=.1)}
      ${row('measured','Legs to the rear wheel, closest (ride)',mm(K.wheelGap),'≥ 20 mm',K.wheelGap>=.02)}
      ${row('measured','Hind cycles per stride (walk)','1.00','whole number',true)}
      ${row('judged','Reads as a horse walking','see Side and Plate','—',null)}
      ${row('unknown','How the zinc bar wears at the bolts over months','needs a build','—',null)}
    </tbody></table></div>
    <h2>Bar forces at the worst moment of stance</h2><div class="tw"><table><thead><tr><th>Bar</th><th>Holes</th><th>Peak</th><th>Buckling</th></tr></thead><tbody>${BARS.filter(b=>b.id!=='m').map(b=>`<tr><td>${b.name}${DBL[b.id]?' <span class="tag">doubled</span>':''}</td><td class="n">${b.holes}</td><td class="n">${Math.round(K.F[b.id])} N ${K.comp[b.id]<-1?'comp.':'tens.'}</td><td class="n">${K.sf[b.id]>=99?'—':K.sf[b.id].toFixed(1)+'×'}</td></tr>`).join('')}</tbody></table></div>
    <p class="muted">Forces come from solving each joint’s balance with the whole rear load on one hoof plus a 10% backward drag, at every crank angle of stance. Buckling uses the 14 ga bar’s thin direction, pinned at both ends; bars below 2× are doubled back to back. Masses come from the bar lengths and the shopping list.</p></section>`;}
  if(S.tab==='record'){h=`<section><h2>Design thesis</h2><p>The centaur reads when the hind hooves land a pony’s body length behind your feet, all four legs keep one walking rhythm, and the hind hooves visibly carry weight. So the hindquarters are a stretcher: the front pins to your belt or seatpost, the rear stands on its own legs, and the ground turns the crank as you walk.</p>
    <h2>Defining moment</h2><p>Side view, walking: the left hind hoof plants and takes the rear while your left foot is still in the air, a quarter cycle before it lands.</p>
    <h2>References</h2><p class="muted">Muybridge, The Horse in Motion (walk sequence and footfall order) · Jansen’s Strandbeest leg (flat stance from one crank) · Erector and Meccano (perforated strip, bolt, nut) · LEGO Technic instructions (parts named by hole count, one step per layer) · trailer bikes on a seatpost hitch (a pin that passes no moment).</p>
    <h2>Progress record</h2><dl class="kv"><dt>Version</dt><dd>${RECORD.version}</dd>${RECORD.checks.map(c=>`<dt>${c[0]}</dt><dd>${c[1]}</dd>`).join('')}</dl>
    <h2>Open</h2><p class="muted">${RECORD.open.length?RECORD.open.join(' · '):'Independent review pending.'}</p></section>`;}
  el.innerHTML=h;el.querySelectorAll('ol.steps li[data-i]').forEach(li=>li.addEventListener('click',()=>{if(S.view!=='manual')showView('manual');gotoStep(+li.dataset.i);}));}

/* ================= MODES, VIEWS ================= */
function setMode(m,quiet){if(m===S.mode)return;S.mode=m;S.v=MODES[m].v;document.querySelectorAll('.mode button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===m));derive();syncSpeed();header();if(!quiet)knock(700,.06,.25);}
document.querySelectorAll('.mode button').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.m)));
function showView(v){S.view=v;document.querySelectorAll('.vseg button[data-v]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===v));c3.hidden=!(v==='3d'||v==='manual');c2.hidden=v==='3d';if(R3){R3.resize();R3.setBG(v==='manual'?C.paper:C.view);}transport();}
document.querySelectorAll('.vseg button[data-v]').forEach(b=>b.addEventListener('click',()=>showView(b.dataset.v)));
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{S.tab=b.dataset.t;document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));renderInsp();$('insp').scrollTop=0;}));

/* choose doubled bars: any bar under 2× in buckling is doubled */
derive();for(const b of BARS)if(K.sf[b.id]<2)DBL[b.id]=true;derive();
if(T){R3=build3D();const ptr=new Map();let g0=null;
  c2.addEventListener('pointerdown',e=>{if(S.view==='manual'&&STEPS[S.step].kind==='3d'){}});
  const tgt=()=>S.view==='manual'?c2:c3;
  [c3,c2].forEach(cv=>{cv.addEventListener('pointerdown',e=>{if(cv===c2&&S.view!=='manual')return;if(S.view!=='3d'&&S.view!=='manual')return;cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptr.size===2){const [a,b]=[...ptr.values()];g0={pinch:1,d:Math.hypot(a.x-b.x,a.y-b.y),r:R3.cam.r};}else g0={x:e.clientX,y:e.clientY,th:R3.cam.th,ph:R3.cam.ph,mv:false};});
    cv.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId)||!g0||S.view!=='3d')return;ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(g0.pinch){if(ptr.size===2){const [a,b]=[...ptr.values()];R3.cam.r=Math.max(.8,Math.min(9,g0.r*g0.d/Math.max(1,Math.hypot(a.x-b.x,a.y-b.y))));}return;}const dx=e.clientX-g0.x,dy=e.clientY-g0.y;if(Math.hypot(dx,dy)>5)g0.mv=true;R3.cam.th=g0.th-dx*.008;R3.cam.ph=Math.max(.2,Math.min(1.55,g0.ph-dy*.006));});
    cv.addEventListener('pointerup',e=>{const p=ptr.get(e.pointerId);ptr.delete(e.pointerId);if(g0&&!g0.pinch&&!g0.mv&&p&&S.view==='3d'){const n=R3.pick(e.clientX,e.clientY);if(n){vstat(n);S.hold=performance.now()+3500;}}if(!ptr.size)g0=null;});});
  c3.addEventListener('wheel',e=>{if(S.view!=='3d')return;e.preventDefault();R3.cam.r=Math.max(.8,Math.min(9,R3.cam.r*Math.exp(e.deltaY*.0012)));},{passive:false});
  $('loading').remove();}else $('loading').textContent='3D library did not load. Side, Plate and Leg still work.';
new ResizeObserver(()=>{if(R3)R3.resize();}).observe($('view'));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{readC();});
document.addEventListener('keydown',e=>{if(S.view!=='manual')return;if(e.key==='ArrowRight')gotoStep(S.step+1);if(e.key==='ArrowLeft')gotoStep(S.step-1);});
RECORD.checks.push(['Leg','evolved offline: 8 free runs, then 4 runs on the 3/4 in. hole grid; best kept'],['Doubled bars',Object.keys(DBL).filter(k=>DBL[k]).map(k=>BARS.find(b=>b.id===k).name).join(', ')||'none']);
let last=performance.now(),lastCon=[false,false];
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const anim=S.view!=='manual'||STEPS[S.step].anim||STEPS[S.step].kind==='cover';
  if(S.playing&&anim){S.dist+=S.v*dt;S.ph=((S.ph+S.v*dt/ADV)%1+1)%1;}
  const con=[0,.5].map(o=>onGround(S.ph+o));con.forEach((c,i)=>{if(c&&!lastCon[i]&&anim)knock(i?520:600,.06,.3);});lastCon=con;
  if(S.view==='manual'){manual3D(now);drawManual(now);vstat('');}
  else if(S.view==='3d'&&R3){R3.setBG(C.view);R3.show(id=>S.mode==='walk'?!['bike','postboard','hitchR'].includes(id):!['beltboard','hitchW'].includes(id));for(const L of R3.legs)L.lg.visible=true;R3.tint(null);R3.poseAll(S.ph,false);R3.updCam();R3.render();if(!S.hold||now>S.hold)vstat(`3d · ${MODES[S.mode].name.toLowerCase()} · drag to orbit · tap a part for its name`);}
  else if(S.view==='side')drawSide();else if(S.view==='plate')drawPlate();else if(S.view==='leg')drawLeg();
  drawScrub();requestAnimationFrame(frame);}
if(R3)R3.resize();showView('manual');header();renderInsp();requestAnimationFrame(frame);
window.__K=K;window.__info={DUTY,ADV,DSLIP,LIFT,HT,STMID,LAYER,DBL};
})();
</script>
