<style>

function spread(items,x0,y0,W,H){const dpr=Math.min(2,devicePixelRatio||1);const longest=Math.max(...items.map(p=>p.k==='bar'?BAR[p.id].n*PITCH/1000+.04:.08));let ppm=Math.min(600,(W-20)/longest);
  for(let tries=0;tries<6;tries++){let x=x0,y=y0,rowH=0,ok=true;const pos=[];for(const p of items){const th=thumb(p,ppm,dpr);if(!th)continue;og.font=`11px ${css('--f-body')}`;const lw=Math.max(og.measureText(p.label||'').width,p.dim?og.measureText(p.dim).width+34:0);const w=Math.max(th.w,lw+4,60),h=th.h+30;if(x+w>x0+W&&x>x0){x=x0;y+=rowH+10;rowH=0;}pos.push({p,th,x,y});x+=w+18;rowH=Math.max(rowH,h);}
    if(y+rowH>y0+H&&tries<5){ppm*=.8;continue;}
    og.fillStyle=css('--box');og.strokeStyle=css('--box-edge');og.lineWidth=1.5;const bh=Math.min(H,y+rowH-y0+16);og.beginPath();og.roundRect?og.roundRect(x0-10,y0-10,W+20,bh+4,12):og.rect(x0-10,y0-10,W+20,bh+4);og.fill();og.stroke();
    for(const {p,th,x,y} of pos){og.drawImage(th.cv,x,y,th.w,th.h);og.fillStyle=css('--ink');og.font=`700 13px ${css('--f-body')}`;const q=`${p.q||1}×`;og.fillText(q,x,y+th.h+14);const qw=og.measureText(q).width;if(p.dim){og.font=`600 11px ${css('--f-mono')}`;og.fillText(p.dim,x+qw+6,y+th.h+14);}og.font=`11px ${css('--f-body')}`;og.fillStyle=css('--ink-2');og.fillText(p.label||'',x,y+th.h+27);}break;}}
const stepNo=i=>{const s=S[i];if(['cover','bagopen','done'].includes(s.kind))return 0;return S.slice(0,i+1).filter(q=>!['cover','bagopen','done'].includes(q.kind)).length;};

/* ---------------- camera ---------------- */
function camFor(st){if(st.cam==='hoofSub')return {tx:0,ty:.04,tz:0,r:.6,th:.7,ph:1.15,hoofSub:true};if(st.cam==='hoof'){const P=legAt(PH_A);return {tx:P.H.x,ty:HT+HOOF+P.H.y+.02,tz:HOOF_Z(),r:.75,th:.55,ph:1.3};}return st.cam||CAM.full;}
function updCam(){const c=ST.cam,asp=camera.aspect,k=1/Math.pow(Math.min(1,asp),.75);const sp=v3(Math.sin(c.ph)*Math.sin(c.th),Math.cos(c.ph),Math.sin(c.ph)*Math.cos(c.th)).multiplyScalar(c.r*k);camera.position.set(c.tx+sp.x,c.ty+sp.y,c.tz+sp.z);camera.lookAt(c.tx,c.ty,c.tz);}
function resize(){const r=page.getBoundingClientRect();OW=r.width;OH=r.height;R.setSize(OW,OH,false);camera.aspect=OW/Math.max(1,OH);camera.updateProjectionMatrix();drawBox(S[ST.i]);}
addEventListener('resize',resize);
// orbit
{const pts=new Map();let g0=null;page.addEventListener('pointerdown',e=>{page.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===1)g0={th:ST.cam.th,ph:ST.cam.ph,x:e.clientX,y:e.clientY};if(pts.size===2){const [a,b]=[...pts.values()];g0={pinch:Math.hypot(a.x-b.x,a.y-b.y),r:ST.cam.r};}});
  page.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(!g0)return;ST.camT=null;if(pts.size===2&&g0.pinch){const [a,b]=[...pts.values()];ST.cam.r=Math.max(.2,Math.min(8,g0.r*g0.pinch/Math.hypot(a.x-b.x,a.y-b.y)));}else if(pts.size===1&&!g0.pinch){ST.cam.th=g0.th-(e.clientX-g0.x)*.008;ST.cam.ph=Math.max(.15,Math.min(1.62,g0.ph-(e.clientY-g0.y)*.006));}});
  const up=e=>{pts.delete(e.pointerId);if(!pts.size)g0=null;};page.addEventListener('pointerup',up);page.addEventListener('pointercancel',up);
  page.addEventListener('wheel',e=>{e.preventDefault();ST.camT=null;ST.cam.r=Math.max(.2,Math.min(8,ST.cam.r*Math.exp(e.deltaY*.001)));},{passive:false});}

/* ---------------- UI ---------------- */
const bagsEl=$('bags');BAGS.forEach(b=>{const el=document.createElement('button');el.className='bag';el.innerHTML=`<i>${b.n}</i>${b.name}<b><span></span></b>`;el.onclick=()=>go(S.findIndex(s=>s.bag===b.n));bagsEl.appendChild(el);b.el=el;});
function refreshBags(){const cur=S[ST.i].bag;for(const b of BAGS){const steps=S.filter(s=>s.bag===b.n),done=steps.filter(s=>ST.checks[s.i]).length;b.el.setAttribute('aria-current',b.n===cur);b.el.classList.toggle('done',done===steps.length);b.el.querySelector('b span').style.width=(done/steps.length*100)+'%';}
  const el=BAGS[cur].el;el.scrollIntoView({block:'nearest',inline:'nearest'});}
const playIc=$('playic');function setPlay(p){ST.play=p;playIc.innerHTML=p?'<rect x="3" y="2" width="3" height="10" fill="currentColor"/><rect x="8" y="2" width="3" height="10" fill="currentColor"/>':'<path d="M3 2l9 5-9 5z" fill="currentColor"/>';$('play').setAttribute('aria-label',p?'Pause':'Play');}
function go(i){ST.i=Math.max(0,Math.min(S.length-1,i));store.set('cwb-step',ST.i);const st=S[ST.i];ST.t=0;setPlay(true);ST.camT={from:Object.assign({},ST.cam),to:Object.assign({},camFor(st)),t0:performance.now()};
  $('bn').textContent=`Bag ${st.bag} · ${BAGS[st.bag].name}`;$('st').textContent=st.t;const n=stepNo(st.i),tot=S.filter(s=>stepNo(s.i)).length;$('of').textContent=n?`${n} / ${tot}`:'';
  $('say').textContent=st.say;$('cktxt').innerHTML=st.check;$('ck').checked=!!ST.checks[st.i];$('chk').classList.toggle('on',!!ST.checks[st.i]);
  $('next').textContent=ST.i===S.length-1?'Start over':'Next';setScene(st);drawBox(st);refreshBags();}
$('prev').onclick=()=>go(ST.i-1);$('next').onclick=()=>go(ST.i===S.length-1?0:ST.i+1);$('play').onclick=()=>setPlay(!ST.play);
$('ck').onchange=e=>{ST.checks[ST.i]=e.target.checked;store.set('cwb-checks',ST.checks);$('chk').classList.toggle('on',e.target.checked);refreshBags();if(e.target.checked&&ST.i<S.length-1)setTimeout(()=>go(ST.i+1),450);};
$('ex').oninput=e=>{setPlay(false);ST.t=.12+.6*(+e.target.value/1000);};
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(ST.i+1);if(e.key==='ArrowLeft')go(ST.i-1);if(e.key===' '){e.preventDefault();setPlay(!ST.play);}});

/* ---------------- frame loop ---------------- */
function frame(now){const dt=Math.min(.05,(now-ST.last)/1000);ST.last=now;const st=S[ST.i];
  if(ST.play){ST.t+=dt/4.2;if(ST.t>1)ST.t=0;$('ex').value=Math.round(cl01((ST.t-.12)/.6)*1000);}
  // walking animations
  const walking=st.anim===true||st.anim==='walk'||st.anim==='frame'||st.anim==='leg';if(walking)ST.ph=(ST.ph+dt/1.25)%1;else ST.ph=PH_A;
  for(const u of ALLU)u.obj.position.copy(u.home);
  if(st.bag===2){LA.lg.position.z=.2;LB.lg.position.z=-.2;}
  poseAll(ST.ph);
  if(walking&&st.anim!=='leg'){grid.position.x=-((ST.ph*ADV)%.2);}else grid.position.x=0;
  // hoof sub-build: lift the hoof to a bench in front of the camera
  if(st.cam==='hoofSub'){LA.hoof.position.set(0,-(HT+HOOF)+.06,0);LA.hoof.rotation.z=0;}
  // approach offsets
  const ap=approach(st,ST.t);for(const a of ap){a.u.obj.position.add(a.u.off.clone().multiplyScalar(a.k));}
  if(st.kind==='mirror'){const k=ap.find(a=>a.u.id==='legB');}
  if(st.kind==='done'||st.kind==='cover'){ST.cam.th+=dt*(st.kind==='done'?.12:.05);}
  if(ST.camT){const k=ease(cl01((now-ST.camT.t0)/700));for(const key of ['tx','ty','tz','r','th','ph'])ST.cam[key]=ST.camT.from[key]+(ST.camT.to[key]-ST.camT.from[key])*k;if(k>=1)ST.camT=null;}
  updCam();R.setClearColor(srgb(css('--paper')),1);scene.background=srgb(css('--paper'));
  const bodyVis=bodyG.visible;ground.visible=grid.visible=st.kind!=='bagopen';if(st.kind==='bagopen'){bodyG.visible=false;}
  R.render(scene,camera);bodyG.visible=bodyVis;
  drawOverlay(st,ap);requestAnimationFrame(frame);}
window.__S=S;window.__ST=ST;window.__go=go;window.__U=U;
resize();go(ST.i);requestAnimationFrame(frame);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{thumbCache.clear();drawBox(S[ST.i]);});
})();
</script>
