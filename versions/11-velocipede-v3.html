<!doctype html>
<html lang="en">
<meta charset="utf-8">

<title>Centaur Velocipede</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#e8e5df;--panel:#f6f4f0;--view:#d9d4cb;--ink:#17150f;--ink-2:#5a554b;--ink-3:#8d877b;--rule:#d0cabe;--rule-2:#e4e0d8;--accent:#2f55c9;--accent-ink:#fff;--ok:#15803d;--warn:#c2410c;
  --f-display:"Bodoni Moda",Didot,Georgia,serif;--f-body:"IBM Plex Sans",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f0e0c;--panel:#171512;--view:#1d1a16;--ink:#ece7dd;--ink-2:#a9a293;--ink-3:#736c60;--rule:#2d2924;--rule-2:#221f1b;--accent:#8fa8ff;--accent-ink:#0d1014;--ok:#4ade80;--warn:#fb923c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f0e0c;--panel:#171512;--view:#1d1a16;--ink:#ece7dd;--ink-2:#a9a293;--ink-3:#736c60;--rule:#2d2924;--rule-2:#221f1b;--accent:#8fa8ff;--accent-ink:#0d1014;--ok:#4ade80;--warn:#fb923c;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 var(--f-body);overflow:hidden}
.ws{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(250px,50%) auto auto minmax(0,1fr);grid-template-areas:"head" "view" "trans" "tabs" "insp";padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
@media (min-width:900px){.ws{grid-template-columns:minmax(0,1fr) 410px;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"head head" "view side" "trans side"}.side{grid-area:side;display:grid;grid-template-rows:auto minmax(0,1fr);border-left:1px solid var(--rule);min-height:0}.tabs,.insp{grid-area:auto!important}}
@media (max-width:899px){.side{display:contents}}
header{grid-area:head;display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--rule);min-width:0}
h1{margin:0;font:500 15px var(--f-display);letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
@media (max-width:560px){h1{display:none}}
.hstat{flex:1;min-width:0;font:500 11px var(--f-mono);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{font:600 11px var(--f-body);border:1px solid var(--rule);background:var(--panel);color:var(--ink);border-radius:5px;min-height:30px;min-width:32px;padding:4px 8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.mini[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.mode{display:inline-flex;border:1px solid var(--ink);border-radius:7px;overflow:hidden;flex-shrink:0}
.mode button{font:600 12.5px var(--f-body);border:0;background:transparent;color:var(--ink);padding:6px 12px;min-height:34px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.mode i{display:inline-block;width:14px;height:10px;border:1.6px solid currentColor;border-radius:50%}
.mode i.pack{border-radius:3px;width:10px;height:13px}
.view{grid-area:view;position:relative;background:var(--view);overflow:hidden;min-height:0}
.view canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.view canvas[hidden]{display:none}
.vbar{position:absolute;top:8px;left:8px;right:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;pointer-events:none}.vbar>*{pointer-events:auto}
.vseg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--panel)}
.vseg button{font:600 11px var(--f-body);border:0;background:transparent;color:var(--ink);padding:5px 10px;min-height:30px;cursor:pointer}
.vseg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.vstat{position:absolute;left:8px;right:8px;bottom:6px;font:500 10.5px var(--f-mono);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.warn{position:absolute;left:8px;bottom:22px;font:600 11px var(--f-body);color:#fff;background:var(--warn);border-radius:4px;padding:3px 8px;pointer-events:none}
.warn[hidden]{display:none}
.trans{grid-area:trans;display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.scrub{flex:1;height:28px;touch-action:none;cursor:pointer;min-width:0}
.play{width:40px;height:36px;border-radius:7px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;display:grid;place-items:center}
.ic{display:inline-block;position:relative;width:12px;height:12px}
.ic.play-i{width:0;height:0;border-left:11px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent}
.ic.pause-i::before,.ic.pause-i::after{content:"";position:absolute;top:0;width:4px;height:12px;background:currentColor}.ic.pause-i::before{left:1px}.ic.pause-i::after{right:1px}
.cad{display:flex;align-items:center;gap:6px;font:500 11px var(--f-mono);color:var(--ink-2)}.cad input{width:96px;accent-color:var(--accent)}
.tabs{grid-area:tabs;display:flex;background:var(--panel);border-bottom:1px solid var(--rule)}
.tabs button{flex:1;font:600 12.5px var(--f-body);border:0;border-bottom:2px solid transparent;background:transparent;color:var(--ink-2);padding:9px 6px;min-height:40px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.insp section{display:flex;flex-direction:column;gap:10px}
h2{margin:0;font:600 16px var(--f-body)}
p{margin:0;max-width:66ch}.muted{color:var(--ink-2);font-size:12.5px}
table{border-collapse:collapse;width:100%;font-size:12.5px}.tw{overflow-x:auto}
th,td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--rule-2);vertical-align:top}
th{font-weight:600;color:var(--ink-2);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
td.n{font-family:var(--f-mono);text-align:right;white-space:nowrap}td.m{font-family:var(--f-mono);white-space:nowrap}
.tag{display:inline-block;font:600 9.5px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:1px 4px;border-radius:3px;border:1px solid currentColor}
.tag.buy{color:var(--accent)}.tag.salvage{color:var(--ok)}.tag.have{color:#8a6d3b}
ol.steps{list-style:none;margin:0;padding:0}
ol.steps li{display:grid;grid-template-columns:26px 1fr;gap:8px;padding:8px 4px;border-bottom:1px solid var(--rule-2);cursor:pointer}
ol.steps li.ph{display:block;cursor:default;border:0;font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:12px 4px 2px}
ol.steps li .no{font:500 11px var(--f-mono);color:var(--ink-3);text-align:right;padding-top:2px}
ol.steps li b{font-weight:600;display:block}
ol.steps li span.d{font-size:12.5px;color:var(--ink-2)}
ol.steps li.cur{background:var(--rule-2)}
ol.steps li.off{opacity:.45}
ol.steps li .num{font-family:var(--f-mono);color:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px;margin:0}.kv dt{color:var(--ink-2)}.kv dd{margin:0;font:500 12.5px var(--f-mono)}
.sl{display:grid;grid-template-columns:minmax(8.5em,auto) 1fr auto;gap:8px;align-items:center;font-size:13px;color:var(--ink-2)}
.val{font:500 12px var(--f-mono);color:var(--ink);min-width:7ch;text-align:right}
.big{font:500 22px var(--f-mono);letter-spacing:-.01em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cell{border:1px solid var(--rule);border-radius:6px;padding:8px 10px;background:var(--bg)}.cell small{display:block;color:var(--ink-2);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.spk{position:relative;width:16px;height:12px;display:inline-block}.spk::before{content:"";position:absolute;left:0;top:3px;width:4px;height:6px;background:currentColor}.spk::after{content:"";position:absolute;left:3px;top:0;border-right:6px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent}.spk i{position:absolute;left:10px;top:2px;width:6px;height:8px;border:2px solid currentColor;border-left:0;border-radius:0 8px 8px 0;opacity:.25}[aria-pressed="true"] .spk i{opacity:1}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select{font:500 12.5px var(--f-body);padding:4px;border:1px solid var(--rule);border-radius:4px;background:var(--bg);color:var(--ink);min-height:30px}
.loading{position:absolute;inset:0;display:grid;place-items:center;font:500 12px var(--f-mono);color:var(--ink-2)}
</style>
<div class="ws">
<header><h1>Centaur Velocipede</h1><div class="mode" role="group" aria-label="Mode"><button data-m="bike" aria-pressed="true"><i></i>Bicycle</button><button data-m="pack" aria-pressed="false"><i class="pack"></i>Backpack</button></div><div class="hstat" id="hstat"></div><button class="mini" id="snd" type="button" aria-pressed="false" aria-label="Sound"><span class="spk"><i></i></span></button></header>
<div class="view" id="view">
  <canvas id="c3" aria-label="3D model. Drag to orbit, pinch to zoom, tap a part to name it."></canvas>
  <canvas id="c2" hidden aria-label="Drawing"></canvas>
  <div class="loading" id="loading">Loading 3D…</div>
  <div class="vbar"><div class="vseg" role="group" aria-label="View"><button data-v="3d" aria-pressed="true">3D</button><button data-v="elev" aria-pressed="false">Elevation</button><button data-v="plate" aria-pressed="false">Plate</button><button data-v="leg" aria-pressed="false">Leg</button></div><div class="vseg" role="group" aria-label="3D options" id="v3opts"><button id="xray" aria-pressed="false">Bare</button><button id="fit">Fit</button></div></div>
  <div class="warn" id="warn" hidden></div>
  <div class="vstat" id="vstat"></div>
</div>
<div class="trans"><button class="play" id="play" type="button" aria-label="Pause"><span class="ic pause-i" id="pi"></span></button><canvas class="scrub" id="scrub" aria-label="Phase of one leg cycle. Drag to scrub."></canvas><label class="cad"><input id="spd" type="range" min="0.5" max="7" step="0.05" value="2.5" aria-label="Ground speed"><span id="spdv"></span></label></div>
<div class="side">
  <div class="tabs" role="tablist"><button role="tab" data-t="build" aria-selected="true">Build</button><button role="tab" data-t="parts" aria-selected="false">Parts</button><button role="tab" data-t="drive" aria-selected="false">Drive</button><button role="tab" data-t="joints" aria-selected="false">Joints</button></div>
  <div class="insp" id="insp"></div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const T=window.THREE,TAU=Math.PI*2,D=Math.PI/180,$=id=>document.getElementById(id);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const V=(x,y)=>({x,y}),sub=(a,b)=>V(a.x-b.x,a.y-b.y),add=(a,b)=>V(a.x+b.x,a.y+b.y),len=v=>Math.hypot(v.x,v.y);
const mm=m=>(m*1000).toFixed(0)+' mm';

/* ===== Jansen linkage (Jansen's units) ===== */
const JU={a:38,b:41.5,c:39.3,d:40.1,e:55.8,f:39.4,g:36.7,h:65.7,i:49,j:50,k:61.9,l:7.8,m:15};
function circ(p,r1,q,r2,side){const dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy);if(d<1e-9)return null;const a=(r1*r1-r2*r2+d*d)/(2*d),hh=r1*r1-a*a;if(hh<0)return null;const h=Math.sqrt(hh),mx=p.x+a*dx/d,my=p.y+a*dy/d;return V(mx-side*h*dy/d,my+side*h*dx/d);}
function jan(th){const O=V(0,0),B=V(-JU.a,-JU.l),C=V(JU.m*Math.cos(th),JU.m*Math.sin(th));const Dd=circ(B,JU.b,C,JU.j,1),E=circ(B,JU.c,C,JU.k,-1),F=circ(B,JU.d,Dd,JU.e,1),G=circ(F,JU.f,E,JU.g,-1),H=circ(G,JU.h,E,JU.i,-1);return {O,B,C,D:Dd,E,F,G,H};}
const NS=360,PU=[];for(let k=0;k<NS;k++)PU.push(jan(k/NS*TAU));
const YMIN=Math.min(...PU.map(p=>p.H.y)),YMAXH=Math.max(...PU.map(p=>p.H.y));
const CONTACT=PU.map(p=>p.H.y<YMIN+1.0);
let TD=0,LO=0;for(let k=0;k<NS;k++){if(CONTACT[k]&&!CONTACT[(k+1)%NS])TD=k;if(CONTACT[k]&&!CONTACT[(k-1+NS)%NS])LO=k;}
const DUTY=CONTACT.filter(Boolean).length/NS;
const thetaAt=ph=>TD/NS*TAU-TAU*ph; // phase 0 = left hind touchdown; the crank turns clockwise seen from the right
const onGround=ph=>CONTACT[((Math.round(TD-NS*ph)%NS)+NS)%NS];
const SC=.170/JU.m;                  // metres per Jansen unit: the crank is a 170 mm bicycle crank arm
const DROP=-YMIN*SC;                 // pivot O to hoof bottom
const BODIES=[{id:'crank',name:'Crank arm',j:['O','C']},{id:'j',name:'Upper rod',j:['C','D']},{id:'k',name:'Lower rod',j:['C','E']},{id:'t1',name:'Hip plate',j:['B','D','F']},{id:'c',name:'Thigh rocker',j:['B','E']},{id:'f',name:'Gaskin rod',j:['F','G']},{id:'t2',name:'Shank plate',j:['G','E','H']}];
const LINKS=[['O','C','m'],['C','D','j'],['C','E','k'],['B','D','b'],['B','F','d'],['D','F','e'],['B','E','c'],['F','G','f'],['G','E','g'],['G','H','h'],['E','H','i']];
const JOINTS=['B','C','D','E','F','G'];
const legL=ph=>{const u=jan(thetaAt(ph)),o={};for(const k in u)o[k]=V(u[k].x*SC,u[k].y*SC);return o;}; // relative to O

/* ===== the bicycle: State Bicycle Co. 4130 All-Road, Medium (51 cm), 700 × 38c ===== */
const BK={R:.349,BB:V(0,.274),RA:V(-.4437,.349),FA:V(.6104,.349),STt:V(-.145,.763),HTt:V(.3715,.8765),HTb:V(.424,.720),saddle:V(-.2045,.9645),rackY:.80,rackX:[-.62,-.24],C:2.16,ring:42,cogs:[11,13,15,17,19,21,24,28,32,36,42]};
const MODES={bike:{name:'Bicycle',O:V(-.50,DROP+.039),vmin:1,vmax:7,v:2.5},pack:{name:'Backpack',O:V(-.52,DROP),vmin:.5,vmax:1.9,v:1.3}};
const S={mode:'bike',v:2.5,cog:24,ph:0,dist:0,playing:true,view:'3d',tab:'build',step:-1,sound:false,bare:false};
const Om=()=>MODES[S.mode].O;
const BASE=-.25; // base rails 250 mm below O
const ARM={pivot:V(-.45,BASE),wheelX:-.58,r:.0975,C:2*Math.PI*.0975}; // 200 × 50 pneumatic, loaded rolling radius
const PLY=.012,WASH=.0016,PITCH=PLY+WASH,BARW=.045,PLATE_Z=.13,LAYER0=.205,HUB=[.165,.199];
const layerZ=L=>LAYER0+(L-1)*PITCH;

/* ===== derived numbers ===== */
let K={};
function derive(){const dx=(PU[TD].H.x-PU[LO].H.x)*SC,adv=dx/DUTY;
  let best=null;for(let a=10;a<=20;a++)for(let b=20;b<=60;b++){const e=Math.abs(ARM.C*b/a-adv);if(!best||e<best.e-1e-6)best={a,b,e};}
  const advG=ARM.C*best.b/best.a;let slip=0;for(let k=TD;k!==LO;k=(k-1+NS)%NS){const k2=(k-1+NS)%NS;slip+=Math.abs((PU[k2].H.x-PU[k].H.x)*SC+advG/NS);}
  const O=Om(),wheel=V(O.x+ARM.wheelX,ARM.r),piv=add(O,ARM.pivot);
  const chain=(cd,t1,t2,p)=>{let n=2*cd/p+(t1+t2)/2+p*(t2-t1)**2/(4*Math.PI**2*cd);n=Math.ceil(n);if(n%2)n++;return n;};
  K={adv,dx,T2:best.a,TJ:best.b,advG,slip,f:S.v/advG,cad:S.v/(BK.C*BK.ring/S.cog)*60,lift:(YMAXH-YMIN)*SC,O,wheel,piv,armLen:len(sub(wheel,piv)),clear:O.y-DROP,
    ch1:chain(len(sub(wheel,piv)),15,15,.009525),ch2:chain(len(sub(O,piv)),best.a,best.b,.009525)};}
derive();

/* ===== layer plan (parts, bolt columns and the shaft end) ===== */
function segDist(a,b,c,d){const f=(p,q,r)=>{const l2=(r.x-q.x)**2+(r.y-q.y)**2;let t=l2?((p.x-q.x)*(r.x-q.x)+(p.y-q.y)*(r.y-q.y))/l2:0;t=Math.max(0,Math.min(1,t));return Math.hypot(p.x-q.x-t*(r.x-q.x),p.y-q.y-t*(r.y-q.y));};
  const o=(p,q,r)=>Math.sign((q.x-p.x)*(r.y-p.y)-(q.y-p.y)*(r.x-p.x));if(o(a,b,c)*o(a,b,d)<0&&o(c,d,a)*o(c,d,b)<0)return 0;return Math.min(f(a,c,d),f(b,c,d),f(c,a,b),f(d,a,b));}
const bodyEdges=b=>b.j.length===2?[[b.j[0],b.j[1]]]:[[b.j[0],b.j[1]],[b.j[1],b.j[2]],[b.j[2],b.j[0]]];
const LAYERS={},JSTACK={};
(function(){const n=BODIES.length,conf=[...Array(n)].map(()=>Array(n).fill(false)),gap=(BARW+.006)/SC;
  for(let a=0;a<n;a++)for(let b=a+1;b<n;b++){const A=BODIES[a],Bb=BODIES[b];if(A.j.some(x=>Bb.j.includes(x))){conf[a][b]=conf[b][a]=true;continue;}
    for(let k=0;k<NS&&!conf[a][b];k+=5){const P=PU[k];for(const [p,q] of bodyEdges(A))for(const [r,t] of bodyEdges(Bb))if(segDist(P[p],P[q],P[r],P[t])<gap)conf[a][b]=conf[b][a]=true;}}
  const COLJ=[...JOINTS,'O'],near=BODIES.map(b=>{const o={},r=(BARW/2+.012)/SC;for(const J of COLJ){o[J]=false;for(let k=0;k<NS&&!o[J];k+=3){const P=PU[k];for(const [p,q] of bodyEdges(b))if(segDist(P[J],P[J],P[p],P[q])<r){o[J]=true;break;}}}return o;});
  let best=null;for(let kc=2;kc<=7&&!best;kc++){const asg=Array(n).fill(0);
    const rec=i=>{if(i===n){for(const J of COLJ){const ls=BODIES.map((b,bi)=>b.j.includes(J)?asg[bi]:null).filter(x=>x!==null);const lo=J==='B'?1:Math.min(...ls),hi=Math.max(...ls);for(let bi=0;bi<n;bi++)if(!BODIES[bi].j.includes(J)&&near[bi][J]&&asg[bi]>=lo&&asg[bi]<=hi)return;}
        let cost=0;for(const J of JOINTS){const ls=BODIES.map((b,bi)=>b.j.includes(J)?asg[bi]:null).filter(x=>x!==null);const lo=J==='B'?1:Math.min(...ls),hi=Math.max(...ls);cost+=hi-lo+1-ls.length;}if(!best||cost<best.cost)best={cost,asg:asg.slice()};return;}
      for(let L=1;L<=kc;L++){if(i===0&&L!==1)continue;let ok=true;for(let p=0;p<i;p++)if(conf[i][p]&&asg[p]===L){ok=false;break;}if(ok){asg[i]=L;rec(i+1);}}};rec(0);}
  BODIES.forEach((b,i)=>LAYERS[b.id]=best.asg[i]);LAYERS.n=Math.max(...best.asg);
  const SH=[10,12,16,20,25,30,35,40,45,50,55,60,70,80];
  for(const J of JOINTS){const bs=BODIES.filter(b=>b.j.includes(J)).map(b=>({b,L:LAYERS[b.id]}));const ls=bs.map(x=>x.L);const lo=J==='B'?1:Math.min(...ls),hi=Math.max(...ls);
    const span=hi-lo+1,stack=span*PLY+(span-1)*WASH+(J==='B'?WASH:0);JSTACK[J]={bodies:bs,lo,hi,spacers:span-ls.length,stack,shoulder:SH.find(x=>x/1000>=stack-.0005)||80};}})();

/* ===== human motion ===== */
function twoBone(h,t,L1,L2,bend){const d=sub(t,h),dl=Math.min(len(d),L1+L2-1e-4),a=Math.atan2(d.y,d.x),al=Math.acos(Math.max(-1,Math.min(1,(L1*L1+dl*dl-L2*L2)/(2*L1*dl))));return V(h.x+Math.cos(a+bend*al)*L1,h.y+Math.sin(a+bend*al)*L1);}

function drawLeg(){const {g,w,h}=fit2(c2);g.fillStyle=C.view;g.fillRect(0,0,w,h);const P=legL(S.ph+.5),O=Om();const x0=LX.min-.08,x1=LX.max+.08,y0=-O.y-.03,y1=LX.ymax+.04;const top=106,bot=30;const u=Math.min((w-24)/(x1-x0),(h-top-bot)/(y1-y0));const ox=(w-(x1-x0)*u)/2-x0*u,oy=h-bot+y0*u;const M=p=>V(ox+p.x*u,oy-p.y*u);

const scrub=$('scrub');function drawScrub(){const {g,w,h}=fit2(scrub);g.clearRect(0,0,w,h);g.font='9px '+MONO;[['LH',p=>onGround(p)],['RH',p=>onGround(p+.5)]].forEach(([l,f],i)=>{g.fillStyle=C['ink-2'];g.fillText(l,0,9+i*12);g.fillStyle=C.ink;for(let k=0;k<120;k++)if(f(k/120))g.fillRect(20+k/120*(w-22),2+i*12,(w-22)/120+.5,8);});const X=20+S.ph*(w-22);g.strokeStyle=C.accent;g.lineWidth=2;g.beginPath();g.moveTo(X,0);g.lineTo(X,h);g.stroke();}
let sDrag=false;const scrubAt=e=>{const r=scrub.getBoundingClientRect(),np=Math.max(0,Math.min(.999,(e.clientX-r.left-20)/(r.width-22)));S.dist+=(np-S.ph)*K.advG;S.ph=np;setPlaying(false);};
scrub.addEventListener('pointerdown',e=>{scrub.setPointerCapture(e.pointerId);sDrag=true;scrubAt(e);});scrub.addEventListener('pointermove',e=>{if(sDrag)scrubAt(e);});scrub.addEventListener('pointerup',()=>sDrag=false);

$('play').addEventListener('click',()=>{audio();setPlaying(!S.playing);});

$('spd').addEventListener('input',e=>{S.v=+e.target.value;MODES[S.mode].v=S.v;$('spdv').textContent=(S.v*3.6).toFixed(1)+' km/h';derive();header();if(S.tab==='drive')renderInsp();});

/* ===== build steps ===== */
function steps(){const f=v=>`<span class="num">${v}</span>`;return [
 {ph:'Module · build once, use in both modes'},
 {t:'Cut the links',d:`From 12 mm Baltic birch cut ${f('10 bars and 4 plates')} (Parts). Clamp each pair; drill the pivots together, ${f('13.8 mm')}, ±0.5 mm on centres.`,tags:['links']},
 {t:'Press the bushings',d:`One sleeve bronze bushing per hole, ${f('10 × 14 × 12 mm')}; at B ${f('12 × 16 × 12 mm')} in a ${f('15.8 mm')} hole.`,tags:['links']},
 {t:'Make the crank arms',d:`2 × steel flat bar 12 × 40 × 210 mm, each welded to a 3/4 in keyed weld-on hub on the inner face. Pin hole ${f('10 mm')} at ${f('170 mm')}.`,tags:['links']},
 {t:'Cut the pelvis plates',d:`2 × 6 mm 6061 aluminium, ${f('560 × 230 mm')}. O: ${f('32 mm')} clear plus 2 × M10 holes 90 mm apart, vertical. B: tap M12, ${f(mm(JU.a*SC))} behind O and ${f(mm(JU.l*SC))} lower; add a 6 mm doubler.`,tags:['frame']},
 {t:'Build the base',d:`2 rails of 25 mm square aluminium, ${f('840 mm')}, ${f('220 mm')} apart; 3 cross bars; posts up to the plates. O sits ${f('250 mm')} above the rails.`,tags:['frame']},
 {t:'Fit shaft and bearings',d:`UCFL204-12 flange bearing on each plate’s outer face. Cut the 3/4 in keyed shaft to ${f('422 mm')}: it ends flush with the crank arms. Key the ${f(K.TJ+'T')} #35 sprocket inside the left plate.`,tags:['shaft','drive']},
 {t:'Assemble the legs',d:`Stack by layer (Joints). Nylon washer between layers. M10 shoulder bolts at C, D, E, F, G; snug each nylock until it turns freely with no end play.`,tags:['links']},
 {t:'Hang the legs',d:`Crank arms on the shaft ${f('180°')} apart. M12 shoulder bolt at B into plate and doubler, lock nut inside.`,tags:['links','frame']},
 {t:'Build the drive arm',d:`2 × 20 mm square aluminium, ${f(mm(K.armLen))}, slotted at the wheel end. 5/8 in pivot shaft at the base rear with ${f('15T')} and ${f(K.T2+'T')}. 200 × 50 pneumatic wheel on a 5/8 in keyed axle with ${f('15T')}. A bungee holds the wheel down; a pin holds the arm up.`,tags:['drive']},
 {t:'Fit the chains',d:`Chain 1, #35, ${f(K.ch1+' links')}, wheel to pivot. Chain 2, #35, ${f(K.ch2+' links')}, pivot to jackshaft. Tension at the slots to 8 mm slack mid-span.`,tags:['drive']},
 {t:'Make the hooves',d:`Pine, ${f('120 × 85 × 80 mm')}. Glue a ${f('15 mm')} closed-cell foam pad and a tyre-tread sole underneath. Bolt to the shank plate at H.`,tags:['hooves']},
 {t:'Spine and ribs',d:`1 in EMT spine, ${f('800 mm')}, on two struts; 17 PVC vertebra rings. 8 ribs of 1/2 in PVC, heat-bent to half-width ${f('150 mm')}, ahead of O.`,tags:['spine','ribs']},
 {t:'Finish like bone',d:`Sand to 180. Black tea, 6 bags per litre, 3 coats. Amber shellac, 2 coats.`,tags:['links','spine','ribs','hooves']},
 {t:'Tie the tail',d:`${f('60 cm')} horsehair switch to the spine end with waxed cord.`,tags:['tail']},
 {ph:'Bicycle mode · your State All-Road, Medium'},
 {t:'Clear the rack',d:`Take off the wire basket and the bungee net. Rack top: ${f('800 mm')} up.`,tags:['bike'],mode:'bike'},
 {t:'Clamp the module',d:`4 × 30 mm risers on the rack rails. Clamp the base cross bars to the rails with 4 M6 U-clamps. Strap the base front to the seatpost. The module is about ${f('10 kg')}: check your rack’s rated load.`,tags:['frame','bike'],mode:'bike'},
 {t:'Drop the drive wheel',d:`Pull the pin. The wheel rolls on the road ${f(mm(-(MODES.bike.O.x+ARM.wheelX)-BK.R+BK.RA.x*-1-ARM.r))} behind your rear tyre. Hooves ride ${f(mm(K.clear))} above the road and walk at road pace.`,tags:['drive'],mode:'bike'},
 {t:'Ride',d:`Leg rate = speed ÷ ${f(mm(K.advG))}. Above ${f('2.2 Hz')} (${f((2.2*K.advG*3.6).toFixed(0)+' km/h')}) pin the arm up and the legs stop. Your gears and coasting do not affect them.`,tags:null,mode:'bike'},
 {ph:'Backpack mode · walking'},
 {t:'Fit the hitch',d:`External-frame backpack with a padded hip belt. Bolt 2 hitch poles (20 mm aluminium tube, M8 rod-end ball joints) from the belt’s side plates to the base front.`,tags:['pack'],mode:'pack'},
 {t:'Set the height',d:`Adjust the arm slot until O is ${f(mm(DROP))} up: the hoof pads just touch level ground. The wheel carries about ${f('60%')} of the module; the belt about ${f('4 kg')}.`,tags:['drive','pack'],mode:'pack'},
 {t:'Walk',d:`Chalk the soles; walk ${f('20 m')}. Each smear should be under ${f(mm(K.slip))}. Your stride and the hind legs run at nearly the same rate but are not locked together.`,tags:null,mode:'pack'}];}

    <dl class="kv"><dt>Drive wheel</dt><dd>200 × 50, rolls ${mm(ARM.C)} per turn</dd><dt>Advance needed per leg turn</dt><dd>${mm(K.adv)}</dd><dt>From the gearing</dt><dd>${mm(K.advG)} (${mm(ARM.C)} × ${K.TJ}/${K.T2})</dd><dt>Pivot O</dt><dd>${mm(K.O.y)} up${S.mode==='bike'?`, ${mm(-K.O.x)} behind the bottom bracket`:''}</dd><dt>Hooves</dt><dd>${S.mode==='bike'?mm(K.clear)+' above the road':'touch, '+Math.round(DUTY*100)+'% of each cycle'}</dd><dt>Chains</dt><dd>${K.ch1} + ${K.ch2} links, #35</dd>${S.mode==='bike'?`<dt>Your bike</dt><dd>State All-Road M: wheelbase 1054, chainstay 450, BB drop 75, 170 cranks, 42T × 11–42</dd>`:''}</dl>
    <p class="muted">The legs take their drive from their own wheel on the ground, so the same module, gearing and direction work behind your bike and behind you. Leg rate is always speed ÷ ${mm(K.advG)}.</p></section>`;}
  if(t==='joints'){h=`<section><h2>Layers, inside to outside</h2><p class="muted">Computed: no two parts on one layer come within a bar width of each other, and no part crosses a bolt or the shaft end on a layer that bolt occupies.</p>
    <div class="tw"><table><thead><tr><th>Layer</th><th>Parts</th><th>Out from plate</th></tr></thead><tbody>${[...Array(LAYERS.n)].map((_,i)=>{const L=i+1;return `<tr><td class="n">${L}</td><td>${BODIES.filter(b=>LAYERS[b.id]===L).map(b=>b.name+' '+b.j.join('–')).join(', ')}</td><td class="n">${mm(layerZ(L)-PLATE_Z)}</td></tr>`;}).join('')}</tbody></table></div>
    <h2>Pivots</h2><div class="tw"><table><thead><tr><th>Pivot</th><th>Parts (layer)</th><th>Stack</th><th>Bolt</th></tr></thead><tbody>${JOINTS.map(J=>{const s=JSTACK[J];return `<tr><td class="m">${J}</td><td>${s.bodies.map(x=>x.b.name+' ('+x.L+')').join(', ')}${J==='B'?', plate':''}</td><td class="n">${mm(s.stack)}</td><td class="m">${J==='B'?'M12':'M10'} × ${s.shoulder}</td></tr>`;}).join('')}<tr><td class="m">O</td><td>Crank arm (1) on shaft</td><td class="n">—</td><td class="m">welded hub</td></tr></tbody></table></div></section>`;}
  el.innerHTML=h;wire();}
function wire(){const el=$('insp');el.querySelectorAll('ol.steps li[data-i]').forEach(li=>li.addEventListener('click',()=>{const i=+li.dataset.i,st=steps()[i];if(st.mode&&st.mode!==S.mode)setMode(st.mode);S.step=S.step===i?-1:i;if(R3)R3.highlight(S.step<0?null:steps()[S.step].tags);renderInsp();knock(1800,.02,.12);}));
  const cog=$('cog');if(cog)cog.addEventListener('change',()=>{S.cog=+cog.value;derive();header();renderInsp();});}
function setMode(m){if(m===S.mode)return;S.mode=m;S.v=MODES[m].v;document.querySelectorAll('.mode button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===m));derive();syncSpeed();header();if(T){R3=build3D();R3.resize();R3.bare(S.bare);if(S.step>=0)R3.highlight(steps()[S.step].tags);}renderInsp();knock(700,.06,.25);}
document.querySelectorAll('.mode button').forEach(b=>b.addEventListener('click',()=>{audio();S.step=-1;setMode(b.dataset.m);}));

/* ===== view, input, loop ===== */
document.querySelectorAll('.vseg button[data-v]').forEach(b=>b.addEventListener('click',()=>{S.view=b.dataset.v;document.querySelectorAll('.vseg button[data-v]').forEach(x=>x.setAttribute('aria-pressed',x===b));c3.hidden=S.view!=='3d';c2.hidden=S.view==='3d';$('v3opts').style.visibility=S.view==='3d'?'visible':'hidden';if(R3)R3.resize();knock(1500,.015,.1);}));
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{S.tab=b.dataset.t;document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));renderInsp();$('insp').scrollTop=0;}));
$('snd').addEventListener('click',e=>{S.sound=!S.sound;e.currentTarget.setAttribute('aria-pressed',S.sound);if(S.sound){audio();knock(900,.05,.25);}});
$('xray').addEventListener('click',e=>{S.bare=!S.bare;e.currentTarget.setAttribute('aria-pressed',S.bare);if(R3)R3.bare(S.bare);});
$('fit').addEventListener('click',()=>{if(R3)Object.assign(R3.cam,{th:.6,ph:1.3,r:4.4,tx:S.mode==='bike'?-.22:-.42,ty:.78});});
if(T){R3=build3D();const ptr=new Map();let g0=null;
  c3.addEventListener('pointerdown',e=>{c3.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptr.size===2){const [a,b]=[...ptr.values()];g0={pinch:1,d:Math.hypot(a.x-b.x,a.y-b.y),r:R3.cam.r};}else g0={x:e.clientX,y:e.clientY,th:R3.cam.th,ph:R3.cam.ph,mv:false};});
  c3.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId)||!g0)return;ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(g0.pinch){if(ptr.size===2){const [a,b]=[...ptr.values()];R3.cam.r=Math.max(.8,Math.min(9,g0.r*g0.d/Math.max(1,Math.hypot(a.x-b.x,a.y-b.y))));}return;}const dx=e.clientX-g0.x,dy=e.clientY-g0.y;if(Math.hypot(dx,dy)>5)g0.mv=true;R3.cam.th=g0.th-dx*.008;R3.cam.ph=Math.max(.2,Math.min(1.55,g0.ph-dy*.006));});
  c3.addEventListener('pointerup',e=>{const p=ptr.get(e.pointerId);ptr.delete(e.pointerId);if(g0&&!g0.pinch&&!g0.mv&&p){const n=R3.pick(e.clientX,e.clientY);if(n){vstat(n);S.hold=performance.now()+3500;knock(2200,.015,.1);}}if(!ptr.size)g0=null;});
  c3.addEventListener('pointercancel',e=>{ptr.delete(e.pointerId);if(!ptr.size)g0=null;});
  c3.addEventListener('wheel',e=>{e.preventDefault();R3.cam.r=Math.max(.8,Math.min(9,R3.cam.r*Math.exp(e.deltaY*.0012)));},{passive:false});
  $('loading').remove();}else $('loading').textContent='3D library did not load. Elevation, Plate and Leg still work.';
new ResizeObserver(()=>{if(R3)R3.resize();}).observe($('view'));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{readC();if(R3)R3.scene.background=new T.Color(C.view).convertSRGBToLinear();});
let last=performance.now(),lastCon=[false,false];
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(S.playing){S.dist+=S.v*dt;S.ph=((S.ph+S.v*dt/K.advG)%1+1)%1;}
  const con=[0,.5].map(o=>onGround(S.ph+o));if(S.mode==='pack')con.forEach((c,i)=>{if(c&&!lastCon[i])knock(i?520:600,.06,.3);});lastCon=con;
  if(S.view==='3d'&&R3){R3.pose(S.ph);R3.updCam();R3.render();if(!S.hold||now>S.hold){const st=S.step>=0?steps()[S.step]:null;vstat(st?st.t:`3d · ${MODES[S.mode].name.toLowerCase()} mode · drag to orbit, tap a part · Bare hides body, ribs, tail`);}}
  else if(S.view==='elev')drawElev();else if(S.view==='plate')drawPlate();else drawLeg();
  drawScrub();requestAnimationFrame(frame);}
if(R3)R3.resize();syncSpeed();header();renderInsp();requestAnimationFrame(frame);
})();
</script>
