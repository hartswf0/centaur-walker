<style>

*{box-sizing:border-box}html,body{height:100%;margin:0}

@media (min-width:900px){.ws{grid-template-columns:minmax(0,1fr) 410px;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"head head" "view side" "trans side"}.side{grid-area:side;display:grid;grid-template-rows:auto minmax(0,1fr);border-left:1px solid var(--rule);min-height:0}.tabs,.insp{grid-area:auto!important}}
@media (max-width:899px){.side{display:contents}}
header{grid-area:head;display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--rule);min-width:0}
h1{margin:0;font:500 15px var(--f-display);letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
@media (max-width:560px){h1{display:none}}
.hstat{flex:1;min-width:0;font:500 11px var(--f-mono);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{font:600 11px var(--f-body);border:1px solid var(--rule);background:var(--panel);color:var(--ink);border-radius:5px;min-height:30px;min-width:32px;padding:4px 8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.mini[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.mode{display:inline-flex;border:1px solid var(--ink);border-radius:7px;overflow:hidden;flex-shrink:0}
.mode button{font:600 12.5px var(--f-body);border:0;background:transparent;color:var(--ink);padding:6px 12px;min-height:34px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.mode i{display:inline-block;width:14px;height:10px;border:1.6px solid currentColor;border-radius:50%}
.mode i.pack{border-radius:3px;width:10px;height:13px}
.view{grid-area:view;position:relative;background:var(--view);overflow:hidden;min-height:0}
.view canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.view canvas[hidden]{display:none}
.vbar{position:absolute;top:8px;left:8px;right:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;pointer-events:none}.vbar>*{pointer-events:auto}
.vseg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--panel)}
.vseg button{font:600 11px var(--f-body);border:0;background:transparent;color:var(--ink);padding:5px 9px;min-height:30px;cursor:pointer}
.vseg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.vstat{position:absolute;left:8px;right:8px;bottom:6px;font:500 10.5px var(--f-mono);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.trans{grid-area:trans;display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.scrub{flex:1;height:28px;touch-action:none;cursor:pointer;min-width:0}
.play{width:40px;height:36px;border-radius:7px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;display:grid;place-items:center}
.ic{display:inline-block;position:relative;width:12px;height:12px}
.ic.play-i{width:0;height:0;border-left:11px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent}
.ic.pause-i::before,.ic.pause-i::after{content:"";position:absolute;top:0;width:4px;height:12px;background:currentColor}.ic.pause-i::before{left:1px}.ic.pause-i::after{right:1px}

h2{margin:0;font:600 16px var(--f-body)}
p{margin:0;max-width:66ch}.muted{color:var(--ink-2);font-size:12.5px}
table{border-collapse:collapse;width:100%;font-size:12.5px}.tw{overflow-x:auto}
th,td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--rule-2);vertical-align:top}
th{font-weight:600;color:var(--ink-2);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
td.n{font-family:var(--f-mono);text-align:right;white-space:nowrap}td.m{font-family:var(--f-mono);white-space:nowrap}

ol.steps li b{font-weight:600;display:block}
ol.steps li span.d{font-size:12.5px;color:var(--ink-2)}

ol.steps li.off{opacity:.45}
ol.steps li .num{font-family:var(--f-mono);color:var(--ink)}

.val{font:500 12px var(--f-mono);color:var(--ink);min-width:7ch;text-align:right}
.big{font:500 22px var(--f-mono);letter-spacing:-.01em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

.loading{position:absolute;inset:0;display:grid;place-items:center;font:500 12px var(--f-mono);color:var(--ink-2)}

 {ph:'Module · one unit, 356 × 356 mm footprint'},

 {t:'Press the bushings',d:`One sleeve bronze bushing per hole, ${f('10 × 14 × 12 mm')}; at B ${f('12 × 16 × 12 mm')} in a ${f('15.8 mm')} hole.`,tags:['links']},
 {t:'Make the crank arms',d:`2 × steel flat bar 12 × 40 × 110 mm. Bore ${f('20 mm')} with a 6 mm keyway; two M6 set screws through the edge. Pin hole ${f('10 mm')} at ${f(J.m+' mm')}.`,tags:['links']},
 {t:'Build the base',d:`2 rails of 25 mm square aluminium, ${f('356 mm')}, ${f('150 mm')} apart (inside faces 125 mm), 2 cross bars. This is the whole footprint.`,tags:['frame']},
 {t:'Cut the side plates',d:`2 × 6 mm 6061 aluminium. O ${f(J.oh+' mm')} above the rails, ${f(mm(J.a/2000))} forward of centre; B ${f(J.a+' mm')} behind O and ${f(J.l+' mm')} lower, tapped M12 with a doubler. Bolt to the rails, ${f('188 mm')} apart outside.`,tags:['frame']},
 {t:'Fit shaft and bearings',d:`UCFL204 flange bearing on each plate’s inner face. Shaft 20 mm keyed, ${f(mm(2*(LAYER0+PLY/2)))}, flush with the crank arms. On it, inside: the ${f(K.TJ+'T')} #25 sprocket at the centre and two cord spools ${f('⌀'+Math.round(K.spool*1000))} on CSK20 one-way bearings.`,tags:['shaft']},
 {t:'Assemble the legs',d:`Stack by layer (Joints). Nylon washer between layers. M10 shoulder bolts at C, D, E, F, G; snug each nylock until it turns freely with no end play.`,tags:['links']},
 {t:'Hang the legs',d:`Crank arms on the shaft ${f('180°')} apart. M12 shoulder bolt at B into plate and doubler, lock nut inside.`,tags:['links','frame']},
 {t:'Make the hooves',d:`Pine, ${f('110 × 70 × 75 mm')}; 12 mm foam pad and tyre-tread sole. Bolt to the shank plate at H.`,tags:['hooves']},
 {t:'Spine and rib hoops',d:`1 in EMT spine ${f('336 mm')} on 4 struts, ${f(mm(LX.ymax+.04))} above O. 5 hoops of 1/2 in PVC, heat-bent, half-width ${f('170 mm')}: they pass outside the legs and stay inside the footprint.`,tags:['body']},
 {t:'Skin the body',d:`2 side panels of 3 mm birch ply, ${f(mm(HALF*2+.155))} long, cut to the outline in Side view. Screw them to the rib hoops ${f('175 mm')} from centre; 13 pine battens, 20 × 6 mm, over the top. The legs move inside the panels and touch nothing; below the belly line, ${f('85 mm')} under the platform, they show as hind legs. Cut a ${f('160 × 120 mm')} hatch over the shaft on two hinges: the drive is reached through it.`,tags:['body']},
 {t:'Hang the apron',d:`Waxed canvas, ${f('600 × 900 mm')}, from the front edge of the panels to a belt at your waist, elastic gores at the sides. It joins the horse body to yours.`,tags:['body']},
 {t:'Horse head (Trojan)',d:`5 mm foam board sides and balsa laths, ${f('480 × 340 × 220 mm')}, glued to a bike helmet; eye slots at your eye line; about ${f('600 g')}. Your torso becomes the neck and your legs the forelegs.`,tags:['body'],bd:'trojan'},
 {t:'Finish like bone',d:`Sand to 180. Black tea, 6 bags per litre, 3 coats. Amber shellac, 2 coats.`,tags:['links','body','hooves']},
 {ph:'Bicycle mode · your State All-Road, Medium'},
 {t:'Clear the rack',d:`Remove the wire basket and the bungee net. The module takes the same 14 × 14 in footprint, ${f('800 mm')} up.`,tags:['bike'],mode:'bike'},
 {t:'Clamp the module',d:`4 M6 U-clamps through the cross bars around the rack rails. Platform centre over the rear axle, ${f(mm(-K.PC))} behind the bottom bracket in bicycle mode.`,tags:['frame','bike'],mode:'bike'},
 {t:'Fit the roller drive',d:`Under the platform: a sprung arm holds a ${f('52 mm')} urethane skate wheel on top of the tyre. 12:36 spur gears (module 1) then #25 chain ${f(K.TS+':'+K.TJ)}, ${f(K.chainR+' links')}, up between the rack tubes. Gear pair reverses the roller so the legs walk forward.`,tags:['roller'],mode:'bike'},
 {t:'Ride',d:`The tyre drives the legs at road pace: ${f(mm(K.advB))} per leg cycle. They keep walking when you coast. Above ${f('2.2 Hz')} (${f((2.2*K.advB*3.6).toFixed(0)+' km/h')}) lift the roller arm off the tyre.`,tags:null,mode:'bike'},
 {ph:'Backpack mode · walking'},
 {t:'Move the module to the pack',d:`Freighter-frame backpack with a load shelf at ${f('800 mm')}, 14 × 14 in. Same 4 U-clamps. Pin the roller arm up.`,tags:['pack','frame','roller'],mode:'pack'},
 {t:'Rig the cords',d:`Velcro strap on the back of each thigh, ${f('half-way to the knee')}. 4 mm Dyneema cord from each strap, over a guide pulley at the shelf front, ${f('3 turns')} round its spool. A bungee inside each spool rewinds it.`,tags:['cords','shaft'],mode:'pack'},

function renderInsp(){const el=$('insp');let h='';const t=S.tab;
  if(t==='build'){const st=steps();let n=0;h=`<section><div class="grid2"><div class="cell"><small>Footprint</small><span class="big">356²</span> mm</div><div class="cell"><small>Per leg cycle</small><span class="big">${K.advG.toFixed(2)}</span> m</div></div><ol class="steps">${st.map((s,i)=>s.ph?`<li class="ph">${s.ph}</li>`:`<li data-i="${i}" class="${S.step===i?'cur':''}${s.mode&&s.mode!==S.mode||s.bd&&s.bd!==S.body?' off':''}"><span class="no">${++n}</span><span><b>${s.t}</b><span class="d">${s.d}</span></span></li>`).join('')}</ol></section>`;}
  if(t==='parts'){const pr=partsRows(),bm=bom(),tot=bm.reduce((a,r)=>a+r.cost,0);h=`<section><h2>Cut list · 12 mm Baltic birch · 2 of each</h2><div class="tw"><table><thead><tr><th>Part</th><th>Pivots</th><th>Centres</th><th>Layer</th></tr></thead><tbody>${pr.map(r=>`<tr><td>${r.part}<br><span class="muted">${r.form}</span></td><td class="m">${r.joints}</td><td class="m">${r.centres}</td><td class="n">${r.layer}</td></tr>`).join('')}<tr><td>Crank arm<br><span class="muted">12 × 40 steel</span></td><td class="m">O–C</td><td class="m">${J.m} mm</td><td class="n">1</td></tr></tbody></table></div>
    <h2>Buy, salvage, have</h2><div class="tw"><table><thead><tr><th>Item</th><th>Qty</th><th>How</th><th>$</th></tr></thead><tbody>${bm.map(r=>`<tr style="${r.mode&&r.mode!==S.mode||r.bd&&r.bd!==S.body?'opacity:.45':''}"><td>${r.item}<br><span class="muted">${r.where}${r.mode?' · '+MODES[r.mode].name.toLowerCase()+' mode':''}${r.bd?' · Trojan head':''}</span></td><td class="m">${r.qty}</td><td><span class="tag ${r.how}">${r.how}</span></td><td class="n">${r.cost.toFixed(0)}</td></tr>`).join('')}<tr><td><b>Both modes, estimated</b></td><td></td><td></td><td class="n"><b>${tot.toFixed(0)}</b></td></tr></tbody></table></div><p class="muted">Prices are estimates, not quotes.</p></section>`;}
  if(t==='drive'){h=S.mode==='bike'?`<section><div class="grid2"><div class="cell"><small>Legs</small><span class="big">${K.f.toFixed(2)}</span> Hz</div><div class="cell"><small>Your cadence</small><span class="big">${Math.round(K.cad)}</span> rpm</div><div class="cell"><small>Roller → gears</small><span class="big">12:36</span></div><div class="cell"><small>Chain #25</small><span class="big">${K.TS}:${K.TJ}</span></div></div>
    <div class="sl"><label for="cog">Cassette cog</label><select id="cog">${BK.cogs.map(c=>`<option value="${c}"${c===S.cog?' selected':''}>42 × ${c}</option>`).join('')}</select><span class="val">${(BK.C*42/S.cog).toFixed(2)} m</span></div>
    <dl class="kv"><dt>Roller</dt><dd>52 mm on the tyre tread: turns once per ${mm(2*Math.PI*ROLL.r)} of road</dd><dt>Needed per leg turn</dt><dd>${mm(K.adv)}</dd><dt>From the train</dt><dd>${mm(K.advB)}</dd><dt>Hooves</dt><dd>${mm(K.clear)} above the road at their lowest</dd><dt>Your bike</dt><dd>wheelbase 1054, chainstay 450, BB drop 75, 42T × 11–42</dd></dl>
    <p class="muted">The roller reads the tyre’s tread speed, which is road speed, so the legs keep pace whatever gear you ride and keep walking when you coast. No wheel of their own touches the road.</p></section>`
   :`<section><div class="grid2"><div class="cell"><small>Legs</small><span class="big">${K.f.toFixed(2)}</span> Hz</div><div class="cell"><small>Your stride</small><span class="big">${(S.v/K.Sh).toFixed(2)}</span> Hz</div><div class="cell"><small>Spool</small><span class="big">⌀${Math.round(K.spool*1000)}</span> mm</div><div class="cell"><small>Stride length</small><span class="big">${K.Sh.toFixed(2)}</span> m</div></div>
    <div class="sl"><label for="pull">Cord pull per step</label><input id="pull" type="range" min="0.10" max="0.25" step="0.005" value="${S.pull}"><span class="val">${mm(S.pull)}</span></div>
    <dl class="kv"><dt>Per step</dt><dd>one thigh pulls, the legs turn ½ cycle</dd><dt>Per stride</dt><dd>1 leg cycle = ${mm(K.adv)} of hoof travel</dd><dt>One-way bearings</dt><dd>CSK20PP, 20 mm bore, keyed</dd><dt>Hooves</dt><dd>${mm(K.clear)} above level ground at their lowest</dd></dl>
    <p class="muted">Your thighs drive the hind legs through cords and one-way bearings, so the hind legs step only when you step. The spool size sets how far they turn per step; measure your own cord pull and set it here.</p></section>`;}
  if(t==='evolve'){const f=EV.best,ok=(v,b)=>`<td class="${v?'pass':'fail'}">${b}</td>`;h=`<section><h2>Evolve under the platform constraint</h2><p class="muted">Genome: Jansen’s 13 link lengths plus the height of O, whole millimetres. Rejected: any linkage that locks or comes within 12% of a toggle. Rewarded: a flat, long, steady hoof stroke. Penalised: anything above the platform outside the 356 mm square, a crank that hits the rails, hooves that reach the rider’s heels.</p>
    <div class="row"><button class="btn" id="evrun" ${EV.running?'disabled':''}>Run 1000 generations</button><button class="btn ghost" id="evstop" ${EV.running?'':'disabled'}>Stop</button><button class="btn ghost" id="evuse" ${EV.src==='champion'||EV.running?'disabled':''}>Use this leg</button><button class="btn ghost" id="evreset">Back to the built leg</button></div>
    <div class="tw"><table><thead><tr><th>Test</th><th>Value</th><th></th></tr></thead><tbody>
      <tr><td>Above-platform parts inside 356 mm</td><td class="n">${Math.round(f.over||0)} mm over</td>${ok((f.over||0)<1,(f.over||0)<1?'pass':'fail')}</tr>
      <tr><td>Crank clears the rails</td><td class="n">${f.oh-f.m} mm</td>${ok(f.oh-f.m>=25,f.oh-f.m>=25?'pass':'fail')}</tr>
      <tr><td>Hoof to rider’s heel, bicycle, closest</td><td class="n">${heelGap(f)} mm</td>${ok(heelGap(f)>=50,heelGap(f)>=50?'pass':'fail')}</tr>
      <tr><td>Advance per turn</td><td class="n">${Math.round(f.adv)} mm</td><td></td></tr>
      <tr><td>Slip per step</td><td class="n">${Math.round(f.slip)} mm</td><td></td></tr>
      <tr><td>Hoof on ground</td><td class="n">${Math.round(f.d*100)}%</td><td></td></tr>
      <tr><td>Hoof lift</td><td class="n">${Math.round(f.lift)} mm</td><td></td></tr></tbody></table></div>
    <p class="muted">${EV.src==='champion'?'Shown: the leg this page builds, the best of six offline runs of 3000 generations.':'Shown: the best of this run. “Use this leg” rebuilds the parts, layers, drive and drawings around it.'}</p></section>`;}
  if(t==='joints'){h=`<section><h2>Layers, inside to outside</h2><p class="muted">Computed: no two parts on one layer come within a bar width of each other, and no part crosses a bolt or the shaft end on a layer that bolt occupies. Outermost bolt head at ${mm(layerZ(LAYERS.n)+PLY/2+.01)} from centre: inside the 178 mm half-width.</p>
    <div class="tw"><table><thead><tr><th>Layer</th><th>Parts</th><th>From centre</th></tr></thead><tbody>${[...Array(LAYERS.n)].map((_,i)=>{const L=i+1;return `<tr><td class="n">${L}</td><td>${BODIES.filter(b=>LAYERS[b.id]===L).map(b=>b.name+' '+b.j.join('–')).join(', ')}</td><td class="n">${mm(layerZ(L))}</td></tr>`;}).join('')}</tbody></table></div>
    <h2>Pivots</h2><div class="tw"><table><thead><tr><th>Pivot</th><th>Parts (layer)</th><th>Stack</th><th>Bolt</th></tr></thead><tbody>${JOINTS.map(Jn=>{const s=JSTACK[Jn];return `<tr><td class="m">${Jn}</td><td>${s.bodies.map(x=>x.b.name+' ('+x.L+')').join(', ')}${Jn==='B'?', plate':''}</td><td class="n">${mm(s.stack)}</td><td class="m">${Jn==='B'?'M12':'M10'} × ${s.shoulder}</td></tr>`;}).join('')}<tr><td class="m">O</td><td>Crank arm (1) on the shaft end</td><td class="n">—</td><td class="m">key + 2 set screws</td></tr></tbody></table></div></section>`;}
  el.innerHTML=h;wire();}
function wire(){const el=$('insp');el.querySelectorAll('ol.steps li[data-i]').forEach(li=>li.addEventListener('click',()=>{const i=+li.dataset.i,st=steps()[i];if(st.mode&&st.mode!==S.mode)setMode(st.mode);if(st.bd&&st.bd!==S.body)setBody(st.bd);S.step=S.step===i?-1:i;if(R3)R3.highlight(S.step<0?null:steps()[S.step].tags);renderInsp();knock(1800,.02,.12);}));
  const cog=$('cog');if(cog)cog.addEventListener('change',()=>{S.cog=+cog.value;derive();header();renderInsp();});
  const pull=$('pull');if(pull)pull.addEventListener('input',()=>{S.pull=+pull.value;pull.nextElementSibling.textContent=mm(S.pull);derive();header();clearTimeout(pull._t);pull._t=setTimeout(()=>{rebuild();renderInsp();},300);});
  const q=id=>$(id);if(q('evrun'))q('evrun').addEventListener('click',()=>{evStart();showView('evo');renderInsp();});if(q('evstop'))q('evstop').addEventListener('click',()=>{EV.running=false;renderInsp();});
  if(q('evuse'))q('evuse').addEventListener('click',()=>{setLinkage(EV.best.J);planLayers();EV.src='champion';derive();rebuild();header();renderInsp();});
  if(q('evreset'))q('evreset').addEventListener('click',()=>{EV.running=false;EV.best={J:CHAMP,...fitness(CHAMP)};EV.hist=CHAMP_HIST.slice();EV.src='champion';setLinkage(CHAMP);planLayers();derive();rebuild();header();renderInsp();});}
function rebuild(){if(T){R3=build3D();R3.resize();R3.bare(S.bare);if(S.step>=0)R3.highlight(steps()[S.step].tags);}}
function setMode(m){if(m===S.mode)return;S.mode=m;S.v=MODES[m].v;document.querySelectorAll('.mode button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===m));derive();syncSpeed();header();rebuild();renderInsp();knock(700,.06,.25);}
document.querySelectorAll('.mode button').forEach(b=>b.addEventListener('click',()=>{audio();S.step=-1;setMode(b.dataset.m);}));
function showView(v){S.view=v;document.querySelectorAll('.vseg button[data-v]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===v));c3.hidden=v!=='3d';c2.hidden=v==='3d';$('fit').style.display=v==='3d'?'':'none';if(R3)R3.resize();}
document.querySelectorAll('.vseg button[data-v]').forEach(b=>b.addEventListener('click',()=>{showView(b.dataset.v);knock(1500,.015,.1);}));
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{S.tab=b.dataset.t;document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));renderInsp();$('insp').scrollTop=0;if(S.tab==='evolve'&&S.view!=='evo')showView('evo');}));
function setBody(b){S.body=b;document.querySelectorAll('[data-b]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.b===b));rebuild();}
document.querySelectorAll('[data-b]').forEach(b=>b.addEventListener('click',()=>{setBody(b.dataset.b);renderInsp();knock(900,.04,.2);}));
$('snd').addEventListener('click',e=>{S.sound=!S.sound;e.currentTarget.setAttribute('aria-pressed',S.sound);if(S.sound){audio();knock(900,.05,.25);}});
$('xray').addEventListener('click',e=>{S.bare=!S.bare;e.currentTarget.setAttribute('aria-pressed',S.bare);if(R3)R3.bare(S.bare);});
$('fit').addEventListener('click',()=>{if(R3)Object.assign(R3.cam,{th:.6,ph:1.3,r:4.0,tx:-.1,ty:.78});});
derive();
if(T){R3=build3D();const ptr=new Map();let g0=null;
  c3.addEventListener('pointerdown',e=>{c3.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptr.size===2){const [a,b]=[...ptr.values()];g0={pinch:1,d:Math.hypot(a.x-b.x,a.y-b.y),r:R3.cam.r};}else g0={x:e.clientX,y:e.clientY,th:R3.cam.th,ph:R3.cam.ph,mv:false};});
  c3.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId)||!g0)return;ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(g0.pinch){if(ptr.size===2){const [a,b]=[...ptr.values()];R3.cam.r=Math.max(.8,Math.min(9,g0.r*g0.d/Math.max(1,Math.hypot(a.x-b.x,a.y-b.y))));}return;}const dx=e.clientX-g0.x,dy=e.clientY-g0.y;if(Math.hypot(dx,dy)>5)g0.mv=true;R3.cam.th=g0.th-dx*.008;R3.cam.ph=Math.max(.2,Math.min(1.55,g0.ph-dy*.006));});
  c3.addEventListener('pointerup',e=>{const p=ptr.get(e.pointerId);ptr.delete(e.pointerId);if(g0&&!g0.pinch&&!g0.mv&&p){const n=R3.pick(e.clientX,e.clientY);if(n){vstat(n);S.hold=performance.now()+3500;knock(2200,.015,.1);}}if(!ptr.size)g0=null;});
  c3.addEventListener('pointercancel',e=>{ptr.delete(e.pointerId);if(!ptr.size)g0=null;});
  c3.addEventListener('wheel',e=>{e.preventDefault();R3.cam.r=Math.max(.8,Math.min(9,R3.cam.r*Math.exp(e.deltaY*.0012)));},{passive:false});
  $('loading').remove();}else $('loading').textContent='3D library did not load. Side, Plate, Leg and Evolve still work.';
new ResizeObserver(()=>{if(R3)R3.resize();}).observe($('view'));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{readC();if(R3)R3.scene.background=new T.Color(C.view).convertSRGBToLinear();});
let last=performance.now(),lastCon=[false,false],evT=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(EV.running){const t0=performance.now();while(EV.running&&performance.now()-t0<14)evStep();if(now-evT>400){evT=now;if(S.tab==='evolve')renderInsp();}if(!EV.running&&S.tab==='evolve')renderInsp();}
  if(S.playing){S.dist+=S.v*dt;S.ph=((S.ph+S.v*dt/K.advG)%1+1)%1;}
  const con=[0,.5].map(o=>onGround(S.ph+o));if(S.mode==='pack')con.forEach((c,i)=>{if(c&&!lastCon[i])knock(i?520:600,.06,.3);});lastCon=con;
  if(S.view==='3d'&&R3){R3.pose(S.ph);R3.updCam();R3.render();if(!S.hold||now>S.hold){const st=S.step>=0?steps()[S.step]:null;vstat(st?st.t:`3d · ${MODES[S.mode].name.toLowerCase()} mode · blue square = the 356 mm platform · tap a part`);}}
  else if(S.view==='elev')drawElev();else if(S.view==='plate')drawPlate();else if(S.view==='leg')drawLeg();else drawEvo();
  drawScrub();requestAnimationFrame(frame);}
if(R3)R3.resize();syncSpeed();header();renderInsp();requestAnimationFrame(frame);
})();
</script>

</html>
