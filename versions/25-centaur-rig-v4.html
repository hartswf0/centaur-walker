<title>Centaur Rig</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: builder bench on one screen. Left: loadout of part cards. Centre: the sim (or the workshop) with a stride strip; below it the pin stack section and the leg detail. Right: scores, what fails, and the four saved builds side by side. */
:root{
  --paper:#fff; --ink:#000;
  --teal:#19e6c8; --amber:#ffd23f; --red:#ff2e2e; --blue:#3b82f6;
  --mono:'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme:light;
}
*{box-sizing:border-box;border-radius:0}
html,body{height:100%;background:var(--paper);color:var(--ink)}
body{margin:0;font-family:var(--mono);font-size:12px;line-height:1.35;
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-block:6px;
  display:grid;grid-template-rows:auto minmax(0,1fr);gap:6px;overflow:hidden}
header{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;border-bottom:2px solid var(--ink);padding-bottom:5px}
h1{font-size:15px;font-weight:700;letter-spacing:.08em;margin:0;text-transform:uppercase}
.clock{font-variant-numeric:tabular-nums;margin-left:auto}
.lab{display:grid;gap:6px;min-height:0;grid-template-columns:250px minmax(0,1fr) 300px;grid-template-rows:minmax(0,1fr) minmax(0,36%)}
.pane{border:1px solid var(--ink);min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--paper)}
.pane > .bar{display:flex;flex-wrap:wrap;gap:3px 8px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--ink);padding:3px 6px;min-height:24px}
.bar h2{font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin:0;font-weight:700}
.bar .note{font-size:10px;font-style:italic}
.cv{position:relative;flex:1;min-height:0}
.cv canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#loadout{grid-column:1;grid-row:1 / span 2;overflow-y:auto}
#center{grid-column:2;grid-row:1}
.under{grid-column:2;grid-row:2;display:grid;gap:6px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:0}
#stats{grid-column:3;grid-row:1 / span 2;overflow-y:auto}
button{font:inherit;font-size:10px;letter-spacing:.07em;text-transform:uppercase;background:var(--paper);color:var(--ink);border:1px solid var(--ink);padding:3px 6px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
button:hover{background:var(--ink);color:var(--paper)}
button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.seg{display:flex;flex-wrap:wrap;gap:3px}
.icon-play{border-left:8px solid currentColor;border-top:5px solid transparent;border-bottom:5px solid transparent;width:0;height:0;display:inline-block}
.icon-pause{width:8px;height:10px;display:inline-block;position:relative}
.icon-pause::before,.icon-pause::after{content:"";position:absolute;top:0;width:3px;height:10px;background:currentColor}
.icon-pause::before{left:0}.icon-pause::after{right:0}
.icon-spk{width:10px;height:10px;display:inline-block;position:relative}
.icon-spk::before{content:"";position:absolute;left:0;top:3px;width:4px;height:4px;background:currentColor}
.icon-spk::after{content:"";position:absolute;left:3px;top:0;border-right:5px solid currentColor;border-top:5px solid transparent;border-bottom:5px solid transparent;height:0}
/* variants */
.vars{display:flex;gap:3px;flex-wrap:wrap}
.var{display:grid;grid-template-columns:auto auto;gap:0 6px;align-items:center;text-transform:none;letter-spacing:0;font-size:11px;padding:2px 6px}
.var .vd{width:8px;height:8px;border:1px solid currentColor}
/* loadout */
.slot{border-bottom:1px solid var(--ink)}
.slot > .head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px;padding:5px 8px;cursor:pointer;align-items:baseline}
.slot > .head:hover{background:rgba(59,130,246,.08)}
.slot .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.slot .cur{font-weight:700;text-align:right}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:0 8px 8px}
.card{border:1px solid var(--ink);padding:5px 6px;cursor:pointer;display:flex;flex-direction:column;gap:2px;background:var(--paper);font:inherit;text-align:left;text-transform:none;letter-spacing:0;font-size:11px;align-items:stretch}
.card b{font-size:11px}
.card .d{font-size:10px;line-height:1.3}
.card[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.card:hover{outline:2px solid var(--blue);outline-offset:-2px;background:var(--paper);color:var(--ink)}
.card[aria-pressed="true"]:hover{background:var(--ink);color:var(--paper)}
.tune .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;padding:2px 8px;align-items:baseline}
.row .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.num{cursor:ew-resize;user-select:none;border-bottom:1px dashed var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.num:hover{background:var(--ink);color:var(--paper)}
.sec h3{font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin:0;padding:6px 8px 3px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.sec h3 span{font-weight:400;letter-spacing:0;text-transform:none;font-style:italic}
.sec{border-bottom:1px solid var(--ink)}
.sec:last-child{border-bottom:0}
.score{display:grid;grid-template-columns:7.2em minmax(0,1fr) auto;gap:6px;padding:2px 8px;align-items:center}
.meter{height:9px;border:1px solid var(--ink);position:relative}
.meter i{position:absolute;inset:0 auto 0 0;display:block}
.ok{background:var(--teal)} .warn{background:var(--amber)} .bad{background:var(--red)}
.fail{display:grid;grid-template-columns:3.2em minmax(0,1fr);gap:6px;padding:3px 8px;border-top:1px solid var(--ink);cursor:pointer;font-size:11px}
.fail:hover{outline:1px solid var(--blue);outline-offset:-1px}
.fail .u{font-weight:700;font-variant-numeric:tabular-nums;text-align:center}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:2px 5px;text-align:right;font-size:11px}
th{font-size:10px;font-weight:700;border-bottom:1px solid var(--ink)}
td:first-child,th:first-child{text-align:left}
td.on,th.on{background:rgba(59,130,246,.12)}
.led{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:6px;padding:2px 8px;align-items:center;font-size:11px}
.dot{width:9px;height:9px;border:1px solid var(--ink)}
/* workshop */
#shop{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
#shop[hidden]{display:none!important}
#shopSide{border-left:1px solid var(--ink);overflow-y:auto;font-size:11px}
#shopSide h4{font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin:0;padding:6px 8px 2px}
#shopSide ol,#shopSide ul{margin:0;padding:0 8px 6px 26px}
#shopSide li{margin:2px 0}
#shopSide table td{font-size:11px}
.cvwrap{position:relative;min-height:0}
@media (max-width:1100px), (max-height:640px){
  body{overflow:auto;height:auto}
  .lab{grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  #loadout,#center,.under,#stats{grid-column:1;grid-row:auto}
  #center{height:64vh;min-height:340px}
  .under{grid-template-columns:minmax(0,1fr)}
  .under .pane{height:320px}
  #loadout,#stats{overflow:visible}
  #shop{grid-template-columns:minmax(0,1fr);grid-template-rows:60% 40%}
}
</style>

<header>
  <h1>Centaur Rig</h1>
  <div class="seg">
    <button id="play" aria-label="Pause"><span class="icon-pause"></span><span>Pause</span></button>
    <button id="slow" aria-pressed="false">Slow</button>
    <button id="sound" aria-pressed="false"><span class="icon-spk"></span><span>Sound</span></button>
  </div>
  <div class="seg" role="group" aria-label="Mode">
    <button data-mode="sim" aria-pressed="true">Simulate</button>
    <button data-mode="shop" aria-pressed="false">Build it</button>
  </div>
  <div class="vars" id="vars" role="group" aria-label="Saved builds"></div>
  <div class="clock" id="clock"></div>
</header>

<div class="lab">
  <aside class="pane" id="loadout" aria-label="Loadout">
    <div class="bar"><h2>Loadout</h2><span class="note">tap a slot to swap</span></div>
    <div id="slots"></div>
    <div class="sec tune"><h3>Tune <span>drag the numbers</span></h3><div id="tune"></div></div>
  </aside>

  <section class="pane" id="center">
    <div class="bar"><h2 id="centerTitle">Side view</h2>
      <div class="seg" id="simBtns">
        <button data-ov="foam" aria-pressed="true">Plates</button>
        <button data-ov="force" aria-pressed="true">Forces</button>
        <button data-ov="slop" aria-pressed="true">Slop</button>
        <button data-ov="heat" aria-pressed="true">Friction heat</button>
        <button id="horseWalk">Horse walk timing</button>
      </div>
    </div>
    <div class="cv">
      <canvas id="stage" aria-label="Side view of the centaur walking. Drag to scrub."></canvas>
      <div id="shop" hidden>
        <div class="cvwrap"><canvas id="sheets" aria-label="Parts nested on your foam and plywood sheets"></canvas></div>
        <div id="shopSide"></div>
      </div>
    </div>
  </section>

  <div class="under">
    <section class="pane">
      <div class="bar"><h2>Stack through pin</h2><div class="seg" id="pinBtns"></div></div>
      <div class="cv"><canvas id="stack" aria-label="Cross-section of the selected pin: plates, washers, spacers, tolerances, play and friction"></canvas></div>
    </section>
    <section class="pane">
      <div class="bar"><h2>Near hind leg</h2><div class="seg"><button id="undo">Undo</button><button id="reset">Holy numbers</button></div></div>
      <div class="cv"><canvas id="leg" aria-label="Near hind leg: plates, holes with clearance, forces, friction heat and foot scatter. Drag a bar to change its length."></canvas></div>
    </section>
  </div>

  <aside class="pane" id="stats" aria-label="Scores">
    <div class="sec"><h3>This build <span id="buildName"></span></h3><div id="scores"></div></div>
    <div class="sec"><h3>Reads as legs <span>vs yours</span></h3><div id="ledger"></div></div>
    <div class="sec"><h3>Gives out first <span>use ≥ 1 fails</span></h3><div id="fails"></div></div>
    <div class="sec"><h3>Builds compared <span>tap a column</span></h3><div id="compare"></div></div>
  </aside>
</div>

<script>
(() => {
'use strict';
const COL = {paper:'#fff', ink:'#000', teal:'#19e6c8', amber:'#ffd23f', red:'#ff2e2e', blue:'#3b82f6', tint:'rgba(59,130,246,.10)', ghost:'rgba(59,130,246,.35)', faint:'rgba(0,0,0,.16)', foam:'rgba(0,0,0,.05)', wood:'#f3ead8'};
const FONT = "'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace";
const HOLY = {a:38, b:41.5, c:39.3, d:40.1, e:55.8, f:39.4, g:36.7, h:65.7, i:49, j:50, k:61.9, l:7.8, m:15};
const KEYS = ['a','b','c','d','e','f','g','h','i','j','k','l','m'];
const BARS = {a:['B','A'], l:['A','O'], m:['O','M'], j:['M','J1'], b:['B','J1'], e:['J1','J3'], d:['B','J3'],
              c:['B','J2'], k:['M','J2'], f:['J3','J4'], g:['J2','J4'], h:['J4','F'], i:['J2','F']};
const JOINT_DEF = {J1:['B','b','M','j',1], J2:['B','c','M','k',-1], J3:['B','d','J1','e',1], J4:['J3','f','J2','g',-1], F:['J4','h','J2','i',-1]};
const ORDER = ['J1','J2','J3','J4','F'];
const N = 360, TAU = Math.PI * 2, G0 = 9.81;
const LINKS = {j:['M','J1'], k:['M','J2'], c:['B','J2'], f:['J3','J4']};

// ---------- part cards. Numbers are typical published values; calibrate against your own material. ----------
const CARDS = {
  plate: {label:'Plates', opts:{
    eps:  {name:'EPS 25', d:'Your foam board as it is.', t:25, tTol:1.0, rho:16, E:4e6, crush:70e3, tens:150e3, wearK:.02, mu:.55},
    skin: {name:'EPS + skin', d:'Mesh tape and joint compound both faces.', t:27, tTol:1.4, rho:16, E:4e6, crush:70e3, tens:150e3, wearK:.006, mu:.45, skin:true},
    spar: {name:'EPS + spar', d:'6 mm ply strip on edge inside each link.', t:25, tTol:1.0, rho:16, E:4e6, crush:70e3, tens:150e3, wearK:.02, mu:.55, spar:true},
    ply:  {name:'Ply 6', d:'Sold as 6 mm, measures 5.2–5.8.', t:5.5, tTol:.3, rho:600, E:6e9, crush:12e6, tens:25e6, wearK:.0004, mu:.4, ply:true}
  }},
  hole: {label:'Holes', opts:{
    raw:    {name:'Plain hole', d:'Pin straight through the plate.', mu:.5},
    puck:   {name:'Wood puck', d:'Hardwood disc glued into the foam.', mu:.35},
    tang:   {name:'Puck + tang', d:'Puck on a ply strip glued 150 mm in.', mu:.35},
    sleeve: {name:'Printed sleeve', d:'PETG tube through puck, long bearing.', mu:.18}
  }},
  pin: {label:'Pins', opts:{
    dowel:    {name:'10 mm dowel', d:'Hardwood. Diameters vary.', dia:10, dTol:.25, mu:.35},
    bolt:     {name:'1/4 in bolt', d:'Threads ride in the hole.', dia:6.35, dTol:.08, mu:.32},
    shoulder: {name:'M8 shoulder', d:'Smooth ground shank.', dia:8, dTol:.02, mu:.2},
    tube:     {name:'12 mm brass', d:'Tube with a bolt inside.', dia:12, dTol:.05, mu:.16}
  }},
  washer: {label:'Washers', opts:{
    none:   {name:'None', d:'Plate rubs on plate.', t:0, od:0, mu:null},
    nylon:  {name:'Nylon', d:'1.5 mm, 24 mm across.', t:1.5, od:24, mu:.22},
    uhmw:   {name:'UHMW', d:'1.5 mm slick plastic, 30 mm.', t:1.5, od:30, mu:.1},
    fender: {name:'Fender', d:'Steel 1.2 mm, 40 mm wide.', t:1.2, od:40, mu:.4}
  }},
  nut: {label:'Nut', opts:{
    loose: {name:'Finger loose', d:'Free to rattle.', clamp:4},
    snug:  {name:'Snug', d:'Touching, still turns.', clamp:25},
    tight: {name:'Tight', d:'Clamped hard.', clamp:90}
  }},
  legs: {label:'Legs per side', opts:{
    one: {name:'1 per side', d:'Two hind legs, 180° apart.', n:1},
    two: {name:'2 per side', d:'Four legs; stacks double.', n:2}
  }},
  make: {label:'Made by', opts:{
    hand:  {name:'Hand cut', d:'Knife, saw, hand drill.', holeTol:.5, posTol:1.5},
    jig:   {name:'Hand + jig', d:'Printed template, drill guide.', holeTol:.25, posTol:.5},
    cnc:   {name:'CNC / laser', d:'Machine cut and drilled.', holeTol:.1, posTol:.15}
  }}
};
const SLOT_ORDER = ['plate','hole','pin','washer','nut','legs','make'];
const TUNE = [
  ['Scale', 'sigma', .01, 4, 16, 2, 'mm/unit'],
  ['Plate width', 'w', .2, 20, 160, 0, 'mm'],
  ['Designed clearance', 'c0', .005, 0, 2, 2, 'mm'],
  ['Rump mass', 'rump', .02, 0, 15, 1, 'kg'],
  ['Feet carry', 'share', .2, 10, 100, 0, '%'],
  ['Drawbar', 'Lb', 2, 450, 1600, 0, 'mm'],
  ['Gap between legs', 'gap', .5, 0, 300, 0, 'mm'],
  ['Strides walked', 'strides', 20, 0, 60000, 0, ''],
  ['Draw slop at', 'mag', .05, 1, 40, 0, '×']
];
const base = () => ({plate:'eps', hole:'puck', pin:'dowel', washer:'none', nut:'snug', legs:'one', make:'hand', c0:.3, w:70, sigma:9.75, rump:2, share:60, Lb:760, gap:30, strides:0, mag:8, tol:'nom', phi0:null, G:{...HOLY}});
const VARS = [
  {name:'A', title:'Foam as it is', B: base()},
  {name:'B', title:'Skinned + tangs', B: Object.assign(base(), {plate:'skin', hole:'tang', washer:'nylon', make:'jig'})},
  {name:'C', title:'Foam + spars, slick', B: Object.assign(base(), {plate:'spar', hole:'sleeve', pin:'shoulder', washer:'uhmw', make:'jig'})},
  {name:'D', title:'All ply', B: Object.assign(base(), {plate:'ply', hole:'raw', pin:'bolt', washer:'nylon', make:'cnc', w:40})}
];
let active = 0;
const B = () => VARS[active].B;
const S = {t: .3, playing: true, slow: false, mode: 'sim', height: 1750, cadence: 54, live: null, hist: [], selPin: 'J2', openSlot: 'plate', hoverBar: null, drag: null,
  ov: {foam: true, force: true, slop: true, heat: true}};
const cur = () => S.live || B().G;

// ---------- linkage ----------
function cc(P, r0, Q, r1, s) {
  const dx = Q.x - P.x, dy = Q.y - P.y, d = Math.hypot(dx, dy);
  if (d < 1e-9 || d > r0 + r1 || d < Math.abs(r0 - r1)) return null;
  const a = (r0*r0 - r1*r1 + d*d) / (2*d), h = Math.sqrt(Math.max(0, r0*r0 - a*a));
  const ux = dx/d, uy = dy/d, mx = P.x + a*ux, my = P.y + a*uy;
  return {x: mx - s*h*uy, y: my + s*h*ux};
}
function solve(G, th) {
  const p = {O:{x:0,y:0}, B:{x:-G.a,y:-G.l}, A:{x:0,y:-G.l}, M:{x:G.m*Math.cos(th), y:G.m*Math.sin(th)}};
  for (const J of ORDER) { const [p0, r0, p1, r1, s] = JOINT_DEF[J]; const q = cc(p[p0], G[r0], p[p1], G[r1], s); if (!q) { p.fail = J; return p; } p[J] = q; }
  return p;
}
const kIdx = ang => ((Math.round(ang / TAU * N) % N) + N) % N;
const uv = (a, b) => { const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy) || 1; return {x: dx / L, y: dy / L}; };
const cr = (a, b) => a.x * b.y - a.y * b.x;
const sub = (a, b) => ({x: a.x - b.x, y: a.y - b.y});
const add = (a, b) => ({x: a.x + b.x, y: a.y + b.y});
const mul = (a, s) => ({x: a.x * s, y: a.y * s});
const len = a => Math.hypot(a.x, a.y);
function analyze(G) {
  const fx = new Float64Array(N), fy = new Float64Array(N), ok = new Uint8Array(N);
  let minY = Infinity, maxY = -Infinity, minX = Infinity, maxX = -Infinity, topY = -Infinity, valid = 0;
  for (let k = 0; k < N; k++) {
    const p = solve(G, TAU * k / N); if (!p.F) continue;
    ok[k] = 1; fx[k] = p.F.x; fy[k] = p.F.y; valid++;
    minY = Math.min(minY, p.F.y); maxY = Math.max(maxY, p.F.y);
    for (const n of ['B','J1','J2','J3','J4','F','M']) { minX = Math.min(minX, p[n].x); maxX = Math.max(maxX, p[n].x); topY = Math.max(topY, p[n].y); }
  }
  if (!valid) { minY = -90; maxY = -70; minX = -80; maxX = 15; topY = 30; }
  const tol = Math.max(.6, .05 * (maxY - minY)), contact = new Uint8Array(N);
  for (let k = 0; k < N; k++) contact[k] = ok[k] && fy[k] < minY + tol ? 1 : 0;
  let sv = 0, nv = 0;
  for (let k = 0; k < N; k++) { const n = (k + 1) % N; if (contact[k] && contact[n]) { sv += fx[n] - fx[k]; nv++; } }
  return {fx, fy, ok, contact, minY, maxY, minX, maxX, topY, spin: sv <= 0 ? 1 : -1, advance: nv ? Math.abs(sv / nv) * N : 0, duty: contact.reduce((s, c) => s + c, 0) / N, locked: (N - valid) / N};
}
function statics(P, W) {
  if (!P.F || W <= 0) return null;
  const uk = uv(P.J2, P.M), uc = uv(P.J2, P.B), uf = uv(P.J4, P.J3), R = {x: 0, y: W};
  const den = cr(sub(P.J4, P.J2), uf); if (Math.abs(den) < 1e-9) return null;
  const Ff = -cr(sub(P.F, P.J2), R) / den;
  const rx = -(Ff * uf.x + R.x), ry = -(Ff * uf.y + R.y), det = uk.x * uc.y - uk.y * uc.x;
  const Fk = (rx * uc.y - ry * uc.x) / det, Fc = (uk.x * ry - uk.y * rx) / det;
  const uj = uv(P.J1, P.M), uf3 = uv(P.J3, P.J4);
  const Fj = -Ff * cr(sub(P.J3, P.B), uf3) / cr(sub(P.J1, P.B), uj);
  const Bup = mul(add(mul(uj, Fj), mul(uf3, Ff)), -1);
  const Fs = add(mul(uv(P.M, P.J1), Fj), mul(uv(P.M, P.J2), Fk));
  const J2v = add(mul(uk, Fk), mul(uc, Fc)), frameB = add(Bup, mul(uv(P.J2, P.B), Fc));
  return {Fj, Fk, Fc, Ff, tauU: -cr(P.M, Fs),

function makeNum(el, get, set, step, min, max, dec, onLive, onCommit) {
  el.classList.add('num'); el.tabIndex = 0; el.setAttribute('role', 'slider');

  let d = null;
  el.addEventListener('pointerdown', e => { el.setPointerCapture(e.pointerId); d = {x: e.clientX, v: get()}; e.preventDefault(); });
  el.addEventListener('pointermove', e => { if (!d) return; set(clamp(+(d.v + (e.clientX - d.x) * step).toFixed(dec), min, max)); show(); onLive(); });
  el.addEventListener('pointerup', () => { if (d) onCommit(); d = null; });
  el.addEventListener('keydown', e => { let dv = 0; const m = e.shiftKey ? 10 : 1; if (e.key === 'ArrowUp' || e.key === 'ArrowRight') dv = step * 10 * m; if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') dv = -step * 10 * m; if (!dv) return; e.preventDefault(); set(clamp(+(get() + dv).toFixed(dec), min, max)); show(); onCommit(); });

// ---------- workshop ----------
const sheetsC = document.getElementById('sheets');

function partOutline(part) {

function nest() {

function drawSheets() {

    x.fillStyle = sheet.mat === 'ply' ? COL.wood : '#f7f7f7'; x.fillRect(ox, oy, st.w * s, st.h * s); x.strokeStyle = COL.ink; x.lineWidth = 1; x.strokeRect(ox, oy, st.w * s, st.h * s);
    x.fillStyle = COL.ink; x.textAlign = 'left'; x.fillText(`${st.name} #${si + 1 - (sheet.mat === 'ply' ? NEST.foam.length : 0)}`, ox, oy - 8);

function nearestDrill(d) { return DRILLS.reduce((b, q) => (q >= d - .05 && (b === null || q < b)) ? q : b, null) || DRILLS[DRILLS.length - 1]; }

    [b.pin === 'dowel' ? 'Wood screw + washer to cap each dowel end' : 'Nylock nut', nuts],
    WA.t ? [`${WA.name} washer ${WA.od} mm`, washers] : null,
    spacers ? [`Spacer ${fmt(PL.ply ? 5.5 : PL.t, 1)} mm thick`, spacers] : null,
    pucks ? [`Hardwood puck Ø${fmt(E.puckD, 0)} × ${PL.t} mm`, pucks] : null,
    b.hole === 'tang' ? ['Ply tang strip 150 × ' + fmt(b.w * .6, 0) + ' mm', 8 * nLegs] : null,
    b.hole === 'sleeve' ? [`PETG sleeve ${fmt(holeD, 1)} bore, ${PL.t + 10} long`, 13 * nLegs] : null,
    PL.spar ? ['6 mm ply spar strips, on edge in each link', 4 * nLegs] : null,
    ['Crank shaft: threaded rod or 10 mm steel rod', 1],

    `Cut ${foamN ? `${foamN} EPS board${foamN > 1 ? 's' : ''}` : 'no foam'} and ${plyN} ply panel${plyN > 1 ? 's' : ''} as laid out. Foam: a fresh snap blade in two passes, or a hot wire. Never solvent glue or spray paint on EPS; it dissolves.`,
    !PL.ply && b.hole !== 'raw' ? `Bore each hole position to Ø${fmt(E.puckD, 0)} with a hole saw run backwards (it melts less), glue in a hardwood puck flush with both faces, let it cure.` : `Mark hole centres with a printed template so position error stays near ±${CARDS.make.opts[b.make].posTol} mm.`,

function hullPts(points) { const P = points.slice().sort((a, b) => a.x - b.x || a.y - b.y), c = (o, a, b) => (a.x - o.x)*(b.y - o.y) - (a.y - o.y)*(b.x - o.x), lo = [], up = []; for (const p of P) { while (lo.length >= 2 && c(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); } for (let i = P.length - 1; i >= 0; i--) { const p = P[i]; while (up.length >= 2 && c(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); } up.pop(); lo.pop(); return lo.concat(up); }

// ---------- sound: knocks click, faces hiss, foam squeaks, feet thud ----------
const SND = {on: false, ctx: null, prevI: null};
function soundInit() {
  const C = new (window.AudioContext || window.webkitAudioContext)(); SND.ctx = C;
  const master = C.createGain(); master.gain.value = .5; master.connect(C.destination); SND.master = master;
  const buf = C.createBuffer(1, C.sampleRate * 2, C.sampleRate), d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; SND.noise = buf;
  const src = C.createBufferSource(); src.buffer = buf; src.loop = true;
  const bp = C.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2400; bp.Q.value = .8;
  const hg = C.createGain(); hg.gain.value = 0; src.connect(bp); bp.connect(hg); hg.connect(master); src.start(); SND.hiss = hg; SND.hissF = bp;
  const osc = C.createOscillator(); osc.type = 'triangle'; osc.frequency.value = 1100; const lfo = C.createOscillator(); lfo.frequency.value = 23; const lg = C.createGain(); lg.gain.value = 60; lfo.connect(lg); lg.connect(osc.frequency);
  const sg = C.createGain(); sg.gain.value = 0; osc.connect(sg); sg.connect(master); osc.start(); lfo.start(); SND.squeak = sg; SND.squeakOsc = osc;
}
const PIN_F = {O: 260, B: 380, M: 520, J1: 700, J2: 900, J3: 1150, J4: 1500};
function click(freq, gain) {
  const C = SND.ctx, s = C.createBufferSource(); s.buffer = SND.noise;

  const g = C.createGain(), t = C.currentTime; g.gain.setValueAtTime(clamp(gain, 0, 1.2), t); g.gain.exponentialRampToValueAtTime(.001, t + .06);

}
function thud(gain) {

  o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(45, t + .15);
  g.gain.setValueAtTime(clamp(gain, 0, 1), t); g.gain.exponentialRampToValueAtTime(.001, t + .2);

function soundTick() {
  if (!SND.on || !SND.ctx || !E) return;

  const b = B();
  if (S.playing && prev !== null && prev !== i) {
    for (const pn of PINS) { const st = E.pins[pn.id]; for (const ki of st.knockAt) for (let o = 0; o < E.offs.length; o++) { const kk = (ki + (o ? Math.round(E.offs[o]) : 0)) % N; if (crossed(kk)) flash[pn.id] = 1, click(PIN_F[pn.id] * (1 + st.c * .3), .08 + st.c * .5 * Math.min(1, st.maxF / 80)); } }
    E.offs.forEach((o, li) => { for (let q = 0; q < N; q++) { const k = (E.tIdx[q] + o) % N, kp = (E.tIdx[(q - 1 + N) % N] + o) % N; if (E.A.contact[k] && !E.A.contact[kp] && crossed(q)) thud(.25 + E.totalKg * .05); } });
  }
  const fNow = S.playing ? Math.min(1, E.fric[i] / Math.max(p95(E.fric), 2)) : 0;
  const t = SND.ctx.currentTime;
  SND.hiss.gain.setTargetAtTime(clamp(fNow * .35, 0, .4), t, .03);

  SND.squeak.gain.setTargetAtTime(foamOnFoam && S.playing ? clamp(fNow * .12, 0, .12) : 0, t, .03);

document.getElementById('sound').onclick = async () => {
  SND.on = !SND.on; document.getElementById('sound').setAttribute('aria-pressed', String(SND.on));
  if (SND.on && !SND.ctx) { try { soundInit(); } catch (e) { SND.on = false; } }
  if (SND.ctx) { if (SND.on) await SND.ctx.resume(); else SND.ctx.suspend(); }
};

renderLoadout();
