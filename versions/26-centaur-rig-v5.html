<title>Centaur Rig</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: phone first. Top half is always the sim: the leg (or rig, or planes) on the left, the selected joint up close on the right, a stride strip below. Bottom half is tabs and controls, scrolling inside itself. On a wide screen the controls move to a right column. */
:root{
  --paper:#fff; --ink:#000;
  --teal:#19e6c8; --amber:#ffd23f; --red:#ff2e2e; --blue:#3b82f6;
  --mono:'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme:light;
}
*{box-sizing:border-box;border-radius:0}
html,body{height:100%;background:var(--paper);color:var(--ink)}
body{margin:0;font-family:var(--mono);font-size:12px;line-height:1.35;overflow:hidden;
  padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px));padding-block:4px;
  display:grid;grid-template-rows:minmax(0,54fr) minmax(0,46fr);gap:4px}
@media (min-width:900px){ body{grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr) 400px} }
.top{display:grid;grid-template-rows:auto minmax(0,1fr) auto;border:1px solid var(--ink);min-height:0;min-width:0}
.hd{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding:3px 5px;border-bottom:1px solid var(--ink)}
.hd h1{font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin:0;font-weight:700}
.views{display:grid;grid-template-columns:minmax(0,58fr) minmax(0,42fr);min-height:0}
.cv{position:relative;min-height:0;min-width:0}
.cv + .cv{border-left:1px solid var(--ink)}
.cv canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#strip{height:40px;position:relative;border-top:1px solid var(--ink)}
#strip canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.panel{border:1px solid var(--ink);display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;min-width:0}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--ink);overflow-x:auto}
.tabs button{border:0;border-right:1px solid var(--ink);flex:1 0 auto;padding:8px 8px}
.body{overflow-y:auto;min-height:0;padding:0 0 10px}
button{font:inherit;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--paper);color:var(--ink);border:1px solid var(--ink);padding:4px 7px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;min-height:28px}
button:hover{background:var(--ink);color:var(--paper)}
button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.seg{display:flex;flex-wrap:wrap;gap:3px}
.icon-play{border-left:8px solid currentColor;border-top:5px solid transparent;border-bottom:5px solid transparent;width:0;height:0;display:inline-block}
.icon-pause{width:8px;height:10px;display:inline-block;position:relative}
.icon-pause::before,.icon-pause::after{content:"";position:absolute;top:0;width:3px;height:10px;background:currentColor}
.icon-pause::before{left:0}.icon-pause::after{right:0}
.icon-spk{width:10px;height:10px;display:inline-block;position:relative}
.icon-spk::before{content:"";position:absolute;left:0;top:3px;width:4px;height:4px;background:currentColor}
.icon-spk::after{content:"";position:absolute;left:3px;top:0;border-right:5px solid currentColor;border-top:5px solid transparent;border-bottom:5px solid transparent;height:0}
h3{font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin:0;padding:8px 8px 4px;font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
h3 span{font-weight:400;letter-spacing:0;text-transform:none;font-style:italic}
.pins{display:flex;gap:3px;padding:6px 8px 2px;flex-wrap:wrap}
.pins button{min-width:44px;justify-content:center;position:relative}
.pins button i{position:absolute;left:0;right:0;bottom:0;height:4px}
.lead{padding:2px 8px 6px;font-size:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:5px;padding:0 8px}
.card{border:1px solid var(--ink);padding:6px;cursor:pointer;display:grid;gap:3px;background:var(--paper);font:inherit;text-align:left;text-transform:none;letter-spacing:0;font-size:11px;align-items:start;min-height:0}
.card b{font-size:12px}
.card .src{font-style:italic;font-size:10px}
.card .nums{display:grid;grid-template-columns:auto 1fr;gap:0 6px;font-variant-numeric:tabular-nums}
.card .nums span:nth-child(2n){text-align:right;font-weight:700}
.card .tag{justify-self:start;padding:0 4px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.card[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:-3px;background:#f2f6ff;color:var(--ink)}
.card[aria-pressed="true"]:hover{background:#f2f6ff;color:var(--ink)}
.card:hover{background:var(--paper);color:var(--ink)}
.card:hover{outline:2px solid var(--blue);outline-offset:-2px}
.ok{background:var(--teal)} .warn{background:var(--amber)} .bad{background:var(--red)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;padding:4px 8px;align-items:baseline;border-top:1px solid #000}
.row .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.num{cursor:ew-resize;user-select:none;border-bottom:1px dashed var(--ink);font-weight:700;font-variant-numeric:tabular-nums;padding:2px 2px;touch-action:none}
.num:hover{background:var(--ink);color:var(--paper)}
.note{padding:4px 8px;font-size:11px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:3px 6px;text-align:right;font-size:11px;border-top:1px solid #000}
th{font-size:10px;font-weight:700}
td:first-child,th:first-child{text-align:left}
td.on,th.on{background:rgba(59,130,246,.14)}
.led{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:6px;padding:4px 8px;align-items:center;border-top:1px solid #000}
.dot{width:10px;height:10px;border:1px solid var(--ink)}
.vars{display:flex;gap:3px;flex-wrap:wrap;padding:6px 8px}
ol.steps{margin:0;padding:0 8px 0 28px}
ol.steps li{margin:4px 0}
</style>

<section class="top" aria-label="Simulation">
  <div class="hd">
    <h1>Centaur Rig</h1>
    <div class="seg">
      <button id="play" aria-label="Pause"><span class="icon-pause"></span></button>
      <button id="slow" aria-pressed="false">Slow</button>
      <button id="sound" aria-pressed="false" aria-label="Sound"><span class="icon-spk"></span></button>
    </div>
    <div class="seg" role="group" aria-label="View">
      <button data-view="leg" aria-pressed="true">Leg</button>
      <button data-view="rig" aria-pressed="false">Rig</button>
      <button data-view="planes" aria-pressed="false">Planes</button>
    </div>
  </div>
  <div class="views">
    <div class="cv"><canvas id="sim" aria-label="Simulation. Tap a pin to choose its joint. Drag a bar to change its length."></canvas></div>
    <div class="cv"><canvas id="joint" aria-label="The selected joint up close, under load"></canvas></div>
  </div>
  <div id="strip"><canvas id="stripC" aria-label="One stride: feet down, knocks, friction"></canvas></div>
</section>

<section class="panel" aria-label="Controls">
  <div class="tabs" role="tablist">
    <button data-tab="joints" aria-pressed="true">Joints</button>
    <button data-tab="links" aria-pressed="false">Links</button>
    <button data-tab="fit" aria-pressed="false">Fit</button>
    <button data-tab="rig" aria-pressed="false">Rig</button>
    <button data-tab="build" aria-pressed="false">Build</button>
  </div>
  <div class="body" id="body"></div>
</section>

<script>
(() => {
'use strict';
const COL = {paper:'#fff', ink:'#000', teal:'#19e6c8', amber:'#ffd23f', red:'#ff2e2e', blue:'#3b82f6', tint:'rgba(59,130,246,.10)', ghost:'rgba(59,130,246,.30)', faint:'rgba(0,0,0,.16)', foam:'rgba(0,0,0,.05)', wood:'#efe2c6', pvc:'#f4f4f4'};
const FONT = "'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace";
const HOLY = {a:38, b:41.5, c:39.3, d:40.1, e:55.8, f:39.4, g:36.7, h:65.7, i:49, j:50, k:61.9, l:7.8, m:15};
const KEYS = ['a','b','c','d','e','f','g','h','i','j','k','l','m'];
const BARS = {a:['B','A'], l:['A','O'], m:['O','M'], j:['M','J1'], b:['B','J1'], e:['J1','J3'], d:['B','J3'], c:['B','J2'], k:['M','J2'], f:['J3','J4'], g:['J2','J4'], h:['J4','F'], i:['J2','F']};
const JOINT_DEF = {J1:['B','b','M','j',1], J2:['B','c','M','k',-1], J3:['B','d','J1','e',1], J4:['J3','f','J2','g',-1], F:['J4','h','J2','i',-1]};
const ORDER = ['J1','J2','J3','J4','F'];
const N = 360, TAU = Math.PI * 2, G0 = 9.81;
const LINKS = {j:['M','J1'], k:['M','J2'], c:['B','J2'], f:['J3','J4']};

// ---------- joints you can actually get. Values are typical estimates; measure your own. ----------
const JT = {
  brad:    {name:'Brad in card', src:'brass paper fasteners', d:3, c:.3, ctol:.2, bear:3, cap:15, mu:.4, maxSwing:999, maxPlates:4, wearK:.01, cost:.05,
            how:'Punch the hole with an awl, push the brad through every layer, fold the legs flat.', breaks:'Card tears from the hole outward; the brad legs open.'},
  rivet:   {name:'Trellis rivet', src:'expandable plastic trellis', d:5, c:.25, ctol:.15, bear:10, cap:60, mu:.25, maxSwing:999, maxPlates:2, wearK:.002, cost:.1, premade:true,
            how:'Cut the trellis so a joint you need is already riveted. For new joints drill 5 mm and use a nylon push rivet.', breaks:'Holds two strips only. Under sideways load the rivet head pops through the plastic.'},
  scissor: {name:'Scissor pivot', src:'giant plastic scissors', d:5, c:.1, ctol:.05, bear:12, cap:150, mu:.2, maxSwing:999, maxPlates:2, wearK:.0005, cost:4, premade:true,
            how:'Use the scissor pivot as it is: the two blades are a ready joint with a boss. Cut the blades to length around it.', breaks:'Only two plates; the blade plastic cracks around the cut ends.'},
  puck:    {name:'Wood puck + dowel', src:'foam board, hardwood dowel', d:10, c:.4, ctol:.3, bear:25, cap:100, mu:.35, maxSwing:999, maxPlates:5, wearK:.006, cost:.5, drilled:true,
            how:'Bore the foam with a hole saw, glue a hardwood puck flush (foam-safe glue), drill the puck for the dowel.', breaks:'The puck presses into the foam and the hole goes oval.'},
  pvc:     {name:'PVC pipe in tee', src:'1/2 in pipe, tees, couplers', d:21.3, c:.5, ctol:.3, bear:35, cap:300, mu:.3, maxSwing:999, maxPlates:5, wearK:.001, cost:1.5, tube:true,
            how:'The axle is a short length of pipe; each link ends in a tee or coupler that turns on it. Sand the pipe so the tee turns freely.', breaks:'Tees split at the socket if forced; loose fits rattle.'},
  bush:    {name:'Bolt + nylon bush', src:'ply or steel plate, M8 bolt', d:8, c:.12, ctol:.05, bear:12, cap:400, mu:.15, maxSwing:999, maxPlates:5, wearK:.0002, cost:1, drilled:true,
            how:'Drill for the bushing, press it in, run an M8 bolt with washers and a nylock nut set snug.', breaks:'Thin plates rock on the bolt; the bush walks out if not flanged.'},
  clevis:  {name:'Clevis + sleeve', src:'fork plates, shoulder bolt, sleeve', d:8, c:.05, ctol:.03, bear:40, cap:800, mu:.12, maxSwing:300, maxPlates:5, wearK:.0001, cost:3, doubleShear:true, extraPlates:1, drilled:true,
            how:'Sandwich the moving plate between two fork plates; a shoulder bolt through a sleeve carries it on both sides.', breaks:'Adds a plate per joint; the fork limits how far it can swing.'},
  strap:   {name:'Webbing hinge', src:'nylon strap laminated in foam', d:0, c:0, ctol:0, bear:60, cap:250, mu:0, maxSwing:100, maxPlates:2, wearK:0, cost:.3, flex:true,
            how:'Split both foam ends, glue a strap 150 mm into each, bevel the faces so they can fold.', breaks:'Cannot turn more than about 100°; twists sideways.'}
};
const STOCK = {
  eps:     {name:'EPS foam 25', src:'your foam board', t:25, w:70, E:4e6, rho:16, plate:true},
  card:    {name:'Corrugated card', src:'boxes, double wall', t:7, w:40, E:.3e9, rho:150, plate:true},
  trellis: {name:'Trellis strip', src:'expandable trellis', t:5, w:22, E:1.3e9, rho:900, maxLen:480},
  pvc:     {name:'1/2 in PVC pipe', src:'hardware store', tube:true, od:21.3, id:15.8, t:21.3, w:21.3, E:3e9, rho:1400},
  ply:     {name:'Ply 6', src:'your plywood panel', t:5.5, w:40, E:6e9, rho:600, plate:true},
  steel:   {name:'Steel flat 3 × 25', src:'flat bar', t:3, w:25, E:200e9, rho:7850}
};
const MAKE = {hand:{name:'Hand drilled', tol:.25, pos:1.5}, jig:{name:'Printed jig', tol:.12, pos:.5}, cnc:{name:'CNC / laser', tol:.05, pos:.15}};
const PIN_NAMES = {O:'crank axle', B:'frame pivot', M:'crank pin', J1:'top', J2:'knee', J3:'back', J4:'hock'};
const allJ = t => ({O:t, B:t, M:t, J1:t, J2:t, J3:t, J4:t});
const base = () => ({stock:'eps', joints: allJ('puck'), make:'hand', sigma:9.75, rump:2, share:60, Lb:760, gap:30, legs:1, strides:0, mag:8, tol:'nom', phi0:null, G:{...HOLY}});
const VARS = [
  {name:'A', title:'Foam + pucks', B: base()},
  {name:'B', title:'Trellis + rivets', B: Object.assign(base(), {stock:'trellis', sigma:7, joints: Object.assign(allJ('rivet'), {O:'bush', M:'scissor', B:'bush', J2:'bush'})})},
  {name:'C', title:'PVC walker', B: Object.assign(base(), {stock:'pvc', joints: allJ('pvc')})},
  {name:'D', title:'Ply + bushes', B: Object.assign(base(), {stock:'ply', make:'jig', joints: Object.assign(allJ('bush'), {J2:'clevis', J4:'clevis'})})}
];
let active = 0;
const B = () => VARS[active].B;
const S = {t: .3, playing: true, slow: false, view: 'leg', tab: 'joints', cadence: 54, height: 1750, live: null, hist: [], sel: 'J2', drag: null, hoverBar: null};
const cur = () => S.live || B().G;

// ---------- linkage ----------
function cc(P, r0, Q, r1, s) { const dx = Q.x - P.x, dy = Q.y - P.y, d = Math.hypot(dx, dy); if (d < 1e-9 || d > r0 + r1 || d < Math.abs(r0 - r1)) return null; const a = (r0*r0 - r1*r1 + d*d) / (2*d), h = Math.sqrt(Math.max(0, r0*r0 - a*a)), ux = dx/d, uy = dy/d; return {x: P.x + a*ux - s*h*uy, y: P.y + a*uy + s*h*ux}; }
function solve(G, th) { const p = {O:{x:0,y:0}, B:{x:-G.a,y:-G.l}, A:{x:0,y:-G.l}, M:{x:G.m*Math.cos(th), y:G.m*Math.sin(th)}}; for (const J of ORDER) { const [p0, r0, p1, r1, s] = JOINT_DEF[J]; const q = cc(p[p0], G[r0], p[p1], G[r1], s); if (!q) { p.fail = J; return p; } p[J] = q; } return p; }
const kIdx = ang => ((Math.round(ang / TAU * N) % N) + N) % N;
const uv = (a, b) => { const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy) || 1; return {x: dx / L, y: dy / L}; };
const cr = (a, b) => a.x * b.y - a.y * b.x, sub = (a, b) => ({x: a.x - b.x, y: a.y - b.y}), add = (a, b) => ({x: a.x + b.x, y: a.y + b.y}), mul = (a, s) => ({x: a.x * s, y: a.y * s}), len = a => Math.hypot(a.x, a.y);
function analyze(G) {
  const fx = new Float64Array(N), fy = new Float64Array(N), ok = new Uint8Array(N);
  let minY = Infinity, maxY = -Infinity, minX = Infinity, maxX = -Infinity, topY = -Infinity, valid = 0;
  for (let k = 0; k < N; k++) { const p = solve(G, TAU * k / N); if (!p.F) continue; ok[k] = 1; fx[k] = p.F.x; fy[k] = p.F.y; valid++; minY = Math.min(minY, p.F.y); maxY = Math.max(maxY, p.F.y); for (const n of ['B','J1','J2','J3','J4','F','M']) { minX = Math.min(minX, p[n].x); maxX = Math.max(maxX, p[n].x); topY = Math.max(topY, p[n].y); } }
  if (!valid) { minY = -90; maxY = -70; minX = -80; maxX = 15; topY = 30; }
  const tol = Math.max(.6, .05 * (maxY - minY)), contact = new Uint8Array(N);
  for (let k = 0; k < N; k++) contact[k] = ok[k] && fy[k] < minY + tol ? 1 : 0;
  let sv = 0, nv = 0; for (let k = 0; k < N; k++) { const n = (k + 1) % N; if (contact[k] && contact[n]) { sv += fx[n] - fx[k]; nv++; } }
  return {fx, fy, ok, contact, minY, maxY, minX, maxX, topY, spin: sv <= 0 ? 1 : -1, advance: nv ? Math.abs(sv / nv) * N : 0, duty: contact.reduce((s, c) => s + c, 0) / N, locked: (N - valid) / N};
}
function statics(P, W) {
  if (!P.F || W <= 0) return null;
  const uk = uv(P.J2, P.M), uc = uv(P.J2, P.B), uf = uv(P.J4, P.J3), R = {x: 0, y: W};
  const den = cr(sub(P.J4, P.J2), uf); if (Math.abs(den) < 1e-9) return null;
  const Ff = -cr(sub(P.F, P.J2), R) / den, rx = -(Ff * uf.x + R.x), ry = -(Ff * uf.y + R.y), det = uk.x * uc.y - uk.y * uc.x;
  const Fk = (rx * uc.y - ry * uc.x) / det, Fc = (uk.x * ry - uk.y * rx) / det, uj = uv(P.J1, P.M), uf3 = uv(P.J3, P.J4);
  const Fj = -Ff * cr(sub(P.J3, P.B), uf3) / cr(sub(P.J1, P.B), uj);
  const Bup = mul(add(mul(uj, Fj), mul(uf3, Ff)), -1), Fs = add(mul(uv(P.M, P.J1), Fj), mul(uv(P.M, P.J2), Fk)), J2v = add(mul(uk, Fk), mul(uc, Fc)), frameB = add(Bup, mul(uv(P.J2, P.B), Fc));
  return {Fj, Fk, Fc, Ff, tauU: -cr(P.M, Fs), pinVec: {O: mul(Fs, -1), B: Bup, M: Fs, J1: mul(uj, Fj), J2: J2v, J3: mul(uf3, Ff), J4: mul(uf, Ff)},
    plates: {O: {frame: len(Fs), crank: len(Fs)}, B: {frame: len(frameB), up: len(Bup), c: Math.abs(Fc)}, M: {crank: len(Fs), j: Math.abs(Fj), k: Math.abs(Fk)}, J1: {j: Math.abs(Fj), up: Math.abs(Fj)}, J2: {k: Math.abs(Fk), c: Math.abs(Fc), lo: len(J2v)}, J3: {up: Math.abs(Ff), f: Math.abs(Ff)}, J4: {f: Math.abs(Ff), lo: Math.abs(Ff)}}};
}
// human gait
const HIPK = [[0,25],[.1,22],[.3,5],[.5,-12],[.6,-8],[.75,18],[.88,30]], KNEEK = [[0,5],[.15,18],[.4,5],[.55,30],[.72,62],[.85,40],[.97,3]];
function curve(keys, u) { u = ((u % 1) + 1) % 1; const n = keys.length; let i = n - 1; for (let q = 0; q < n; q++) if (keys[q][0] <= u) i = q; const k1 = keys[i], k2 = keys[(i + 1) % n], k0 = keys[(i - 1 + n) % n], k3 = keys[(i + 2) % n]; let u1 = k1[0], u2 = k2[0]; if (u2 <= u1) u2 += 1; let uu = u; if (uu < u1) uu += 1; const t = (uu - u1) / (u2 - u1), p0 = k0[1], p1 = k1[1], p2 = k2[1], p3 = k3[1]; return 0.5 * ((2*p1) + (-p0 + p2)*t + (2*p0 - 5*p1 + 4*p2 - p3)*t*t + (-p0 + 3*p1 - 3*p2 + p3)*t*t*t); }
function humanLegRel(H, u) { const Lt = .245 * H, Ls = .246 * H, a = curve(HIPK, u) * Math.PI / 180, kf = curve(KNEEK, u) * Math.PI / 180, knee = {x: Lt * Math.sin(a), y: -Lt * Math.cos(a)}; return {a, knee, ank: {x: knee.x + Ls * Math.sin(a - kf), y: knee.y - Ls * Math.cos(a - kf)}}; }
function humanModel(H) { const ankleH = .039 * H, hipY = new Float64Array(N + 1), hipX = new Float64Array(N + 1), L = [], R = []; for (let k = 0; k <= N; k++) { L.push(humanLegRel(H, k / N)); R.push(humanLegRel(H, k / N + .5)); } for (let k = 0; k <= N; k++) hipY[k] = ankleH + Math.max(-L[k].ank.y, -R[k].ank.y); for (let k = 0; k < N; k++) { const S2 = L[k].ank.y <= R[k].ank.y ? L : R; hipX[k + 1] = hipX[k] - (S2[k + 1].ank.x - S2[k].ank.x); } let m = 0; for (let k = 0; k < N; k++) m += hipY[k] / N; return {H, hipY, hipX, advance: hipX[N], meanHip: m}; }
const HM = humanModel(S.height);

function markTabs() { document.querySelectorAll('[data-tab]').forEach(b2 => b2.setAttribute('aria-pressed', String(b2.dataset.tab === S.tab))); }

// ---------- sound ----------
const SND = {on: false, ctx: null, prevI: null}; const flash = {};

}
const PIN_F = {O: 260, B: 380, M: 520, J1: 700, J2: 900, J3: 1150, J4: 1500};
function click(freq, gain) { const C = SND.ctx, s = C.createBufferSource(); s.buffer = SND.noise; const f = C.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 6; const g = C.createGain(), t = C.currentTime; g.gain.setValueAtTime(clamp(gain, 0, 1.2), t); g.gain.exponentialRampToValueAtTime(.001, t + .06); s.connect(f); f.connect(g); g.connect(SND.master); s.start(t, Math.random() * .5); s.stop(t + .08); }

function tickEvents() {

  const crossed = a => prev <= i ? (a > prev && a <= i) : (a > prev || a <= i);

    E.offs.forEach(o => { for (let q = 0; q < N; q++) { const k = (E.tIdx[q] + o) % N, kp = (E.tIdx[(q - 1 + N) % N] + o) % N; if (E.A.contact[k] && !E.A.contact[kp] && crossed(q)) thud(.25 + E.totalKg * .05); } });
    SND.hiss.gain.setTargetAtTime(clamp(E.fric[i] / Math.max(p95(E.fric), 1.5) * .3, 0, .35), SND.ctx.currentTime, .03);
  }
}
document.getElementById('sound').onclick = async () => {
  SND.on = !SND.on; document.getElementById('sound').setAttribute('aria-pressed', String(SND.on));
  if (SND.on && !SND.ctx) { try { soundInit(); } catch (e) { SND.on = false; } }
  if (SND.ctx) { if (SND.on) await SND.ctx.resume(); else SND.ctx.suspend(); }

const playBtn = document.getElementById('play');
function setPlaying(on) { S.playing = on; playBtn.innerHTML = on ? '<span class="icon-pause"></span>' : '<span class="icon-play"></span>'; playBtn.setAttribute('aria-label', on ? 'Pause' : 'Play'); }

document.getElementById('slow').onclick = e => { S.slow = !S.slow; e.currentTarget.setAttribute('aria-pressed', String(S.slow)); };

let last = performance.now();
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame(now) {

  if (S.playing) S.t += dt * (S.slow ? .25 : 1);
  for (const k in flash) flash[k] = Math.max(0, flash[k] - dt * 4);
