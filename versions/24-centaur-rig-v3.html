<title>Centaur Rig</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: one-screen lab bench. Stage (side view, walking) top-left; leg detail, time plots and plan view along the bottom; inspector on the right. No page scroll on a desktop screen. */
:root{
  --paper:#fff; --ink:#000;
  --teal:#19e6c8; --amber:#ffd23f; --red:#ff2e2e; --blue:#3b82f6;
  --mono:'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme:light;
}
*{box-sizing:border-box;border-radius:0}
html,body{height:100%;background:var(--paper);color:var(--ink)}
body{margin:0;font-family:var(--mono);font-size:12px;line-height:1.35;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:8px;
  display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px;overflow:hidden}
header{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;border-bottom:2px solid var(--ink);padding-bottom:6px}
h1{font-size:16px;font-weight:700;letter-spacing:.08em;margin:0;text-transform:uppercase}
.clock{font-variant-numeric:tabular-nums;margin-left:auto}
.lab{display:grid;gap:8px;min-height:0;grid-template-columns:minmax(0,1fr) 350px;grid-template-rows:minmax(0,1fr) minmax(0,38%)}
.pane{border:1px solid var(--ink);min-width:0;min-height:0;display:flex;flex-direction:column}
.pane > .bar{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--ink);padding:3px 6px;min-height:26px}
.bar h2{font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin:0;font-weight:700}
.bar .note{font-size:10px;font-style:italic}
.cv{position:relative;flex:1;min-height:0}
.cv canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#stagePane{grid-column:1;grid-row:1}
.bottom{grid-column:1;grid-row:2;display:grid;gap:8px;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr) minmax(0,.8fr);min-height:0}
#insp{grid-column:2;grid-row:1 / span 2;overflow-y:auto}
button{font:inherit;font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:var(--paper);color:var(--ink);border:1px solid var(--ink);padding:3px 6px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
button:hover{background:var(--ink);color:var(--paper)}
button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.seg{display:flex;flex-wrap:wrap;gap:3px}
.icon-play{border-left:8px solid currentColor;border-top:5px solid transparent;border-bottom:5px solid transparent;width:0;height:0;display:inline-block}
.icon-pause{width:8px;height:10px;display:inline-block;position:relative}
.icon-pause::before,.icon-pause::after{content:"";position:absolute;top:0;width:3px;height:10px;background:currentColor}
.icon-pause::before{left:0}.icon-pause::after{right:0}
.sec{border-bottom:1px solid var(--ink)}
.sec:last-child{border-bottom:0}
.sec h3{font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin:0;padding:5px 8px 3px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.sec h3 span{font-weight:400;letter-spacing:0;text-transform:none;font-style:italic}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;padding:2px 8px;align-items:baseline}
.row .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.choice{display:grid;grid-template-columns:4.6em minmax(0,1fr);gap:6px;padding:2px 8px;align-items:center}
.num{cursor:ew-resize;user-select:none;border-bottom:1px dashed var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.num:hover{background:var(--ink);color:var(--paper)}
.led{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:6px;padding:3px 8px;align-items:baseline;border-top:1px solid var(--ink)}
.led:first-of-type{border-top:0}
.led .why{grid-column:2 / -1;font-size:11px}
.dot{width:10px;height:10px;border:1px solid var(--ink);align-self:center}
.ok{background:var(--teal)} .warn{background:var(--amber)} .bad{background:var(--red)}
.fail{display:grid;grid-template-columns:3.6em minmax(0,1fr);gap:6px;padding:3px 8px;border-top:1px solid var(--ink);cursor:pointer}
.fail:hover{outline:1px solid var(--blue);outline-offset:-1px}
.fail.sel{box-shadow:inset 4px 0 0 var(--blue)}
.fail .u{font-weight:700;font-variant-numeric:tabular-nums;text-align:center;padding:0 2px}
.small{font-size:11px;padding:2px 8px 6px}
@media (max-width:1000px), (max-height:620px){
  body{overflow:auto;height:auto}
  .lab{grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  #stagePane{height:62vh;min-height:320px}
  .bottom{grid-row:auto;grid-template-columns:minmax(0,1fr)}
  .bottom .pane{height:340px}
  #insp{grid-column:1;grid-row:auto;overflow:visible}
}
</style>

<header>
  <h1>Centaur Rig</h1>
  <div class="seg">
    <button id="play" aria-label="Pause"><span class="icon-pause"></span><span>Pause</span></button>
    <button id="slow" aria-pressed="false">Slow</button>
  </div>
  <div class="seg" role="group" aria-label="Overlays">
    <button data-ov="foam" aria-pressed="true">Foam plates</button>
    <button data-ov="force" aria-pressed="true">Forces</button>
    <button data-ov="slop" aria-pressed="true">Slop</button>
    <button data-ov="stress" aria-pressed="true">Hole stress</button>
  </div>
  <div class="clock" id="clock"></div>
</header>

<div class="lab">
  <section class="pane" id="stagePane">
    <div class="bar"><h2>Side view: you walk, the hind pair carries the rump</h2>
      <div class="seg"><button id="horseWalk">Horse walk timing</button><span class="note">drag to scrub</span></div></div>
    <div class="cv"><canvas id="stage" aria-label="Side view of the centaur walking"></canvas></div>
  </section>

  <div class="bottom">
    <section class="pane">
      <div class="bar"><h2>Near hind leg</h2><div class="seg"><button id="undo">Undo</button><button id="reset">Holy numbers</button></div></div>
      <div class="cv"><canvas id="leg" aria-label="Near hind leg with foam plates, pins, clearance and forces. Drag a bar to change its length; tap a pin to select it."></canvas></div>
    </section>
    <section class="pane">
      <div class="bar"><h2>One stride</h2><span class="note" id="plotNote"></span></div>
      <div class="cv"><canvas id="plots" aria-label="Foot load, crank torque, selected pin force and hole stress over one stride"></canvas></div>
    </section>
    <section class="pane">
      <div class="bar"><h2>From above</h2><span class="note">footprints</span></div>
      <div class="cv"><canvas id="plan" aria-label="Top view of human and hind footprints"></canvas></div>
    </section>
  </div>

  <aside class="pane" id="insp">
    <div class="sec">
      <h3>Build <span>what it is made of</span></h3>
      <div class="choice"><span>Plates</span><div class="seg" id="cMat"></div></div>
      <div class="choice"><span>Holes</span><div class="seg" id="cJoint"></div></div>
      <div class="choice"><span>Pins</span><div class="seg" id="cPin"></div></div>
      <div id="nums"></div>
    </div>
    <div class="sec">
      <h3>Age <span>run the joints for a while</span></h3>
      <div id="ageNums"></div>
    </div>
    <div class="sec">
      <h3>Does it read as legs <span>vs your legs</span></h3>
      <div id="ledger"></div>
    </div>
    <div class="sec">
      <h3>What gives out first <span>use ≥ 1 fails</span></h3>
      <div id="fails"></div>
    </div>
  </aside>
</div>

<script>
(() => {
'use strict';
const COL = {paper:'#fff', ink:'#000', teal:'#19e6c8', amber:'#ffd23f', red:'#ff2e2e', blue:'#3b82f6', tint:'rgba(59,130,246,.10)', ghost:'rgba(59,130,246,.35)', faint:'rgba(0,0,0,.16)', foam:'rgba(0,0,0,.05)'};
const FONT = "'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace";
const HOLY = {a:38, b:41.5, c:39.3, d:40.1, e:55.8, f:39.4, g:36.7, h:65.7, i:49, j:50, k:61.9, l:7.8, m:15};
const KEYS = ['a','b','c','d','e','f','g','h','i','j','k','l','m'];
const BARS = {a:['B','A'], l:['A','O'], m:['O','M'], j:['M','J1'], b:['B','J1'], e:['J1','J3'], d:['B','J3'],
              c:['B','J2'], k:['M','J2'], f:['J3','J4'], g:['J2','J4'], h:['J4','F'], i:['J2','F']};
const JOINT_DEF = {J1:['B','b','M','j',1], J2:['B','c','M','k',-1], J3:['B','d','J1','e',1], J4:['J3','f','J2','g',-1], F:['J4','h','J2','i',-1]};
const ORDER = ['J1','J2','J3','J4','F'];
const N = 360, TAU = Math.PI * 2, G0 = 9.81;
const LINKS = {j:['M','J1'], k:['M','J2'], c:['B','J2'], f:['J3','J4']};

// materials (SI). EPS: expanded polystyrene board, ~16 kg/m3.
const MATS = {
  eps:  {name:'EPS 25', t:25, rho:16, E:4e6, crush:70e3, tens:150e3, wearK:.02, label:'bare EPS foam board, 25 mm'},
  skin: {name:'EPS + skin', t:27, rho:16, E:4e6, crush:70e3, tens:150e3, wearK:.006, skin:true, label:'EPS with fibreglass mesh and joint compound both faces'},
  ply:  {name:'Ply 6', t:6, rho:600, E:6e9, crush:12e6, tens:25e6, wearK:.0004, label:'6 mm plywood'}
};
const JOINTS = {
  raw:  {name:'Plain hole', label:'pin straight through the plate'},
  puck: {name:'Wood puck', label:'hardwood puck glued into the foam; the pin bears on wood, the puck bears on foam'},
  tang: {name:'Puck + tang', label:'puck on a ply strip glued 150 mm into the plate; load goes into the foam by glue shear'}
};
const PINS_T = {dowel:{name:'10 mm dowel', d:10}, bolt:{name:'1/4 in bolt', d:6.35}};

// ---------- linkage ----------
function cc(P, r0, Q, r1, s) {
  const dx = Q.x - P.x, dy = Q.y - P.y, d = Math.hypot(dx, dy);
  if (d < 1e-9 || d > r0 + r1 || d < Math.abs(r0 - r1)) return null;
  const a = (r0*r0 - r1*r1 + d*d) / (2*d), h = Math.sqrt(Math.max(0, r0*r0 - a*a));
  const ux = dx/d, uy = dy/d, mx = P.x + a*ux, my = P.y + a*uy;
  return {x: mx - s*h*uy, y: my + s*h*ux};
}
function solve(G, th) {
  const p = {O:{x:0,y:0}, B:{x:-G.a,y:-G.l}, A:{x:0,y:-G.l}, M:{x:G.m*Math.cos(th), y:G.m*Math.sin(th)}};
  for (const J of ORDER) {
    const [p0, r0, p1, r1, s] = JOINT_DEF[J];
    const q = cc(p[p0], G[r0], p[p1], G[r1], s);
    if (!q) { p.fail = J; return p; }
    p[J] = q;
  }
  return p;
}
const kIdx = ang => ((Math.round(ang / TAU * N) % N) + N) % N;
const uv = (a, b) => { const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy) || 1; return {x: dx / L, y: dy / L}; };
const cr = (a, b) => a.x * b.y - a.y * b.x;
const sub = (a, b) => ({x: a.x - b.x, y: a.y - b.y});
const add = (a, b) => ({x: a.x + b.x, y: a.y + b.y});
const mul = (a, s) => ({x: a.x * s, y: a.y * s});
const len = a => Math.hypot(a.x, a.y);
function analyze(G) {
  const fx = new Float64Array(N), fy = new Float64Array(N), ok = new Uint8Array(N);
  let minY = Infinity, maxY = -Infinity, minX = Infinity, maxX = -Infinity, topY = -Infinity, valid = 0;
  for (let k = 0; k < N; k++) {
    const p = solve(G, TAU * k / N); if (!p.F) continue;
    ok[k] = 1; fx[k] = p.F.x; fy[k] = p.F.y; valid++;
    minY = Math.min(minY, p.F.y); maxY = Math.max(maxY, p.F.y);
    for (const n of ['B','J1','J2','J3','J4','F','M']) { minX = Math.min(minX, p[n].x); maxX = Math.max(maxX, p[n].x); topY = Math.max(topY, p[n].y); }
  }
  if (!valid) { minY = -90; maxY = -70; minX = -80; maxX = 15; topY = 30; }
  const tol = Math.max(.6, .05 * (maxY - minY)), contact = new Uint8Array(N);
  for (let k = 0; k < N; k++) contact[k] = ok[k] && fy[k] < minY + tol ? 1 : 0;
  let sv = 0, nv = 0;
  for (let k = 0; k < N; k++) { const n = (k + 1) % N; if (contact[k] && contact[n]) { sv += fx[n] - fx[k]; nv++; } }
  return {fx, fy, ok, contact, minY, maxY, minX, maxX, topY, spin: sv <= 0 ? 1 : -1, advance: nv ? Math.abs(sv / nv) * N : 0,
          duty: contact.reduce((s, c) => s + c, 0) / N, locked: (N - valid) / N};
}
// statics: a vertical ground load W (N) on the foot. Links j k c f are two-force members (tension +).
function statics(P, W) {
  if (!P.F || W <= 0) return null;
  const uk = uv(P.J2, P.M), uc = uv(P.J2, P.B), uf = uv(P.J4, P.J3), R = {x: 0, y: W};
  const den = cr(sub(P.J4, P.J2), uf); if (Math.abs(den) < 1e-9) return null;
  const Ff = -cr(sub(P.F, P.J2), R) / den;
  const rx = -(Ff * uf.x + R.x), ry = -(Ff * uf.y + R.y), det = uk.x * uc.y - uk.y * uc.x;
  const Fk = (rx * uc.y - ry * uc.x) / det, Fc = (uk.x * ry - uk.y * rx) / det;
  const uj = uv(P.J1, P.M), uf3 = uv(P.J3, P.J4);
  const Fj = -Ff * cr(sub(P.J3, P.B), uf3) / cr(sub(P.J1, P.B), uj);
  const Bup = mul(add(mul(uj, Fj), mul(uf3, Ff)), -1);
  const Fs = add(mul(uv(P.M, P.J1), Fj), mul(uv(P.M, P.J2), Fk));
  const tauU = -cr(P.M, Fs);
  const J2v = add(mul(uk, Fk), mul(uc, Fc));
  const frameB = add(Bup, mul(uv(P.J2, P.B), Fc));
  return {Fj, Fk, Fc, Ff, tauU, Fs,
    pinVec: {O: mul(Fs, -1), B: Bup, M: Fs, J1: mul(uj, Fj), J2: J2v, J3: mul(uf3, Ff), J4: mul(uf, Ff)},
    plates: {O: {frame: len(Fs), crank: len(Fs)}, B: {frame: len(frameB), up: len(Bup), c: Math.abs(Fc)}, M: {crank: len(Fs), j: Math.abs(Fj), k: Math.abs(Fk)},
      J1: {j: Math.abs(Fj), up: Math.abs(Fj)}, J2: {k: Math.abs(Fk), c: Math.abs(Fc), lo: len(J2v)}, J3: {up: Math.abs(Ff), f: Math.abs(Ff)}, J4: {f: Math.abs(Ff), lo: Math.abs(Ff)}}};
}

// ---------- human gait ----------
const HIPK  = [[0,25],[.1,22],[.3,5],[.5,-12],[.6,-8],[.75,18],[.88,30]];
const KNEEK = [[0,5],[.15,18],[.4,5],[.55,30],[.72,62],[.85,40],[.97,3]];
function curve(keys, u) {
  u = ((u % 1) + 1) % 1;
  const n = keys.length; let i = n - 1;
  for (let q = 0; q < n; q++) if (keys[q][0] <= u) i = q;
  const k1 = keys[i], k2 = keys[(i + 1) % n], k0 = keys[(i - 1 + n) % n], k3 = keys[(i + 2) % n];
  let u1 = k1[0], u2 = k2[0]; if (u2 <= u1) u2 += 1; let uu = u; if (uu < u1) uu += 1;
  const t = (uu - u1) / (u2 - u1), p0 = k0[1], p1 = k1[1], p2 = k2[1], p3 = k3[1];
  return 0.5 * ((2*p1) + (-p0 + p2)*t + (2*p0 - 5*p1 + 4*p2 - p3)*t*t + (-p0 + 3*p1 - 3*p2 + p3)*t*t*t);
}
function humanLegRel(H, u) {
  const Lt = .245 * H, Ls = .246 * H;
  const a = curve(HIPK, u) * Math.PI / 180, kf = curve(KNEEK, u) * Math.PI / 180;
  const knee = {x: Lt * Math.sin(a), y: -Lt * Math.cos(a)};
  return {a, knee, ank: {x: knee.x + Ls * Math.sin(a - kf), y: knee.y - Ls * Math.cos(a - kf)}};
}
function humanModel(H) {
  const ankleH = .039 * H, hipY = new Float64Array(N + 1), hipX = new Float64Array(N + 1), L = [], R = [];
  for (let k = 0; k <= N; k++) { L.push(humanLegRel(H, k / N)); R.push(humanLegRel(H, k / N + .5)); }
  for (let k = 0; k <= N; k++) hipY[k] = ankleH + Math.max(-L[k].ank.y, -R[k].ank.y);
  const stL = new Uint8Array(N), stR = new Uint8Array(N);
  for (let k = 0; k < N; k++) {
    const S2 = L[k].ank.y <= R[k].ank.y ? L : R; hipX[k + 1] = hipX[k] - (S2[k + 1].ank.x - S2[k].ank.x);
    stL[k] = hipY[k] + L[k].ank.y - ankleH < 8 ? 1 : 0; stR[k] = hipY[k] + R[k].ank.y - ankleH < 8 ? 1 : 0;
  }
  let meanHip = 0; for (let k = 0; k < N; k++) meanHip += hipY[k] / N;
  const duty = stL.reduce((s, v) => s + v, 0) / N;
  return {H, hipY, hipX, advance: hipX[N], meanHip, L, R, stL, stR, duty, legLen: .491 * H + ankleH};
}

// ---------- state ----------
const S = {
  G: {...HOLY}, live: null, hist: [{...HOLY}],
  t: .3, playing: true, slow: false,
  height: 1750, cadence: 54, sigma: 9.75, Lb: 760, gap: 30, phi0: 0,
  mat: 'eps', joint: 'puck', pin: 'dowel', w: 70, c0: .4, rump: 2.0, share: 60, strides: 0, mag: 8,
  ov: {foam: true, force: true, slop: true, stress: true},
  selPin: 'J2', hoverBar: null, drag: null
};
const cur = () => S.live || S.G;
let A, HM, E;   // linkage analysis, human model, engine results

// ---------- helpers ----------
const lerp = (a, b, t) => a + (b - a) * t;
const fmt = (v, d = 1) => (Math.abs(v) < 1e-9 ? 0 : v).toFixed(d);
const wrapPi = a => Math.atan2(Math.sin(a), Math.cos(a));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function sizeCanvas(c) {
  const dpr = Math.min(2, window.devicePixelRatio || 1), w = c.clientWidth, h = c.clientHeight;
  if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
  const x = c.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0);
  return {x, W: w, H: h};
}
function distPtSeg(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, L = dx*dx + dy*dy || 1e-12;
  const t = Math.max(0, Math.min(1, ((p.x - a.x)*dx + (p.y - a.y)*dy) / L));
  return Math.hypot(p.x - a.x - t*dx, p.y - a.y - t*dy);
}
function segsCross(a, b, c, d) { const o = (p, q, r) => (q.x - p.x)*(r.y - p.y) - (q.y - p.y)*(r.x - p.x); return (o(a, b, c) * o(a, b, d) < 0) && (o(c, d, a) * o(c, d, b) < 0); }
function distSegSeg(a, b, c, d) { if (segsCross(a, b, c, d)) return 0; return Math.min(distPtSeg(a, c, d), distPtSeg(b, c, d), distPtSeg(c, a, b), distPtSeg(d, a, b)); }
function inTri(p, t) { const s = (a, b, c) => (a.x - c.x)*(b.y - c.y) - (b.x - c.x)*(a.y - c.y); const d1 = s(p, t[0], t[1]), d2 = s(p, t[1], t[2]), d3 = s(p, t[2], t[0]); return !(((d1 < 0) || (d2 < 0) || (d3 < 0)) && ((d1 > 0) || (d2 > 0) || (d3 > 0))); }
function useClass(u) { return u >= 1 ? 'bad' : u >= .5 ? 'warn' : 'ok'; }
function useCol(u) { return u >= 1 ? COL.red : u >= .5 ? COL.amber : COL.teal; }
let rngSeed = 7; const rnd = () => { rngSeed = (rngSeed * 16807) % 2147483647; return rngSeed / 2147483647 * 2 - 1; };
const MC = Array.from({length: 48}, () => ({j: rnd(), k: rnd(), c: rnd(), f: rnd(), m: rnd()}));

// ---------- plates, pins, layers ----------
const PARTS = [
  {id:'frame', name:'Frame', segs:[['B','A'],['A','O']], holes:['B','O'], ply:true},
  {id:'crank', name:'Crank arm', segs:[['O','M']], holes:['O','M'], ply:true},
  {id:'j', name:'Link j', segs:[['M','J1']], holes:['M','J1']},
  {id:'k', name:'Link k', segs:[['M','J2']], holes:['M','J2']},
  {id:'c', name:'Link c', segs:[['B','J2']], holes:['B','J2']},

  document.getElementById('fitBoth').onclick = () => { S.sigma = +(HM.advance / A.advance).toFixed(2); buildNums(); engine(); };
  const age = document.getElementById('ageNums'); age.innerHTML = '';
  for (const [label, key, step, min, max, dec, unit] of [['Strides walked', 'strides', 20, 0, 50000, 0, ''], ['Draw slop at', 'mag', .05, 1, 40, 0, '×']]) {
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<span>${label}</span><span class="v"><span data-n></span> <span style="font-weight:400">${unit}</span></span>`;
    age.appendChild(row);
    makeNum(row.querySelector('[data-n]'), () => S[key], v => { S[key] = v; }, step, min, max, dec, () => engine(), () => engine());
  }
  const ab = document.createElement('div'); ab.className = 'small';
  ab.innerHTML = '<div class="seg"><button data-age="0">New</button><button data-age="1000">1 km</button><button data-age="5000">5 km</button><button data-age="20000">20 km</button></div>';
  age.appendChild(ab);
  ab.querySelectorAll('[data-age]').forEach(b => b.onclick = () => { S.strides = Math.round(+b.dataset.age / (HM.advance / 1000) * (+b.dataset.age ? 1 / 1000 * 1000 : 0)); S.strides = +b.dataset.age ? Math.round(+b.dataset.age * 1000 / HM.advance) : 0; buildNums(); engine(); });
}
function renderInspector() {
  if (!E) return;
  const led = [];
  const add2 = (st, title, val, why) => led.push(`<div class="led" title="${why.replace(/"/g, '')}"><span class="dot ${st}"></span><span>${title}</span><span class="v" style="font-weight:700">${val}</span>${st === 'ok' ? '' : `<span class="why">${why}</span>`}</div>`);
  const sup = E.supported;
  add2(sup > .97 ? 'ok' : sup > .85 ? 'warn' : 'bad', 'Feet carry the rump', `${fmt(sup * 100, 0)}%`,
    sup < .999 ? `For ${fmt((1 - sup) * 100, 0)}% of each stride no hind foot is down and the rump hangs on your belt. Legs that never bear weight read as dangling props.` : 'A hind foot is always down. Weight going into the ground is what makes a leg read as a leg.');
  const slipPct = E.slipMax;
  add2(slipPct < 15 ? 'ok' : slipPct < 50 ? 'warn' : 'bad', 'Feet stay planted', `${fmt(slipPct, 0)} mm`,
    slipPct < 15 ? 'A planted foot does not move against the ground. This one holds still within 15 mm.' : `Each hind foot slides ${fmt(slipPct, 0)} mm while it is down. A foot that skates reads as dragged.`);
  add2(Math.abs(E.slope) < 3 ? 'ok' : Math.abs(E.slope) < 8 ? 'warn' : 'bad', 'Same height as your hips', `${fmt(E.slope, 1)}°`,
    `Hind axle ${fmt(E.Hc / 10, 0)} cm, your hip ${fmt(HM.meanHip / 10, 0)} cm. A level back joins the two bodies into one animal.`);
  const dz = E.footZ - E.humanZ;
  add2(Math.abs(dz) < 25 ? 'ok' : Math.abs(dz) < 60 ? 'warn' : 'bad', 'Same plane as your legs', `${dz >= 0 ? '+' : ''}${fmt(dz, 0)} mm`,
    `Hind feet land ${fmt(E.footZ, 0)} mm from the centreline, yours ${fmt(E.humanZ, 0)} mm. From the side the four legs only read as one body when they stand in the same two lines. Each extra ${MATS[S.mat].t} mm layer pushes them out.`);
  const sr = E.strideRatio;
  add2(Math.abs(sr - 1) < .03 ? 'ok' : Math.abs(sr - 1) < .1 ? 'warn' : 'bad', 'Same stride as yours', `${fmt(sr * 100, 0)}%`,
    'One hind stride per human stride, the same length on the ground. If they differ, the hind feet scuff or drag.');
  const ph = E.onset === null ? null : ((E.onset - .75 + 1.5) % 1) - .5;
  add2(ph === null ? 'bad' : Math.abs(ph) < .06 ? 'ok' : Math.abs(ph) < .15 ? 'warn' : 'bad', 'Horse walk timing', ph === null ? '–' : `${ph >= 0 ? '+' : ''}${fmt(ph * 100, 0)}%`,
    'In a horse walk the hind foot lands a quarter stride before the fore foot on the same side. Press Horse walk timing to set it.');
  add2(A.duty > .55 ? 'ok' : A.duty > .45 ? 'warn' : 'bad', 'Ground time like a walk', `${fmt(A.duty * 100, 0)}%`,
    `Each hind foot is down ${fmt(A.duty * 100, 0)}% of the stride; yours ${fmt(HM.duty * 100, 0)}%, a walking horse about 60%. Under 50% a foot spends more time in the air than on the ground, which reads as a trot.`);
  document.getElementById('ledger').innerHTML = led.join('');

  // failure ranking
  const items = [];
  for (const pn of PINS) {
    const st = E.pins[pn.id];
    items.push({u: st.uMax, pin: pn.id, t: `<b>${pn.id} ${pn.name}</b>: ${st.what}, ${fmt(st.maxF, 0)} N on the ${PARTS.find(p => p.id === st.worst) ? PARTS.find(p => p.id === st.worst).name.toLowerCase() : '–'}. ${st.uMax >= 1 ? 'Crushes in the first steps.' : isFinite(st.life) && st.life < 1e6 ? `Gains 2 mm of slop in about ${fmt(st.life / 1000 * HM.advance / 1000, 1)} km.` : 'Holds.'} ${st.knocks} knock${st.knocks === 1 ? '' : 's'} per stride, swings ${fmt(st.swing, 0)}°.`});
  }
  for (const [id, L] of Object.entries(E.links)) {
    if (L.cMax > 0) items.push({u: L.buck, pin: null, t: `<b>Link ${id}</b> buckles sideways at ${fmt(L.Pcr, 0)} N; it carries ${fmt(L.cMax, 0)} N in compression over ${fmt(L.Lmm, 0)} mm.${L.buck >= 1 ? ' Add a ply spar or a skin.' : ''}`});
    if (L.tMax > 0) items.push({u: L.tens, pin: null, t: `<b>Link ${id}</b> in tension: ${fmt(L.tMax, 0)} N through a ${S.w} × ${MATS[S.mat].t} mm section.`});
  }
  items.push({u: E.spread / 15, pin: null, t: `<b>Foot wanders</b> up to ${fmt(E.spread, 1)} mm from hole clearance alone, and the loaded foot sags ${fmt(E.sag, 1)} mm (clearance plus foam stretch).`});
  items.push({u: (1 - E.supported) * 4, pin: null, t: `<b>Rump unsupported</b> ${fmt((1 - E.supported) * 100, 0)}% of each stride; your belt takes ${fmt(E.totalKg * G0, 0)} N then.`});
  items.sort((a, b) => b.u - a.u);
  document.getElementById('fails').innerHTML = items.slice(0, 7).map(it =>
    `<div class="fail${it.pin === S.selPin ? ' sel' : ''}" ${it.pin ? `data-pin="${it.pin}"` : ''}><span class="u ${useClass(it.u)}">${fmt(it.u, 2)}</span><span>${it.t}</span></div>`).join('');
  document.querySelectorAll('#fails [data-pin]').forEach(el => el.onclick = () => { S.selPin = el.dataset.pin; renderInspector(); });
}

// ---------- header ----------
const playBtn = document.getElementById('play');
function setPlaying(on) { S.playing = on; playBtn.innerHTML = on ? '<span class="icon-pause"></span><span>Pause</span>' : '<span class="icon-play"></span><span>Play</span>'; playBtn.setAttribute('aria-label', on ? 'Pause' : 'Play'); }
playBtn.onclick = () => setPlaying(!S.playing);
const slowBtn = document.getElementById('slow');
slowBtn.onclick = () => { S.slow = !S.slow; slowBtn.setAttribute('aria-pressed', String(S.slow)); };
document.querySelectorAll('[data-ov]').forEach(b => b.onclick = () => { const k = b.dataset.ov; S.ov[k] = !S.ov[k]; b.setAttribute('aria-pressed', String(S.ov[k])); });
document.getElementById('horseWalk').onclick = () => {
  let best = null;
  for (let q = 0; q < 72; q++) {
    S.phi0 = TAU * q / 72;
    let onset = null; for (let i = 0; i < N; i++) { const k = kIdx(legPhi(i / N, 0)), kp = kIdx(legPhi((i - 1) / N, 0)); if (A.contact[k] && !A.contact[kp]) { onset = i / N; break; } }
    if (onset === null) continue; const e = Math.abs(((onset - .75 + 1.5) % 1) - .5);
    if (!best || e < best.e) best = {e, p: S.phi0};
  }
  if (best) S.phi0 = best.p; engine();
};

let last = performance.now();
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (S.playing) S.t += dt * (S.slow ? .25 : 1);
  drawStage(); drawLegDetail(); drawPlots(); drawPlan();
  const u = uNow();
  document.getElementById('clock').textContent = `stride ${Math.floor(u)} · ${fmt((((u % 1) + 1) % 1) * 100, 0).padStart(2, '0')}% · ${fmt(S.cadence, 0)} strides/min`;
  requestAnimationFrame(frame);
}
segButtons('cMat', MATS, 'mat'); segButtons('cJoint', JOINTS, 'joint'); segButtons('cPin', PINS_T, 'pin');
HM = humanModel(S.height); A = analyze(S.G);
buildNums();
engine();
document.getElementById('horseWalk').click();
setPlaying(!reduce);
requestAnimationFrame(frame);
})();
</script>
