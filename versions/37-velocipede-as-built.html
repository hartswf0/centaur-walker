  {t:'What the belts are made of',sel:null,cam:'q',b:`<p>Each belt is one closed loop of round cord. Three cords fit this rig; all are at Home Depot.</p>

   <p>Paracord barely stretches. If the A-frame or the roller wire bends 1 mm, a paracord loop loses about ${f1(CORDS.para.EA/(b1.len*25.4))} N, which is all of its pull, and it slips. That is the slop. Shock cord is rubber strands in a woven sheath: it stays stretched and keeps pulling when things flex.</p>

  if(!TB.points.length||TB.mode!==S.mode){g.textAlign='center';g.fillText('Find the winner to place every build here',sx0+sw/2,sy0+sh/2);g.textAlign='left';return;}
  const P=TB.points,pmin=Math.min(...P.map(p=>p.price)),pmax=Math.max(...P.map(p=>p.price)),kmin=Math.min(...P.map(p=>p.kg)),kmax=Math.max(...P.map(p=>p.kg)),X=v=>sx0+6+(v-pmin)/((pmax-pmin)||1)*(sw-12),Y=v=>sy0+sh-6-(v-kmin)/((kmax-kmin)||1)*(sh-12);
  const omax=Math.max(...P.map(p=>p.o));for(const p of P){g.globalAlpha=p.fails?.25:.35+.65*p.o/omax;g.fillStyle=p.fails?C.warn:C.accent;g.fillRect(X(p.price)-1.5,Y(p.kg)-1.5,3,3);}g.globalAlpha=1;
  g.fillStyle=C['ink-2'];const cx=X(E.price),cy=Y(E.kg);g.strokeStyle=C.ink;g.lineWidth=2;g.beginPath();g.arc(cx,cy,6,0,TAU);g.stroke();
  g.fillText(`each dot is one build · across: price $${Math.round(pmin)}–${Math.round(pmax)} · up: weight ${kmin.toFixed(1)}–${kmax.toFixed(1)} kg · ring: this build`,sx0,sy0-4);
  vstat('test · bars score this build; the curve is the torque the legs need; dots are every build, darker = higher score, red = fails');}
/* ===== inspector ===== */
function header(){if(S.built&&S.mode==='bike'){$('hstat').textContent=AB.status();return;}$('hstat').textContent=S.mode==='bike'?`legs ${K.f.toFixed(2)} Hz · ${Math.round(K.cad)} rpm in 42×${S.cog} · hooves ${mm(K.clear)} up`:`legs ${K.f.toFixed(2)} Hz · stride ${(S.v/K.Sh).toFixed(2)} Hz · hooves ${mm(K.clear)} up`;}
const heelGap=f=>Math.round(-245-(MODES.bike.PC*1000+f.J.a/2+f.hx)); // heel at the back of the pedal stroke, x = -245 mm from the bottom bracket
function renderInsp(){const el=$('insp');let h='';const t=S.tab;
  if(S.built&&S.mode==='bike'&&['build','parts','drive','test'].includes(t)){AB.recompute(S.v);el.innerHTML=AB.html(t);AB.wire(el,window.__abChanged);return;}
  if(t==='build'){const st=steps();let n=0;h=`<section><div class="grid2"><div class="cell"><small>Footprint</small><span class="big">356²</span> mm</div><div class="cell"><small>${S.mode==='bike'?'On the rack':'On you'}</small><span class="big">${W().tot.toFixed(1)}</span> kg</div></div><ol class="steps">${st.map((s,i)=>s.ph?`<li class="ph">${s.ph}</li>`:`<li data-i="${i}" class="${S.step===i?'cur':''}${s.mode&&s.mode!==S.mode||s.bd&&s.bd!==S.body||s.off?' off':''}"><span class="no">${++n}</span><span><b>${s.t}</b><span class="d">${s.d}</span></span></li>`).join('')}</ol></section>`;}
  if(t==='parts'){const pr=partsRows(),bm=bom(),tot=bm.reduce((a,r)=>a+r.cost,0);{const w=W();h=`<section><h2>Weight · ${MODES[S.mode].name.toLowerCase()} mode</h2><div class="tw"><table><thead><tr><th>Part</th><th>kg</th></tr></thead><tbody>${w.rows.map(r=>`<tr><td>${r[0]}</td><td class="n">${r[1].toFixed(2)}</td></tr>`).join('')}<tr><td><b>Total</b></td><td class="n"><b>${w.tot.toFixed(1)}</b></td></tr></tbody></table></div><p class="muted">Change materials in the Test tab; this list follows.</p>`;}h+=`<h2>Cut list · ${OPT.link.opts[S.cfg.link].name} · 2 of each</h2><div class="tw"><table><thead><tr><th>Part</th><th>Pivots</th><th>Centres</th><th>Layer</th></tr></thead><tbody>${pr.map(r=>`<tr><td>${r.part}<br><span class="muted">${r.form}</span></td><td class="m">${r.joints}</td><td class="m">${r.centres}</td><td class="n">${r.layer}</td></tr>`).join('')}<tr><td>Crank arm<br><span class="muted">6 × 30 aluminium</span></td><td class="m">O–C</td><td class="m">${J.m} mm</td><td class="n">1</td></tr></tbody></table></div>
    <h2>Buy, salvage, have</h2><div class="tw"><table><thead><tr><th>Item</th><th>Qty</th><th>How</th><th>$</th></tr></thead><tbody>${bm.map(r=>`<tr style="${r.mode&&r.mode!==S.mode||r.bd&&r.bd!==S.body?'opacity:.45':''}"><td>${r.item}<br><span class="muted">${r.where}${r.mode?' · '+MODES[r.mode].name.toLowerCase()+' mode':''}${r.bd?' · Trojan head':''}</span></td><td class="m">${r.qty}</td><td><span class="tag ${r.how}">${r.how}</span></td><td class="n">${r.cost.toFixed(0)}</td></tr>`).join('')}<tr><td><b>Both modes, estimated</b></td><td></td><td></td><td class="n"><b>${tot.toFixed(0)}</b></td></tr></tbody></table></div><p class="muted">Prices are estimates, not quotes.</p></section>`;}
  if(t==='drive'){h=S.mode==='bike'?`<section><div class="grid2"><div class="cell"><small>Legs</small><span class="big">${K.f.toFixed(2)}</span> Hz</div><div class="cell"><small>Your cadence</small><span class="big">${Math.round(K.cad)}</span> rpm</div><div class="cell"><small>Roller → gears</small><span class="big">12:36</span></div><div class="cell"><small>Chain #25</small><span class="big">${K.TS}:${K.TJ}</span></div></div>
    <div class="sl"><label for="cog">Cassette cog</label><select id="cog">${BK.cogs.map(c=>`<option value="${c}"${c===S.cog?' selected':''}>42 × ${c}</option>`).join('')}</select><span class="val">${(BK.C*42/S.cog).toFixed(2)} m</span></div>
    <dl class="kv"><dt>Roller</dt><dd>52 mm on the tyre tread: turns once per ${mm(2*Math.PI*ROLL.r)} of road</dd><dt>Needed per leg turn</dt><dd>${mm(K.adv)}</dd><dt>From the train</dt><dd>${mm(K.advB)}</dd><dt>Hooves</dt><dd>${mm(K.clear)} above the road at their lowest</dd><dt>Your bike</dt><dd>wheelbase 1054, chainstay 450, BB drop 75, 42T × 11–42</dd></dl>
    <p class="muted">The roller reads the tyre’s tread speed, which is road speed, so the legs keep pace whatever gear you ride and keep walking when you coast. No wheel of their own touches the road.</p></section>`
   :`<section><div class="grid2"><div class="cell"><small>Legs</small><span class="big">${K.f.toFixed(2)}</span> Hz</div><div class="cell"><small>Your stride</small><span class="big">${(S.v/K.Sh).toFixed(2)}</span> Hz</div><div class="cell"><small>Spool</small><span class="big">⌀${Math.round(K.spool*1000)}</span> mm</div><div class="cell"><small>Stride length</small><span class="big">${K.Sh.toFixed(2)}</span> m</div></div>
    <div class="sl"><label for="pull">Cord pull per step</label><input id="pull" type="range" min="0.10" max="0.25" step="0.005" value="${S.pull}"><span class="val">${mm(S.pull)}</span></div>
    <dl class="kv"><dt>Per step</dt><dd>one thigh pulls, the legs turn ${K.perStep.toFixed(2)} of a cycle</dd><dt>Per leg cycle</dt><dd>${mm(K.adv)} of hoof travel</dd><dt>One-way bearings</dt><dd>CSK12PP, 12 mm bore, keyed</dd><dt>On your hips</dt><dd>${W().tot.toFixed(1)} kg; module centre ${mm(-0.12-K.PC)} behind your back, ${(W().mod*9.81*(-0.12-K.PC)).toFixed(0)} N·m, taken by the hip belt and shoulder straps</dd><dt>Hooves</dt><dd>${mm(K.clear)} above level ground at their lowest</dd></dl>
    <p class="muted">Your thighs drive the hind legs through cords and one-way bearings, so the hind legs step only when you step. The spool size sets how far they turn per step; measure your own cord pull and set it here.</p></section>`;}
  if(t==='evolve'){const f=EV.best,ok=(v,b)=>`<td class="${v?'pass':'fail'}">${b}</td>`;h=`<section><h2>Evolve under the platform constraint</h2><p class="muted">Genome: Jansen’s 13 link lengths plus the height of O, whole millimetres. Rejected: any linkage that locks or comes within 12% of a toggle. Rewarded: a flat, long, steady hoof stroke. Penalised: anything above the platform outside the 356 mm square, a crank that hits the rails, hooves that reach the rider’s heels.</p>
    <div class="row"><button class="btn" id="evrun" ${EV.running?'disabled':''}>Run 1000 generations</button><button class="btn ghost" id="evstop" ${EV.running?'':'disabled'}>Stop</button><button class="btn ghost" id="evuse" ${EV.src==='champion'||EV.running?'disabled':''}>Use this leg</button><button class="btn ghost" id="evreset">Back to the built leg</button></div>
    <div class="tw"><table><thead><tr><th>Test</th><th>Value</th><th></th></tr></thead><tbody>
      <tr><td>Above-platform parts inside 356 mm</td><td class="n">${Math.round(f.over||0)} mm over</td>${ok((f.over||0)<1,(f.over||0)<1?'pass':'fail')}</tr>
      <tr><td>Crank clears the rails</td><td class="n">${f.oh-f.m} mm</td>${ok(f.oh-f.m>=25,f.oh-f.m>=25?'pass':'fail')}</tr>
      <tr><td>Hoof to rider’s heel, bicycle, closest</td><td class="n">${heelGap(f)} mm</td>${ok(heelGap(f)>=50,heelGap(f)>=50?'pass':'fail')}</tr>
      <tr><td>Advance per turn</td><td class="n">${Math.round(f.adv)} mm</td><td></td></tr>
      <tr><td>Slip per step</td><td class="n">${Math.round(f.slip)} mm</td><td></td></tr>
      <tr><td>Hoof on ground</td><td class="n">${Math.round(f.d*100)}%</td><td></td></tr>
      <tr><td>Hoof lift</td><td class="n">${Math.round(f.lift)} mm</td><td></td></tr></tbody></table></div>
    <p class="muted">${EV.src==='champion'?'Shown: the leg this page builds, the best of six offline runs of 3000 generations.':'Shown: the best of this run. “Use this leg” rebuilds the parts, layers, drive and drawings around it.'}</p></section>`;}
  if(t==='test')h=testHTML();
  if(t==='joints'){h=`<section><h2>Layers, inside to outside</h2><p class="muted">Computed: no two parts on one layer come within a bar width of each other, and no part crosses a bolt or the shaft end on a layer that bolt occupies. Outermost bolt head at ${mm(layerZ(LAYERS.n)+PLY/2+.01)} from centre: inside the body at ${mm(HULLZ)}.</p>
    <div class="tw"><table><thead><tr><th>Layer</th><th>Parts</th><th>From centre</th></tr></thead><tbody>${[...Array(LAYERS.n)].map((_,i)=>{const L=i+1;return `<tr><td class="n">${L}</td><td>${BODIES.filter(b=>LAYERS[b.id]===L).map(b=>b.name+' '+b.j.join('–')).join(', ')}</td><td class="n">${mm(layerZ(L))}</td></tr>`;}).join('')}</tbody></table></div>
    <h2>Pivots</h2><div class="tw"><table><thead><tr><th>Pivot</th><th>Parts (layer)</th><th>Stack</th><th>Bolt</th></tr></thead><tbody>${JOINTS.map(Jn=>{const s=JSTACK[Jn];return `<tr><td class="m">${Jn}</td><td>${s.bodies.map(x=>x.b.name+' ('+x.L+')').join(', ')}${Jn==='B'?', plate':''}</td><td class="n">${mm(s.stack)}</td><td class="m">${OPT.piv.opts[S.cfg.piv].bolt} × ${s.shoulder}</td></tr>`;}).join('')}<tr><td class="m">O</td><td>Crank arm (1) on the shaft end</td><td class="n">—</td><td class="m">key + 1 M5 set screw</td></tr></tbody></table></div></section>`;}
  el.innerHTML=h;wire();}
function wire(){const el=$('insp');wireTest();el.querySelectorAll('ol.steps li[data-i]').forEach(li=>li.addEventListener('click',()=>{const i=+li.dataset.i,st=steps()[i];if(st.mode&&st.mode!==S.mode)setMode(st.mode);if(st.bd&&st.bd!==S.body)setBody(st.bd);S.step=S.step===i?-1:i;if(R3)R3.highlight(S.step<0?null:steps()[S.step].tags);renderInsp();knock(1800,.02,.12);}));
  const cog=$('cog');if(cog)cog.addEventListener('change',()=>{S.cog=+cog.value;derive();header();renderInsp();});
  const pull=$('pull');if(pull)pull.addEventListener('input',()=>{S.pull=+pull.value;pull.nextElementSibling.textContent=mm(S.pull);derive();header();clearTimeout(pull._t);pull._t=setTimeout(()=>{rebuild();renderInsp();},300);});
  const q=id=>$(id);if(q('evrun'))q('evrun').addEventListener('click',()=>{evStart();showView('evo');renderInsp();});if(q('evstop'))q('evstop').addEventListener('click',()=>{EV.running=false;renderInsp();});
  if(q('evuse'))q('evuse').addEventListener('click',()=>{setLinkage(EV.best.J);planLayers();EV.src='champion';derive();rebuild();header();renderInsp();});
  if(q('evreset'))q('evreset').addEventListener('click',()=>{EV.running=false;EV.best={J:CHAMP,...fitness(CHAMP)};EV.hist=CHAMP_HIST.slice();EV.src='champion';setLinkage(CHAMP);planLayers();derive();rebuild();header();renderInsp();});}
function rebuild(){if(T){R3=build3D();R3.resize();R3.bare(S.bare);if(S.step>=0)R3.highlight(steps()[S.step].tags);}}
function setMode(m){if(m===S.mode)return;S.mode=m;S.v=MODES[m].v;document.querySelectorAll('.mode button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===m));derive();syncSpeed();header();rebuild();renderInsp();knock(700,.06,.25);}
function modeBtns(){document.querySelectorAll('.mode button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m==='built'?S.built:(!S.built&&b.dataset.m===S.mode)));}
document.querySelectorAll('.mode button').forEach(b=>b.addEventListener('click',()=>{audio();S.step=-1;const m=b.dataset.m,was=S.built;S.built=m==='built';const mm=S.built?'bike':m;if(mm===S.mode){if(was!==S.built){derive();syncSpeed();header();rebuild();renderInsp();}}else setMode(mm);modeBtns();}));
window.__abChanged=geomChanged=>{if(geomChanged){AB.recompute(S.v);derive();rebuild();}header();renderInsp();};modeBtns();
function showView(v){S.view=v;document.querySelectorAll('.vseg button[data-v]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===v));c3.hidden=v!=='3d';c2.hidden=v==='3d';$('fit').style.display=v==='3d'?'':'none';if(R3)R3.resize();}
document.querySelectorAll('.vseg button[data-v]').forEach(b=>b.addEventListener('click',()=>{showView(b.dataset.v);knock(1500,.015,.1);}));
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{S.tab=b.dataset.t;document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));renderInsp();$('insp').scrollTop=0;if(S.tab==='evolve'&&S.view!=='evo')showView('evo');if(S.tab==='test'&&S.view!=='test')showView('test');}));
function setBody(b){S.body=b;document.querySelectorAll('[data-b]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.b===b));rebuild();}
document.querySelectorAll('[data-b]').forEach(b=>b.addEventListener('click',()=>{setBody(b.dataset.b);renderInsp();knock(900,.04,.2);}));
$('snd').addEventListener('click',e=>{S.sound=!S.sound;e.currentTarget.setAttribute('aria-pressed',S.sound);if(S.sound){audio();knock(900,.05,.25);}});
$('xray').addEventListener('click',e=>{S.bare=!S.bare;e.currentTarget.setAttribute('aria-pressed',S.bare);if(R3)R3.bare(S.bare);});
$('fit').addEventListener('click',()=>{if(R3)Object.assign(R3.cam,{th:.6,ph:1.3,r:4.0,tx:-.1,ty:.78});});
derive();
if(T){R3=build3D();const ptr=new Map();let g0=null;
  c3.addEventListener('pointerdown',e=>{c3.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptr.size===2){const [a,b]=[...ptr.values()];g0={pinch:1,d:Math.hypot(a.x-b.x,a.y-b.y),r:R3.cam.r};}else g0={x:e.clientX,y:e.clientY,th:R3.cam.th,ph:R3.cam.ph,mv:false};});
  c3.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId)||!g0)return;ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(g0.pinch){if(ptr.size===2){const [a,b]=[...ptr.values()];R3.cam.r=Math.max(.8,Math.min(9,g0.r*g0.d/Math.max(1,Math.hypot(a.x-b.x,a.y-b.y))));}return;}const dx=e.clientX-g0.x,dy=e.clientY-g0.y;if(Math.hypot(dx,dy)>5)g0.mv=true;R3.cam.th=g0.th-dx*.008;R3.cam.ph=Math.max(.2,Math.min(1.55,g0.ph-dy*.006));});
  c3.addEventListener('pointerup',e=>{const p=ptr.get(e.pointerId);ptr.delete(e.pointerId);if(g0&&!g0.pinch&&!g0.mv&&p){const n=R3.pick(e.clientX,e.clientY);if(n){vstat(n);S.hold=performance.now()+3500;knock(2200,.015,.1);}}if(!ptr.size)g0=null;});
  c3.addEventListener('pointercancel',e=>{ptr.delete(e.pointerId);if(!ptr.size)g0=null;});
  c3.addEventListener('wheel',e=>{e.preventDefault();R3.cam.r=Math.max(.8,Math.min(9,R3.cam.r*Math.exp(e.deltaY*.0012)));},{passive:false});
  $('loading').remove();}else $('loading').textContent='3D library did not load. Side, Plate, Leg and Evolve still work.';
new ResizeObserver(()=>{if(R3)R3.resize();}).observe($('view'));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{readC();if(R3)R3.scene.background=new T.Color(C.view).convertSRGBToLinear();});
let last=performance.now(),lastCon=[false,false],evT=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(EV.running){const t0=performance.now();while(EV.running&&performance.now()-t0<14)evStep();if(now-evT>400){evT=now;if(S.tab==='evolve')renderInsp();}if(!EV.running&&S.tab==='evolve')renderInsp();}
  if(S.playing){S.dist+=S.v*dt;const rate=S.built&&S.mode==='bike'?AB.phaseRate(S.v):S.v/K.advG;S.ph=((S.ph+rate*dt)%1+1)%1;}
  const con=[0,.5].map(o=>onGround(S.ph+o));if(S.mode==='pack')con.forEach((c,i)=>{if(c&&!lastCon[i])knock(i?520:600,.06,.3);});lastCon=con;
  if(S.view==='3d'&&R3){R3.pose(S.ph);R3.updCam();R3.render();if(!S.hold||now>S.hold){const st=S.step>=0?steps()[S.step]:null;vstat(st?st.t:S.built&&S.mode==='bike'?'3d · as built · cords coloured by pull, blue slack to orange tight':`3d · ${MODES[S.mode].name.toLowerCase()} mode · blue square = the 356 mm platform · tap a part`);}}
  else if(S.view==='elev')drawElev();else if(S.view==='plate')drawPlate();else if(S.view==='leg')drawLeg();else if(S.view==='test')drawTest();else drawEvo();
  drawScrub();requestAnimationFrame(frame);}
if(R3)R3.resize();syncSpeed();header();renderInsp();requestAnimationFrame(frame);
})();
