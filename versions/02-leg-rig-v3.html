<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<title>Centaur Leg Rig</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen instrument. Header with mode switch, one stage where every view shares one space, a time strip, a dock whose panels slide up over the strip. */
:root{
  --paper:#eceeed; --sheet:#f7f8f7; --ink:#15181b; --ink-2:#555c62; --rule:#cdd2d3;
  --muscle:#d9785f; --tendon:#2f55c9; --far:#a3abb1; --accent:#2f55c9; --accent-ink:#fff; --ground:#7c8489; --warn:#c2410c; --ok:#15803d;
  --j0:#7c4dcc; --j1:#d13f78; --j2:#d9822b; --j3:#21915f; --j4:#2f55c9; --j5:#15181b;
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1214; --sheet:#161a1d; --ink:#e7eaeb; --ink-2:#9ea7ad; --rule:#2c3338;
  --muscle:#e58a72; --tendon:#7f9dff; --far:#4f585e; --accent:#7f9dff; --accent-ink:#0d1014; --ground:#6b7479; --warn:#fb923c; --ok:#4ade80;
  --j0:#b393ff; --j1:#ff7fae; --j2:#ffb15c; --j3:#5fd39b; --j4:#86a3ff; --j5:#e7eaeb; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0f1214; --sheet:#161a1d; --ink:#e7eaeb; --ink-2:#9ea7ad; --rule:#2c3338;
  --muscle:#e58a72; --tendon:#7f9dff; --far:#4f585e; --accent:#7f9dff; --accent-ink:#0d1014; --ground:#6b7479; --warn:#fb923c; --ok:#4ade80;
  --j0:#b393ff; --j1:#ff7fae; --j2:#ffb15c; --j3:#5fd39b; --j4:#86a3ff; --j5:#e7eaeb; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.4;overflow:hidden;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:8px}
.app{height:100%;max-width:1100px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:6px;position:relative}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:500;font-size:17px;letter-spacing:.16em;text-transform:uppercase;margin:0;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden;background:var(--sheet)}
.seg button{font:500 13px var(--f-body);border:0;background:transparent;color:var(--ink);padding:6px 11px;min-height:32px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
canvas{display:block;width:100%;height:100%;background:var(--sheet);border:1px solid var(--rule);border-radius:4px;touch-action:none}
.stagebox{min-height:0;position:relative}
.stripbox{height:clamp(96px,17vh,150px)}
.dock{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{font:600 13px var(--f-body);border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:6px 12px;border-radius:4px;cursor:pointer;min-height:34px;display:inline-flex;align-items:center;gap:7px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.icon{display:inline-block;position:relative;width:12px;height:12px}
.icon.play{width:0;height:0;border-left:11px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent}
.icon.pause::before,.icon.pause::after{content:"";position:absolute;top:0;width:4px;height:12px;background:currentColor}
.icon.pause::before{left:1px}.icon.pause::after{right:1px}
.spk{position:relative;width:16px;height:12px;display:inline-block}
.spk::before{content:"";position:absolute;left:0;top:3px;width:4px;height:6px;background:currentColor}
.spk::after{content:"";position:absolute;left:3px;top:0;border-right:6px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent;width:0;height:0}
.spk i{position:absolute;left:10px;top:2px;width:6px;height:8px;border:2px solid currentColor;border-left:0;border-radius:0 8px 8px 0;opacity:.25}
[aria-pressed="true"] .spk i{opacity:1}
.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.tab{font:500 13px var(--f-body);border:1px solid var(--rule);background:var(--sheet);color:var(--ink);padding:6px 10px;border-radius:4px;cursor:pointer;min-height:34px}
.tab[aria-expanded="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.mini{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.mini input{width:84px;accent-color:var(--accent)}
.val{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink);font-size:12px;min-width:4.5ch;text-align:right}
.dockwrap{position:relative}
.panel{position:absolute;left:0;right:0;bottom:100%;margin-bottom:6px;max-height:min(60vh,540px);overflow:auto;background:var(--sheet);border:1px solid var(--ink);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 -8px 24px rgb(0 0 0 / .18);z-index:5}
.panel[hidden]{display:none}
.panel>*{flex-shrink:0}
.panel h3{margin:0;font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.panel h4{margin:4px 0 0;font:600 13px var(--f-body)}
.panel p{margin:0;font-size:13px;color:var(--ink-2);max-width:68ch}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lab{font-size:13px;color:var(--ink-2)}
.chip{font:500 13px var(--f-body);border:1px solid var(--rule);background:var(--paper);color:var(--ink);padding:5px 11px;border-radius:999px;cursor:pointer;min-height:32px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sl{display:grid;grid-template-columns:minmax(7.5em,auto) 1fr auto;gap:8px;align-items:center;font-size:13px;color:var(--ink-2)}
.sl input{width:100%;accent-color:var(--accent)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px 18px}
.sheetwrap{overflow-x:auto;border:1px solid var(--rule);background:#fff;border-radius:3px}
.sheetwrap svg{display:block;height:auto;width:100%;min-width:360px;max-height:46vh}
.xsec{border:1px solid var(--rule);border-radius:3px;background:#fff;overflow-x:auto}
.xsec svg{display:block;width:100%;min-width:320px;height:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
.tw{overflow-x:auto}
th,td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--rule);white-space:nowrap}
th{font-weight:600;color:var(--ink-2);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
td.pass{color:var(--ok);font-weight:600}td.fail{color:var(--warn);font-weight:600}
ol.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px;font-size:13px;max-width:70ch}
ol.steps b{font-weight:600}
.toast{font-size:12px;color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,canvas:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,.num{font:500 13px var(--f-body);padding:5px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);color:var(--ink);min-height:32px}
.num{width:6em}
@media (max-width:560px){.mini .lbl{display:none} .mini input{width:64px} h1{font-size:14px;letter-spacing:.12em} .seg button{padding:6px 9px}}
</style>

<div class="app">
  <header>
    <h1>Centaur Leg Rig</h1>
    <div class="seg" role="group" aria-label="Mode"><button type="button" data-mode="horse" aria-pressed="true">Horse</button><button type="button" data-mode="wear" aria-pressed="false">Walk</button><button type="button" data-mode="bike" aria-pressed="false">Bike</button><button type="button" data-mode="evolve" aria-pressed="false">Evolve</button></div>
  </header>
  <div class="stagebox"><canvas id="stage" tabindex="0" aria-label="Simulation stage. Drag to scrub time, pinch to zoom, tap a joint to select it."></canvas></div>
  <div class="stripbox"><canvas id="strip" aria-label="Values over one cycle. Drag to scrub."></canvas></div>
  <div class="dockwrap">
    <div class="panel" id="panel" hidden></div>
    <div class="dock">
      <button class="btn" id="play" type="button" aria-label="Pause"><span class="icon pause" id="playIcon"></span></button>
      <button class="btn ghost" id="snd" type="button" aria-pressed="false" aria-label="Sound"><span class="spk"><i></i></span></button>
      <label class="mini"><span class="lbl">Speed</span><input id="speed" type="range" min="0.05" max="1.5" step="0.05" value="0.4"><span class="val" id="speedV">0.40×</span></label>
      <div class="tabs" role="group" aria-label="Panels">
        <button class="tab" type="button" data-tab="time" aria-expanded="false">Time</button>
        <button class="tab" type="button" data-tab="drive" aria-expanded="false" id="driveTab">Gait</button>
        <button class="tab" type="button" data-tab="layers" aria-expanded="false">Layers</button>
        <button class="tab" type="button" data-tab="build" aria-expanded="false">Build</button>
      </div>
    </div>
  </div>
</div>

<script>
(()=>{
/* =================== math =================== */
const D2R=Math.PI/180,TAU=Math.PI*2,G0=9.81;
const V=(x,y)=>({x,y}),dir=a=>V(Math.cos(a),Math.sin(a)),add=(p,v,s=1)=>V(p.x+v.x*s,p.y+v.y*s),sub=(a,b)=>V(a.x-b.x,a.y-b.y),len=v=>Math.hypot(v.x,v.y);
const lerp=(a,b,t)=>a+(b-a)*t,mod1=x=>((x%1)+1)%1,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rot90=v=>V(-v.y,v.x);
function interiorAt(a,p,b){const u=sub(a,p),v=sub(b,p);return Math.acos(clamp((u.x*v.x+u.y*v.y)/(len(u)*len(v)||1),-1,1))/D2R;}
function circ(p,r1,q,r2,side){const dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy);if(d<1e-9)return null;const a=(r1*r1-r2*r2+d*d)/(2*d),hh=r1*r1-a*a;if(hh<0)return null;const h=Math.sqrt(hh),mx=p.x+a*dx/d,my=p.y+a*dy/d;return V(mx-side*h*dy/d,my+side*h*dx/d);}

/* =================== state =================== */
const S={mode:'horse',gait:'walk',custom:null,t:0,playing:true,speed:.4,spread:0,ghosts:0,dist:0,
  layers:{bones:true,forms:true,traces:true,labels:'horse',forces:false,far:true,jansen:false,centaur:false},
  sel:'LH:2',view:{z:1,tx:0,ty:0},withers:24,unit:'cm',build:'foam',thick:2.5,density:45,
  sound:false,haptic:true,joint:'lap',pinD:6.5,plateD:50};
const WDEF={cadence:.85,mass:.7,barrel:1.5,boom:.8,clear:.04,kb:60,kc:800,slack:.01,wiring:'cross',tie:'knee',lever:.14,fold:.9,ground:true};
const W={...WDEF};
const BDEF={drive:'crank',rpm:70,gear:2.6,R:2,ecc:.035,lever:.12,cadj:0,mass:.6,clear:.08,fold:.9};
const BK={...BDEF};

/* =================== horse model =================== */
const P={hind:{femur:.23,tibia:.24,cannon:.17,digit:.09,theta0:-56*D2R,stifle0:60*D2R,hock0:26*D2R,k:.9,curl:60*D2R,x:-.45},
  fore:{scap:.28,hum:.20,fore:.27,cannon:.15,digit:.085,sig0:-62*D2R,sh0:66*D2R,el0:38*D2R,curl:85*D2R,x:.34},alpha0:55*D2R};
const GAITS={
  walk:{label:'Walk',duty:.62,off:{LH:0,LF:.25,RH:.5,RF:.75},L:.40,lift:{H:.10,F:.10},cycle:1.1,bob:{A:.008,n:2,pitch:0},drop:8,beats:'4-beat lateral'},
  trot:{label:'Trot',duty:.42,off:{LH:0,RF:0,RH:.5,LF:.5},L:.42,lift:{H:.13,F:.15},cycle:.72,bob:{A:.018,n:2,pitch:0},drop:14,beats:'2-beat diagonal'},
  canter:{label:'Canter',duty:.38,off:{LH:0,RH:.25,LF:.25,RF:.45},L:.42,lift:{H:.15,F:.2},cycle:.62,bob:{A:.022,n:1,pitch:.05},drop:18,beats:'3-beat, right lead'},
  gallop:{label:'Gallop',duty:.28,off:{LH:0,RH:.10,LF:.32,RF:.42},L:.44,lift:{H:.2,F:.26},cycle:.45,bob:{A:.03,n:1,pitch:.07},drop:24,beats:'4-beat transverse'},
};
const LEGS=['LH','RH','LF','RF'];
const gait=()=>S.gait==='custom'?S.custom:GAITS[S.gait];
function fkHind(a,th,ph){const h=P.hind;const a1=th,p1=add(a,dir(a1),h.femur),a2=a1-(h.stifle0+ph),p2=add(p1,dir(a2),h.tibia),a3=a2+h.hock0+h.k*ph,p3=add(p2,dir(a3),h.cannon);return {pts:[a,p1,p2,p3],ang:[a1,a2,a3]};}
function fkFore(a,sg,ep,cf){const f=P.fore;const a1=sg,p1=add(a,dir(a1),f.scap),a2=a1-f.sh0+.6*ep,p2=add(p1,dir(a2),f.hum),a3=a2+f.el0+ep,p3=add(p2,dir(a3),f.fore),a4=a3-cf,p4=add(p3,dir(a4),f.cannon);return {pts:[a,p1,p2,p3,p4],ang:[a1,a2,a3,a4]};}
const ca=Math.cos(P.alpha0),sa=Math.sin(P.alpha0);
const sh0=fkHind(V(0,0),P.hind.theta0,0).pts[3],sf0=fkFore(V(0,0),P.fore.sig0,0,0).pts[4];
const HIP=V(P.hind.x,-(sh0.y-P.hind.digit*sa)),SCAP=V(P.fore.x,-(sf0.y-P.fore.digit*sa));
const TOE0={H:HIP.x+sh0.x+P.hind.digit*ca,F:SCAP.x+sf0.x+P.fore.digit*ca};
const BODYC=V(0,.72);
function legTarget(G,leg,t){const kind=leg[1],d=kind==='H'?P.hind.digit:P.fore.digit;const p=mod1(t-G.off[leg]),x0=TOE0[kind]-(kind==='H'?.05:.035),L=G.L;const curl=kind==='H'?P.hind.curl:P.fore.curl;
  if(p<G.duty){const u=p/G.duty,gx=x0+L/2-L*u,al=P.alpha0-G.drop*D2R*Math.sin(Math.PI*u);return {F:V(gx-d*Math.cos(al),d*Math.sin(al)),toe:V(gx,0),dang:-al,stance:true,s:0};}
  const s=(p-G.duty)/(1-G.duty),e=.5-.5*Math.cos(Math.PI*s);const F=V(lerp(x0-L/2-d*ca,x0+L/2-d*ca,e),d*sa+G.lift[kind]*Math.pow(Math.sin(Math.PI*s),.8));const dang=-P.alpha0-curl*Math.pow(Math.sin(Math.PI*s),1.3);
  return {F,toe:add(F,dir(dang),d),dang,stance:false,s};}
function solve1(fk,u,v,target,lo,hi){let err=1;for(let it=0;it<30;it++){const e0=fk(u,v),ex=target.x-e0.x,ey=target.y-e0.y;err=Math.hypot(ex,ey);if(err<1e-5)break;const h=1e-4,eu=fk(u+h,v),ev=fk(u,v+h);
  const j11=(eu.x-e0.x)/h,j21=(eu.y-e0.y)/h,j12=(ev.x-e0.x)/h,j22=(ev.y-e0.y)/h,lam=.002,a=j11*j11+j21*j21+lam,b=j11*j12+j21*j22,c=j12*j12+j22*j22+lam,r1=j11*ex+j21*ey,r2=j12*ex+j22*ey,det=a*c-b*b;
  let du=(c*r1-b*r2)/det,dv=(a*r2-b*r1)/det;const m=Math.max(Math.abs(du),Math.abs(dv));if(m>.25){du*=.25/m;dv*=.25/m;}u+=du;v=clamp(v+dv,lo,hi);}return [u,v,err];}
function solve(fk,u,v,T,lo,hi,u0){let r=solve1(fk,u,v,T,lo,hi);if(r[2]>.01){const r2=solve1(fk,u0,0,T,lo,hi);if(r2[2]<r[2])r=r2;}return r;}
const warm={};
function xf(pt,bp){const dx=pt.x-BODYC.x,dy=pt.y-BODYC.y,c=Math.cos(bp.pitch),s=Math.sin(bp.pitch);return V(BODYC.x+dx*c-dy*s,BODYC.y+dx*s+dy*c+bp.y);}
function poseHorse(t,wk=''){
  const G=gait();const bp={y:G.bob.A*Math.cos(TAU*(G.bob.n*t-.15)),pitch:G.bob.pitch*Math.sin(TAU*(t-.1))};
  const hip=xf(HIP,bp),scap=xf(SCAP,bp);const chains=[];
  for(const leg of LEGS){const T=legTarget(G,leg,t),kind=leg[1],key=wk+leg;
    if(kind==='H'){let [a,b]=warm[key]||[P.hind.theta0,0];const r=solve((u,v)=>fkHind(hip,u,v).pts[3],a,b,T.F,-40*D2R,115*D2R,P.hind.theta0);warm[key]=[r[0],r[1]];const fk=fkHind(hip,r[0],r[1]);
      chains.push({id:leg,kind:'H',near:leg[0]==='L',pts:[...fk.pts,add(fk.pts[3],dir(T.dang),P.hind.digit)],stance:T.stance,scale:1});}
    else{const cf=T.stance?0:100*D2R*Math.pow(Math.sin(Math.PI*T.s),1.1)*(.6+.4*(G.lift.F/.26));let [a,b]=warm[key]||[P.fore.sig0,0];
      const r=solve((u,v)=>fkFore(scap,u,v,cf).pts[4],a,b,T.F,-45*D2R,130*D2R,P.fore.sig0);warm[key]=[r[0],r[1]];const fk=fkFore(scap,r[0],r[1],cf);
      chains.push({id:leg,kind:'F',near:leg[0]==='L',pts:[...fk.pts,add(fk.pts[4],dir(T.dang),P.fore.digit)],stance:T.stance,scale:1});}}
  return {mode:'horse',t,bp,chains};
}

/* =================== foam hind leg (shared by Walk and Bike) =================== */
const FR={femur:.23,tibia:.24,cannon:.17,digit:.09};
const MFR=[.42,.28,.15,.15],CFR=[.5,.5,.5,.7];
function unitDrop(){const a1=P.hind.theta0,a2=a1-P.hind.stifle0,a3=a2+P.hind.hock0,a4=a3+35*D2R;return -(FR.femur*Math.sin(a1)+FR.tibia*Math.sin(a2)+FR.cannon*Math.sin(a3)+FR.digit*Math.sin(a4));}
function fkFoam(pv,th,k,fold){const phi=fold*Math.max(0,th);const a1=P.hind.theta0+th,a2=a1-(P.hind.stifle0+phi),a3=a2+P.hind.hock0+.9*phi,a4=a3+35*D2R-1.2*phi;
  const p1=add(pv,dir(a1),FR.femur*k),p2=add(p1,dir(a2),FR.tibia*k),p3=add(p2,dir(a3),FR.cannon*k),p4=add(p3,dir(a4),FR.digit*k);return {pts:[pv,p1,p2,p3,p4]};}
function legMech(th,k,mass,fold,g=G0){const pr=fkFoam(V(0,0),th,k,fold).pts;let I=0,Vg=0;const Ls=[FR.femur,FR.tibia,FR.cannon,FR.digit].map(x=>x*k);
  for(let i=0;i<4;i++){const m=MFR[i]*mass,cx=lerp(pr[i].x,pr[i+1].x,CFR[i]),cy=lerp(pr[i].y,pr[i+1].y,CFR[i]);I+=m*(cx*cx+cy*cy+Ls[i]*Ls[i]/12);Vg+=m*g*cy;}return {I,V:Vg};}
function gravTorque(th,k,mass,fold,g=G0){const h=1e-4;return -(legMech(th+h,k,mass,fold,g).V-legMech(th-h,k,mass,fold,g).V)/(2*h);}

/* =================== walking rig (you are the front legs) =================== */
const WP={hipH:.92,thigh:.47,shank:.47,foot:.22,HX:.22,S:1.15,duty:.62,bob:.02};
function humanAnkle(p){const E=WP.S*WP.duty,x0=WP.HX+.04,s22=Math.sin(22*D2R);
  if(p<WP.duty){const u=p/WP.duty;const heel=u>.72?(u-.72)/.28*32*D2R:0;return {ankle:V(x0+E/2-E*u,.085+WP.foot*(Math.sin(22*D2R+heel)-s22)),fa:-22*D2R-heel,stance:true};}
  const s=(p-WP.duty)/(1-WP.duty),e=.5-.5*Math.cos(Math.PI*s);return {ankle:V(lerp(x0-E/2,x0+E/2,e),.085+WP.foot*(Math.sin(54*D2R)-s22)*(1-e)+.11*Math.pow(Math.sin(Math.PI*s),.9)),fa:lerp(-54,-22,e)*D2R,stance:false};}
function twoBone(h,t,L1,L2){const d=sub(t,h);const dl=clamp(len(d),.05,L1+L2-1e-4);const a=Math.atan2(d.y,d.x);const al=Math.acos(clamp((L1*L1+dl*dl-L2*L2)/(2*L1*dl),-1,1));return [add(h,dir(a+al),L1),add(h,dir(a),dl)];}
const humanPhaseOff={R:0,L:.5};
function wearFrame(time,T){const ph=time/T,w2=TAU*2/T;const hip=V(WP.HX,WP.hipH+WP.bob*Math.cos(TAU*2*ph));

const legScaleW=()=>(WP.hipH+.01-W.clear)/unitDrop();
function cableAttach(pv,th,k){const d=dir(P.hind.theta0+th);return add(add(pv,d,.3*FR.femur*k),rot90(d),W.lever);}
function bungeeAttach(pv,th,k){const d=dir(P.hind.theta0+th);return add(add(pv,d,.35*FR.femur*k),rot90(d),-.05);}
let SIM=null,simKey='';
function simulate(){
  const T=1/W.cadence,vW=WP.S/T,dt=1/2000,steps=Math.round(T/dt),k=legScaleW(),N=240;
  const drivers=W.wiring==='cross'?{LH:'R',RH:'L'}:W.wiring==='same'?{LH:'L',RH:'R'}:{LH:null,RH:null};
  const tieAt=(side,time)=>{const f=wearFrame(time,T);const [kn,an]=twoBone(f.hip,humanAnkle(mod1(time/T-humanPhaseOff[side])).ankle,WP.thigh,WP.shank);return W.tie==='knee'?kn:an;};
  const l0={};for(const leg of ['LH','RH']){const s=drivers[leg];if(!s){l0[leg]=0;continue;}let mn=1e9;for(let i=0;i<120;i++){const tm=i/120*T,f=wearFrame(tm,T);mn=Math.min(mn,len(sub(tieAt(s,tm),f.pA))+len(sub(f.pB,cableAttach(f.pivot,0,k))));}l0[leg]=mn+W.slack;}
  const fz=wearFrame(0,T);const lb0=.7*len(sub(fz.pK,bungeeAttach(fz.pivot,0,k)));

    let tau=gravTorque(t,k,W.mass,W.fold,g);const I=legMech(t,k,W.mass,W.fold,g).I;
    let Tc=0;const s=drivers[leg];
    if(s){const an=tieAt(s,time),an2=tieAt(s,time+1e-3),f2=wearFrame(time+1e-3,T);const s1=len(sub(an,f.pA)),s1b=len(sub(an2,f2.pA));
      const lf=x=>len(sub(f.pB,cableAttach(f.pivot,x,k)));const dl=(lf(t+h)-lf(t-h))/(2*h),l=s1+lf(t),ldot=(s1b-s1)/1e-3+dl*w;

    const lb=x=>len(sub(f.pK,bungeeAttach(f.pivot,x,k)));const Tb=W.kb*Math.max(0,lb(t)-lb0);tau-=Tb*(lb(t+h)-lb(t-h))/(2*h);

  for(let c=0;c<cycles;c++){let nextRec=0;for(let s=0;s<steps;s++){const time=(c*steps+s)*dt,doRec=nextRec<N&&s>=nextRec*steps/N;

        if(doRec){if(c===cycles-2)prev[leg].push(th[leg]);if(c===cycles-1){const R=rec[leg];R.th.push(th[leg]);R.T.push(r.Tc);R.Tb.push(r.Tb);R.N.push(r.N);R.toe.push(r.toeY);}}}

}
function sampleRec(arr,ph){const N=arr.length;const x=mod1(ph)*N,i=Math.floor(x)%N,f=x-Math.floor(x);return lerp(arr[i],arr[(i+1)%N],f);}

  for(const side of ['R','L']){const h=humanAnkle(mod1(ph-humanPhaseOff[side]));const [knee,ank]=twoBone(f.hip,h.ankle,WP.thigh,WP.shank);hum[side]={tie:W.tie==='knee'?knee:ank};
    chains.push({id:side+'F',kind:'U',near:side==='L',pts:[f.hip,knee,ank,add(ank,dir(h.fa),WP.foot)],stance:h.stance,scale:1});}
  const ex={frame:f,cables:[],bungees:[],ground:[]};

    ex.bungees.push({leg,pts:[f.pK,bungeeAttach(f.pivot,th,k)],T:sampleRec(R.Tb,ph),near:leg==='LH'});

/* =================== bike rig: crank- or wheel-driven four-bar =================== */
const BG={bb:V(0,.28),rh:V(-.42,.34),fh:V(.62,.34),wr:.34,seatTop:V(-.13,.93),head:V(.5,.86),bar:V(.46,1.02),rackF:V(-.16,.80),rackB:V(-.66,.80),pivot:V(-.76,.80),crank:.17,hip:V(-.1,.99)};
const legScaleB=()=>(BG.pivot.y-BK.clear)/unitDrop();
function bikeDrive(){const O=BK.drive==='crank'?BG.bb:BG.rh,Pv=BG.pivot,toO=Math.atan2(O.y-Pv.y,O.x-Pv.x),beta=toO+Math.PI/2-P.hind.theta0;
  const Q0=add(Pv,dir(P.hind.theta0+beta),BK.lever);return {O,P:Pv,beta,Q0,c:len(sub(Q0,O))+BK.cadj};}
function rocker(dr,ang){const pin=add(dr.O,dir(ang),BK.ecc);const a=circ(dr.P,BK.lever,pin,dr.c,1),b=circ(dr.P,BK.lever,pin,dr.c,-1);if(!a||!b)return {pin,locked:true,th:0,Q:null,mu:0};
  const Q=len(sub(a,dr.Q0))<len(sub(b,dr.Q0))?a:b;const th=Math.atan2(Q.y-dr.P.y,Q.x-dr.P.x)-dr.beta-P.hind.theta0;
  const u=sub(pin,Q),v=sub(dr.P,Q);const mu=Math.acos(clamp((u.x*v.x+u.y*v.y)/(len(u)*len(v)),-1,1));return {pin,Q,th:Math.atan2(Math.sin(th),Math.cos(th)),mu:Math.min(mu,Math.PI-mu),locked:false};}
const crankHz=()=>BK.rpm/60;
const bikeV=()=>crankHz()*BK.gear*2.1;
const bikeCycle=()=>BK.drive==='crank'?60/BK.rpm:BK.R/(crankHz()*BK.gear);
function poseBike(t){const dr=bikeDrive(),k=legScaleB();const psi=-TAU*t+Math.PI/2;const pedal=BK.drive==='crank'?psi:-TAU*t*BK.R/BK.gear+Math.PI/2;
  const chains=[],rods=[];let locked=false;
  for(const [side,off] of [['R',Math.PI],['L',0]]){const pp=add(BG.bb,dir(pedal+off),BG.crank);const ank=add(pp,V(-.03,.08));const [knee,a2]=twoBone(BG.hip,ank,WP.thigh,WP.shank);
    chains.push({id:side+'F',kind:'U',near:side==='L',pts:[BG.hip,knee,a2,add(a2,dir(-12*D2R),WP.foot)],stance:false,scale:1,pedal:pp,aperiodic:BK.drive!=='crank'});}
  for(const [leg,off] of [['RH',Math.PI],['LH',0]]){const r=rocker(dr,psi+off);locked=locked||r.locked;const fk=fkFoam(dr.P,r.th,k,BK.fold);

/* =================== Jansen linkage + evolution =================== */
const HOLY={a:38,b:41.5,c:39.3,d:40.1,e:55.8,f:39.4,g:36.7,h:65.7,i:49,j:50,k:61.9,l:7.8,m:15};
const GENES=['a','b','c','d','e','f','g','h','i','j','k','l'];
let JCUR={...HOLY};
function linkage(Jx,th){const O=V(0,0),B=V(-Jx.a,-Jx.l),C=V(Jx.m*Math.cos(th),Jx.m*Math.sin(th));const D=circ(B,Jx.b,C,Jx.j,1);if(!D)return null;const E=circ(B,Jx.c,C,Jx.k,-1);if(!E)return null;
  const F=circ(B,Jx.d,D,Jx.e,1);if(!F)return null;const G=circ(F,Jx.f,E,Jx.g,-1);if(!G)return null;const H=circ(G,Jx.h,E,Jx.i,-1);if(!H)return null;return {O,B,C,D,E,F,G,H};}
function analyze(Jx,n=72){const pts=[];for(let k=0;k<n;k++){const L=linkage(Jx,k/n*TAU);if(!L)return null;pts.push(L.H);}
  // continuity: reject branch jumps
  for(let k=0;k<n;k++){if(len(sub(pts[k],pts[(k+1)%n]))>Jx.m*1.6)return null;}
  const ys=pts.map(p=>p.y),ymin=Math.min(...ys),ymax=Math.max(...ys),R=ymax-ymin;if(R<1e-6)return null;
  const con=ys.map(y=>y<ymin+.06*R);let best=[0,0];for(let s=0;s<n;s++){if(!con[s]||con[(s-1+n)%n])continue;let l=0;while(l<n&&con[(s+l)%n])l++;if(l>best[1])best=[s,l];}
  if(best[1]===0&&con.every(Boolean))best=[0,n];
  const [s,L]=best;if(L<3)return null;const run=[];for(let i=0;i<L;i++)run.push(pts[(s+i)%n]);
  const stride=Math.abs(run[L-1].x-run[0].x);if(stride<1e-3)return null;
  const flat=Math.sqrt(run.reduce((a,p)=>a+(p.y-ymin)**2,0)/L)/stride;const dx=[];for(let i=1;i<L;i++)dx.push(run[i].x-run[i-1].x);
  const mdx=dx.reduce((a,b)=>a+b,0)/dx.length,cv=Math.sqrt(dx.reduce((a,b)=>a+(b-mdx)**2,0)/dx.length)/(Math.abs(mdx)||1e-6);
  return {pts,n,ymin,ymax,R,start:s,runLen:L,duty:L/n,stride,flat,cv,lift:R/stride,dirSign:Math.sign(mdx),mid:(run[0].x+run[L-1].x)/2};}
function crankAt(A,p){const n=A.n;return A.dirSign>0?((A.start+A.runLen-1)/n)*TAU-p*TAU:(A.start/n)*TAU+p*TAU;} // touchdown at p=0, foot moving backward
let JA=analyze(JCUR,360);
const EV={pop:[],gen:0,best:null,hist:[],running:false,target:'flat',rate:.06,N:60,init:'jansen',holyCost:0};
function horseTarget(n){const G=GAITS.walk;const pts=[];for(let i=0;i<n;i++)pts.push(legTarget(G,'LH',i/n).toe);const xs=pts.map(p=>p.x),ymin=Math.min(...pts.map(p=>p.y));const st=G.L,mid=TOE0.H-.05;return pts.map(p=>V((p.x-mid)/st,(p.y-ymin)/st));}
const HT=horseTarget(48);
function costOf(Jx){const A=analyze(Jx,48);if(!A)return {c:99,A:null};
  let c;if(EV.target==='flat'){c=12*A.flat+1.2*A.cv+4*Math.max(0,.2-A.lift)+2.5*Math.abs(A.duty-.5)+6*Jx.m/A.stride;}
  else{const n=48;const seq=[];for(let i=0;i<n;i++){const ang=crankAt(A,i/n);const idx=Math.round(mod1(ang/TAU)*n)%n;const p=A.pts[idx];seq.push(V((p.x-A.mid)/A.stride*(-A.dirSign)*-1,(p.y-A.ymin)/A.stride));}
    let best=1e9;for(let sh=-4;sh<=4;sh++){let s=0;for(let i=0;i<n;i++){const q=seq[(i+sh+n)%n],h=HT[i];s+=Math.hypot(q.x-h.x,q.y-h.y);}best=Math.min(best,s/n);}

function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*v);}

function evStep(){const pop=EV.pop,N=EV.N;const next=pop.slice(0,3);const pick=()=>{let b=null;for(let i=0;i<3;i++){const c=pop[Math.floor(Math.random()*pop.length)];if(!b||c.c<b.c)b=c;}return b;};
  while(next.length<N){const a=pick().g,b=pick().g,g={m:15};for(const k of GENES){let v=Math.random()<.5?a[k]:b[k];if(Math.random()<.35)v+=gauss()*EV.rate*Math.max(5,v);g[k]=k==='l'?clamp(v,-30,40):clamp(v,4,160);}const r=costOf(g);next.push({g,c:r.c,A:r.A});}

const M=96;let CACHE=null,cacheKey='';

function bearingRows(){const {F,why}=jointLoad(),t=S.thick*10,d=S.pinD,D=S.plateD,lim=70,glue=50;const kPa=(f,a)=>f/a*1000;
  const rows=[['Bare pin in foam',kPa(F,d*t),lim,'bearing'],['PVC bushing in foam (21 mm OD)',kPa(F,21.3*t),lim,'bearing']];
  if(S.joint==='lap')rows.push(['Cheek plates, glued both faces',kPa(F,2*Math.PI*D*D/4),glue,'glue shear']);
  if(S.joint==='clevis')rows.push(['Plates on two prongs, double shear',kPa(F/2,2*Math.PI*D*D/4),glue,'glue shear']);
  if(S.joint==='strap')rows.push(['Webbing 25 mm × 150 mm, both faces',kPa(F,2*25*150),glue,'glue shear']);
  if(S.joint==='knuckle')rows.push(['4 knuckles × 50 mm of PVC',kPa(F,4*50*21.3),glue,'glue shear']);
  if(S.joint==='spar')rows.push(['Ply tang 30 mm × 220 mm, both faces',kPa(F,2*30*220),glue,'glue shear']);
  return {F,why,rows};}
function buildPanel(){
  panel.append(el('h3','Joint'),el('p','Your sketch is a pinned lap joint with cheek plates. Bead foam crushes under a narrow pin, so every option here spreads the pin load over a larger glued area. Pick one to see its section, its stack-up and whether the foam survives the load from the current rig.'));
  const r=rowOf();for(const k in JOINTS)r.append(chip(JOINTS[k].name,S.joint===k,()=>{S.joint=k;}));panel.append(r);
  const J0=JOINTS[S.joint];const xs=el('div');xs.className='xsec';xs.innerHTML=xsecSVG(S.joint);panel.append(xs);
  panel.append(el('p',`<b>${J0.name}</b> (${J0.src}). ${J0.free}. ${J0.align}. ${J0.note}`));
  const ol=el('ol');ol.className='steps';ol.innerHTML=J0.stack.map(s=>`<li>${s}</li>`).join('');panel.append(el('h4','Stack-up, outside to inside'),ol);
  panel.append(el('h4','Will the foam hold?'),rowOf(slider('jt','Foam thickness',.5,8,.25,S.thick,v=>v.toFixed(2)+' cm',v=>{S.thick=v;renderBearing();}),slider('jp','Plate diameter',20,120,5,S.plateD,v=>v+' mm',v=>{S.plateD=v;renderBearing();})));
  const bt=el('div');bt.className='tw';bt.id='bear';panel.append(bt);
  panel.append(el('h3','Cut template'));
  if(S.mode==='horse'){const f=el('div');f.className='row';f.innerHTML=`<label class="mini" for="wh">Withers height</label><input class="num" id="wh" type="number" min="5" max="400" step="0.5" value="${S.withers}"><select id="wu" aria-label="Unit"><option value="cm"${S.unit==='cm'?' selected':''}>cm</option><option value="in"${S.unit==='in'?' selected':''}>in</option></select><select id="wb" aria-label="Build"><option value="brad"${S.build==='brad'?' selected':''}>Card + brads</option><option value="foam"${S.build==='foam'?' selected':''}>Foam + bolts</option></select>`;panel.append(f);
    f.querySelector('#wh').addEventListener('input',e=>{S.withers=+e.target.value||24;renderSheet();});f.querySelector('#wu').addEventListener('change',e=>{S.unit=e.target.value;renderSheet();});f.querySelector('#wb').addEventListener('change',e=>{S.build=e.target.value;renderSheet();});}
  else panel.append(slider('fde','Foam density',20,200,5,S.density,v=>v+' kg/m³',v=>{S.density=v;renderSheet();}));
  const sw=el('div');sw.className='sheetwrap';sw.id='sheet';panel.append(sw);
  const tst=el('span');tst.className='toast';const cb=btn('Copy SVG',()=>{navigator.clipboard.writeText(lastSvg).then(()=>tst.textContent='Copied. Drawn 1:1 in millimetres.').catch(()=>tst.textContent='Copy was blocked here; long-press the drawing instead.');});panel.append(rowOf(cb,tst));
  const tb=el('div');tb.className='tw';tb.id='btable';panel.append(tb);const notes=el('div');notes.id='bnotes';panel.append(notes);renderSheet();renderBearing();}
function renderBearing(){const b=document.getElementById('bear');if(!b)return;const {F,why,rows}=bearingRows();
  b.innerHTML=`<p style="margin:0 0 6px">Peak load at a leg pivot ≈ <b>${F.toFixed(0)} N</b> (${why}). Limits used: about 70 kPa for 1 lb/ft³ EPS in bearing, about 50 kPa for glue shear into EPS. Check your foam's datasheet; grades vary.</p><table><thead><tr><th>Load path</th><th>Stress</th><th>Limit</th><th></th></tr></thead><tbody>${rows.map(([n,s,l,k])=>`<tr><td>${n}</td><td class="n">${s.toFixed(0)} kPa</td><td class="n">${l} kPa ${k}</td><td class="${s<l*.7?'pass':'fail'}">${s<l*.7?'holds':s<l?'marginal':'crushes'}</td></tr>`).join('')}</tbody></table>`;}
function renderSheet(){const horse=S.mode==='horse';let Hmm,unit,hole,foam;
  if(!horse){Hmm=(S.mode==='bike'?legScaleB():legScaleW())*1000;unit='cm';hole=S.pinD;foam=true;}else{unit=S.unit;Hmm=S.withers*(unit==='cm'?10:25.4);foam=S.build==='foam';hole=foam?S.pinD:3.2;}
  const hind=[['Thigh','femur'],['Gaskin','tibia'],['Cannon','cannon'],['Pastern + hoof','digit']].map(([n,k],i)=>({leg:'Hind',name:n,len:(horse?P.hind[k]:FR[k])*Hmm,pr:PROF.H[i]}));
  const parts=!horse?hind:[...hind,...[['Shoulder','scap'],['Arm','hum'],['Forearm','fore'],['Cannon','cannon'],['Pastern + hoof','digit']].map(([n,k],i)=>({leg:'Fore',name:n,len:P.fore[k]*Hmm,pr:PROF.F[i]}))];
  const gap=Math.max(10,Hmm*.04),fs=Math.max(3.5,Hmm*.025);let x=gap,maxH=0;const items=[];
  for(const p of parts){const wf=Math.max(...p.pr.f)*Hmm,wb=Math.max(...p.pr.b)*Hmm,pad=Math.max(0,fs*5.4-(wf+wb))/2;items.push({p,cx:x+pad+wb});x+=wf+wb+2*pad+gap;maxH=Math.max(maxH,p.len+(p.pr.f[0]+p.pr.f[4])*Hmm);}
  const top=gap+fs*3,Wd=x,Hd=top+maxH+fs*4+gap,sw=Math.max(.3,Hmm*.0015),jt=foam?S.joint:'lap';
  let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${Wd.toFixed(1)}mm" height="${Hd.toFixed(1)}mm" viewBox="0 0 ${Wd.toFixed(1)} ${Hd.toFixed(1)}" font-family="IBM Plex Mono, monospace"><rect width="100%" height="100%" fill="#fff"/>`;
  let areaTot=0;const fmt=v=>unit==='cm'?(v/10).toFixed(1)+' cm':(v/25.4).toFixed(2)+' in';const dash=`stroke-dasharray="${(fs*.35).toFixed(2)} ${(fs*.3).toFixed(2)}"`;
  items.forEach(({p,cx},idx)=>{const a=V(cx,top+p.pr.f[0]*Hmm),b=V(cx,a.y+p.len);
    const pts=outline(V(a.x,-a.y),V(b.x,-b.y),p.pr,Hmm).map(q=>V(q.x,-q.y));if(p.leg==='Hind')areaTot+=polyArea(pts);
    const n=pts.length,mid=(u,v)=>V((u.x+v.x)/2,(u.y+v.y)/2),m0=mid(pts[n-1],pts[0]);let d=`M ${m0.x.toFixed(2)} ${m0.y.toFixed(2)}`;for(let i=0;i<n;i++){const q=pts[i],m=mid(q,pts[(i+1)%n]);d+=` Q ${q.x.toFixed(2)} ${q.y.toFixed(2)} ${m.x.toFixed(2)} ${m.y.toFixed(2)}`;}
    const col=p.pr.m?'#d9785f':'#2f55c9';svg+=`<path d="${d} Z" fill="${col}" fill-opacity=".14" stroke="#15181b" stroke-width="${sw}"/><line x1="${cx}" y1="${a.y}" x2="${cx}" y2="${b.y}" stroke="${col}" stroke-width="${sw*.7}" stroke-dasharray="${fs*.6} ${fs*.4}"/>`;
    if(foam&&p.pr.m&&jt!=='spar'){const rx=Math.min(...p.pr.f.slice(1,4),...p.pr.b.slice(1,4))*Hmm*.45;svg+=`<ellipse cx="${(cx-(p.pr.b[2]-p.pr.f[2])*Hmm*.3).toFixed(2)}" cy="${lerp(a.y,b.y,.45).toFixed(2)}" rx="${rx.toFixed(2)}" ry="${(p.len*.18).toFixed(2)}" fill="none" stroke="#15181b" stroke-width="${sw}" ${dash}/>`;}
    for(const [y,end] of [[a.y,0],[b.y,1]]){
      if(jt==='strap'){svg+=`<rect x="${cx-12.5}" y="${(end?y-150:y).toFixed(2)}" width="25" height="150" fill="#2f55c9" fill-opacity=".12" stroke="#2f55c9" stroke-width="${sw}" ${dash}/>`;continue;}
      if(jt==='knuckle'){for(let k=-1;k<=1;k++)svg+=`<rect x="${(cx+k*14-5).toFixed(2)}" y="${(y-5).toFixed(2)}" width="10" height="10" fill="none" stroke="#15181b" stroke-width="${sw}"/>`;continue;}
      if(jt==='spar'){svg+=`<rect x="${cx-15}" y="${(end?y-220:y).toFixed(2)}" width="30" height="220" fill="none" stroke="#a07a4c" stroke-width="${sw*1.4}" ${dash}/>`;}
      if(foam&&(jt==='lap'||jt==='clevis'))svg+=`<circle cx="${cx}" cy="${y}" r="${S.plateD/2}" fill="none" stroke="#a07a4c" stroke-width="${sw*1.3}" ${dash}/><circle cx="${cx}" cy="${y}" r="10.65" fill="none" stroke="#15181b" stroke-width="${sw*.8}"/>`;
      svg+=`<circle cx="${cx}" cy="${y}" r="${hole/2}" fill="#fff" stroke="#15181b" stroke-width="${sw}"/><path d="M ${cx-hole} ${y} H ${cx+hole} M ${cx} ${y-hole} V ${y+hole}" stroke="#15181b" stroke-width="${sw*.6}"/>`;}
    svg+=`<text x="${cx}" y="${gap+fs}" font-size="${fs}" text-anchor="middle" fill="#15181b">${p.leg.toUpperCase()}</text><text x="${cx}" y="${gap+fs*2.1}" font-size="${fs*.8}" text-anchor="middle" fill="#555c62">${p.name.replace('Pastern + hoof','Hoof')}</text><text x="${cx}" y="${(b.y+p.pr.f[4]*Hmm+fs*1.6).toFixed(2)}" font-size="${fs*.8}" text-anchor="middle" fill="#15181b">${fmt(p.len)}</text>`;});
  const bar=unit==='cm'?(Hmm>=500?100:50):(Hmm>=500?101.6:50.8);svg+=`<path d="M ${gap} ${Hd-gap} H ${gap+bar}" stroke="#15181b" stroke-width="${sw*2}"/><text x="${gap+bar+fs*.5}" y="${Hd-gap+fs*.35}" font-size="${fs*.8}" fill="#15181b">${unit==='cm'?bar/10+' cm':bar/25.4+' in'} scale check</text></svg>`;
  lastSvg=svg;lastArea=areaTot;const sh=document.getElementById('sheet');if(sh)sh.innerHTML=svg;
  const tb=document.getElementById('btable'),nt=document.getElementById('bnotes');if(!tb)return;
  tb.innerHTML=`<table><thead><tr><th>Leg</th><th>Part</th><th>Pivot to pivot</th><th>Widest</th></tr></thead><tbody>${parts.map(p=>`<tr><td>${p.leg}</td><td>${p.name}</td><td class="n">${fmt(p.len)}</td><td class="n">${fmt((Math.max(...p.pr.f)+Math.max(...p.pr.b))*Hmm)}</td></tr>`).join('')}</tbody></table>`;
  const mass=templateMass();const curMass=S.mode==='bike'?BK.mass:W.mass;
  let html=`<p style="margin:8px 0">One hind leg is ${(areaTot/100).toFixed(0)} cm² of profile. At ${S.thick} cm thick and ${S.density} kg/m³ that is about <b>${mass.toFixed(2)} kg</b>, with 15% added for glue, plates and skin.${S.mode!=='horse'?` The sim uses ${curMass.toFixed(2)} kg. <button class="btn ghost" type="button" id="usem">Use ${mass.toFixed(2)} kg</button>`:''} Brown dashed circles are cheek plates; strap, knuckle and spar features change with the joint you pick.</p>`;
  if(S.mode==='wear'){const bt=cur&&cur.ex&&cur.ex.beltTorque?cur.ex.beltTorque:0;html+=`<h4>Walk rig build</h4><ol class="steps">
    <li><b>Hip belt carries it.</b> An external-frame pack, or a 20 mm aluminium tube frame on a padded hip belt. The boom bolts on at belt height and runs ${(W.boom*100).toFixed(0)} cm back. The rear puts about ${bt.toFixed(0)} N·m on the belt, roughly ${(bt/G0/.5).toFixed(1)} kg held at half a metre.</li>
    <li><b>Triangulate.</b> A stay from the top of the frame to the boom end (dashed on the stage) keeps the boom in compression and the stay in tension.</li>
    <li><b>Cable.</b> ${W.tie==='knee'?'Knee strap':'Ankle strap'} → pulley behind your hip → along the boom → pulley ahead of the axle → lever ${(W.lever*100).toFixed(1)} cm off the thigh. Your knee moves the cable about 9 cm a stride, your ankle about 36 cm. Fit a magnet or hook-and-loop breakaway at the strap.</li>
    <li><b>Return and hock.</b> A bungee pulls the thigh back; an inner cord from thigh to cannon folds the hock as the thigh swings forward.</li></ol>`;}
  if(S.mode==='bike')html+=`<h4>Bike rig build</h4><ol class="steps">
    <li><b>Rack and boom.</b> A rear rack with a tube extending back to a cross-axle behind the wheel, ${(BG.pivot.y*100).toFixed(0)} cm up. Mount each leg 8–10 cm outboard of the wheel with a spoke guard; the side view here overlaps them.</li>
    <li><b>Drive.</b> ${BK.drive==='crank'?`An eccentric pin ${(BK.ecc*100).toFixed(1)} cm off the crank spindle, for example a plate under the chainring bolts. Push rods run outboard along the chainstays.`:`A pulley on the rear hub (a disc-brake-mount adapter works) belted ${BK.R.toFixed(2)}:1 down to an eccentric pin ${(BK.ecc*100).toFixed(1)} cm off centre. The legs keep moving when you coast.`}</li>
    <li><b>Rods and levers.</b> Rods about ${(bikeDrive().c*100).toFixed(0)} cm long with rod-end bearings at both ends, to levers ${(BK.lever*100).toFixed(0)} cm long on the thighs. Use the trim slider to centre the swing.</li>
    <li><b>Safety.</b> Make the rod-to-lever link a shear pin or magnet so a snagged leg lets go instead of stopping the crank.</li></ol>`;
  nt.innerHTML=html;const um=document.getElementById('usem');if(um)um.addEventListener('click',()=>{if(S.mode==='bike')BK.mass=Math.max(.15,Math.round(mass*20)/20);else W.mass=Math.max(.15,Math.round(mass*20)/20);SFX.toggle();dirty=true;syncPanel();});}

/* =================== mode, sound, loop =================== */
function toggleSound(){S.sound=!S.sound;if(S.sound){audioStart();setTimeout(()=>SFX.chime(),60);}document.getElementById('snd').setAttribute('aria-pressed',S.sound);}
document.getElementById('snd').addEventListener('click',()=>{toggleSound();if(openTab==='layers')syncPanel();});
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{S.mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b));S.view={z:1,tx:0,ty:0};
  S.sel=S.mode==='horse'?'LH:2':'LH:1';if(S.mode==='wear'||S.mode==='bike')S.layers.forces=true;cacheKey='';SFX.toggle();syncPanel();dirty=true;}));
document.getElementById('play').addEventListener('click',()=>{setPlaying(!S.playing);SFX.toggle();});
const spEl=document.getElementById('speed');spEl.addEventListener('input',()=>{S.speed=+spEl.value;document.getElementById('speedV').textContent=S.speed.toFixed(2)+'×';});
let last=performance.now(),lastLock=false;
if(matchMedia('(prefers-reduced-motion: reduce)').matches)setPlaying(false);
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  try{ensureCache();
    if(S.mode==='evolve'&&EV.running){const imp=evStep();if(imp&&EV.gen>1)SFX.chime();cacheKey='';dirty=true;if(openTab==='drive'&&EV.gen%10===0)syncPanel();}
    if(S.playing){const t0=S.t,dp=dt*S.speed/cycleSec();S.t=mod1(S.t+dp);S.dist+=dp*strideLen();fireEvents(t0,S.t);dirty=true;}
    if(dirty){dirty=false;drawStage();drawStrip();if(S.mode==='bike'&&cur){const lk=cur.ex.locked;if(lk&&!lastLock)SFX.lock();lastLock=lk;}}}catch(err){console.error(err);}
  requestAnimationFrame(frame);}
new ResizeObserver(()=>{dirty=true;}).observe(stage);
syncPanel();requestAnimationFrame(frame);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{readFonts();dirty=true;});
})();
</script>
