<style>

*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px var(--f-body);display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
if(window.parent!==window)document.documentElement.classList.add('embedded');
if(!window.THREE){document.getElementById('loading').textContent='3D library did not load. The 2D views still work.';}
const T=window.THREE,D=Math.PI/180,TAU=Math.PI*2;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const $=id=>document.getElementById(id);

/* ================= configuration ================= */
const CFG={joint:'bolt',couple:'cord',foam:.025,plateD:.05,finish:'paint',color:'#6b3e26',caps:true,units:'mm'};
const JT={
  bolt:{name:'Shoulder bolt + cheek plates',short:'Shoulder bolt',sum:'Hardware-store stack from your sketch: plates spread the load, a smooth shoulder turns in nylon bushings. Strongest; heads show.'},
  chicago:{name:'Chicago screw + cheek plates',short:'Chicago screw',sum:'Binding barrel from one side, screw from the other: flush round heads on both faces, cleanest look. Same plates and bushings.'},
  scissors:{name:'Salvaged novelty scissors',short:'Scissor pivot',sum:'A 15 in plastic scissor is a finished lap joint. Glue one blade to the inner face of each limb; its rivet is the pivot. No drilling at the knees.'}};
const HIDES=[['Bay','#6b3e26'],['Chestnut','#8a4b2a'],['Grey','#8d8f8f'],['Palomino','#c9a86a'],['Black','#2a2624'],['Dun','#a88d63']];
const PIVOT_H=.93,CLEAR=.04;
const FR=[.23,.24,.17,.09],NAMES=['thigh','gaskin','cannon','hoof'],JNAMES=['hip','stifle','hock','fetlock'];
const REL=[-56,-60,26,35].map(x=>x*D);
const ABS=[];{let a=0;for(const r of REL){a+=r;ABS.push(a);}}
const DROP=-FR.reduce((s,f,i)=>s+f*Math.sin(ABS[i]),0),K=(PIVOT_H-CLEAR)/DROP,L=FR.map(f=>f*K);
const PROF=[{f:[.05,.08,.08,.06,.04],b:[.08,.11,.10,.075,.045]},{f:[.04,.045,.035,.025,.02],b:[.05,.06,.045,.03,.045]},{f:[.02,.016,.016,.017,.022],b:[.025,.02,.02,.022,.028]},{f:[.02,.02,.026,.035,.03],b:[.025,.022,.026,.032,.035]}];
const PT=.003,NYW=.0015,FW=.0016,BR=.003,BL=.0025,BEV=.0012,BUSH_R=.00635,HOLE_R=.0033,BOLT_R=.00318,HEAD_R=.0066,HEAD_H=.0042,NUT_R=.0063,NUT_H=.0066,FWASH_R=.016,NWASH_R=.0125,JIG=.075;
const LAYER=i=>i%2;
function dims(){const F=CFG.foam,sc=CFG.joint==='scissors';const Z1=sc?F+2*BL:F+2*PT+NYW;return {F,Z1,sc,plateR:CFG.plateD/2,boltJ:(Z1+F+PT+FW)-(-PT-FW-NUT_H)+.005,boltH:(F+PT+FW)-(-PT-BR-FW-NUT_H)+.005,stack:sc?2*F+2*BL:2*F+4*PT+NYW+2*FW};}
const fmt=m=>CFG.units==='mm'?(m*1000).toFixed(m<.01?1:0)+' mm':(m/0.0254).toFixed(m<.05?2:1)+' in';

/* ================= 2D profile + kinematics shared by all views ================= */
const V2=(x,y)=>({x,y});
function profile(i){const pr=PROF[i],Lb=L[i],st=[0,.25,.5,.75,1],pts=[];
  pts.push(V2(-pr.b[0]*K*.8,0));for(let k=0;k<5;k++)pts.push(V2(Lb*st[k],-pr.b[k]*K));pts.push(V2(Lb+pr.f[4]*K*.8,0));for(let k=4;k>=0;k--)pts.push(V2(Lb*st[k],pr.f[k]*K));
  const n=pts.length,out=[],mid=(a,b)=>V2((a.x+b.x)/2,(a.y+b.y)/2);for(let j=0;j<n;j++){const p0=mid(pts[(j-1+n)%n],pts[j]),p1=pts[j],p2=mid(pts[j],pts[(j+1)%n]);for(let s=0;s<4;s++){const t=s/4;out.push(V2((1-t)*(1-t)*p0.x+2*(1-t)*t*p1.x+t*t*p2.x,(1-t)*(1-t)*p0.y+2*(1-t)*t*p1.y+t*t*p2.y));}}return out;}
const PROFILES=[0,1,2,3].map(profile);
function edgeAt(i,s,side){const pr=PROF[i][side],x=s*4,k=Math.min(3,Math.floor(x)),f=x-k;return (pr[k]+(pr[k+1]-pr[k])*f)*K;}
const S={n:0,view:'3d',tab:'build',sound:true,explode:0,exT:0,cut3d:false,dims:true,traces:true,testing:false,phase:0,amp:22,fold:.9,cad:.9,sel:1,forceJ:0};
function relAngles(ph){const th=S.amp*D*Math.sin(TAU*ph),phi=S.fold*Math.max(0,th);return [REL[0]+th,REL[1]-phi,REL[2]+.9*phi,REL[3]-1.2*phi];}
function poseFrom(r){let a=0,p=V2(0,0);const pts=[p],abs=[];for(let i=0;i<4;i++){a+=r[i];abs.push(a);p=V2(p.x+L[i]*Math.cos(a),p.y+L[i]*Math.sin(a));pts.push(p);}return {pts,abs};}
const legPose=ph=>poseFrom(relAngles(ph));
const restPose=()=>poseFrom(REL);
function coupleAnchors(pose){const a=pose.abs,p=pose.pts;const loc=(i,x,y)=>{const c=Math.cos(a[i]),s=Math.sin(a[i]);return V2(p[i].x+x*c-y*s,p[i].y+x*s+y*c);};
  return [loc(0,.82*L[0],edgeAt(0,.82,'f')+.006),loc(2,.22*L[2],edgeAt(2,.22,'f')+.006)];}
const REST_COUPLE=(()=>{const [a,b]=coupleAnchors(restPose());return Math.hypot(a.x-b.x,a.y-b.y);})();
function interior(p,j){const a0=p.abs[j-1]+Math.PI,a1=p.abs[j];const x=(((a1-a0)%TAU)+TAU)%TAU;return (x>Math.PI?TAU-x:x)/D;}
function coupleDelta(p){const [a,b]=coupleAnchors(p);return (Math.hypot(a.x-b.x,a.y-b.y)-REST_COUPLE)/REST_COUPLE;}

/* ================= Jansen (for the linkage view) ================= */
const HOLY={a:38,b:41.5,c:39.3,d:40.1,e:55.8,f:39.4,g:36.7,h:65.7,i:49,j:50,k:61.9,l:7.8,m:15};

let ANIMS=[];const now=()=>performance.now()/1000;
const easeOutBack=x=>{const c1=1.4,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const easeIO=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;

function setStand(up){const s=up?UP:FLAT;legRoot.position.copy(s.p);legRoot.quaternion.copy(s.q);jig.visible=!up;}
function shadeHex(h,f){const n=parseInt(h.slice(1),16);const r=Math.round(((n>>16)&255)*f),g=Math.round(((n>>8)&255)*f),b=Math.round((n&255)*f);return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');}
function partColor(i,n){if(n>=S.paintStep)return i===3?'#2e2824':i===2?shadeHex(CFG.color,.8):CFG.color;if(n>=S.skinStep)return '#e6e2da';return '#f3efe6';}

  if(T){if(n<standStep)restLeg();for(const p of parts)p.mesh.material.opacity=1;
    for(const r of REG){const done=r.step<=n;
      if(r.type==='cut'){parts[r.part].g.visible=done;parts[r.part].line.visible=false;}
      else if(r.type==='fly'||r.type==='tighten'){r.o.visible=done;r.o.userData.anim=0;}
      else if(r.type==='assemble')setPartBench(parts[r.part],!done);

      if(r.type==='cut'){const p=parts[r.part];p.g.visible=true;p.mesh.material.opacity=0;p.line.visible=true;p.line.geometry.setDrawRange(0,0);play('cut',d);ANIMS.push({t0,dur:1.3,fn:e=>{p.line.geometry.setDrawRange(0,Math.floor(Math.min(1,e/.7)*p.npts));p.mesh.material.opacity=Math.max(0,(e-.6)/.4);},done:()=>{p.line.visible=false;p.mesh.material.opacity=1;}});end=Math.max(end,d+1.3);}

  if(S.view==='section')h=[1,2,3].map(j=>`<button class="mini" data-tool="j${j}" aria-pressed="${currentJoint()===j}">${cap(JNAMES[j])}</button>`).join('');t.innerHTML=h;
  t.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.tool;audio();play('tap');if(k==='exp')S.exT=S.exT>0?0:1;if(k==='cut'&&T)setCut3d(!S.cut3d);if(k==='fit'&&T){CAM.th=.35;CAM.ph=.95;retarget();}if(k==='dims')S.dims=!S.dims;if(k==='traces')S.traces=!S.traces;if(k==='run'){toggleTest();return;}if(k[0]==='j')S.forceJ=+k[1];vtools();}));}
function stat(){const d=dims();const cost=sourceRows().reduce((s,r)=>s+(r.cost||0),0);const hw=CFG.joint==='bolt'?NUT_H+HEAD_H:CFG.joint==='chicago'?.0032-2*FW:0;$('hstat').textContent=`${fmt(d.stack+hw)} joint stack · ${JT[CFG.joint].short} · ${fmt(d.F)} foam · about $${cost.toFixed(0)} per leg`;}
function updateUI(){const n=S.n;$('act').textContent=n<N?STEPS[n].act:(S.testing?'Stop':'Test');
  [...$('tl').children].forEach((s,i)=>{s.classList.toggle('done',i<n);s.classList.toggle('next',i===n);});stat();renderInsp();vtools();
  if(S.view==='3d')$('vstat').textContent=n<N?`3d · step ${n+1}/${N} · drag to orbit, pinch to zoom, tap a part`:`3d · built · press Test to swing it`;}
function stepHeader(){const n=S.n;if(n>=N)return `<div class="eyebrow"><i style="background:var(--ok)"></i>Built · ${N} steps · about ${(STEPS.reduce((s,x)=>s+x.min,0)/60).toFixed(1)} h of work</div><h2>${S.testing?'Swinging on the boom':'The leg is built'}</h2><p class="muted">Test swings it through a walking stride. In Side view, watch the hock fold with the thigh and check the coupling length.</p>`;
  const s=STEPS[n];return `<div class="eyebrow"><i style="background:var(${KC[s.kind]})"></i>Step ${n+1} of ${N} · ${PHASE[s.kind]} · about ${s.min} min</div><h2>${s.t}</h2><p class="muted">${s.why}</p>
  ${s.uses.length?`<div class="tw"><table><thead><tr><th>Uses</th><th>Qty</th><th>Size</th></tr></thead><tbody>${s.uses.map(u=>`<tr><td>${u[0]}</td><td class="n">${u[1]}</td><td>${u[2]}</td></tr>`).join('')}</tbody></table></div>`:''}${s.tool?`<dl class="kv"><dt>Tool</dt><dd>${s.tool}</dd></dl>`:''}`;}
function renderInsp(){const el=$('insp');const t=S.tab;let h='';
  if(t==='build'){h=`<section>${stepHeader()}<h3>Build order</h3><ol class="steps">`;let ph='';STEPS.forEach((s,i)=>{if(PHASE[s.kind]!==ph){ph=PHASE[s.kind];h+=`<li class="phase">${ph}</li>`;}h+=`<li data-i="${i}" class="${i<S.n?'done':i===S.n?'cur':''}"><span class="no">${i+1}</span><span>${s.t}</span><span class="k" style="background:var(${KC[s.kind]})"></span></li>`;});h+='</ol></section>';}
  if(t==='joint'){const d=dims();h=`<section><h2>Joint</h2><p class="muted">Every knee is a lap joint: two limbs overlap on one pin. The choice is what makes the pin and how the load gets into the foam. Changing it rebuilds the parts and the build order.</p><div class="cards">${Object.entries(JT).map(([k,v])=>`<button class="cardopt" data-j="${k}" aria-pressed="${CFG.joint===k}"><b>${v.name}</b><small>${v.sum}</small></button>`).join('')}</div>
    <h3>Will the foam hold</h3>${meters()}
    <h3>Hock coupling</h3><div class="cards"><button class="cardopt" data-c="cord" aria-pressed="${CFG.couple==='cord'}"><b>Waxed cord</b><small>Pulls only: folds the hock as the thigh swings forward; gravity opens it.</small></button><button class="cardopt" data-c="link" aria-pressed="${CFG.couple==='link'}"><b>Trellis strip</b><small>Salvaged from an expandable plastic trellis, its rivets as pivots. Pushes and pulls, so the hock follows the thigh both ways.</small></button></div>
    <h3>Foam board</h3><div class="row">${[[.02,'20 mm'],[.025,'25 mm (1 in)'],[.038,'38 mm (1.5 in)']].map(([v,l])=>`<button class="mini" data-f="${v}" aria-pressed="${Math.abs(CFG.foam-v)<1e-6}">${l}</button>`).join('')}</div>
    ${CFG.joint!=='scissors'?`<div class="sl"><label for="pd">Cheek plate ⌀</label><input id="pd" type="range" min="0.035" max="0.08" step="0.005" value="${CFG.plateD}"><span class="val">${fmt(CFG.plateD)}</span></div>`:''}
    <dl class="kv"><dt>Joint stack, foam and plates</dt><dd>${fmt(d.stack)}</dd><dt>Layer step</dt><dd>${fmt(d.Z1)}</dd>${CFG.joint==='bolt'?`<dt>Knee bolt</dt><dd>1/4 in × ${fmt(d.boltJ)}</dd>`:''}<dt>Hip bolt</dt><dd>1/4 in × ${fmt(d.boltH)}</dd></dl></section>`;}
  if(t==='source'){const rows=sourceRows();const tot=rows.reduce((s,r)=>s+(r.cost||0),0);h=`<section><h2>Where it comes from</h2><p class="muted">Quantities for one hind leg. Prices are typical US hardware and craft-store figures; salvage is free if you have the donor.</p><div class="tw"><table><thead><tr><th>Item and where</th><th>Qty</th><th>How</th><th>$</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.item}<br><span class="muted" style="font-size:12px">${r.where}</span></td><td style="font-family:var(--f-mono);font-size:12px">${r.qty}</td><td><span class="tag ${r.how}">${r.how}</span></td><td class="n">${r.cost?r.cost.toFixed(2):'0'}</td></tr>`).join('')}<tr><td><b>Total</b></td><td></td><td></td><td class="n"><b>${tot.toFixed(0)}</b></td></tr></tbody></table></div>
    <h3>Salvage notes</h3>
    <p class="muted"><b>Novelty scissors.</b> A 15 in plastic scissor is a lap joint with a molded boss and a rivet that already turns smoothly. One pair per knee; the Joint tab switches the model to it. Check the rivet is metal or a thick plastic post, not a snap fit.</p>
    <p class="muted"><b>Expandable plastic trellis.</b> A bundle of identical flat links with snap rivets. One strip makes the hock link; a run of them makes a parallelogram if you want the cannon to stay vertical.</p>
    <p class="muted"><b>PVC pipe.</b> The hand-pushed Strandbeest builds use 1/2 in PVC with nylon ties at the pivots. Good for the boom and a test rig; too heavy and flexible for the leg itself at this size.</p>
    <p class="muted"><b>Steel flat bar and bike parts.</b> Rusted steel reads well as a finish but weighs about ten times the foam. Keep steel to the boom bracket. A bike crank or a pedal spindle with its sealed bearing makes a low-friction hip pivot if the leg is driven from a bike.</p>
    <p class="muted"><b>Pegboard and packaging.</b> Pegboard offcuts are free hardboard for cheek plates. Appliance packaging is bead EPS; it crumbles at cut edges, so skin it.</p></section>`;}
  if(t==='finish'){h=`<section><h2>Finish</h2><div class="cards">${[['raw','Raw foam','Fastest. Fragile edges; the bead texture shows.'],['skin','Skinned','Mesh tape and joint compound: hard, sandable shell, primer white.'],['paint','Painted hide','Skinned, then matte acrylic in a coat colour with a darker cannon and black hoof.']].map(([k,a,b])=>`<button class="cardopt" data-fin="${k}" aria-pressed="${CFG.finish===k}"><b>${a}</b><small>${b}</small></button>`).join('')}</div>
    ${CFG.finish==='paint'?`<h3>Coat</h3><div class="row">${HIDES.map(([n,c])=>`<button class="sw" data-col="${c}" aria-pressed="${CFG.color===c}" style="background:${c}" aria-label="${n}" title="${n}"></button>`).join('')}</div>`:''}
    ${CFG.finish!=='raw'?`<div class="row"><button class="mini" id="capsB" aria-pressed="${CFG.caps}">Cap the pivots</button><span class="muted">Foam domes hide the pin heads and read as joints.</span></div>`:''}
    <p class="muted">Paint the parts flat before assembly so the faces under the cheek plates stay clean. Leave the inner faces that slide on the nylon washer unpainted, or the paint will grab.</p></section>`;}
  if(t==='test'){const p=legPose(S.phase);const dl=coupleDelta(p);
    h=`<section><h2>Test</h2><p class="muted">${S.n<standStep?`The 3D leg stays on the jig until step ${standStep} hangs it on the boom. Side and Linkage views run the stride now.`:'Swings the leg through a walking stride on the boom.'}</p><div class="row"><button class="act" id="testB" type="button">${S.testing?'Stop':'Run stride'}</button></div>
    <div class="sl"><label for="am">Thigh swing</label><input id="am" type="range" min="8" max="35" step="1" value="${S.amp}"><span class="val">±${S.amp}°</span></div>
    <div class="sl"><label for="fo">Hock fold ratio</label><input id="fo" type="range" min="0" max="1.5" step="0.05" value="${S.fold}"><span class="val">${S.fold.toFixed(2)}</span></div>
    <div class="sl"><label for="ca">Cadence</label><input id="ca" type="range" min="0.3" max="1.4" step="0.05" value="${S.cad}"><span class="val">${S.cad.toFixed(2)} Hz</span></div>
    <dl class="kv" id="live"><dt>Stifle</dt><dd>${interior(p,1).toFixed(0)}°</dd><dt>Hock</dt><dd>${interior(p,2).toFixed(0)}°</dd><dt>Fetlock</dt><dd>${interior(p,3).toFixed(0)}°</dd><dt>${CFG.couple==='link'?'Link':'Cord'} length change</dt><dd>${(dl*100).toFixed(1)}%</dd></dl>
    <p class="muted">A cord only pulls: where the change is positive it is taut and drives the fold, where negative it hangs slack. A trellis link holds its length, so a large change here means the link would bend or the fold ratio has to give.</p></section>`;}
  el.innerHTML=h;wireInsp();}
function meters(){const d=dims();const F=.7*9.81*2+60;const t=d.F*1000;const rows=[];const kPa=(f,a)=>f/a*1000;
  rows.push(['Bare pin in foam',kPa(F,6.5*t),70]);if(CFG.joint==='scissors')rows.push(['Scissor blade glued, 120 × 15 mm',kPa(F,120*15),50]);else{rows.push(['Nylon bushing in foam',kPa(F,12.7*t),70]);rows.push([`Cheek plates ⌀${(CFG.plateD*1000).toFixed(0)}, glued both faces`,kPa(F,2*Math.PI*Math.pow(CFG.plateD*500,2)),50]);}
  return `<div class="meter">${rows.map(([n,s,l])=>{const r=s/l,col=r<.7?'var(--ok)':r<1?'var(--k-finish)':'var(--warn)';return `<span>${n}</span><span class="val">${s.toFixed(0)} kPa</span><span class="bar"><i style="width:${Math.min(100,r*100)}%;background:${col}"></i></span>`;}).join('')}</div><p class="muted">Peak pin load about ${F.toFixed(0)} N: a 0.7 kg leg at twice its weight plus a 60 N cable pull. Limits are about 70 kPa for EPS in bearing and 50 kPa for glue shear into EPS. A full bar crushes the foam.</p>`;}
function sourceRows(){const d=dims(),sc=CFG.joint==='scissors',ch=CFG.joint==='chicago';const R=(item,qty,how,where,cost)=>({item,qty,how,where,cost});const rows=[];
  rows.push(R(`Foam board ${fmt(d.F)}`,'¼ sheet','buy','XPS insulation board (pink or blue), home centre',8));
  if(!sc){rows.push(R('Nylon spacer 1/2 × 1/4 in','7','buy','Specialty hardware drawer',7*.9));rows.push(R(`Cheek plate ⌀${fmt(CFG.plateD)}`,'14','salvage','Pegboard or hardboard offcut, cut with a hole saw',0));rows.push(R('Nylon washer ⌀25','3','buy','Hardware drawer',3*.3));}
  else{rows.push(R('Novelty scissors, 15 in','3','buy','Party or discount store; any with a riveted pivot',3*6));rows.push(R('Nylon spacer and 2 plates (hip)','1 + 2','buy','Hardware drawer, pegboard offcut',1.5));rows.push(R('5-minute epoxy','1','buy','Hardware',6));}
  if(CFG.joint==='bolt')rows.push(R('Shoulder bolt 1/4 in, Nylock nut, 2 fender washers','4 sets','buy','Hardware drawer',4*3.2));
  else rows.push(R('Shoulder bolt set (hip)','1','buy','Hardware drawer',3.2));
  if(ch)rows.push(R('Chicago screw 1/4 in','3','buy','Leathercraft supply (binding posts)',3*1.5));
  rows.push(R('Birch ply 6 mm offcut','70 × 50 mm','salvage','Scrap bin',0));rows.push(R('Eye screws','3','buy','Hardware',1.5));
  rows.push(CFG.couple==='link'?R('Expandable plastic trellis','1 strip + 2 rivets','salvage','Garden centre trellis; one strip of it',0):R('Waxed polyester cord','1 m','buy','Craft store',2));
  rows.push(R('Foam adhesive (PL 300)','¼ tube','buy','Home centre',2));
  if(CFG.finish!=='raw'){rows.push(R('Fiberglass mesh tape','6 m','buy','Drywall aisle',4));rows.push(R('Lightweight joint compound','1 L','buy','Drywall aisle',4));}
  if(CFG.finish==='paint')rows.push(R('Matte acrylic, hide colour and black','2 colours','buy','Craft store',8));
  rows.push(R('Aluminium bar 3 mm and 20 mm square tube','bracket + 0.6 m','buy','Home centre metals rack',12));
  return rows;}
function wireInsp(){const el=$('insp');
  el.querySelectorAll('ol.steps li[data-i]').forEach(li=>li.addEventListener('click',()=>{finishAnims();applyState(+li.dataset.i);play('tap');}));
  el.querySelectorAll('[data-j]').forEach(b=>b.addEventListener('click',()=>{CFG.joint=b.dataset.j;play('snap');rebuild();}));
  el.querySelectorAll('[data-c]').forEach(b=>b.addEventListener('click',()=>{CFG.couple=b.dataset.c;play('snap');rebuild();}));
  el.querySelectorAll('[data-f]').forEach(b=>b.addEventListener('click',()=>{CFG.foam=+b.dataset.f;play('thud');rebuild();}));
  el.querySelectorAll('[data-fin]').forEach(b=>b.addEventListener('click',()=>{CFG.finish=b.dataset.fin;play('scrape');rebuild();}));
  el.querySelectorAll('[data-col]').forEach(b=>b.addEventListener('click',()=>{CFG.color=b.dataset.col;play('tap');finishColor(S.n);renderInsp();stat();}));
  const pd=$('pd');if(pd){let to;pd.addEventListener('input',()=>{CFG.plateD=+pd.value;pd.nextElementSibling.textContent=fmt(CFG.plateD);play('ratchet');clearTimeout(to);to=setTimeout(rebuild,300);});}
  const cb=$('capsB');if(cb)cb.addEventListener('click',()=>{CFG.caps=!CFG.caps;play('tap');rebuild();});
  const tb=$('testB');if(tb)tb.addEventListener('click',()=>{audio();toggleTest();});
  for(const [id,k,f] of [['am','amp',v=>'±'+v+'°'],['fo','fold',v=>(+v).toFixed(2)],['ca','cad',v=>(+v).toFixed(2)+' Hz']]){const s=$(id);if(s)s.addEventListener('input',()=>{S[k]=+s.value;s.nextElementSibling.textContent=f(s.value);TR.length=0;play('ratchet');});}}
function rebuild(){finishAnims();if(T&&S.cut3d)setCut3d(false);const tab=$('insp').scrollTop;buildModel();$('insp').scrollTop=tab;}
function toggleTest(){S.testing=!S.testing;if(!S.testing)restLeg();TR.length=0;play('tock');updateUI();}

/* ================= input ================= */
$('act').addEventListener('click',()=>{audio();if(S.n<N)advance();else toggleTest();});
$('prev').addEventListener('click',()=>{if(S.n>0){finishAnims();applyState(S.n-1);play('undo');}});
$('snd').addEventListener('click',e=>{S.sound=!S.sound;e.currentTarget.setAttribute('aria-pressed',S.sound);if(S.sound){audio();play('tap');}});
$('units').addEventListener('click',e=>{CFG.units=CFG.units==='mm'?'in':'mm';e.currentTarget.textContent=CFG.units;play('tap');updateUI();});
document.querySelectorAll('.vseg button').forEach(b=>b.addEventListener('click',()=>{S.view=b.dataset.v;document.querySelectorAll('.vseg button').forEach(x=>x.setAttribute('aria-pressed',x===b));c3.hidden=S.view!=='3d';c2.hidden=S.view==='3d';$('vtip').hidden=true;audio();play('tap');resize();updateUI();}));
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{S.tab=b.dataset.t;document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));play('tap');renderInsp();$('insp').scrollTop=0;}));
const tl=$('tl');let tlDrag=false;const tlAt=e=>{const r=tl.getBoundingClientRect();const n=Math.max(0,Math.min(N,Math.round((e.clientX-r.left)/r.width*N)));if(n!==S.n){finishAnims();applyState(n);play('tap');}};
tl.addEventListener('pointerdown',e=>{tl.setPointerCapture(e.pointerId);tlDrag=true;tlAt(e);});tl.addEventListener('pointermove',e=>{if(tlDrag)tlAt(e);});tl.addEventListener('pointerup',()=>tlDrag=false);
if(T){const ptr=new Map();let g0=null;const ray=new T.Raycaster();let lastTap=0;
  c3.addEventListener('pointerdown',e=>{c3.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptr.size===2){const [a,b]=[...ptr.values()];g0={pinch:true,d:Math.hypot(a.x-b.x,a.y-b.y),r:CAM.rt};}else g0={x:e.clientX,y:e.clientY,th:CAM.th,ph:CAM.ph,moved:false};});
  c3.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(!g0)return;if(g0.pinch&&ptr.size===2){const [a,b]=[...ptr.values()];CAM.rt=Math.max(.15,Math.min(4,g0.r*g0.d/Math.max(1,Math.hypot(a.x-b.x,a.y-b.y))));CAM.r=CAM.rt;return;}
    if(g0.pinch)return;const dx=e.clientX-g0.x,dy=e.clientY-g0.y;if(Math.hypot(dx,dy)>5)g0.moved=true;CAM.th=g0.th-dx*.008;CAM.ph=Math.max(.15,Math.min(1.5,g0.ph-dy*.006));});
  c3.addEventListener('pointerup',e=>{const p=ptr.get(e.pointerId);ptr.delete(e.pointerId);if(g0&&!g0.pinch&&!g0.moved&&p){const t=now();if(t-lastTap<.3){CAM.th=.35;CAM.ph=.95;retarget();lastTap=0;}else{lastTap=t;const r=c3.getBoundingClientRect();ray.setFromCamera({x:(e.clientX-r.left)/r.width*2-1,y:-(e.clientY-r.top)/r.height*2+1},camera);
      const hits=ray.intersectObjects(scene.children,true).filter(hh=>{let o=hh.object;while(o){if(!o.visible)return false;o=o.parent;}return hh.object.userData.info;});const tip=$('vtip');if(hits.length){tip.innerHTML=hits[0].object.userData.info;tip.hidden=false;clearTimeout(tip._t);tip._t=setTimeout(()=>tip.hidden=true,3500);play('tap');}}}if(!ptr.size)g0=null;});
  c3.addEventListener('pointercancel',e=>{ptr.delete(e.pointerId);if(!ptr.size)g0=null;});
  c3.addEventListener('wheel',e=>{e.preventDefault();CAM.rt=Math.max(.15,Math.min(4,CAM.rt*Math.exp(e.deltaY*.0012)));},{passive:false});}

/* ================= loop ================= */
function resize(){if(T){const w=c3.clientWidth||1,h=c3.clientHeight||1;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}}
new ResizeObserver(resize).observe($('view'));
function themeChanged(){readC();if(T)scene.background=new T.Color(C.view||'#dfe3e2');}themeChanged();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',themeChanged);new MutationObserver(themeChanged).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
let last=now(),liveT=0;
function frame(){const t=now(),dt=Math.min(.05,t-last);last=t;
  if(S.testing){S.phase=(S.phase+dt*S.cad)%1;if(T&&S.n>=standStep){const r=relAngles(S.phase);for(let i=0;i<4;i++)pivots[i].rotation.z=r[i];}const b=Math.floor(S.phase*2);if(b!==lastBeat){lastBeat=b;play(b?'tap':'hoof');}recordTrace();
    if(S.tab==='test'&&t-liveT>.15){liveT=t;const live=$('live');if(live){const p=legPose(S.phase);const dd=live.querySelectorAll('dd');dd[0].textContent=interior(p,1).toFixed(0)+'°';dd[1].textContent=interior(p,2).toFixed(0)+'°';dd[2].textContent=interior(p,3).toFixed(0)+'°';dd[3].textContent=(coupleDelta(p)*100).toFixed(1)+'%';}}}
  tickAnims();
  if(S.view==='3d'&&T){applyOffsets();updateCamera();updateSectionPlane();renderer.render(scene,camera);}
  else{if(T)applyOffsets();if(S.view==='side')drawSide();else if(S.view==='section')drawSection();else drawLinkage();}
  requestAnimationFrame(frame);}
if(T)$('loading').remove();
buildModel();resize();requestAnimationFrame(frame);
})();
</script>

}

  --muscle:#e58a72; --tendon:#7f9dff; --far:#4f585e; --accent:#7f9dff; --accent-ink:#0d1014; --ground:#6b7479; --warn:#fb923c; --ok:#4ade80;
  --j0:#b393ff; --j1:#ff7fae; --j2:#ffb15c; --j3:#5fd39b; --j4:#86a3ff; --j5:#e7eaeb; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0f1214; --sheet:#161a1d; --ink:#e7eaeb; --ink-2:#9ea7ad; --rule:#2c3338;
  --muscle:#e58a72; --tendon:#7f9dff; --far:#4f585e; --accent:#7f9dff; --accent-ink:#0d1014; --ground:#6b7479; --warn:#fb923c; --ok:#4ade80;
  --j0:#b393ff; --j1:#ff7fae; --j2:#ffb15c; --j3:#5fd39b; --j4:#86a3ff; --j5:#e7eaeb; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.4;overflow:hidden;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:8px}
.app{height:100%;max-width:1100px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"head" "stage" "strip" "dock";gap:6px;position:relative}
header{grid-area:head}.stagebox{grid-area:stage}.stripbox{grid-area:strip}.dockwrap{grid-area:dock;min-height:0}
@media (min-width:900px){.app{max-width:none;grid-template-columns:minmax(0,1fr) 390px;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"head head" "stage dock" "strip dock"}.dockwrap{display:flex;flex-direction:column}.dockwrap .panel{flex:1 1 auto;max-height:none}.dockwrap .panel[hidden]{display:none}}

header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:500;font-size:17px;letter-spacing:.16em;text-transform:uppercase;margin:0;white-space:nowrap}

.btn{font:600 13px var(--f-body);border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:6px 12px;border-radius:4px;cursor:pointer;min-height:34px;display:inline-flex;align-items:center;gap:7px}

.btn.ghost[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.icon{display:inline-block;position:relative;width:12px;height:12px}
.icon.play{width:0;height:0;border-left:11px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent}
.icon.pause::before,.icon.pause::after{content:"";position:absolute;top:0;width:4px;height:12px;background:currentColor}

.spk::after{content:"";position:absolute;left:3px;top:0;border-right:6px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent;width:0;height:0}

[aria-pressed="true"] .spk i{opacity:1}
.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}

.panel>*{flex-shrink:0}

<div class="app">
  <header>
    <h1>Centaur Leg Rig</h1>
    <div class="seg" role="group" aria-label="Mode"><button type="button" data-mode="horse" aria-pressed="true">Horse</button><button type="button" data-mode="wear" aria-pressed="false">Walk</button><button type="button" data-mode="bike" aria-pressed="false">Bike</button><button type="button" data-mode="evolve" aria-pressed="false">Evolve</button></div>
  </header>
  <div class="stagebox"><canvas id="stage" tabindex="0" aria-label="Simulation stage. Drag to scrub time, pinch to zoom, tap a joint to select it."></canvas></div>
  <div class="stripbox"><canvas id="strip" aria-label="Values over one cycle. Drag to scrub."></canvas></div>
  <div class="dockwrap">
    <div class="dock">
      <button class="btn" id="play" type="button" aria-label="Pause"><span class="icon pause" id="playIcon"></span></button>
      <button class="btn ghost" id="snd" type="button" aria-pressed="false" aria-label="Sound"><span class="spk"><i></i></span></button>
      <button class="btn ghost" id="v3b" type="button" aria-label="View: side, planes or 3D">2D</button>
      <label class="mini"><span class="lbl">Speed</span><input id="speed" type="range" min="0.05" max="1.5" step="0.05" value="0.4"><span class="val" id="speedV">0.40×</span></label>
      <div class="tabs" role="group" aria-label="Panels">
        <button class="tab" type="button" data-tab="time" aria-expanded="false">Time</button>
        <button class="tab" type="button" data-tab="drive" aria-expanded="false" id="driveTab">Gait</button>
        <button class="tab" type="button" data-tab="layers" aria-expanded="false">Layers</button>
        <button class="tab" type="button" data-tab="build" aria-expanded="false">Build</button>
      </div>
    </div>
    <div class="panel" id="panel" hidden></div>
  </div>
</div>

<script>
(()=>{
/* =================== math =================== */
const D2R=Math.PI/180,TAU=Math.PI*2,G0=9.81;
const V=(x,y)=>({x,y}),dir=a=>V(Math.cos(a),Math.sin(a)),add=(p,v,s=1)=>V(p.x+v.x*s,p.y+v.y*s),sub=(a,b)=>V(a.x-b.x,a.y-b.y),len=v=>Math.hypot(v.x,v.y);
const lerp=(a,b,t)=>a+(b-a)*t,mod1=x=>((x%1)+1)%1,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rot90=v=>V(-v.y,v.x);
function interiorAt(a,p,b){const u=sub(a,p),v=sub(b,p);return Math.acos(clamp((u.x*v.x+u.y*v.y)/(len(u)*len(v)||1),-1,1))/D2R;}
function circ(p,r1,q,r2,side){const dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy);if(d<1e-9)return null;const a=(r1*r1-r2*r2+d*d)/(2*d),hh=r1*r1-a*a;if(hh<0)return null;const h=Math.sqrt(hh),mx=p.x+a*dx/d,my=p.y+a*dy/d;return V(mx-side*h*dy/d,my+side*h*dx/d);}

/* =================== state =================== */
const S={mode:'horse',gait:'walk',custom:null,t:0,playing:true,speed:.4,spread:0,ghosts:0,dist:0,
  layers:{bones:true,forms:true,traces:true,labels:'horse',forces:false,far:true,jansen:false,centaur:false,gait:true},
  sel:'LH:2',view:{z:1,tx:0,ty:0},withers:24,unit:'cm',build:'brad',thick:2.5,density:45,
  sound:false,haptic:true,joint:'lap',pinD:6.5,plateD:50,v3:'side',camP:{yaw:-.75,pitch:.32},cam3:{yaw:-.55,pitch:.25},explode:3};
const WDEF={cadence:.85,mass:.7,barrel:1.5,boom:.8,clear:.04,kb:60,kc:800,slack:.01,wiring:'cross',tie:'knee',lever:.14,fold:.9,ground:true};
const W={...WDEF};
const BDEF={drive:'crank',rpm:70,gear:2.6,R:2,ecc:.035,lever:.12,cadj:0,mass:.6,clear:.08,fold:.9};
const BK={...BDEF};
const FRIC={washer:'nylon',clamp:40,pmu:.15};
const MUW={nylon:.12,rubber:.8,foam:.5},WASH={nylon:'Nylon washer',rubber:'Rubber washer',foam:'Foam on foam'};
function pivotFric(mass){return MUW[FRIC.washer]*FRIC.clamp*S.plateD/2000*.6+.2*mass*G0*S.pinD/2000;}
const simSig=()=>JSON.stringify([W,FRIC,S.plateD,S.pinD]);
const GAITX={mu:0};let BIKEF=0;

/* =================== horse model =================== */
const P={hind:{femur:.23,tibia:.24,cannon:.17,digit:.09,theta0:-56*D2R,stifle0:60*D2R,hock0:26*D2R,k:.9,curl:60*D2R,x:-.45},
  fore:{scap:.28,hum:.20,fore:.27,cannon:.15,digit:.085,sig0:-62*D2R,sh0:66*D2R,el0:38*D2R,curl:85*D2R,x:.34},alpha0:55*D2R};
const GAITS={
  walk:{label:'Walk',duty:.62,off:{LH:0,LF:.25,RH:.5,RF:.75},L:.40,lift:{H:.10,F:.10},cycle:1.1,bob:{A:.008,n:2,pitch:0},drop:8,beats:'4-beat lateral'},
  trot:{label:'Trot',duty:.42,off:{LH:0,RF:0,RH:.5,LF:.5},L:.42,lift:{H:.13,F:.15},cycle:.72,bob:{A:.018,n:2,pitch:0},drop:14,beats:'2-beat diagonal'},
  canter:{label:'Canter',duty:.38,off:{LH:0,RH:.25,LF:.25,RF:.45},L:.42,lift:{H:.15,F:.2},cycle:.62,bob:{A:.022,n:1,pitch:.05},drop:18,beats:'3-beat, right lead'},
  gallop:{label:'Gallop',duty:.28,off:{LH:0,RH:.10,LF:.32,RF:.42},L:.44,lift:{H:.2,F:.26},cycle:.45,bob:{A:.03,n:1,pitch:.07},drop:24,beats:'4-beat transverse'},
};
const LEGS=['LH','RH','LF','RF'];
const gait=()=>S.gait==='custom'?S.custom:GAITS[S.gait];
function fkHind(a,th,ph){const h=P.hind;const a1=th,p1=add(a,dir(a1),h.femur),a2=a1-(h.stifle0+ph),p2=add(p1,dir(a2),h.tibia),a3=a2+h.hock0+h.k*ph,p3=add(p2,dir(a3),h.cannon);return {pts:[a,p1,p2,p3],ang:[a1,a2,a3]};}
function fkFore(a,sg,ep,cf){const f=P.fore;const a1=sg,p1=add(a,dir(a1),f.scap),a2=a1-f.sh0+.6*ep,p2=add(p1,dir(a2),f.hum),a3=a2+f.el0+ep,p3=add(p2,dir(a3),f.fore),a4=a3-cf,p4=add(p3,dir(a4),f.cannon);return {pts:[a,p1,p2,p3,p4],ang:[a1,a2,a3,a4]};}
const ca=Math.cos(P.alpha0),sa=Math.sin(P.alpha0);
const sh0=fkHind(V(0,0),P.hind.theta0,0).pts[3],sf0=fkFore(V(0,0),P.fore.sig0,0,0).pts[4];
const HIP=V(P.hind.x,-(sh0.y-P.hind.digit*sa)),SCAP=V(P.fore.x,-(sf0.y-P.fore.digit*sa));
const TOE0={H:HIP.x+sh0.x+P.hind.digit*ca,F:SCAP.x+sf0.x+P.fore.digit*ca};
const BODYC=V(0,.72);
function legTarget(G,leg,t){const kind=leg[1],d=kind==='H'?P.hind.digit:P.fore.digit;const p=mod1(t-G.off[leg]),x0=TOE0[kind]-(kind==='H'?.05:.035),L=G.L;const curl=kind==='H'?P.hind.curl:P.fore.curl;
  if(p<G.duty){const u=p/G.duty,gx=x0+L/2-L*u,al=P.alpha0-G.drop*D2R*Math.sin(Math.PI*u);return {F:V(gx-d*Math.cos(al),d*Math.sin(al)),toe:V(gx,0),dang:-al,stance:true,s:0};}
  const s=(p-G.duty)/(1-G.duty),e=.5-.5*Math.cos(Math.PI*s);const F=V(lerp(x0-L/2-d*ca,x0+L/2-d*ca,e),d*sa+G.lift[kind]*Math.pow(Math.sin(Math.PI*s),.8));const dang=-P.alpha0-curl*Math.pow(Math.sin(Math.PI*s),1.3);
  return {F,toe:add(F,dir(dang),d),dang,stance:false,s};}
function solve1(fk,u,v,target,lo,hi){let err=1;for(let it=0;it<30;it++){const e0=fk(u,v),ex=target.x-e0.x,ey=target.y-e0.y;err=Math.hypot(ex,ey);if(err<1e-5)break;const h=1e-4,eu=fk(u+h,v),ev=fk(u,v+h);
  const j11=(eu.x-e0.x)/h,j21=(eu.y-e0.y)/h,j12=(ev.x-e0.x)/h,j22=(ev.y-e0.y)/h,lam=.002,a=j11*j11+j21*j21+lam,b=j11*j12+j21*j22,c=j12*j12+j22*j22+lam,r1=j11*ex+j21*ey,r2=j12*ex+j22*ey,det=a*c-b*b;
  let du=(c*r1-b*r2)/det,dv=(a*r2-b*r1)/det;const m=Math.max(Math.abs(du),Math.abs(dv));if(m>.25){du*=.25/m;dv*=.25/m;}u+=du;v=clamp(v+dv,lo,hi);}return [u,v,err];}
function solve(fk,u,v,T,lo,hi,u0){let r=solve1(fk,u,v,T,lo,hi);if(r[2]>.01){const r2=solve1(fk,u0,0,T,lo,hi);if(r2[2]<r[2])r=r2;}return r;}
const warm={};
function xf(pt,bp){const dx=pt.x-BODYC.x,dy=pt.y-BODYC.y,c=Math.cos(bp.pitch),s=Math.sin(bp.pitch);return V(BODYC.x+dx*c-dy*s,BODYC.y+dx*s+dy*c+bp.y);}
function poseHorse(t,wk=''){
  const G=gait();const bp={y:G.bob.A*Math.cos(TAU*(G.bob.n*t-.15)),pitch:G.bob.pitch*Math.sin(TAU*(t-.1))};
  const hip=xf(HIP,bp),scap=xf(SCAP,bp);const chains=[];
  for(const leg of LEGS){const T=legTarget(G,leg,t),kind=leg[1],key=wk+leg;
    if(kind==='H'){let [a,b]=warm[key]||[P.hind.theta0,0];const r=solve((u,v)=>fkHind(hip,u,v).pts[3],a,b,T.F,-40*D2R,115*D2R,P.hind.theta0);warm[key]=[r[0],r[1]];const fk=fkHind(hip,r[0],r[1]);
      chains.push({id:leg,kind:'H',near:leg[0]==='L',pts:[...fk.pts,add(fk.pts[3],dir(T.dang),P.hind.digit)],stance:T.stance,scale:1});}
    else{const cf=T.stance?0:100*D2R*Math.pow(Math.sin(Math.PI*T.s),1.1)*(.6+.4*(G.lift.F/.26));let [a,b]=warm[key]||[P.fore.sig0,0];
      const r=solve((u,v)=>fkFore(scap,u,v,cf).pts[4],a,b,T.F,-45*D2R,130*D2R,P.fore.sig0);warm[key]=[r[0],r[1]];const fk=fkFore(scap,r[0],r[1],cf);
      chains.push({id:leg,kind:'F',near:leg[0]==='L',pts:[...fk.pts,add(fk.pts[4],dir(T.dang),P.fore.digit)],stance:T.stance,scale:1});}}
  return {mode:'horse',t,bp,chains};
}

/* =================== foam hind leg (shared by Walk and Bike) =================== */
const FR={femur:.23,tibia:.24,cannon:.17,digit:.09};
const MFR=[.42,.28,.15,.15],CFR=[.5,.5,.5,.7];
function unitDrop(){const a1=P.hind.theta0,a2=a1-P.hind.stifle0,a3=a2+P.hind.hock0,a4=a3+35*D2R;return -(FR.femur*Math.sin(a1)+FR.tibia*Math.sin(a2)+FR.cannon*Math.sin(a3)+FR.digit*Math.sin(a4));}
function fkFoam(pv,th,k,fold){const phi=fold*Math.max(0,th);const a1=P.hind.theta0+th,a2=a1-(P.hind.stifle0+phi),a3=a2+P.hind.hock0+.9*phi,a4=a3+35*D2R-1.2*phi;
  const p1=add(pv,dir(a1),FR.femur*k),p2=add(p1,dir(a2),FR.tibia*k),p3=add(p2,dir(a3),FR.cannon*k),p4=add(p3,dir(a4),FR.digit*k);return {pts:[pv,p1,p2,p3,p4]};}
function legMech(th,k,mass,fold,g=G0){const pr=fkFoam(V(0,0),th,k,fold).pts;let I=0,Vg=0;const Ls=[FR.femur,FR.tibia,FR.cannon,FR.digit].map(x=>x*k);
  for(let i=0;i<4;i++){const m=MFR[i]*mass,cx=lerp(pr[i].x,pr[i+1].x,CFR[i]),cy=lerp(pr[i].y,pr[i+1].y,CFR[i]);I+=m*(cx*cx+cy*cy+Ls[i]*Ls[i]/12);Vg+=m*g*cy;}return {I,V:Vg};}
function gravTorque(th,k,mass,fold,g=G0){const h=1e-4;return -(legMech(th+h,k,mass,fold,g).V-legMech(th-h,k,mass,fold,g).V)/(2*h);}

/* =================== walking rig (you are the front legs) =================== */
const WP={hipH:.92,thigh:.47,shank:.47,foot:.22,HX:.22,S:1.15,duty:.62,bob:.02};
function humanAnkle(p){const E=WP.S*WP.duty,x0=WP.HX+.04,s22=Math.sin(22*D2R);
  if(p<WP.duty){const u=p/WP.duty;const heel=u>.72?(u-.72)/.28*32*D2R:0;return {ankle:V(x0+E/2-E*u,.085+WP.foot*(Math.sin(22*D2R+heel)-s22)),fa:-22*D2R-heel,stance:true};}
  const s=(p-WP.duty)/(1-WP.duty),e=.5-.5*Math.cos(Math.PI*s);return {ankle:V(lerp(x0-E/2,x0+E/2,e),.085+WP.foot*(Math.sin(54*D2R)-s22)*(1-e)+.11*Math.pow(Math.sin(Math.PI*s),.9)),fa:lerp(-54,-22,e)*D2R,stance:false};}
function twoBone(h,t,L1,L2){const d=sub(t,h);const dl=clamp(len(d),.05,L1+L2-1e-4);const a=Math.atan2(d.y,d.x);const al=Math.acos(clamp((L1*L1+dl*dl-L2*L2)/(2*L1*dl),-1,1));return [add(h,dir(a+al),L1),add(h,dir(a),dl)];}
const humanPhaseOff={R:0,L:.5};
function wearFrame(time,T){const ph=time/T,w2=TAU*2/T;const hip=V(WP.HX,WP.hipH+WP.bob*Math.cos(TAU*2*ph));
  const belt=add(hip,V(-.17,.04)),top=add(hip,V(-.17,.52)),boomEnd=add(belt,V(-W.boom,0)),pivot=add(boomEnd,V(0,-.03));
  return {hip,belt,top,boomEnd,pivot,pA:add(hip,V(-.13,-.03)),pB:add(pivot,V(.11,.03)),pK:add(pivot,V(-.17,.03)),vy:-WP.bob*w2*Math.sin(TAU*2*ph),ay:-WP.bob*w2*w2*Math.cos(TAU*2*ph)};}
const legScaleW=()=>(WP.hipH+.01-W.clear)/unitDrop();
function cableAttach(pv,th,k){const d=dir(P.hind.theta0+th);return add(add(pv,d,.3*FR.femur*k),rot90(d),W.lever);}
function bungeeAttach(pv,th,k){const d=dir(P.hind.theta0+th);return add(add(pv,d,.35*FR.femur*k),rot90(d),-.05);}
let SIM=null,simKey='';
function simulate(){
  const T=1/W.cadence,vW=WP.S/T,dt=1/2000,steps=Math.round(T/dt),k=legScaleW(),N=240;
  const drivers=W.wiring==='cross'?{LH:'R',RH:'L'}:W.wiring==='same'?{LH:'L',RH:'R'}:{LH:null,RH:null};

const BG={bb:V(0,.28),rh:V(-.42,.34),fh:V(.62,.34),wr:.34,seatTop:V(-.13,.93),head:V(.5,.86),bar:V(.46,1.02),rackF:V(-.16,.80),rackB:V(-.66,.80),pivot:V(-.76,.80),crank:.17,hip:V(-.1,.99)};

function bikeDrive(){const O=BK.drive==='crank'?BG.bb:BG.rh,Pv=BG.pivot,toO=Math.atan2(O.y-Pv.y,O.x-Pv.x),beta=toO+Math.PI/2-P.hind.theta0;

const crankHz=()=>BK.rpm/60;
const bikeV=()=>crankHz()*BK.gear*2.1;
const bikeCycle=()=>BK.drive==='crank'?60/BK.rpm:BK.R/(crankHz()*BK.gear);
function poseBike(t){const dr=bikeDrive(),k=legScaleB();const psi=-TAU*t+Math.PI/2;const pedal=BK.drive==='crank'?psi:-TAU*t*BK.R/BK.gear+Math.PI/2;

/* =================== Jansen linkage + evolution =================== */
const HOLY={a:38,b:41.5,c:39.3,d:40.1,e:55.8,f:39.4,g:36.7,h:65.7,i:49,j:50,k:61.9,l:7.8,m:15};

let JCUR={...HOLY};

function analyze(Jx,n=72){const pts=[];for(let k=0;k<n;k++){const L=linkage(Jx,k/n*TAU);if(!L)return null;pts.push(L.H);}

  const ys=pts.map(p=>p.y),ymin=Math.min(...ys),ymax=Math.max(...ys),R=ymax-ymin;if(R<1e-6)return null;
  const con=ys.map(y=>y<ymin+.06*R);let best=[0,0];for(let s=0;s<n;s++){if(!con[s]||con[(s-1+n)%n])continue;let l=0;while(l<n&&con[(s+l)%n])l++;if(l>best[1])best=[s,l];}

let JA=analyze(JCUR,360);
const EV={pop:[],gen:0,best:null,hist:[],running:false,target:'flat',rate:.06,N:60,init:'jansen',holyCost:0,search:'objective',archive:[],thr:3,show:'linkage',lin:new Map(),champ:null,nextId:1,inspect:null,cells:[],stall:0};

const HT=horseTarget(48);

function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*v);}

const M=96;let CACHE=null,cacheKey='';

  if(S.mode==='horse')for(let i=0;i<M;i++)poseHorse(i/M,'c');
  CACHE=[];if(S.mode!=='evolve')for(let i=0;i<M;i++)CACHE.push(poseAt(i/M,'c'));cacheKey=key;buildChannels();buildEvents();}

const V3L={side:'2D',planes:'Planes','3d':'3D'};function setV3(v){S.v3=v;document.getElementById('v3b').textContent=V3L[v];SFX.toggle();dirty=true;}

function toggleSound(){S.sound=!S.sound;if(S.sound){audioStart();setTimeout(()=>SFX.chime(),60);}document.getElementById('snd').setAttribute('aria-pressed',S.sound);}
document.getElementById('snd').addEventListener('click',()=>{toggleSound();if(openTab==='layers')syncPanel();});
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{S.mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b));S.view={z:1,tx:0,ty:0};
  S.sel=S.mode==='horse'?'LH:2':'LH:1';if(S.mode==='wear'||S.mode==='bike')S.layers.forces=true;cacheKey='';SFX.toggle();syncPanel();dirty=true;}));
document.getElementById('play').addEventListener('click',()=>{setPlaying(!S.playing);SFX.toggle();});
const spEl=document.getElementById('speed');spEl.addEventListener('input',()=>{S.speed=+spEl.value;document.getElementById('speedV').textContent=S.speed.toFixed(2)+'×';});
let last=performance.now(),lastLock=false;
if(matchMedia('(prefers-reduced-motion: reduce)').matches)setPlaying(false);
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  try{ensureCache();
    if(S.mode==='evolve'&&EV.running){const r=evStep();if(r.improved&&EV.gen>1)SFX.chime();else if(r.added)tone(1567.98,.6,.02,.9);cacheKey='';dirty=true;if(openTab==='drive'&&EV.gen%10===0)syncPanel();}
    if(S.playing){const t0=S.t,dp=dt*S.speed/cycleSec();S.t=mod1(S.t+dp);S.dist+=dp*strideLen();fireEvents(t0,S.t);dirty=true;}
    if(dirty){dirty=false;drawStage();drawStrip();if(S.mode==='bike'&&cur){const lk=cur.ex.locked;if(lk&&!lastLock)SFX.lock();lastLock=lk;}}}catch(err){console.error(err);}
  requestAnimationFrame(frame);}
new ResizeObserver(()=>{dirty=true;}).observe(stage);
syncPanel();requestAnimationFrame(frame);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{readFonts();dirty=true;});
})();
