<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<title>Centaur Walker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{--bg:#e9e7e2;--panel:#f7f6f2;--view:#dcd8cf;--paper:#f4f2ec;--ink:#17150f;--ink-2:#5a554b;--ink-3:#8d877b;--rule:#d0cabe;--rule-2:#e6e2da;--accent:#2f55c9;--accent-ink:#fff;--hot:#e2591b;--ok:#15803d;--warn:#c2410c;
  --f-display:"Bodoni Moda",Didot,Georgia,serif;--f-body:"IBM Plex Sans",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f0e0c;--panel:#171512;--view:#1d1a16;--paper:#24211c;--ink:#ece7dd;--ink-2:#a9a293;--ink-3:#736c60;--rule:#2d2924;--rule-2:#221f1b;--accent:#8fa8ff;--accent-ink:#0d1014;--hot:#ff8a4c;--ok:#4ade80;--warn:#fb923c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f0e0c;--panel:#171512;--view:#1d1a16;--paper:#24211c;--ink:#ece7dd;--ink-2:#a9a293;--ink-3:#736c60;--rule:#2d2924;--rule-2:#221f1b;--accent:#8fa8ff;--accent-ink:#0d1014;--hot:#ff8a4c;--ok:#4ade80;--warn:#fb923c;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 var(--f-body);overflow:hidden}
.ws{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(260px,52%) auto auto minmax(0,1fr);grid-template-areas:"head" "view" "trans" "tabs" "insp";padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
@media (min-width:900px){.ws{grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"head head" "view side" "trans side"}.side{grid-area:side;display:grid;grid-template-rows:auto minmax(0,1fr);border-left:1px solid var(--rule);min-height:0}.tabs,.insp{grid-area:auto!important}}
@media (max-width:899px){.side{display:contents}}
header{grid-area:head;display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--rule);min-width:0}
h1{margin:0;font:500 15px var(--f-display);letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
@media (max-width:560px){h1{display:none}}
.hstat{flex:1;min-width:0;font:500 11px var(--f-mono);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mode{display:inline-flex;border:1px solid var(--ink);border-radius:7px;overflow:hidden;flex-shrink:0}
.mode button{font:600 12.5px var(--f-body);border:0;background:transparent;color:var(--ink);padding:6px 12px;min-height:34px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.mode i{display:inline-block;width:6px;height:13px;border:1.6px solid currentColor;border-radius:3px 3px 1px 1px}.mode i.w{width:14px;height:10px;border-radius:50%}
.mini{font:600 11px var(--f-body);border:1px solid var(--rule);background:var(--panel);color:var(--ink);border-radius:5px;min-height:30px;min-width:32px;padding:4px 8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.mini[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.view{grid-area:view;position:relative;background:var(--view);overflow:hidden;min-height:0}
.view canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.view canvas[hidden]{display:none}
.vbar{position:absolute;top:8px;left:8px;right:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;pointer-events:none;z-index:3}.vbar>*{pointer-events:auto}
.vseg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--panel)}
.vseg button{font:600 11px var(--f-body);border:0;background:transparent;color:var(--ink);padding:5px 9px;min-height:30px;cursor:pointer}
.vseg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.vstat{position:absolute;left:8px;right:8px;bottom:6px;font:500 10.5px var(--f-mono);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;z-index:3}
.trans{grid-area:trans;display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.play,.stepb{width:40px;height:36px;border-radius:7px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;display:grid;place-items:center;flex-shrink:0}
.stepb{background:var(--panel);color:var(--ink);border:1px solid var(--rule)}
.stepb:disabled{opacity:.35}
.ic{display:inline-block;position:relative;width:12px;height:12px}
.ic.play-i{width:0;height:0;border-left:11px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent}
.ic.pause-i::before,.ic.pause-i::after{content:"";position:absolute;top:0;width:4px;height:12px;background:currentColor}.ic.pause-i::before{left:1px}.ic.pause-i::after{right:1px}
.ic.prev,.ic.next{width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent}.ic.prev{border-right:9px solid currentColor}.ic.next{border-left:9px solid currentColor}
.scrub{flex:1;height:28px;touch-action:none;cursor:pointer;min-width:0}
.stepno{flex:1;min-width:0;font:500 12px var(--f-mono);color:var(--ink-2);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cad{display:flex;align-items:center;gap:6px;font:500 11px var(--f-mono);color:var(--ink-2)}.cad input{width:90px;accent-color:var(--accent)}
.tabs{grid-area:tabs;display:flex;background:var(--panel);border-bottom:1px solid var(--rule)}
.tabs button{flex:1;font:600 12.5px var(--f-body);border:0;border-bottom:2px solid transparent;background:transparent;color:var(--ink-2);padding:9px 4px;min-height:40px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.insp{grid-area:insp;overflow:auto;background:var(--panel);padding:12px 14px calc(18px + env(safe-area-inset-bottom,0px));min-height:0}
.insp section{display:flex;flex-direction:column;gap:10px}
h2{margin:6px 0 0;font:600 15px var(--f-body)}
p{margin:0;max-width:66ch}.muted{color:var(--ink-2);font-size:12.5px}
table{border-collapse:collapse;width:100%;font-size:12.5px}.tw{overflow-x:auto}
th,td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--rule-2);vertical-align:top}
th{font-weight:600;color:var(--ink-2);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
td.n{font-family:var(--f-mono);text-align:right;white-space:nowrap}td.m{font-family:var(--f-mono);white-space:nowrap}
td.pass{color:var(--ok);font-weight:600}td.fail{color:var(--warn);font-weight:600}
.tag{display:inline-block;font:600 9.5px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:1px 4px;border-radius:3px;border:1px solid currentColor;white-space:nowrap}
ol.steps{list-style:none;margin:0;padding:0}
ol.steps li{display:grid;grid-template-columns:30px 1fr;gap:8px;padding:7px 4px;border-bottom:1px solid var(--rule-2);cursor:pointer}
ol.steps li.ph{display:block;cursor:default;border:0;font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:12px 4px 2px}
ol.steps li .no{font:600 13px var(--f-mono);color:var(--ink-3);text-align:right}
ol.steps li b{font-weight:600;display:block}
ol.steps li span.d{font-size:12.5px;color:var(--ink-2)}
ol.steps li.cur{background:var(--rule-2)}ol.steps li.cur .no{color:var(--hot)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px;margin:0}.kv dt{color:var(--ink-2)}.kv dd{margin:0;font:500 12.5px var(--f-mono)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cell{border:1px solid var(--rule);border-radius:6px;padding:8px 10px;background:var(--bg)}.cell small{display:block;color:var(--ink-2);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.big{font:500 22px var(--f-mono);letter-spacing:-.01em}
a{color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.loading{position:absolute;inset:0;display:grid;place-items:center;font:500 12px var(--f-mono);color:var(--ink-2)}
</style>
<div class="ws">
<header><h1>Centaur Walker</h1><div class="mode" role="group" aria-label="Mode"><button data-m="walk" aria-pressed="true"><i></i>Walk</button><button data-m="ride" aria-pressed="false"><i class="w"></i>Ride</button></div><div class="hstat" id="hstat"></div></header>
<div class="view" id="view">
  <canvas id="c3" aria-label="3D model"></canvas>
  <canvas id="c2" hidden aria-label="Drawing"></canvas>
  <div class="loading" id="loading">Loading 3D…</div>
  <div class="vbar"><div class="vseg" role="group" aria-label="View"><button data-v="manual" aria-pressed="true">Manual</button><button data-v="3d" aria-pressed="false">3D</button><button data-v="side" aria-pressed="false">Side</button><button data-v="plate" aria-pressed="false">Plate</button><button data-v="leg" aria-pressed="false">Leg</button><button data-v="drive" aria-pressed="false">Drive</button></div></div>
  <div class="vstat" id="vstat"></div>
</div>
<div class="trans" id="trans"></div>
<div class="side">
  <div class="tabs" role="tablist"><button role="tab" data-t="steps" aria-selected="true">Steps</button><button role="tab" data-t="shop" aria-selected="false">Shop</button><button role="tab" data-t="tests" aria-selected="false">Tests</button><button role="tab" data-t="record" aria-selected="false">Record</button></div>
  <div class="insp" id="insp"></div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const T=window.THREE,TAU=Math.PI*2,$=id=>document.getElementById(id),css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const V=(x,y)=>({x,y}),sub=(a,b)=>V(a.x-b.x,a.y-b.y),add=(a,b)=>V(a.x+b.x,a.y+b.y),len=v=>Math.hypot(v.x,v.y),mm=m=>Math.round(m*1000)+' mm',inch=m=>(m/.0254).toFixed(1)+' in';

/* ================= THE LEG =================
   Jansen's topology, evolved for a load-bearing walk: one hoof always on the ground, level stance, two planted
   hooves moving together. Every length is a whole number of 3/4 in., so a tape measure marks every hole. */
const PITCH=19.05; // mm: 3/4 in.
const N={a:16,b:13,c:18,d:13,e:13,f:28,g:11,h:22,i:23,j:18,k:28,l:5,m:5};
const J={};for(const k in N)J[k]=N[k]*PITCH;
function circ(p,r1,q,r2,side){const dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy);if(d<1e-9)return null;const a=(r1*r1-r2*r2+d*d)/(2*d),hh=r1*r1-a*a;if(hh<0)return null;const h=Math.sqrt(hh),mx=p.x+a*dx/d,my=p.y+a*dy/d;return V(mx-side*h*dy/d,my+side*h*dx/d);}
function lk(th){const O=V(0,0),B=V(-J.a,-J.l),C=V(J.m*Math.cos(th),J.m*Math.sin(th));const D=circ(B,J.b,C,J.j,1),E=circ(B,J.c,C,J.k,-1);if(!D||!E)return null;const F=circ(B,J.d,D,J.e,1);if(!F)return null;const G=circ(F,J.f,E,J.g,-1);if(!G)return null;const H=circ(G,J.h,E,J.i,-1);if(!H)return null;return {O,B,C,D,E,F,G,H};}
const NS=360,PU=[];for(let k=0;k<NS;k++)PU.push(lk(k/NS*TAU));
const YMIN=Math.min(...PU.map(p=>p.H.y)),CONTACT=PU.map(p=>p.H.y<YMIN+6);let TD=0,LO=0;for(let k=0;k<NS;k++){if(CONTACT[k]&&!CONTACT[(k+1)%NS])TD=k;if(CONTACT[k]&&!CONTACT[(k-1+NS)%NS])LO=k;}
const DUTY=CONTACT.filter(Boolean).length/NS,STX=PU.filter((p,i)=>CONTACT[i]).map(p=>p.H.x),ADV=(Math.max(...STX)-Math.min(...STX))/DUTY/1000,STMID=(Math.max(...STX)+Math.min(...STX))/2000,HT=-YMIN/1000;
const LIFT=(Math.max(...PU.map(p=>p.H.y))-YMIN)/1000,STBOB=(Math.max(...PU.filter((p,i)=>CONTACT[i]).map(p=>p.H.y))-YMIN)/1000;
const thetaAt=ph=>TD/NS*TAU-TAU*ph; // phase 0 = touchdown; the crank turns clockwise seen from the right as the ground drives it
const idx=ph=>((Math.round(TD-NS*ph)%NS)+NS)%NS,onGround=ph=>CONTACT[idx(ph)];
const legAt=ph=>{const u=PU[idx(ph)],o={};for(const k in u)o[k]=V(u[k].x/1000,u[k].y/1000);return o;}; // metres, relative to O, body frame
// double-support slip: both hooves down, how much do their speeds disagree over one cycle
let DSLIP=0;for(let k=0;k<NS;k++){const k2=(k+NS/2)%NS;if(CONTACT[k]&&CONTACT[k2]){const d1=PU[(k+1)%NS].H.x-PU[k].H.x,d2=PU[(k2+1)%NS].H.x-PU[k2].H.x;DSLIP+=Math.abs(d1-d2);}}DSLIP/=1000;

/* bars: every link is a piece of 1×2 select pine (19 × 38 mm) with a 3/8 in. hole near each end. The distance between
   the holes is a whole number of 3/4 in., so a tape measure in inches marks every bar. Triangles are three bars bolted at their corners. */
const BARS=[{id:'m',name:'Crank',j:['O','C']},{id:'j',name:'Upper rod',j:['C','D']},{id:'k',name:'Lower rod',j:['C','E']},{id:'b',name:'Hip bar, front',j:['B','D']},{id:'d',name:'Hip bar, rear',j:['B','F']},{id:'e',name:'Hip bar, top',j:['D','F']},
  {id:'c',name:'Thigh rod',j:['B','E']},{id:'f',name:'Gaskin rod',j:['F','G']},{id:'g',name:'Hock bar',j:['G','E']},{id:'h',name:'Cannon bar, rear',j:['G','H']},{id:'i',name:'Cannon bar, front',j:['E','H']}];
const frac=x=>{const w=Math.floor(x+1e-9),r=x-w;return (w?w:'')+(r>.6?'-3/4':r>.4?'-1/2':r>.1?'-1/4':'')+'';};
BARS.forEach(b=>{b.n=N[b.id];b.inch=b.n*.75;b.cut=b.inch+1.5+(b.id==='m'?1.3125:0);b.inchS=frac(b.inch).replace(/^-/,'')+' in.';b.cutS=frac(b.cut).replace(/^-/,'')+' in.';});
const PIVOTS=['B','C','D','E','F','G','H'];
function segDist(a,b,c,d){const f=(p,q,r)=>{const l2=(r.x-q.x)**2+(r.y-q.y)**2;let t=l2?((p.x-q.x)*(r.x-q.x)+(p.y-q.y)*(r.y-q.y))/l2:0;t=Math.max(0,Math.min(1,t));return Math.hypot(p.x-q.x-t*(r.x-q.x),p.y-q.y-t*(r.y-q.y));};const o=(p,q,r)=>Math.sign((q.x-p.x)*(r.y-p.y)-(q.y-p.y)*(r.x-p.x));if(o(a,b,c)*o(a,b,d)<0&&o(c,d,a)*o(c,d,b)<0)return 0;return Math.min(f(a,c,d),f(b,c,d),f(c,a,b),f(d,a,b));}
const BAR_T=.019,BAR_W=.0381,WASH_T=.0016,PLATE_T=.012;
const LAYER={},STACK={};
(function plan(){const n=BARS.length,gap=BAR_W*1000+6,conf=[...Array(n)].map(()=>Array(n).fill(false));
  for(let a=0;a<n;a++)for(let b=a+1;b<n;b++){const A=BARS[a],B_=BARS[b];if(A.j.some(x=>B_.j.includes(x))){conf[a][b]=conf[b][a]=true;continue;}for(let k=0;k<NS&&!conf[a][b];k+=3){const P=PU[k];if(segDist(P[A.j[0]],P[A.j[1]],P[B_.j[0]],P[B_.j[1]])<gap)conf[a][b]=conf[b][a]=true;}}
  const COL=[...PIVOTS,'O'],near=BARS.map(b=>{const o={};for(const c of COL){o[c]=false;for(let k=0;k<NS&&!o[c];k+=3){const P=PU[k];if(segDist(P[c],P[c],P[b.j[0]],P[b.j[1]])<BAR_W*500+14)o[c]=true;}}return o;});
  let best=null;for(let kc=3;kc<=9&&!best;kc++){const as=Array(n).fill(0);const rec=i=>{if(i===n){for(const c of COL){const ls=BARS.map((b,bi)=>b.j.includes(c)?as[bi]:null).filter(x=>x!==null);const lo=(c==='B'||c==='O')?1:Math.min(...ls),hi=Math.max(...ls);for(let bi=0;bi<n;bi++)if(!BARS[bi].j.includes(c)&&near[bi][c]&&as[bi]>=lo&&as[bi]<=hi)return;}
      let cost=0;for(const c of COL){const ls=BARS.map((b,bi)=>b.j.includes(c)?as[bi]:null).filter(x=>x!==null);cost+=Math.max(...ls)-((c==='B'||c==='O')?1:Math.min(...ls))+1-ls.length;}const hL=BARS.map((b,bi)=>b.j.includes('H')?as[bi]:null).filter(x=>x!==null);cost+=1.5*(Math.min(...hL)+Math.max(...hL))/2; // keep the hoof near the centreline
      if(!best||cost<best.cost)best={cost,as:as.slice()};return;}
    for(let L=1;L<=kc;L++){if(i===0&&L!==1)continue;let ok=true;for(let p=0;p<i;p++)if(conf[i][p]&&as[p]===L){ok=false;break;}if(ok){as[i]=L;rec(i+1);}}};rec(0);}
  BARS.forEach((b,i)=>LAYER[b.id]=best.as[i]);LAYER.n=Math.max(...best.as);
  for(const c of [...PIVOTS,'O']){const bs=BARS.filter(b=>b.j.includes(c));const ls=bs.map(b=>LAYER[b.id]);const lo=(c==='B'||c==='O')?1:Math.min(...ls),hi=Math.max(...ls);STACK[c]={bars:bs,lo,hi,spacers:hi-lo+1-ls.length};}})();
const LZ=L=>PLATE_T/2+WASH_T+(L-1)*(BAR_T+WASH_T)+BAR_T/2; // centre of layer L, from the middle of the plate
const HOOF_ANG=(()=>{const P=PU[(((Math.round(TD-NS*DUTY/2))%NS)+NS)%NS];return Math.atan2(P.H.y-P.E.y,P.H.x-P.E.x);})(); // hoof sole level at mid-stance
const HOOF_Z=()=>(LZ(STACK.H.lo)+LZ(STACK.H.hi))/2;       // the 2×4 block hangs centred under the H stack on two mending plates
const STOCK_IN=[2,2.5,3,3.5,4,4.5,5,5.5,6,7,8];
function boltFor(c){const s=STACK[c];let grip;if(c==='B')grip=2*(LZ(s.hi)+BAR_T/2+WASH_T);else{const span=s.hi-s.lo+1;grip=span*BAR_T+(span+1)*WASH_T+(c==='H'?2*.0012:0);}const need=grip+.0032+.0095+.004;return {grip,len:STOCK_IN.find(x=>x*.0254>=need)||8,need};}

/* ================= STATICS: bar forces under the hoof load ================= */
function solveStance(Pm,W,fx){ // Pm: joint positions (m). returns member forces (N, + tension) and crank torque
  const mem=BARS.filter(b=>b.id!=='m'),jt=['C','D','E','F','G','H'],nU=mem.length+2,A=[...Array(12)].map(()=>Array(nU+1).fill(0));
  const row=(j,ax)=>jt.indexOf(j)*2+ax;
  mem.forEach((b,mi)=>{const [p,q]=b.j;for(const [x,y] of [[p,q],[q,p]]){if(!jt.includes(x))continue;const d=sub(Pm[y],Pm[x]),l=len(d);A[row(x,0)][mi]+=d.x/l;A[row(x,1)][mi]+=d.y/l;}});
  A[row('C',0)][mem.length]=1;A[row('C',1)][mem.length+1]=1;A[row('H',0)][nU]=-fx;A[row('H',1)][nU]=-W;
  for(let c=0;c<nU;c++){let p=c;for(let r=c+1;r<12;r++)if(Math.abs(A[r][c])>Math.abs(A[p][c]))p=r;[A[c],A[p]]=[A[p],A[c]];const pv=A[c][c];if(Math.abs(pv)<1e-12)return null;for(let k=c;k<=nU;k++)A[c][k]/=pv;for(let r=0;r<12;r++)if(r!==c){const f=A[r][c];if(f)for(let k=c;k<=nU;k++)A[r][k]-=f*A[c][k];}}
  const F={};mem.forEach((b,mi)=>F[b.id]=A[mi][nU]);const R=V(A[mem.length][nU],A[mem.length+1][nU]),C=Pm.C;return {F,tau:-(C.x*(-R.y)-C.y*(-R.x))};}

/* ================= THE ENGINE: weight, friction, traction, roll, sway and slop =================
   One function evaluates a leg built from a given material. The build uses pine; the others are computed beside it. */
const HOOF_M=.06; // 1×2 pine pad .03, rubber .01, two 2 in. corner braces .02: the hoof is the fastest-moving part, so its weight sets the grip the drive needs

      row('computed','Wood crushing at the bolt holes',D.sfC.toFixed(1)+'×','≥ 2×',D.sfC>=2),
      row('computed','Hoof side play walking straight (0.2 mm per drilled hole)',mm(D.swayPlay),'≤ 25 mm',D.swayPlay<=.025),
      row('computed','Hoof side flex in a turn, before the hoof slides',mm(D.swayBend),'≤ 40 mm',D.swayBend<=.04),
      row('computed','Hoof play in the leg’s plane (0.4 mm per hole)',(D.slop).toFixed(1)+' mm','≤ 8 mm',D.slop<=8),
      row('computed','Rear bob, beyond your own hips',mm(Math.max(0,K.bob)),'≤ 10 mm',K.bob<=.01)])}
    <h2>Fit</h2>${tbl([
      row('computed','Hoof to your heel, closest (walk)',mm(K.heelGap),'≥ 100 mm',K.heelGap>=.1),

      row('condition','You match your stride to the hoof beat',mm(ADV)+' stride','—',null),
      row('judged','Reads as a horse walking','Side, Plate, 3D','—',null),
      row('unknown','How the pine holes wear over months','needs a build','—',null)])}
    <h2>Why pine: the same leg in four materials</h2><div class="tw"><table><thead><tr><th>Material</th><th>kg / leg</th><th>legs $</th><th>sway</th><th>buckling</th><th>grip</th></tr></thead><tbody>${['wood','s14','s16x2','emt'].map(k=>{const e=k==='wood'?D:evalDesign(k,VMAX.fb),bad=e.sway>.03||e.sfB<2||e.sfC<2;return `<tr><td>${e.m.short}<br><span class="muted">${e.m.holes}</span></td><td class="n">${e.leg.toFixed(1)}</td><td class="n">${Math.round(e.costLegs)}</td><td class="n ${e.sway>.03?'fail':''}">${e.sway>1?'>1 m':mm(e.sway)}</td><td class="n ${e.sfB<2?'fail':''}">${e.sfB>=99?'—':e.sfB.toFixed(1)+'×'}</td><td class="n">${e.muMax.toFixed(2)}</td></tr>`;}).join('')}</tbody></table></div>
    <p class="muted">Weight on you is the share of the hindquarters that the hitch carries: the rear stands on whichever hoof is down, and that hoof travels ${mm(Math.max(...STX)/1000-Math.min(...STX)/1000)} while it is down, so the share changes twice per stride. Grip needed is the backward force the stance hoof must push with to turn the crank, divided by the load on it. Friction uses greased steel in pine (μ 0.2) on the computed pin loads, with nuts set a quarter turn back so nothing is clamped. One steel strip has almost no stiffness sideways; pine’s 19 mm thickness gives it enough, at a third of the weight of two strips.</p></section>`;}
  if(S.tab==='record'){h=`<section><h2>Design thesis</h2><p>The centaur reads when the hind hooves land a pony’s body length behind your feet, all four legs keep one walking rhythm, and the hind hooves visibly carry weight. So the hindquarters are a stretcher: the front pins to your belt or seatpost, the rear stands on its own legs, and the ground turns the crank as you walk.</p>
    <h2>Defining moment</h2><p>Side view, walking: the left hind hoof plants and takes the rear while your left foot is still in the air, a quarter cycle before it lands.</p>

{const kmh=v=>(v*3.6).toFixed(1);const w=STEPS.find(x=>x.t==='Walk'),r=STEPS.find(x=>x.t==='Ride');

    cv.addEventListener('pointerup',e=>{const p=ptr.get(e.pointerId);ptr.delete(e.pointerId);if(g0&&!g0.pinch&&!g0.mv&&p&&S.view==='3d'){const n=R3.pick(e.clientX,e.clientY);if(n){vstat(n);S.hold=performance.now()+3500;}}if(!ptr.size)g0=null;});});
