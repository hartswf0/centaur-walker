<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<title>Centaur Velocipede</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#e8e5df;--panel:#f6f4f0;--view:#d9d4cb;--ink:#17150f;--ink-2:#5a554b;--ink-3:#8d877b;--rule:#d0cabe;--rule-2:#e4e0d8;--accent:#2f55c9;--accent-ink:#fff;--ok:#15803d;--warn:#c2410c;--bone:#c9a46c;
  --f-display:"Bodoni Moda",Didot,Georgia,serif;--f-body:"IBM Plex Sans",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f0e0c;--panel:#171512;--view:#1d1a16;--ink:#ece7dd;--ink-2:#a9a293;--ink-3:#736c60;--rule:#2d2924;--rule-2:#221f1b;--accent:#8fa8ff;--accent-ink:#0d1014;--ok:#4ade80;--warn:#fb923c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f0e0c;--panel:#171512;--view:#1d1a16;--ink:#ece7dd;--ink-2:#a9a293;--ink-3:#736c60;--rule:#2d2924;--rule-2:#221f1b;--accent:#8fa8ff;--accent-ink:#0d1014;--ok:#4ade80;--warn:#fb923c;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 var(--f-body);overflow:hidden}
.ws{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(250px,50%) auto auto minmax(0,1fr);grid-template-areas:"head" "view" "trans" "tabs" "insp";padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
@media (min-width:900px){.ws{grid-template-columns:minmax(0,1fr) 410px;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"head head" "view side" "trans side"}.side{grid-area:side;display:grid;grid-template-rows:auto minmax(0,1fr);border-left:1px solid var(--rule);min-height:0}.tabs,.insp{grid-area:auto!important}}
@media (max-width:899px){.side{display:contents}}
header{grid-area:head;display:flex;align-items:center;gap:10px;padding:7px 12px;background:var(--panel);border-bottom:1px solid var(--rule);min-width:0}
h1{margin:0;font:500 15px var(--f-display);letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
.hstat{flex:1;min-width:0;font:500 11px var(--f-mono);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{font:600 11px var(--f-body);border:1px solid var(--rule);background:var(--panel);color:var(--ink);border-radius:5px;min-height:30px;min-width:32px;padding:4px 8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.mini[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.view{grid-area:view;position:relative;background:var(--view);overflow:hidden;min-height:0}
.view canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.view canvas[hidden]{display:none}
.vbar{position:absolute;top:8px;left:8px;right:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;pointer-events:none}.vbar>*{pointer-events:auto}
.vseg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--panel)}
.vseg button{font:600 11px var(--f-body);border:0;background:transparent;color:var(--ink);padding:5px 10px;min-height:30px;cursor:pointer}
.vseg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.vstat{position:absolute;left:8px;right:8px;bottom:6px;font:500 10.5px var(--f-mono);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.trans{grid-area:trans;display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.scrub{flex:1;height:28px;touch-action:none;cursor:pointer;min-width:0}
.play{width:40px;height:36px;border-radius:7px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;display:grid;place-items:center}
.ic{display:inline-block;position:relative;width:12px;height:12px}
.ic.play-i{width:0;height:0;border-left:11px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent}
.ic.pause-i::before,.ic.pause-i::after{content:"";position:absolute;top:0;width:4px;height:12px;background:currentColor}.ic.pause-i::before{left:1px}.ic.pause-i::after{right:1px}
.cad{display:flex;align-items:center;gap:6px;font:500 11px var(--f-mono);color:var(--ink-2)}.cad input{width:90px;accent-color:var(--accent)}
.tabs{grid-area:tabs;display:flex;background:var(--panel);border-bottom:1px solid var(--rule)}
.tabs button{flex:1;font:600 12.5px var(--f-body);border:0;border-bottom:2px solid transparent;background:transparent;color:var(--ink-2);padding:9px 6px;min-height:40px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.insp{grid-area:insp;overflow:auto;background:var(--panel);padding:12px 14px calc(18px + env(safe-area-inset-bottom,0px));min-height:0}
.insp section{display:flex;flex-direction:column;gap:10px}
h2{margin:0;font:600 16px var(--f-body)}h3{margin:6px 0 0;font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
p{margin:0;max-width:66ch}.muted{color:var(--ink-2);font-size:12.5px}
table{border-collapse:collapse;width:100%;font-size:12.5px}.tw{overflow-x:auto}
th,td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--rule-2);vertical-align:top}
th{font-weight:600;color:var(--ink-2);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
td.n{font-family:var(--f-mono);text-align:right;white-space:nowrap}td.m{font-family:var(--f-mono);white-space:nowrap}
.tag{display:inline-block;font:600 9.5px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:1px 4px;border-radius:3px;border:1px solid currentColor}
.tag.buy{color:var(--accent)}.tag.salvage{color:var(--ok)}.tag.make{color:#a0703f}
ol.steps{list-style:none;margin:0;padding:0}
ol.steps li{display:grid;grid-template-columns:26px 1fr;gap:8px;padding:8px 4px;border-bottom:1px solid var(--rule-2);cursor:pointer}
ol.steps li .no{font:500 11px var(--f-mono);color:var(--ink-3);text-align:right;padding-top:2px}
ol.steps li b{font-weight:600;display:block}
ol.steps li span.d{font-size:12.5px;color:var(--ink-2)}
ol.steps li.cur{background:var(--rule-2)}
ol.steps li .num{font-family:var(--f-mono);color:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px;margin:0}.kv dt{color:var(--ink-2)}.kv dd{margin:0;font:500 12.5px var(--f-mono)}
.sl{display:grid;grid-template-columns:minmax(8.5em,auto) 1fr auto;gap:8px;align-items:center;font-size:13px;color:var(--ink-2)}.sl input{width:100%;accent-color:var(--accent)}
.val{font:500 12px var(--f-mono);color:var(--ink);min-width:7ch;text-align:right}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.big{font:500 22px var(--f-mono);letter-spacing:-.01em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cell{border:1px solid var(--rule);border-radius:6px;padding:8px 10px;background:var(--bg)}.cell small{display:block;color:var(--ink-2);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.spk{position:relative;width:16px;height:12px;display:inline-block}.spk::before{content:"";position:absolute;left:0;top:3px;width:4px;height:6px;background:currentColor}.spk::after{content:"";position:absolute;left:3px;top:0;border-right:6px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent}.spk i{position:absolute;left:10px;top:2px;width:6px;height:8px;border:2px solid currentColor;border-left:0;border-radius:0 8px 8px 0;opacity:.25}[aria-pressed="true"] .spk i{opacity:1}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select{font:500 12.5px var(--f-body);padding:4px;border:1px solid var(--rule);border-radius:4px;background:var(--bg);color:var(--ink);min-height:30px}
.loading{position:absolute;inset:0;display:grid;place-items:center;font:500 12px var(--f-mono);color:var(--ink-2)}
</style>
<div class="ws">
<header><h1>Centaur Velocipede</h1><div class="hstat" id="hstat"></div><button class="mini" id="snd" type="button" aria-pressed="false" aria-label="Sound"><span class="spk"><i></i></span></button></header>
<div class="view" id="view">
  <canvas id="c3" aria-label="3D model. Drag to orbit, pinch to zoom, tap a part to name it."></canvas>
  <canvas id="c2" hidden aria-label="Drawing"></canvas>
  <div class="loading" id="loading">Loading 3D…</div>
  <div class="vbar"><div class="vseg" role="group" aria-label="View"><button data-v="3d" aria-pressed="true">3D</button><button data-v="elev" aria-pressed="false">Elevation</button><button data-v="plate" aria-pressed="false">Plate</button><button data-v="leg" aria-pressed="false">Leg</button></div><div class="vseg" role="group" aria-label="3D options" id="v3opts"><button id="xray" aria-pressed="false">Bare</button><button id="fit">Fit</button></div></div>
  <div class="vstat" id="vstat"></div>
</div>
<div class="trans"><button class="play" id="play" type="button" aria-label="Pause"><span class="ic pause-i" id="pi"></span></button><canvas class="scrub" id="scrub" aria-label="Phase of one pedal turn. Drag to scrub."></canvas><label class="cad"><input id="cad" type="range" min="20" max="90" step="1" value="60" aria-label="Cadence"><span id="cadv">60 rpm</span></label></div>
<div class="side">
  <div class="tabs" role="tablist"><button role="tab" data-t="build" aria-selected="true">Build</button><button role="tab" data-t="parts" aria-selected="false">Parts</button><button role="tab" data-t="drive" aria-selected="false">Drive</button><button role="tab" data-t="joints" aria-selected="false">Joints</button></div>
  <div class="insp" id="insp"></div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const T=window.THREE,TAU=Math.PI*2,D=Math.PI/180,$=id=>document.getElementById(id);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const V=(x,y)=>({x,y}),sub=(a,b)=>V(a.x-b.x,a.y-b.y),len=v=>Math.hypot(v.x,v.y);

/* ===== Jansen linkage, in Jansen's units ===== */
const JU={a:38,b:41.5,c:39.3,d:40.1,e:55.8,f:39.4,g:36.7,h:65.7,i:49,j:50,k:61.9,l:7.8,m:15};
function circ(p,r1,q,r2,side){const dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy);if(d<1e-9)return null;const a=(r1*r1-r2*r2+d*d)/(2*d),hh=r1*r1-a*a;if(hh<0)return null;const h=Math.sqrt(hh),mx=p.x+a*dx/d,my=p.y+a*dy/d;return V(mx-side*h*dy/d,my+side*h*dx/d);}
function jan(th){const O=V(0,0),B=V(-JU.a,-JU.l),C=V(JU.m*Math.cos(th),JU.m*Math.sin(th));const Dd=circ(B,JU.b,C,JU.j,1),E=circ(B,JU.c,C,JU.k,-1),F=circ(B,JU.d,Dd,JU.e,1),G=circ(F,JU.f,E,JU.g,-1),H=circ(G,JU.h,E,JU.i,-1);return {O,B,C,D:Dd,E,F,G,H};}
const NS=360,PU=[];for(let k=0;k<NS;k++)PU.push(jan(k/NS*TAU));
const YMIN=Math.min(...PU.map(p=>p.H.y)),YMAXH=Math.max(...PU.map(p=>p.H.y));
const TOLU=1.0;const CONTACT=PU.map(p=>p.H.y<YMIN+TOLU);
let TD=0,LO=0;for(let k=0;k<NS;k++){if(CONTACT[k]&&!CONTACT[(k+1)%NS])TD=k;if(CONTACT[k]&&!CONTACT[(k-1+NS)%NS])LO=k;}
const DUTY=CONTACT.filter(Boolean).length/NS;
// phase 0 = left hind touchdown; crank turns with decreasing theta so the machine walks toward +x and the knee G trails like a hock
const thetaAt=ph=>TD/NS*TAU-TAU*ph;
const BODIES=[
 {id:'crank',name:'Crank arm',j:['O','C']},
 {id:'j',name:'Upper rod',j:['C','D']},
 {id:'k',name:'Lower rod',j:['C','E']},
 {id:'t1',name:'Hip plate',j:['B','D','F']},
 {id:'c',name:'Thigh rocker',j:['B','E']},
 {id:'f',name:'Gaskin rod',j:['F','G']},
 {id:'t2',name:'Shank plate',j:['G','E','H']}];
const LINKS=[['O','C','m'],['C','D','j'],['C','E','k'],['B','D','b'],['B','F','d'],['D','F','e'],['B','E','c'],['F','G','f'],['G','E','g'],['G','H','h'],['E','H','i']];
const JOINTS=['B','C','D','E','F','G'];

/* ===== state ===== */
const S={hip:1.046,clear:.005,cad:60,wheel:20,ph:0,playing:true,view:'3d',tab:'build',step:-1,sound:false,bare:false,dist:0};
const PLY=.012,WASH=.0016,PITCH=PLY+WASH,BARW=.045,PLATE_Z=.13,LAYER0=.18;
const sc=()=>(S.hip-S.clear)/(-YMIN);  // metres per Jansen unit
const OX=-.65;
const WHEELS={20:{name:'20 in (406)',C:Math.PI*.500,r:.25},24:{name:'24 in (507)',C:Math.PI*.601,r:.3005},26:{name:'26 in (559)',C:Math.PI*.653,r:.3265}};
function legW(ph){const s=sc(),u=jan(thetaAt(ph)),o={};for(const k in u)o[k]=V(OX+u[k].x*s,S.hip+u[k].y*s);return o;} // world side-view, metres
/* derived numbers */
let K={};
function derive(){const s=sc();const dx=(PU[TD].H.x-PU[LO].H.x)*s;const adv=dx/DUTY;const W=WHEELS[S.wheel];
  let best=null;for(let a=14;a<=36;a++)for(let b=16;b<=44;b++){const e=Math.abs(W.C*a/b-adv);if(!best||e<best.e-1e-6||(Math.abs(e-best.e)<1e-6&&a+b<best.a+best.b))best={a,b,e};}
  const Ceff=W.C*best.a/best.b;
  // hoof slip during stance with this gearing
  let slip=0;for(let k=TD;k!==LO;k=(k-1+NS)%NS){const k2=(k-1+NS)%NS;const hoofRel=(PU[k2].H.x-PU[k].H.x)*s;slip+=Math.abs(hoofRel+Ceff/NS);}
  const v=S.cad/60*Ceff;
  const lift=(YMAXH-YMIN)*s;
  // timing: crank pin angle when the left pedal is straight up (phase .25)
  const th=thetaAt(.25),ang=((th%TAU)+TAU)%TAU/D;let clock=(3-ang/30);clock=((clock%12)+12)%12;clock=Math.round(clock*2)/2;if(clock===0)clock=12;
  const chain=(cd,t1,t2)=>{const p=.0127;let n=2*cd/p+(t1+t2)/2+p*(t2-t1)**2/(4*Math.PI**2*cd);n=Math.ceil(n);if(n%2)n++;return n;};
  const BB=V(0,.27),O=V(OX,S.hip),RA=V(-.78,W.r);
  K={s,crank:15*s,adv,duty:DUTY,T1:best.a,T2:best.b,Ceff,slip,v,lift,clock,stride:dx,chainA:chain(len(sub(O,BB)),32,32)+2,chainB:chain(len(sub(O,RA)),best.a,best.b)+2,O,B:V(OX-JU.a*s,S.hip-JU.l*s),RA,BB,W};}
derive();

/* ===== layer plan: bodies that share a joint or pass within a bar width of each other go on different layers ===== */
function segDist(a,b,c,d){const f=(p,q,r)=>{const l2=(r.x-q.x)**2+(r.y-q.y)**2;let t=l2?((p.x-q.x)*(r.x-q.x)+(p.y-q.y)*(r.y-q.y))/l2:0;t=Math.max(0,Math.min(1,t));return Math.hypot(p.x-q.x-t*(r.x-q.x),p.y-q.y-t*(r.y-q.y));};
  const o=(p,q,r)=>Math.sign((q.x-p.x)*(r.y-p.y)-(q.y-p.y)*(r.x-p.x));if(o(a,b,c)*o(a,b,d)<0&&o(c,d,a)*o(c,d,b)<0)return 0;return Math.min(f(a,c,d),f(b,c,d),f(c,a,b),f(d,a,b));}
const bodyEdges=b=>b.j.length===2?[[b.j[0],b.j[1]]]:[[b.j[0],b.j[1]],[b.j[1],b.j[2]],[b.j[2],b.j[0]]];
let LAYERS={},JSTACK={};
function planLayers(){const n=BODIES.length,conf=[...Array(n)].map(()=>Array(n).fill(false));const gap=(BARW+.006)/sc();
  for(let a=0;a<n;a++)for(let b=a+1;b<n;b++){const A=BODIES[a],Bb=BODIES[b];if(A.j.some(x=>Bb.j.includes(x))){conf[a][b]=conf[b][a]=true;continue;}
    for(let k=0;k<NS&&!conf[a][b];k+=5){const P=PU[k];for(const [p,q] of bodyEdges(A))for(const [r,t] of bodyEdges(Bb))if(segDist(P[p],P[q],P[r],P[t])<gap){conf[a][b]=conf[b][a]=true;}}}
  let best=null;for(let kc=2;kc<=7&&!best;kc++){const asg=Array(n).fill(0);
    const rec=i=>{if(i===n){let cost=0;for(const J of JOINTS){const ls=BODIES.map((b,bi)=>b.j.includes(J)?asg[bi]:null).filter(x=>x!==null);const lo=J==='B'?1:Math.min(...ls),hi=Math.max(...ls);cost+=hi-lo+1-ls.length;}if(!best||cost<best.cost)best={cost,asg:asg.slice()};return;}
      for(let L=1;L<=kc;L++){if(i===0&&L!==1)continue;let ok=true;for(let p=0;p<i;p++)if(conf[i][p]&&asg[p]===L){ok=false;break;}if(ok){asg[i]=L;rec(i+1);}}};rec(0);}
  LAYERS={};BODIES.forEach((b,i)=>LAYERS[b.id]=best.asg[i]);LAYERS.n=Math.max(...best.asg);
  JSTACK={};const SH=[.5,.625,.75,1,1.25,1.5,1.75,2,2.25,2.5,2.75,3,3.5,4];
  for(const J of JOINTS){const bs=BODIES.filter(b=>b.j.includes(J)).map(b=>({b,L:LAYERS[b.id]}));const ls=bs.map(x=>x.L);const lo=J==='B'?1:Math.min(...ls),hi=Math.max(...ls);
    const span=hi-lo+1,spacers=span-ls.length,stack=span*PLY+(span-1)*WASH+(J==='B'?WASH:0);let sh=SH.find(x=>x*25.4/1000>=stack)||4;JSTACK[J]={bodies:bs,lo,hi,spacers,stack,shoulder:sh};}}
planLayers();
const layerZ=L=>LAYER0+(L-1)*PITCH; // centre of layer L (per side, outward)

/* ===== sound ===== */
const AU={};function audio(){if(AU.c){if(AU.c.state==='suspended')AU.c.resume();return AU.c;}try{const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createGain();o.gain.value=.7;o.connect(c.destination);const nb=c.createBuffer(1,c.sampleRate,c.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;Object.assign(AU,{c,o,nb});return c;}catch(e){return null;}}
function knock(f,dur,g){if(!S.sound)return;const c=audio();if(!c)return;const t=c.currentTime,s=c.createBufferSource(),bp=c.createBiquadFilter(),gn=c.createGain();s.buffer=AU.nb;bp.type='bandpass';bp.frequency.value=f;bp.Q.value=3;gn.gain.setValueAtTime(g,t);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(bp);bp.connect(gn);gn.connect(AU.o);s.start(t);s.stop(t+dur+.02);
  const o=c.createOscillator(),g2=c.createGain();o.frequency.value=f/3;g2.gain.setValueAtTime(g*.4,t);g2.gain.exponentialRampToValueAtTime(.0001,t+dur*3);o.connect(g2);g2.connect(AU.o);o.start(t);o.stop(t+dur*3+.02);try{navigator.vibrate&&navigator.vibrate(8);}catch(e){}}

/* ===== 3D ===== */
const c3=$('c3'),c2=$('c2');let R3=null;
if(T)R3=build3D();else $('loading').textContent='3D library did not load. Elevation, Plate and Leg still work.';
function build3D(){
  const renderer=new T.WebGLRenderer({canvas:c3,antialias:true});renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
  const scene=new T.Scene(),camera=new T.PerspectiveCamera(32,1,.05,40);
  scene.add(new T.HemisphereLight(0xfff4e0,0x6b5a44,.7));const sun=new T.DirectionalLight(0xffffff,1.0);sun.position.set(1.2,3,2.4);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-2.2,right:2.2,top:2,bottom:-1,near:.5,far:8});sun.shadow.bias=-.0005;scene.add(sun);
  const rim=new T.DirectionalLight(0xc8d6ff,.3);rim.position.set(-2,1.5,-1.5);scene.add(rim);

  for(const b of BODIES){const col=lc[(LAYERS[b.id]-1)%lc.length];g.strokeStyle=col;g.lineWidth=Math.max(4,BARW*u*.55);g.lineCap='round';g.globalAlpha=.85;const E=bodyEdges(b);for(const [p,q] of E){const a=M(P[p]),c=M(P[q]);g.beginPath();g.moveTo(a.x,a.y);g.lineTo(c.x,c.y);g.stroke();}g.globalAlpha=1;}
  g.font='10px '+MONO;g.textAlign='center';for(const [p,q,n] of LINKS){const a=P[p],b=P[q],m=M(V((a.x+b.x)/2,(a.y+b.y)/2));const t=mm(JU[n]*s);const tw=g.measureText(t).width;g.fillStyle=C.view;g.globalAlpha=.85;g.fillRect(m.x-tw/2-2,m.y-6,tw+4,11);g.globalAlpha=1;g.fillStyle=C.ink;g.fillText(t,m.x,m.y+3);}
  for(const k of ['O','B','C','D','E','F','G','H']){const q=M(P[k]);g.fillStyle=C.panel;g.beginPath();g.arc(q.x,q.y,5,0,TAU);g.fill();g.strokeStyle=C.ink;g.lineWidth=1.5;g.stroke();g.fillStyle=C.ink;g.font='600 11px '+BODY;g.textAlign='left';g.fillText(k,q.x+7,q.y-6);}
  g.textAlign='left';g.font='10px '+MONO;g.fillStyle=C['ink-2'];let y=56;for(const t of [`crank ${mm(K.crank)} · hip ${mm(S.hip)}`,`advance ${mm(K.adv)} per turn · on ground ${Math.round(K.duty*100)}%`,`hoof lifts ${mm(K.lift)} · slip ${mm(K.slip)} per step`,`${LAYERS.n} layers of 12 mm · colours = layer`]){g.fillText(t,10,y);y+=13;}
  vstat('leg · Jansen linkage scaled so the crank is a 170 mm bicycle crank arm · red = hoof on the ground');}
const mm=m=>(m*1000).toFixed(0)+' mm';
const vstat=t=>{$('vstat').textContent=t;};

/* ===== scrub bar ===== */
const scrub=$('scrub');function drawScrub(){const {g,w,h}=fit2(scrub);g.clearRect(0,0,w,h);const rows=[['LH',p=>CONTACT[Math.round(((thetaAt(p)/TAU*NS)%NS+NS)%NS)%NS]],['RH',p=>CONTACT[Math.round(((thetaAt(p+.5)/TAU*NS)%NS+NS)%NS)%NS]]];
  g.font='9px '+MONO;g.fillStyle=C['ink-2'];rows.forEach(([l,f],i)=>{g.fillText(l,0,9+i*12);g.fillStyle=C.ink;for(let k=0;k<120;k++)if(f(k/120))g.fillRect(20+k/120*(w-22),2+i*12,(w-22)/120+.5,8);g.fillStyle=C['ink-2'];});
  const X=20+S.ph*(w-22);g.strokeStyle=C.accent;g.lineWidth=2;g.beginPath();g.moveTo(X,0);g.lineTo(X,h);g.stroke();}
let sDrag=false;const scrubAt=e=>{const r=scrub.getBoundingClientRect();S.ph=Math.max(0,Math.min(.999,(e.clientX-r.left-20)/(r.width-22)));setPlaying(false);};
scrub.addEventListener('pointerdown',e=>{scrub.setPointerCapture(e.pointerId);sDrag=true;scrubAt(e);});scrub.addEventListener('pointermove',e=>{if(sDrag)scrubAt(e);});scrub.addEventListener('pointerup',()=>sDrag=false);
function setPlaying(p){S.playing=p;$('pi').className='ic '+(p?'pause-i':'play-i');$('play').setAttribute('aria-label',p?'Pause':'Play');}
$('play').addEventListener('click',()=>{audio();setPlaying(!S.playing);});
$('cad').addEventListener('input',e=>{S.cad=+e.target.value;$('cadv').textContent=S.cad+' rpm';derive();header();if(S.tab==='drive')renderInsp();});

/* ===== build steps (operational) ===== */
function steps(){const f=v=>`<span class="num">${v}</span>`;return [
 {t:'Strip the donor bike',d:`20 in steel longtail with a 6-bolt rear hub. Remove the derailleur, shifters, cassette and rear rotor. Keep the 170 mm cranks and the ${f('32T')} chainring.`,tags:['bike']},
 {t:'Fix the rear sprocket',d:`Bolt a ${f(K.T2+'T')} 6-bolt disc-mount sprocket to the rear hub, left side. The wheel and the legs now turn together; there is no freewheel.`,tags:['bike','chainB']},
 {t:'Cut the pelvis plates',d:`Cut 2 plates from 6 mm 6061 aluminium, ${f('560 × 230 mm')}. Bore O at ${f('50.8 mm')} for the pillow block spigot; drill B at ${f('8 mm')}, ${f(mm(K.O.x-K.B.x))} behind O and ${f(mm(K.O.y-K.B.y))} lower.`,tags:['frame']},
 {t:'Mount the pelvis frame',d:`Bolt 4 posts of 25 mm square steel tube to the deck rails with U-bolts. Bolt the plates to the posts, inner faces ${f('248 mm')} apart. O sits ${f(mm(K.O.y))} above the floor, ${f(mm(-OX))} behind the bottom bracket.`,tags:['frame']},
 {t:'Fit the jackshaft',d:`Bolt 2 pillow blocks UCP204-12 over O. Slide in the 3/4 in keyed shaft, ${f('600 mm')}. Lock both set screws.`,tags:['shaft','frame']},
 {t:'Key the sprockets',d:`Key the ${f('32T')} #41 sprocket on the right, in line with the chainring; the ${f(K.T1+'T')} on the left, in line with the rear sprocket. Check each line with a straightedge.`,tags:['shaft','chainA','chainB']},
 {t:'Cut the links',d:`Cut ${f('10 bars and 4 plates')} from 12 mm Baltic birch (Parts tab). Drill each pivot ${f('1/2 in')} at the listed centres, ±0.5 mm. Clamp the two copies of each part together and drill them as a pair.`,tags:['links']},
 {t:'Cut the crank arms',d:`Cut 2 arms from 12 × 40 mm aluminium flat bar. Bolt each to a 3/4 in two-piece shaft collar. Drill the pin hole at ${f(mm(K.crank))} from the shaft centre.`,tags:['links']},
 {t:'Press the bushings',d:`Press a flanged bronze bushing, 3/8 ID × 1/2 OD × 3/8 in, into each pivot hole from the face listed in the Joints tab.`,tags:['links']},
 {t:'Assemble each leg',d:`Stack the parts in layer order (Joints tab). Put a nylon washer between every two layers and a nylon spacer in every empty layer. Snug each nylock until the joint turns freely with no end play.`,tags:['links']},
 {t:'Hang the legs',d:`Clamp the crank arms on the shaft ${f('180°')} apart. Thread each B bolt through its plate, outermost layer first, with a nut inside the plate.`,tags:['links','frame']},
 {t:'Time chain A',d:`Fit chain A, ${f(K.chainA+' links')}, with an idler. Set the left pedal straight up. Turn the shaft until the left crank pin points at ${f(K.clock+' o’clock')} (seen from the right). Engage the chain.`,tags:['chainA','shaft','bike']},
 {t:'Fit chain B',d:`Fit chain B, ${f(K.chainB+' links')}, jackshaft to rear wheel, with an idler. Tension both chains to 10 mm of slack mid-span.`,tags:['chainB']},
 {t:'Make the hooves',d:`Carve 2 hooves from 2 × 4 pine, ${f('120 × 85 × 80 mm')}. Screw on soles cut from an old tyre tread. Bolt each to the shank plate at H. Set the sole ${f(mm(S.clear))} above a level floor.`,tags:['hooves','links']},
 {t:'Fit the spine',d:`Bend 1 in EMT conduit to the back line: seat post to croup, ${f('900 mm')}. Slide on 23 vertebra rings cut from 1-1/4 in PVC, 22 mm long. Clamp to the seat post and both posts.`,tags:['spine']},
 {t:'Fit the ribs',d:`Heat 1/2 in PVC conduit with a heat gun and bend 12 ribs over a plywood former (half-width ${f('250 → 190 mm')}). Bolt them in pairs to the spine, ${f('36 mm')} apart, and to a PVC breastbone.`,tags:['ribs']},
 {t:'Finish like bone',d:`Sand all wood and PVC to 180 grit. Brew 6 black tea bags per litre; wipe on 3 coats, drying between. Seal with 2 coats of amber shellac.`,tags:['links','spine','ribs','hooves']},
 {t:'Tie the tail',d:`Tie a ${f('60 cm')} horsehair switch to the spine end with waxed cord.`,tags:['tail']},
 {t:'Test',d:`Turn the pedals one full turn by hand: no part touches another. Chalk the soles; ride ${f('20 m')} at ${f('60 rpm')}. Measure each chalk smear: it should be no longer than ${f(mm(K.slip))}, the slip the linkage predicts per step. Longer smears mean the sprocket ratio is off.`,tags:null}];}

/* ===== parts ===== */
function partsRows(){const s=K.s,L=n=>JU[n]*s;const rows=[];
  for(const b of BODIES){if(b.id==='crank')continue;const ls=bodyEdges(b).map(([p,q])=>{const n=LINKS.find(l=>(l[0]===p&&l[1]===q)||(l[0]===q&&l[1]===p))[2];return n;});
    rows.push({part:b.name,joints:b.j.join('–'),centres:ls.map(n=>mm(L(n))).join(' / '),form:b.j.length===2?'bar, 45 mm wide':'plate, cut-out',qty:2,layer:LAYERS[b.id]});}
  return rows;}
function massEst(){const s=K.s,rho=680;let a=0;for(const b of BODIES){if(b.id==='crank')continue;const ls=bodyEdges(b);if(b.j.length===2){const [p,q]=ls[0],n=LINKS.find(l=>(l[0]===p&&l[1]===q)||(l[0]===q&&l[1]===p))[2];a+=JU[n]*s*BARW+Math.PI*(BARW/2)**2;}else{let per=0;for(const [p,q] of ls){const n=LINKS.find(l=>(l[0]===p&&l[1]===q)||(l[0]===q&&l[1]===p))[2];per+=JU[n]*s;}a+=per*BARW*1.1;}}return a*PLY*rho;}
function bom(){const R=(item,qty,how,where,cost)=>({item,qty,how,where,cost});return [
 R('Steel longtail bike, 20 in, 6-bolt rear hub','1','salvage','Used market; any steel longtail or a 20 in bike with a longtail kit',400),
 R(`6-bolt disc-mount sprocket ${K.T2}T`,'1','buy','Mini-bike / motorised-bicycle suppliers',18),
 R('#41 plate sprocket 32T, 3/4 in bore, keyway','1','buy','Industrial supply',22),
 R(`#41 plate sprocket ${K.T1}T, 3/4 in bore, keyway`,'1','buy','Industrial supply',16),
 R('Pillow block UCP204-12','2','buy','Industrial supply',24),
 R('Keyed shaft 3/4 in × 600 mm + 3/16 key','1','buy','Industrial supply',22),
 R('Chain 1/8 in single-speed, 116 links',String(Math.ceil((K.chainA+K.chainB)/116)),'buy','Bike shop; join with master links',12*Math.ceil((K.chainA+K.chainB)/116)),
 R('Chain idler / tensioner','2','buy','Bike shop (single-speed tensioner)',24),
 R('Baltic birch 12 mm, 1525 × 1525','1','buy','Lumber yard',75),
 R('Aluminium 6061 plate 6 mm, 600 × 250','2','buy','Metal supplier offcut bin',60),
 R('Aluminium flat bar 12 × 40 mm, 250','2','buy','Metal supplier',14),
 R('Shaft collar 3/4 in, two-piece','2','buy','Industrial supply',16),
 R('Flanged bronze bushing 3/8 × 1/2 × 3/8 in',String(2*JOINTS.reduce((a,J)=>a+JSTACK[J].bodies.length,0)),'buy','Industrial supply',2*JOINTS.reduce((a,J)=>a+JSTACK[J].bodies.length,0)*1.2),
 R('Shoulder bolt 3/8 × lengths per Joints tab, nylock 5/16-18','12','buy','Hardware store',36),
 R('Nylon washers 3/8 in, nylon spacers 3/8 × 12 mm','60','buy','Hardware store',12),
 R('Square steel tube 25 mm, 16 ga, 1.2 m; U-bolts','1','buy','Hardware store',30),
 R('EMT conduit 1 in × 3 m; PVC 1/2 in × 3 m; PVC 1-1/4 in × 0.6 m','1 each','buy','Hardware store',22),
 R('2 × 4 pine offcut; old tyre','1','salvage','Scrap bin',0),
 R('Black tea, amber shellac','1','buy','Grocery, hardware store',22),
 R('Horsehair tail switch, 60 cm','1','buy','Tack shop',35)];}

/* ===== inspector ===== */
function header(){$('hstat').textContent=`${(K.v*3.6).toFixed(1)} km/h at ${S.cad} rpm · ${mm(K.adv)} per pedal turn · ${K.T1}/${K.T2}T · slip ${mm(K.slip)}`;}
function renderInsp(){const el=$('insp');let h='';const t=S.tab;
  if(t==='build'){const st=steps();h=`<section><div class="grid2"><div class="cell"><small>Walks at</small><span class="big">${K.v.toFixed(2)}</span> m/s</div><div class="cell"><small>Per pedal turn</small><span class="big">${(K.adv).toFixed(2)}</span> m</div></div><ol class="steps">${st.map((s,i)=>`<li data-i="${i}" class="${S.step===i?'cur':''}"><span class="no">${i+1}</span><span><b>${s.t}</b><span class="d">${s.d}</span></span></li>`).join('')}</ol></section>`;}
  if(t==='parts'){const pr=partsRows(),bm=bom(),tot=bm.reduce((a,r)=>a+r.cost,0);h=`<section><h2>Cut list · 12 mm Baltic birch</h2><div class="tw"><table><thead><tr><th>Part</th><th>Pivots</th><th>Centres</th><th>Qty</th><th>Layer</th></tr></thead><tbody>${pr.map(r=>`<tr><td>${r.part}<br><span class="muted">${r.form}</span></td><td class="m">${r.joints}</td><td class="m">${r.centres}</td><td class="n">${r.qty}</td><td class="n">${r.layer}</td></tr>`).join('')}<tr><td>Crank arm<br><span class="muted">12 × 40 mm aluminium</span></td><td class="m">O–C</td><td class="m">${mm(K.crank)}</td><td class="n">2</td><td class="n">1</td></tr></tbody></table></div>
    <p class="muted">Both legs: ${(2*massEst()).toFixed(1)} kg of plywood, about ${(2*massEst()+1.6).toFixed(1)} kg with hardware.</p>
    <h2>Buy and salvage</h2><div class="tw"><table><thead><tr><th>Item</th><th>Qty</th><th>How</th><th>$</th></tr></thead><tbody>${bm.map(r=>`<tr><td>${r.item}<br><span class="muted">${r.where}</span></td><td class="m">${r.qty}</td><td><span class="tag ${r.how}">${r.how}</span></td><td class="n">${r.cost.toFixed(0)}</td></tr>`).join('')}<tr><td><b>Total, estimated</b></td><td></td><td></td><td class="n"><b>${tot.toFixed(0)}</b></td></tr></tbody></table></div><p class="muted">Prices are estimates, not quotes.</p></section>`;}
  if(t==='drive'){h=`<section><div class="grid2"><div class="cell"><small>Speed at ${S.cad} rpm</small><span class="big">${(K.v*3.6).toFixed(1)}</span> km/h</div><div class="cell"><small>Hoof slip per step</small><span class="big">${(K.slip*1000).toFixed(0)}</span> mm</div><div class="cell"><small>Pedals → jackshaft</small><span class="big">32:32</span></div><div class="cell"><small>Jackshaft → wheel</small><span class="big">${K.T1}:${K.T2}</span></div></div>
    <div class="sl"><label for="hip">Pivot O height</label><input id="hip" type="range" min="0.85" max="1.25" step="0.005" value="${S.hip}"><span class="val">${mm(S.hip)}</span></div>
    <div class="sl"><label for="clr">Hoof clearance</label><input id="clr" type="range" min="0" max="0.04" step="0.001" value="${S.clear}"><span class="val">${mm(S.clear)}</span></div>
    <div class="sl"><label for="whl">Wheel</label><select id="whl">${Object.keys(WHEELS).map(k=>`<option value="${k}"${+k===S.wheel?' selected':''}>${WHEELS[k].name}</option>`).join('')}</select><span class="val">${(K.W.C).toFixed(3)} m</span></div>
    <dl class="kv"><dt>Crank arm</dt><dd>${mm(K.crank)}${Math.abs(K.crank-.17)<.003?' · a bicycle crank length':''}</dd><dt>Hoof travel on ground</dt><dd>${mm(K.stride)} in ${Math.round(K.duty*100)}% of a turn</dd><dt>Advance needed per turn</dt><dd>${mm(K.adv)}</dd><dt>Advance from gearing</dt><dd>${mm(K.Ceff)} (${K.T1}/${K.T2} × ${(K.W.C).toFixed(3)} m)</dd><dt>Chain A</dt><dd>${K.chainA} links</dd><dt>Chain B</dt><dd>${K.chainB} links</dd><dt>Timing</dt><dd>left pedal up → left crank pin at ${K.clock} o’clock</dd><dt>Horse walk reference</dt><dd>1.5–1.8 m/s, about 1 stride per second</dd></dl>
    <p class="muted">Rule: wheel turns per leg turn = advance ÷ wheel circumference. Hit it with whole teeth and the hoof moves at road speed while it is down, so it does not scrub. Pedals and legs are locked 1:1, so the rider’s legs stay a quarter-turn behind the hind legs, as a horse’s forelegs do at a walk.</p></section>`;}
  if(t==='joints'){h=`<section><h2>Layer order, inside to outside</h2><p class="muted">Computed: two parts share a layer only if they never come within a bar width of each other through a full turn. ${LAYERS.n} layers, 12 mm each, 1.6 mm nylon washer between.</p>
    <div class="tw"><table><thead><tr><th>Layer</th><th>Part</th><th>z from plate</th></tr></thead><tbody>${[...Array(LAYERS.n)].map((_,i)=>{const L=i+1;return `<tr><td class="n">${L}</td><td>${BODIES.filter(b=>LAYERS[b.id]===L).map(b=>b.name+' '+b.j.join('–')).join(', ')}</td><td class="n">${mm(layerZ(L)-PLATE_Z)}</td></tr>`;}).join('')}</tbody></table></div>
    <h2>Pivots</h2><div class="tw"><table><thead><tr><th>Pivot</th><th>Parts (layer)</th><th>Stack</th><th>Spacers</th><th>Bolt</th></tr></thead><tbody>${JOINTS.map(J=>{const s=JSTACK[J];return `<tr><td class="m">${J}</td><td>${s.bodies.map(x=>x.b.name+' ('+x.L+')').join(', ')}${J==='B'?', plate (0)':''}</td><td class="n">${mm(s.stack)}</td><td class="n">${s.spacers}</td><td class="m">3/8 × ${s.shoulder} in</td></tr>`;}).join('')}<tr><td class="m">O</td><td>Crank arm (1) on shaft</td><td class="n">—</td><td class="n">0</td><td class="m">shaft collar</td></tr></tbody></table></div>
    <p class="muted">Every pivot: shoulder bolt through bronze bushings, nylon washer between layers, nylock outside. B is a stub: the bolt threads through the plate with a nut inside.</p></section>`;}
  el.innerHTML=h;wire();}
function wire(){const el=$('insp');el.querySelectorAll('ol.steps li').forEach(li=>li.addEventListener('click',()=>{const i=+li.dataset.i;S.step=S.step===i?-1:i;const st=steps()[i];if(R3)R3.highlight(S.step<0?null:st.tags);renderInsp();knock(1800,.02,.12);}));
  const hip=$('hip');if(hip)hip.addEventListener('input',()=>{S.hip=+hip.value;hip.nextElementSibling.textContent=mm(S.hip);reb();});
  const clr=$('clr');if(clr)clr.addEventListener('input',()=>{S.clear=+clr.value;clr.nextElementSibling.textContent=mm(S.clear);reb();});
  const whl=$('whl');if(whl)whl.addEventListener('change',()=>{S.wheel=+whl.value;reb(true);});}
let rebT=null;function reb(now){derive();header();clearTimeout(rebT);rebT=setTimeout(()=>{planLayers();if(T){const old=R3;R3.renderer.dispose();R3=build3D();R3.resize();if(S.step>=0)R3.highlight(steps()[S.step].tags);R3.bare(S.bare);}renderInsp();},now?0:250);}

/* ===== view switching and input ===== */
document.querySelectorAll('.vseg button[data-v]').forEach(b=>b.addEventListener('click',()=>{S.view=b.dataset.v;document.querySelectorAll('.vseg button[data-v]').forEach(x=>x.setAttribute('aria-pressed',x===b));c3.hidden=S.view!=='3d';c2.hidden=S.view==='3d';$('v3opts').style.visibility=S.view==='3d'?'visible':'hidden';if(R3)R3.resize();knock(1500,.015,.1);}));
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{S.tab=b.dataset.t;document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));renderInsp();$('insp').scrollTop=0;}));
$('snd').addEventListener('click',e=>{S.sound=!S.sound;e.currentTarget.setAttribute('aria-pressed',S.sound);if(S.sound){audio();knock(900,.05,.25);}});
$('xray').addEventListener('click',e=>{S.bare=!S.bare;e.currentTarget.setAttribute('aria-pressed',S.bare);if(R3)R3.bare(S.bare);});
$('fit').addEventListener('click',()=>{if(R3)Object.assign(R3.cam,{th:.55,ph:1.3,r:4.3,tx:-.35,ty:.72});});
if(R3){const ptr=new Map();let g0=null;
  c3.addEventListener('pointerdown',e=>{c3.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptr.size===2){const [a,b]=[...ptr.values()];g0={pinch:1,d:Math.hypot(a.x-b.x,a.y-b.y),r:R3.cam.r};}else g0={x:e.clientX,y:e.clientY,th:R3.cam.th,ph:R3.cam.ph,mv:false};});
  c3.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId)||!g0)return;ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(g0.pinch){if(ptr.size===2){const [a,b]=[...ptr.values()];R3.cam.r=Math.max(.8,Math.min(9,g0.r*g0.d/Math.max(1,Math.hypot(a.x-b.x,a.y-b.y))));}return;}const dx=e.clientX-g0.x,dy=e.clientY-g0.y;if(Math.hypot(dx,dy)>5)g0.mv=true;R3.cam.th=g0.th-dx*.008;R3.cam.ph=Math.max(.2,Math.min(1.55,g0.ph-dy*.006));});
  c3.addEventListener('pointerup',e=>{const p=ptr.get(e.pointerId);ptr.delete(e.pointerId);if(g0&&!g0.pinch&&!g0.mv&&p){const n=R3.pick(e.clientX,e.clientY);if(n){vstat(n);S.hold=performance.now()+3500;knock(2200,.015,.1);}}if(!ptr.size)g0=null;});
  c3.addEventListener('pointercancel',e=>{ptr.delete(e.pointerId);if(!ptr.size)g0=null;});
  c3.addEventListener('wheel',e=>{e.preventDefault();R3.cam.r=Math.max(.8,Math.min(9,R3.cam.r*Math.exp(e.deltaY*.0012)));},{passive:false});}
new ResizeObserver(()=>{if(R3)R3.resize();}).observe($('view'));
function theme(){readC();if(R3)R3.scene.background=new T.Color(C.view).convertSRGBToLinear();}theme();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',theme);
let last=performance.now(),lastCon=[false,false];
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(S.playing){const dp=dt*S.cad/60;S.ph=(S.ph+dp)%1;S.dist+=dp*K.Ceff;}
  const con=[0,.5].map(o=>CONTACT[Math.round(((thetaAt(S.ph+o)/TAU*NS)%NS+NS)%NS)%NS]);con.forEach((c,i)=>{if(c&&!lastCon[i])knock(i?520:600,.06,.3);});lastCon=con;
  if(S.view==='3d'&&R3){R3.pose(S.ph);R3.updCam();R3.render();if(!S.hold||now>S.hold)vstat(S.step>=0?`step ${S.step+1} · ${steps()[S.step].t}`:`3d · drag to orbit, tap a part · Bare hides rider, ribs and tail`);}
  else if(S.view==='elev')drawElev();else if(S.view==='plate')drawPlate();else drawLeg();
  drawScrub();requestAnimationFrame(frame);}
if(R3){$('loading').remove();R3.resize();}
header();renderInsp();requestAnimationFrame(frame);
})();
</script>
